},{passive:true});

/* ---------- полноэкранный просмотр фото ---------- */
const V={el:$('#viewer'),st:$('#vstage'),img:$('#vimg'),ids:[],i:0,s:1,x:0,y:0,open:false};
const vclamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function vApply(anim){
  V.img.style.transition=(anim?'transform .22s cubic-bezier(.2,.8,.2,1),':'')+'opacity .15s';
  V.img.style.transform='translate('+V.x+'px,'+V.y+'px) scale('+V.s+')';
}
function vBounds(){
  const w=V.img.offsetWidth*V.s,h=V.img.offsetHeight*V.s;
  const mx=Math.max(0,(w-V.st.clientWidth)/2),my=Math.max(0,(h-V.st.clientHeight)/2);
  V.x=vclamp(V.x,-mx,mx);V.y=vclamp(V.y,-my,my);
}
async function vShow(i){
  V.i=i;V.s=1;V.x=0;V.y=0;vApply(false);
  V.el.style.background='';
  $('#vcount').textContent=V.ids.length>1?(i+1)+' / '+V.ids.length:'';
  $('#vPrev').hidden=$('#vNext').hidden=V.ids.length<2;
  V.img.style.opacity='0';
  const id=V.ids[i];let u=urlCache.get(id);
  if(!u){const b=await fileGet(id);if(b)u=getUrl(id,b)}
  if(!V.open||V.i!==i)return;
  if(!u){closeViewer();infoBox('Фото недоступно','Это изображение больше не хранится на устройстве. Такое бывает, если память приложения была очищена.');return}
  V.img.onload=()=>{V.img.style.opacity='1'};
  V.img.src=u;
  if(V.img.complete)V.img.style.opacity='1';
}
function openViewer(ids,i){
  if(V.open)return;
  V.ids=ids;V.open=true;V.el.classList.add('on');pushLayer(closeViewer);vShow(i);
}
function closeViewer(){
  if(!V.open)return;
  V.open=false;V.el.classList.remove('on');popLayer(closeViewer);
  vp.clear();vg=null;
  setTimeout(()=>{if(!V.open)V.img.removeAttribute('src')},230);
}
const vp=new Map();let vg=null,vTap={t:0,x:0,y:0};
const vcen=()=>{
  const a=Array.from(vp.values());
  return {n:a.length,x:a.reduce((t,p)=>t+p.x,0)/a.length,y:a.reduce((t,p)=>t+p.y,0)/a.length,
    d:a.length>1?Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y):0};
};
function vStart(){const c=vcen();vg={n:c.n,cx:c.x,cy:c.y,d:c.d,s:V.s,x:V.x,y:V.y,t:Date.now(),moved:false}}
V.st.addEventListener('pointerdown',e=>{
  try{V.st.setPointerCapture(e.pointerId)}catch(_){}
  vp.set(e.pointerId,{x:e.clientX,y:e.clientY});vStart();
});
V.st.addEventListener('pointermove',e=>{
  if(!vp.has(e.pointerId)||!vg)return;
  vp.set(e.pointerId,{x:e.clientX,y:e.clientY});
  const c=vcen();
  if(c.n>=2&&vg.n>=2&&vg.d>0){            // щипок: масштаб + сдвиг
    V.s=vclamp(vg.s*c.d/vg.d,1,6);V.x=vg.x+(c.x-vg.cx);V.y=vg.y+(c.y-vg.cy);vg.moved=true;
  }else if(c.n===1&&vg.n===1){            // один палец
    const dx=c.x-vg.cx,dy=c.y-vg.cy;
    if(Math.abs(dx)+Math.abs(dy)>8)vg.moved=true;
    if(!vg.moved)return;
    V.x=vg.x+dx;V.y=vg.y+dy;
    if(V.s<=1.01)V.el.style.background='rgba(0,0,0,'+(1-Math.min(.6,Math.abs(V.y)/500))+')';
  }else return;
  vApply(false);
});
function vEnd(e){
  if(!vp.has(e.pointerId))return;
  vp.delete(e.pointerId);
  if(vp.size>0){vStart();return}
  const g=vg;vg=null;if(!g)return;
  if(V.s<=1.02){
    const dx=V.x,dy=V.y;
    if(g.moved&&g.n===1){
      if(Math.abs(dy)>110&&Math.abs(dy)>Math.abs(dx)){closeViewer();return}              // свайп вниз/вверх — закрыть
      if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)&&V.ids.length>1){                   // свайп вбок — соседнее фото
        const n=V.i+(dx<0?1:-1);
        if(n>=0&&n<V.ids.length){vShow(n);return}
      }
    }
    V.s=1;V.x=0;V.y=0;V.el.style.background='';vApply(true);
  }else{vBounds();vApply(true)}
  if(!g.moved&&e.type==='pointerup'&&Date.now()-g.t<350){
    const now=Date.now(),r=V.img.getBoundingClientRect();
    const onImg=e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom;
    if(now-vTap.t<320&&Math.hypot(e.clientX-vTap.x,e.clientY-vTap.y)<30){              // двойной тап — зум
      vTap.t=0;
      if(V.s>1.05){V.s=1;V.x=0;V.y=0}
      else{
        const rc=V.st.getBoundingClientRect(),k=2.5;
        V.s=k;V.x=-(k-1)*(e.clientX-(rc.left+rc.width/2));V.y=-(k-1)*(e.clientY-(rc.top+rc.height/2));vBounds();
      }
      vApply(true);return;
    }
    vTap={t:now,x:e.clientX,y:e.clientY};
    if(!onImg&&V.s<=1.02)closeViewer();                                                   // тап по тёмному фону — закрыть
  }
}
V.st.addEventListener('pointerup',vEnd);
V.st.addEventListener('pointercancel',vEnd);
V.st.addEventListener('wheel',e=>{
  e.preventDefault();
  V.s=vclamp(V.s*(e.deltaY<0?1.15:1/1.15),1,6);
  if(V.s<=1.01){V.s=1;V.x=0;V.y=0}
  vBounds();vApply(false);
},{passive:false});
$('#vClose').addEventListener('click',closeViewer);
$('#vSave').innerHTML=ic('download',22);
$('#vSave').addEventListener('click',()=>{const a=findAtt(V.ids[V.i]);if(a)downloadAtt(a,null)});
$('#vPrev').addEventListener('click',()=>{if(V.i>0)vShow(V.i-1)});
$('#vNext').addEventListener('click',()=>{if(V.i<V.ids.length-1)vShow(V.i+1)});
document.addEventListener('keydown',e=>{
  if(!V.open)return;
  if(e.key==='Escape')closeViewer();
  else if(e.key==='ArrowLeft'&&V.i>0)vShow(V.i-1);
  else if(e.key==='ArrowRight'&&V.i<V.ids.length-1)vShow(V.i+1);
});

async function adminRequest(method,text){
  const res=await fetch(CLOUD_API+'/admin/system-prompt',{method:method,
    headers:{'X-Telegram-Init-Data':tg.initData,'Content-Type':'application/json'},
    body:method==='PUT'?JSON.stringify({text:text}):undefined});
  let j={};try{j=await res.json()}catch(e){}
  if(!res.ok)throw cloudErr(res,j);
  return j;
}
function renderUsage(){
  const el=$('#usage');if(!el)return;
  const items=PROVIDERS.filter(p=>{const c=S.providers[p.id];return isAvail(p.id)||c.used.in+c.used.out>0});
  if(!items.length){el.innerHTML='<div class="uc"><div class="ul">Пока нет данных. Добавьте API ключ ниже.</div></div>';return}
  el.innerHTML=items.map(p=>{
    const c=S.providers[p.id],tot=c.used.in+c.used.out;
    let line='',bar='';
    if(p.balance&&c.bal){line='<div class="ul">Баланс: <em>'+esc(c.bal.text)+'</em></div>'}
    if(c.limit>0){
      const rem=Math.max(0,c.limit-tot),pc=Math.min(100,rem/c.limit*100);
      line+='<div class="ul">Остаток по лимиту: <em>'+fmt(rem)+'</em> из '+fmt(c.limit)+' токенов</div>';
      bar='<div class="bar"><i class="'+(pc<15?'low':'')+'" style="width:'+pc.toFixed(1)+'%"></i></div>';
    }
    const top=Object.keys(c.by).sort((a,b)=>(c.by[b].in+c.by[b].out)-(c.by[a].in+c.by[a].out)).slice(0,4)
      .map(m=>'<div class="ul sub">'+esc(m)+' — '+fmt(c.by[m].in+c.by[m].out)+'</div>').join('');
    return '<div class="uc" data-pid="'+p.id+'"><div class="uh"><b>'+esc(provName(p.id))+'</b>'+(p.balance&&c.key?'<button class="ib" data-act="bal" aria-label="Обновить">'+ic('refresh',18)+'</button>':'')+'</div>'+
      '<div class="ul">Вход: <em>'+fmt(c.used.in)+'</em> · Выход: <em>'+fmt(c.used.out)+'</em> · Всего: <em>'+fmt(tot)+'</em></div>'+line+bar+top+'</div>';
  }).join('');
}

function updModelCount(pv,pid){
  const el=pv.querySelector('.mcnt');
  if(el)el.innerHTML='выбрано <b>'+getModels(pid).length+'</b> из '+allModels(pid).length;
}
function addModel(pv,pid){
  const ni=pv.querySelector('[data-f="newmodel"]'),v=ni?ni.value.trim():'';
  if(!v)return;
  const c=S.providers[pid],all=allModels(pid).slice(),en=new Set(getModels(pid));
  if(all.indexOf(v)<0)all.push(v);
  en.add(v);
  c.models=all;c.enabled=all.filter(x=>en.has(x));
  save();renderProvs();toast('Модель добавлена');
}
const onSet=(ev,fn)=>[$('#setBody'),$('#manBody')].forEach(h=>h.addEventListener(ev,fn));
onSet('input',e=>{
  const t=e.target;
  if(t.dataset.g){
    if(t.dataset.g==='maxTokens')S.maxTokens=Math.max(0,parseInt(t.value)||4096);else S[t.dataset.g]=t.value;
    save();return;
  }
  const pv=t.closest('[data-pv]');if(!pv||!t.dataset.f)return;
  const pid=pv.dataset.pv,c=S.providers[pid],f=t.dataset.f;
  if(f==='mfilter'){
    t.size=Math.max(6,t.value.length+1);
    const q=t.value.trim().toLowerCase();
    pv.querySelectorAll('.mrow').forEach(r=>{r.hidden=!!q&&r.dataset.m.toLowerCase().indexOf(q)<0});
    return;
  }
  if(f==='newmodel')return;
  if(f==='key'){c.key=t.value.trim();return}
  else if(f==='base')c.base=t.value.trim();
  else if(f==='name'){c.name=t.value.trim().slice(0,40);const hn=pv.querySelector('.pvn');if(hn)hn.textContent=provName(pid)}
  else if(f==='limit')c.limit=Math.max(0,parseInt(t.value)||0);
  save();
  const d=pv.querySelector('.dot');if(d)d.classList.toggle('on',isAvail(pid));
  renderUsage();
});
onSet('keydown',e=>{
  if(e.key!=='Enter')return;
  const t=e.target;
  if(t.dataset&&t.dataset.f==='newmodel'){e.preventDefault();const pv=t.closest('[data-pv]');if(pv)addModel(pv,pv.dataset.pv)}
});
onSet('change',e=>{
  const t=e.target;if(t.dataset.f!=='key')return;
  const pv=t.closest('[data-pv]');if(!pv)return;
  const pid=pv.dataset.pv,key=t.value.trim();
  S.providers[pid].key=key;
  saveCloudKey(pid,key);
  const d=pv.querySelector('.dot');if(d)d.classList.toggle('on',isAvail(pid));
  renderUsage();
});
onSet('click',async e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,pv=b.closest('[data-pv]'),pu=b.closest('[data-pid]');
  const pid=pv?pv.dataset.pv:(pu?pu.dataset.pid:'');
  if(a==='tog'){openProv.has(pid)?openProv.delete(pid):openProv.add(pid);renderProvs()}
  else if(a==='eye'){const i=b.parentElement.querySelector('input');i.type=i.type==='password'?'text':'password'}
  else if(a==='load'){b.disabled=true;const sp=b.querySelector('span');if(sp)sp.textContent='Загрузка…';await loadModels(pid);renderProvs()}
  else if(a==='mtog'){
    const m=b.dataset.m,set=new Set(getModels(pid)),c=S.providers[pid];
    if(set.has(m))set.delete(m);else set.add(m);
    c.enabled=allModels(pid).filter(x=>set.has(x));save();
    b.classList.toggle('on',set.has(m));b.setAttribute('aria-checked',String(set.has(m)));
    updModelCount(pv,pid);hap();
  }
  else if(a==='mdel'){
    const m=b.dataset.m,c=S.providers[pid],set=new Set(getModels(pid));
    c.models=allModels(pid).filter(x=>x!==m);set.delete(m);
    c.enabled=c.models.filter(x=>set.has(x));save();
    const row=b.closest('.mrow');if(row)row.remove();
    updModelCount(pv,pid);
  }
  else if(a==='madd'){addModel(pv,pid)}
  else if(a==='openupd'){openUpd()}
  else if(a==='openmanual'){openManual()}
  else if(a==='bal'){fetchBal(pid,false)}
  else if(a==='setredeem'){
    const i=$('#setCode'),v=i?i.value.trim():'';
    if(!v){infoBox('Вставьте код','Скопируйте код быстрой настройки или ссылку, которую вам прислали, и вставьте в поле.');return}
    b.disabled=true;
    try{if(await redeemCode(v)){toast('Готово! Системное подключение обновлено');renderSettings()}}
    catch(err){showError(err,{where:'cloud',title:'Не удалось применить код',noNav:true})}
    b.disabled=false;
  }
  else if(a==='clearkey'){
    const ok=await dialog({title:'Очистить поля?',text:'Удалятся ключ и Base URL, лимит сбросится.',ok:'Очистить',danger:true});
    if(!ok)return;
    const c=S.providers[pid];
    c.key='';c.base='';c.limit=0;delete c.models;delete c.enabled;if(PROV[pid].custom)c.name='';
    delete c.bal;
    save();saveCloudKey(pid,'');renderProvs();renderUsage();
  }
  else if(a==='resetu'){S.providers[pid].used={in:0,out:0};S.providers[pid].by={};save();renderUsage();toast('Счётчик сброшен')}
  else if(a==='resetall'){const ok=await dialog({title:'Сбросить все счётчики?',ok:'Сбросить'});if(ok){PROVIDERS.forEach(p=>{S.providers[p.id].used={in:0,out:0};S.providers[p.id].by={}});save();renderUsage()}}
  else if(a==='clearchats'){const ok=await dialog({title:'Удалить все чаты?',text:'Это действие нельзя отменить.',ok:'Удалить',danger:true});if(ok){stopGen();S.chats.forEach(c=>fileDel(chatFileIds(c)));S.chats=[];save();newChat();toast('Чаты удалены')}}
});

async function fetchBal(pid,silent){
  const p=PROV[pid],c=S.providers[pid];if(!c.key||!p.balance)return;
  const base=(c.base||p.base).replace(/\/+$/,''),H={Authorization:'Bearer '+c.key};
  try{
    let text='';
    if(p.balance==='deepseek'){
      const r=await fetch(base+'/user/balance',{headers:H});
      if(!r.ok)throw await apiErr(r);
      const j=await r.json();
      text=(j.balance_infos||[]).map(b=>b.total_balance+' '+b.currency).join(' · ')||'—';
    }else{
      let r=await fetch(base+'/credits',{headers:H});
      if(r.ok){const d=(await r.json()).data;text='$'+(d.total_credits-d.total_usage).toFixed(2)}
      else{r=await fetch(base+'/key',{headers:H});if(!r.ok)throw await apiErr(r);const j=await r.json();

async function loadModels(pid){
  const p=provOf(pid),c=S.providers[pid],mg=pid==='managed';
  if(!isAvail(pid)){infoBox('Сначала подключите сервис',p.custom?'Укажите адрес сервиса (Base URL), а затем загрузите список моделей.':'Вставьте API-ключ, а затем загрузите список моделей.');return}
  const base=mg?'':(c.base||p.base).replace(/\/+$/,'');
  try{
    let list=[];
    if(mg){
      const r=await managedFetch('models');
      if(!r.ok)throw await apiErr(r);const j=await r.json();
      list=p.type==='gemini'
        ?(j.models||[]).filter(m=>(m.supportedGenerationMethods||[]).indexOf('generateContent')>=0).map(m=>m.name.replace(/^models\//,''))
        :(j.data||[]).map(m=>m.id);
    }else if(p.type==='oai'){
      const r=await fetch(base+'/models',{headers:c.key?{Authorization:'Bearer '+c.key}:{}});
      if(!r.ok)throw await apiErr(r);const j=await r.json();list=(j.data||[]).map(m=>m.id);
    }else if(p.type==='anthropic'){
      const r=await fetch(base+'/v1/models?limit=100',{headers:{'x-api-key':c.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'}});
      if(!r.ok)throw await apiErr(r);const j=await r.json();list=(j.data||[]).map(m=>m.id);
    }else{
      const r=await fetch(base+'/models?pageSize=200&key='+encodeURIComponent(c.key));
      if(!r.ok)throw await apiErr(r);const j=await r.json();
      list=(j.models||[]).filter(m=>(m.supportedGenerationMethods||[]).indexOf('generateContent')>=0).map(m=>m.name.replace(/^models\//,''));
    }
    list=Array.from(new Set(list.filter(Boolean))).sort();
    if(!list.length){infoBox('Список моделей пуст','Сервис не вернул ни одной модели. Проверьте ключ и адрес сервиса или добавьте модель вручную кнопкой «+».');return}
    // что было отмечено до загрузки, остаётся отмеченным; остальное пользователь отмечает галочками
    const prev=new Set(getModels(pid));
    const extra=Array.from(prev).filter(m=>list.indexOf(m)<0);
    c.models=list.concat(extra).sort();
    c.enabled=c.models.filter(m=>prev.has(m));
    openProv.add(pid);save();
    toast('Загружено моделей: '+list.length+'. Отметьте нужные галочками');
  }catch(e){showError(e,{where:'models',provider:provName(pid),title:'Не удалось загрузить список моделей',noNav:true})}
}

/* та же мини-разметка, что и на сервере: **жирный**, *курсив*, `код`, [ссылка](https://…) */
function tgHtml(title,text){
  const codes=[];
  let s=String(text||'').replace(/`([^`\n]+)`/g,(m,c)=>{codes.push(c);return '\u0000'+(codes.length-1)+'\u0000'});
  s=esc(s).replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>')
    .replace(/(^|[^*\w])\*([^*\n]+)\*(?!\*)/g,'$1<i>$2</i>')
    .replace(/\[([^\]\n]+)\]\((https?:\/\/[^)\s]+)\)/g,'<a href="$2">$1</a>');
  s=s.replace(/\u0000(\d+)\u0000/g,(m,i)=>'<code>'+esc(codes[+i])+'</code>');
  return ((title?'<b>'+esc(title)+'</b>\n\n':'')+s).trim();
}
async function upApi(method,path,body){
  if(!tg||!tg.initData)throw needTg();
  const h={'X-Telegram-Init-Data':tg.initData};
  if(body)h['Content-Type']='application/json';
  const r=await fetch(CLOUD_API+path,{method:method,headers:h,body:body?JSON.stringify(body):undefined});
  let j={};try{j=await r.json()}catch(e){}
  if(!r.ok){const er=cloudErr(r,j);er.data=j;throw er}
  return j;
}
async function prepTgImage(f){   // Telegram надёжно принимает JPEG/PNG; остальное конвертируем в JPEG
  if(f.type==='image/jpeg'||f.type==='image/png'){const r=await prepImageFile(f,f.type);return r.blob}
  const img=await loadImg(f),w=img.naturalWidth,h=img.naturalHeight,k=Math.min(1,2048/Math.max(w,h));
  const cv=document.createElement('canvas');cv.width=Math.max(1,Math.round(w*k));cv.height=Math.max(1,Math.round(h*k));
  const cx=cv.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,cv.width,cv.height);cx.drawImage(img,0,0,cv.width,cv.height);
  const b=await new Promise(r=>cv.toBlob(r,'image/jpeg',.9));
  if(!b)throw new Error('img');
  return b;
}

async function upAdd(files){
  for(const f of files){
    const fn='«'+(f.name||'файл')+'»';
    if(UP.media.length>=10){infoBox('Слишком много вложений','В одном уведомлении может быть не больше 10 фото и видео.');break}
    const isV=/^video\//.test(f.type),isI=/^image\//.test(f.type);
    if(!isV&&!isI){warnBox('Этот формат не подходит',fn+': в уведомление можно добавить фото (JPEG, PNG, WebP, GIF) и видео MP4.');continue}
    if(isV&&f.type!=='video/mp4'){warnBox('Видео нужно в формате MP4',fn+' в другом формате. Сохраните видео как MP4 и добавьте снова.');continue}
    if(isV&&f.size>45*1024*1024){warnBox('Видео слишком большое',fn+' весит '+fmtSize(f.size)+', а можно до 45 МБ.');continue}
    let blob=f;
    if(isI){try{blob=await prepTgImage(f)}catch(e){warnBox('Не удалось открыть фото',fn+' повреждён или имеет неподдерживаемый формат. Попробуйте JPEG или PNG.');continue}}
    const it={uid:uid(),type:isV?'video':'photo',name:f.name||(isV?'video.mp4':'photo.jpg'),url:URL.createObjectURL(blob),state:'up',fileId:''};
    UP.media.push(it);UP.token=null;upAtts();upPrev();
    (async()=>{
      try{
        const fd=new FormData();fd.append('file',blob,it.name);
        const r=await fetch(CLOUD_API+'/admin/media',{method:'POST',headers:{'X-Telegram-Init-Data':tg.initData},body:fd});
        const j=await r.json().catch(()=>({}));
        if(!r.ok)throw cloudErr(r,j);
        it.fileId=j.id;it.type=j.type||it.type;it.state='ok';
      }catch(e){it.state='err';showError(e,{where:'cloud',title:'Файл не загрузился'})}
      upAtts();
    })();
  }
}

async function upRun(id){
  if(UP.running)return;

  try{
    for(;;){
      const st=await upApi('POST','/admin/broadcasts/'+id+'/run');
      UP.cur=st;upProgress();
      if(st.status!=='sending'||UP.stop)break;
      if(st.retry_after)await sleepMs(st.retry_after*1000);
      else if(st.busy)await sleepMs(1500);
    }
  }catch(e){showError(e,{where:'cloud',title:'Рассылка приостановлена'})}
  UP.running=null;UP.stop=false;upProgress();
  await upLoad();

}

   '<h3>Новое уведомление</h3><div class="gb">'+
   '<button class="attach-btn" data-u="attach">'+ic('plus',18)+'<span>Фото или видео</span><small>до 10</small></button>'+
   '<div class="atts" id="uAtts"></div>'+
   '<label>Заголовок</label><input id="uTitle" maxlength="200" placeholder="🚀 Вышло новое обновление!" autocomplete="off">'+
   '<label>Текст</label><textarea id="uText" rows="9" placeholder="Версия 1.5&#10;&#10;Что нового:&#10;• Добавлена новая функция&#10;• Улучшена скорость работы&#10;• Исправлены ошибки&#10;&#10;Спасибо, что пользуетесь нашим ботом! ❤️"></textarea>'+
   '<p class="hint" style="margin:6px 0 0">Форматирование: **жирный**, *курсив*, `код`, [ссылка](https://…)</p></div>'+
   '<h3>Предпросмотр</h3><div id="uPrev"></div>'+
   '<p class="hint" id="uCount"></p>'+
   '<div class="btns one"><button class="btn" data-u="test">Тест себе</button><button class="btn pri" data-u="send">Разослать всем</button></div>'+
   '<div id="uProg" style="margin-top:14px"></div>'+
   '<h3>История рассылок</h3><div id="uHist"></div>'+
   '<h3>Быстрая настройка</h3><div class="gb">'+
   '<label>Провайдер</label><select id="qProv">'+VISIBLE.map(p=>'<option value="'+p.id+'">'+esc(p.name)+'</option>').join('')+'</select>'+
   '<div class="kl"><div class="kf"><label>API ключ</label><input id="qKey" autocomplete="off" autocapitalize="off" spellcheck="false"></div>'+
   '<div class="lf"><label>Лимит</label><input id="qLimit" inputmode="numeric" maxlength="10" placeholder="0"></div></div>'+
   '<label>Base URL (обязательно для своего endpoint)</label><input id="qBase" autocapitalize="off" spellcheck="false" placeholder="https://…/v1">'+
   '<div id="qModels"></div>'+
   '<label>Заметка (для кого)</label><input id="qNote" maxlength="60" autocomplete="off">'+
   '<p class="hint" style="margin:10px 2px 0;font-size:12px;line-height:1.4">Условия кода:<br>• одно использование;<br>• срок жизни 7 дней;<br>• можно отозвать, пока не использован.</p>'+
   '<div class="btns one"><button class="btn pri" data-u="qgen">Сформировать</button></div>'+
   '<div id="qRes"></div></div><div id="qList" style="margin-top:12px"></div>';
  upPrev();upProgress();upHist();qModelsRender();
}
function openUpd(){
  if(!isAdmin||$('#upd').classList.contains('open'))return;
  buildUpd();
  $('#adminSys').value=remoteSystem!==null?remoteSystem:DEFAULT_SYSTEM;
  $('#upd').classList.add('open');pushLayer(closeUpd);upLoad();qLoad();
}
function closeUpd(){
  if(!$('#upd').classList.contains('open'))return;
  $('#upd').classList.remove('open');popLayer(closeUpd);
}
$('#updBack').innerHTML=ic('back',24);
$('#updBack').addEventListener('click',closeUpd);
$('#updBody').addEventListener('input',e=>{
  if(e.target.id!=='qFilter')return;
  const t=e.target,q=t.value.trim().toLowerCase();
  t.size=Math.max(6,t.value.length+1);
  document.querySelectorAll('#qModels .mrow').forEach(r=>{r.hidden=!!q&&r.dataset.m.toLowerCase().indexOf(q)<0});
});
$('#updBody').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='qNew'){e.preventDefault();qModelAdd()}});
$('#updBody').addEventListener('change',e=>{if(e.target.id==='qProv'){QM.all=[];QM.on=new Set();qModelsRender()}});
$('#upFile').addEventListener('change',e=>{
  const list=Array.prototype.slice.call(e.target.files||[]);e.target.value='';
  if(list.length)upAdd(list);
});
$('#updBody').addEventListener('input',e=>{
  if(e.target.id==='uTitle'||e.target.id==='uText'){UP.token=null;upPrev()}
});
$('#updBody').addEventListener('click',async e=>{
  const rm=e.target.closest('[data-urm]');
  if(rm){
    const i=UP.media.findIndex(m=>m.uid===rm.dataset.urm);
    if(i>=0){try{URL.revokeObjectURL(UP.media[i].url)}catch(_){}UP.media.splice(i,1);UP.token=null;upAtts();upPrev();hap()}
    return;
  }
  const b=e.target.closest('[data-u]');if(!b)return;
  const a=b.dataset.u;
  if(a==='attach')$('#upFile').click();
  else if(a==='test'){b.disabled=true;await upTest();b.disabled=false}
  else if(a==='send'){b.disabled=true;await upSend();b.disabled=false}
  else if(a==='pause'){UP.stop=true;b.disabled=true}
  else if(a==='resume')upRun(b.dataset.id);
  else if(a==='syssave'||a==='sysreset'){
    if(!isAdmin||!tg||!tg.initData)return;
    b.disabled=true;
    try{
      if(a==='syssave'){const t=$('#adminSys').value.trim();await adminRequest('PUT',t);remoteSystem=t;toast('Промпт сохранён для всех')}
      else{await adminRequest('DELETE');remoteSystem=null;$('#adminSys').value='';toast('Промпт очищен')}
    }catch(err){showError(err,{where:'cloud',title:'Не удалось сохранить промпт'})}
    b.disabled=false;
  }
  else if(a==='qload'){b.disabled=true;const sp=b.querySelector('span');if(sp)sp.textContent='Загрузка…';await qLoadModels();qModelsRender()}
  else if(a==='qmtog'){const m=b.dataset.m;if(QM.on.has(m))QM.on.delete(m);else QM.on.add(m);b.classList.toggle('on',QM.on.has(m));b.setAttribute('aria-checked',String(QM.on.has(m)));hap()}
  else if(a==='qmdel'){const m=b.dataset.m;QM.all=QM.all.filter(x=>x!==m);QM.on.delete(m);const row=b.closest('.mrow');if(row)row.remove()}
  else if(a==='qmadd')qModelAdd();
  else if(a==='qgen'){b.disabled=true;try{await qGen()}catch(err){showError(err,{where:'cloud',title:'Не удалось создать код'})}b.disabled=false}
  else if(a==='qcopy'){copyText(b.dataset.t)}
  else if(a==='qdel'){
    const ok=await dialog({title:'Удалить запись?',text:'Код '+b.dataset.id+' пропадёт из списка. Подключение у тех, кто его уже активировал, тоже отключится.',ok:'Удалить',danger:true});
    if(!ok)return;
    try{await upApi('DELETE','/admin/setup-codes/'+b.dataset.id+'?purge=1');qLoad()}catch(err){showError(err,{where:'cloud',title:'Не удалось удалить код'})}
  }
  else if(a==='qrev'){try{await upApi('DELETE','/admin/setup-codes/'+b.dataset.id);qLoad()}catch(err){showError(err,{where:'cloud',title:'Не удалось отозвать код'})}}
  else if(a==='cancel'){
    const ok=await dialog({title:'Отменить рассылку?',text:'Недоставленные сообщения отправлены не будут.',ok:'Отменить рассылку',danger:true});
    if(!ok)return;
    try{await upApi('POST','/admin/broadcasts/'+b.dataset.id+'/cancel');if(UP.cur&&UP.cur.id===b.dataset.id)UP.cur=null;upProgress();await upLoad()}
    catch(err){showError(err,{where:'cloud',title:'Не удалось отменить рассылку'})}
  }
});

/* ---------- быстрая настройка по коду или ссылке ---------- */
/* сервер возвращает только имя, лимит и модели: ключ и адрес остаются на сервере в скрытом системном слоте */
function applySetup(d){
  if(!PROV[d.provider]||PROV[d.provider].hidden)throw new Error('Неизвестный провайдер');
  const c=S.providers.managed;
  c.key='';c.base='';c.name='';
  c.used={in:0,out:0};c.by={};delete c.bal;
  c.meta=null;setManagedMeta(d);
  const first=getModels('managed')[0];
  if(first){cur.model='managed|'+first;S.lastModel=cur.model}
  save();renderTop();
}
/* Возвращает false, если пользователь отказался от перезаписи (код при этом не списывается) */
async function redeemCode(raw){
  const m=String(raw||'').match(/startapp=([\w-]+)/i);
  const code=(m?m[1]:String(raw||'')).trim();
  const info=await cloudJson('POST','/setup/check',{code:code});
  if(info.existing){
    const ok=await dialog({title:'Перезаписать подключение?',text:'Системное подключение уже настроено. Оно будет заменено данными из нового кода, счётчик токенов обнулится.',ok:'Перезаписать'});
    if(!ok)return false;
  }
  const d=await cloudJson('POST','/setup/redeem',{code:code});
  applySetup(d);
  if(!getModels('managed').length){
    await loadModels('managed');
    const c=S.providers.managed,list=allModels('managed').slice(0,20);
    if(list.length){c.enabled=list;cur.model='managed|'+list[0];S.lastModel=cur.model;save();renderTop()}
  }
  return true;
}

try{
  if(tg){
    tg.ready();tg.expand();
    applyTheme();

    tg.onEvent&&tg.onEvent('viewportChanged',fit);

fit();
window.addEventListener('resize',fit);
if(window.visualViewport)window.visualViewport.addEventListener('resize',fit);
inp.addEventListener('focus',()=>{setTimeout(fit,60);setTimeout(fit,320)});
/* окна поверх чата поднимаются вместе с клавиатурой (одно обновление за кадр, без лишних записей) */
let kbRaf=0,kbLast='';
function kbFix(){
  if(kbRaf)return;
  kbRaf=requestAnimationFrame(()=>{
    kbRaf=0;
    const d=$('#dlg');
    if(!d.classList.contains('on')||d.classList.contains('context')){if(d.style.paddingBottom)d.style.paddingBottom='';kbLast='';return}
    const v=window.visualViewport,appH=$('#app').getBoundingClientRect().height;
    const vh=v?v.height:appH,kb=Math.max(0,Math.round(appH-vh-(v?v.offsetTop:0)));
    const pad=(24+kb)+'px',mh=Math.max(200,Math.round(Math.min(appH,vh)-48))+'px';
    const card=d.querySelector('.dcard');
    if(kbLast===pad+'|'+mh&&card&&card.style.maxHeight===mh)return;
    kbLast=pad+'|'+mh;
    d.style.paddingBottom=pad;
    if(card)card.style.maxHeight=mh;
    requestAnimationFrame(kbScroll);
  });
}
function kbScroll(){
  const d=$('#dlg'),a=document.activeElement,card=d.querySelector('.dcard');
  if(!d.classList.contains('on')||!card||!a||!card.contains(a)||!/^(INPUT|TEXTAREA)$/.test(a.tagName))return;
  if(card.classList.contains('cn')){card.scrollTop=card.scrollHeight;return}   // окно подключения: до самого низа, к кнопке «Применить код»
  const r=a.getBoundingClientRect(),c=card.getBoundingClientRect();
  if(r.bottom>c.bottom-8)card.scrollTop+=r.bottom-c.bottom+16;
  else if(r.top<c.top+8)card.scrollTop-=c.top-r.top+16;
}
$('#dlg').addEventListener('focusin',()=>{kbFix();setTimeout(kbFix,250);setTimeout(()=>{kbFix();kbScroll()},420);setTimeout(kbScroll,750)});
$('#dlg').addEventListener('focusout',()=>{setTimeout(kbFix,120);setTimeout(kbFix,420)});
if(window.visualViewport)window.visualViewport.addEventListener('resize',kbFix);
try{tg&&tg.onEvent&&tg.onEvent('viewportChanged',kbFix)}catch(e){}
(async()=>{
  let failed=0;
  try{failed=await loadCloudKeys()||0}catch(e){failed=1}
  newChat();
  if(failed)return;   // не удалось связаться с облаком — не считаем пользователя новым
  const sp=tg&&tg.initDataUnsafe&&tg.initDataUnsafe.start_param;
  if(sp){
    try{
      if(!hasSetup()){await redeemCode(sp);toast('Настройка применена')}
      else if(await redeemCode(sp))toast('Настройка обновлена');
    }catch(e){if(!hasSetup())showError(e,{where:'cloud',title:'Не удалось применить код настройки',noNav:true})}
  }
  if(!hasSetup())openConn();
})();
gcFiles();
})();
