<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#121212">
<title>AI Chat</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#121212; --surface:#1a1a1a; --card:#2f2f2f; --card2:#242424; --border:#3a3a3a;
  --text:#f2f2f2; --muted:#9b9b9b; --danger:#ff6b6b; --ok:#4ade80;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);overflow:hidden;
  position:fixed;inset:0;width:100%;
  font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea{font:inherit;color:var(--text);outline:none}
svg{display:block}
#app{position:fixed;left:0;top:0;width:100%;height:var(--h,100dvh);
  display:flex;flex-direction:column;overflow:hidden}

/* header */
#top{display:flex;justify-content:space-between;align-items:center;
  padding:max(12px,env(safe-area-inset-top)) 16px 8px;flex:none}
.circle{width:38px;height:38px;border-radius:50%;border:1px solid var(--border);display:grid;place-items:center;background:transparent}
.pill{height:36px;padding:0 12px 0 16px;border-radius:30px;background:#fff;color:#121212;font-size:15px;font-weight:500;
  display:flex;align-items:center;gap:6px;max-width:62vw}
.pill span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* messages */
#msgs{flex:1;min-height:0;overflow-y:auto;padding:8px 16px 16px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.send-space{
  height:100vh;
  height:100dvh;
  flex:none;
}
.empty{height:100%;display:grid;place-items:center;color:#5d5d5d;font-size:22px;font-weight:500}
.m{margin:16px 0;font-size:17px;line-height:1.5;letter-spacing:.01em}
.m.u{display:flex;justify-content:flex-end}
.m.u .uwrap{display:flex;flex-direction:column;align-items:flex-end;max-width:86%;min-width:0}
.m.u .b{background:var(--card);padding:10px 16px;border-radius:20px 20px 5px 20px;max-width:100%;white-space:pre-wrap;word-break:break-word}

.ufoot{
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:5px;
  height:20px;
  margin:2px 4px 0 0;
  color:#858585;
  font-size:11px;
}

.umore{
  display:grid;
  place-items:center;
  width:24px;
  height:22px;
  padding:0;
  color:#858585;
  background:transparent;
  border:0;
  border-radius:6px;
}
.m.a .b{word-break:break-word}
.word-in{
  display:inline-block;
  animation:wordSettle .24s cubic-bezier(.2,.7,.2,1) both;
}
@keyframes wordSettle{
  from{
    opacity:0;
    filter:blur(6px);
    position:relative;
    top:4px;
  }
  to{
    opacity:1;
    filter:blur(0);
    top:0;
  }
}
.m.a{
  animation:answerIn .3s ease-out;
  transform-origin:top;
}
@keyframes answerIn{
  from{opacity:0;transform:translateY(8px)}
  to{opacity:1;transform:translateY(0)}
}
.m.a .b>*:first-child{margin-top:0}
.m.a .b p{margin:0 0 1em}
.m.a .b h1,.m.a .b h2,.m.a .b h3,.m.a .b h4{margin:1em 0 .4em;font-size:17px}
.m.a .b ul,.m.a .b ol{margin:0 0 .75em;padding-left:22px}
.m.a .b a{color:#8ab4ff}
.m.a .b code{background:#262626;padding:1px 6px;border-radius:6px;font-size:.9em;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.code{background:#0b0b0b;border:1px solid #2a2a2a;border-radius:14px;margin:.4em 0 .9em;overflow:hidden}
.code .ch{display:flex;justify-content:space-between;align-items:center;padding:6px 12px;background:#1b1b1b;color:var(--muted);font-size:13px}
.code .ch button{color:var(--muted);font-size:13px}
.code pre{margin:0;padding:12px;overflow-x:auto}
.code pre code{background:none;padding:0;font-size:13.5px;line-height:1.5;white-space:pre}
.act{display:flex;gap:4px;margin-top:2px;color:var(--muted)}
.act button{width:34px;height:34px;display:grid;place-items:center;border-radius:10px}
.act button:active{background:#262626}
.dots{display:inline-flex;gap:5px;padding:8px 0}
.dots i{width:8px;height:8px;border-radius:50%;background:#777;animation:bl 1.2s infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes bl{0%,80%,100%{opacity:.25}40%{opacity:1}}
.err{margin:10px 0;padding:12px 14px;border:1px solid #5a2b2b;background:#2a1717;border-radius:14px;color:#ffb4b4;font-size:14px;line-height:1.45}
.err button{display:block;margin-top:8px;color:#fff;background:#4a2323;padding:6px 12px;border-radius:10px;font-size:14px}

/* bottom */
#bottom{flex:none;padding:0 16px max(14px,env(safe-area-inset-bottom))}
.sugg{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 0 12px;padding:0;scrollbar-width:none}
.sugg::-webkit-scrollbar{display:none}
.sugg.hide{display:none}
.sc{flex:none;width:min(68vw,250px);scroll-snap-align:start;display:flex;align-items:center;gap:10px;padding:7px 14px 7px 8px;
  background:var(--card);border:1px solid #3d3d3d;border-radius:30px;text-align:left}
.sc .tile{width:38px;height:38px;border-radius:50%;background:#181818;display:grid;place-items:center;flex:none}
.sc b{display:block;font-size:15px;font-weight:600}
.sc small{display:block;color:var(--muted);font-size:12.5px;margin-top:1px}
.composer{background:var(--surface);border:1px solid #3a3a3a;border-radius:30px;padding:7px 9px}
#inp{display:block;flex:1;min-width:0;width:100%;background:none;border:0;resize:none;font-size:17px;line-height:1.4;min-height:40px;max-height:120px;padding:9px 4px}
#inp::placeholder{color:#a5a5a5}
.crow{display:flex;align-items:center;gap:5px;margin-top:0}
.sp{flex:1}
.ib{width:40px;height:40px;display:grid;place-items:center;border-radius:50%;color:#e6e6e6}
.ib:active{background:#2a2a2a}
.ib.on{color:var(--danger)}
.send{width:46px;height:46px;border-radius:50%;background:#fff;color:#121212;display:grid;place-items:center;margin-left:4px}
#btnMic{
  display:none !important;
}
.send:disabled{
  background:#3a3a3a;
  color:#777;
  opacity:1;
  cursor:default;
}

:root[data-theme="light"] .send:disabled{
  background:#d1d1d6;
  color:#8e8e93;
}

/* drawer */
#scrim{position:absolute;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
#scrim.on{opacity:1;pointer-events:auto}
#drawer{position:absolute;top:0;bottom:0;left:0;width:min(86vw,340px);background:#171717;z-index:21;
  transform:translateX(-102%);transition:transform .28s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;
  padding-top:max(12px,env(safe-area-inset-top));border-right:1px solid #262626}
#drawer.open{transform:none}
.dh{display:flex;gap:8px;padding:0 12px 8px}
.search{flex:1;display:flex;align-items:center;gap:8px;background:#232323;border-radius:14px;padding:0 12px;height:42px;color:var(--muted)}
.search input{flex:1;min-width:0;background:none;border:0;font-size:16px}
.newc{display:flex;align-items:center;gap:12px;margin:4px 12px;padding:10px 12px;border-radius:14px;font-size:16px;font-weight:500;width:calc(100% - 24px)}
.newc:active,.ci:active{background:#232323}
.list{flex:1;overflow-y:auto;padding:4px 12px 12px}
.gl{margin:14px 8px 4px;color:#7d7d7d;font-size:13px;font-weight:600}
.ci{display:flex;align-items:center;border-radius:12px;padding:0 4px 0 12px;min-height:44px;cursor:pointer}
.ci.sel{background:#262626}
.ci .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:16px}
.ci .ib{width:36px;height:36px;color:var(--muted)}
.noc{color:#6d6d6d;text-align:center;padding:30px 10px;font-size:15px}
.prof{display:flex;align-items:center;gap:12px;padding:14px 26px max(20px,calc(env(safe-area-inset-bottom) + 8px));width:100%;text-align:left}
.av{width:36px;height:36px;border-radius:50%;background:#3a3a3a;display:grid;place-items:center;font-weight:600;overflow:hidden;flex:none}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.prof .pn{flex:1;font-weight:500}

/* popover / dialog */
#pop,#dlg{position:absolute;inset:0;z-index:40;display:none}
#pop.on,#dlg.on{display:block}
#dlg{background:rgba(0,0,0,.6);z-index:50}
#dlg.on{display:grid;place-items:center;padding:24px}
.pcard{position:absolute;top:max(60px,calc(env(safe-area-inset-top) + 52px));right:12px;width:min(88vw,330px);max-height:64vh;overflow-y:auto;
  background:#242424;border:1px solid #363636;border-radius:20px;padding:8px;box-shadow:0 12px 40px rgba(0,0,0,.5)}
.pg{padding:10px 12px 4px;color:#8a8a8a;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.pi{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:left;padding:11px 12px;border-radius:12px;font-size:16px;word-break:break-all}
.pi:active{background:#303030}
.pi.sel{background:#2c2c2c}
.pn2{padding:16px 12px;color:var(--muted);font-size:15px;line-height:1.45}
.dcard{width:min(100%,360px);background:#242424;border:1px solid #3a3a3a;border-radius:22px;padding:20px}
.dcard h4{margin:0 0 8px;font-size:18px}
.dcard p{margin:0 0 14px;color:#bdbdbd;font-size:15px;line-height:1.45}
.dcard input{width:100%;background:#181818;border:1px solid #3a3a3a;border-radius:12px;padding:11px 12px;font-size:16px;margin-bottom:14px}
.drow{display:flex;gap:10px;justify-content:flex-end}
.btn{background:#2f2f2f;border-radius:12px;padding:10px 16px;font-size:15px;font-weight:500}
.btn.pri{background:#fff;color:#121212}
.btn.dan{background:#5a2323;color:#ffb4b4}
.btn.ghost{background:none;border:1px solid #3a3a3a}
/* Контекстные меню возле нажатого элемента */
#dlg.context{
  background:transparent;
  display:block;
  padding:0;
}

#dlg.context .dcard{
  position:absolute;
  width:min(260px,calc(100vw - 24px));
  max-width:none;
  padding:10px;
  border-radius:16px;
  box-shadow:0 8px 30px rgba(0,0,0,.4);
  animation:menuIn .14s ease-out;
}

@keyframes menuIn{
  from{opacity:0;transform:scale(.96)}
  to{opacity:1;transform:scale(1)}
}

/* settings */
#settings{position:absolute;inset:0;background:var(--bg);z-index:30;transform:translateX(102%);transition:transform .28s cubic-bezier(.2,.8,.2,1);
  display:flex;flex-direction:column}
#settings.open{transform:none}
.sh{display:flex;align-items:center;gap:8px;padding:max(10px,env(safe-area-inset-top)) 12px 8px}
.sh h2{margin:0;font-size:20px;font-weight:600}
#setBody{flex:1;overflow-y:auto;padding:4px 16px max(30px,env(safe-area-inset-bottom));overscroll-behavior:contain}
#setBody h3{margin:22px 0 10px;font-size:13px;color:#8a8a8a;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.hint{color:#7d7d7d;font-size:13px;line-height:1.45;margin:8px 2px}
.uc{background:var(--card2);border:1px solid #303030;border-radius:16px;padding:12px 14px;margin-bottom:10px}
.uh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.uh b{font-size:16px}
.uh .ib{width:32px;height:32px;color:var(--muted)}
.ul{color:#bdbdbd;font-size:14px;margin-top:4px;line-height:1.5}
.ul em{font-style:normal;color:#fff;font-weight:600}
.bar{height:6px;border-radius:3px;background:#383838;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:#fff;border-radius:3px}
.bar i.low{background:var(--danger)}
.pv{background:var(--card2);border:1px solid #303030;border-radius:16px;margin-bottom:10px;overflow:hidden}
.pvh{display:flex;align-items:center;gap:10px;width:100%;padding:14px;font-size:16px;font-weight:500;text-align:left}
.pvh .chev{margin-left:auto;color:var(--muted);transition:transform .2s}
.pv.open .chev{transform:rotate(180deg)}
.dot{width:9px;height:9px;border-radius:50%;background:#555;flex:none}
.dot.on{background:var(--ok)}
.pvb{padding:0 14px 14px}
.pvb label,.gb label{display:block;margin:12px 0 6px;color:#9a9a9a;font-size:13px}
.pvb input,.pvb textarea,.gb input,.gb textarea{width:100%;background:#181818;border:1px solid #363636;border-radius:12px;padding:11px 12px;font-size:16px;resize:vertical}
.row{display:flex;gap:6px;align-items:center}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.gb{background:var(--card2);border:1px solid #303030;border-radius:16px;padding:4px 14px 14px}

#toast{position:absolute;left:50%;bottom:110px;transform:translateX(-50%) translateY(20px);background:#fff;color:#111;padding:10px 16px;border-radius:14px;
  font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:86vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%)}
/* LIGHT THEME */
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#ffffff;
  --surface:#f4f4f7;
  --card:#ebebf0;
  --card2:#f4f4f7;
  --border:#c9c9d2;
  --text:#0d0d10;
  --muted:#575761;
  --danger:#c62828;
  --ok:#1f8a4c;
}

:root[data-theme="light"] body,
:root[data-theme="light"] #app,
:root[data-theme="light"] #settings{
  background:var(--bg);
  color:var(--text);
}

:root[data-theme="light"] .pill,
:root[data-theme="light"] .send{
  background:#1c1c1e;
  color:#fff;
}

:root[data-theme="light"] .m.u .b,
:root[data-theme="light"] .sc,
:root[data-theme="light"] .uc,
:root[data-theme="light"] .pv,
:root[data-theme="light"] .gb{
  background:var(--card);
  border-color:var(--border);
  color:var(--text);
}

:root[data-theme="light"] .composer,
:root[data-theme="light"] .dcard,
:root[data-theme="light"] .pcard{
  background:var(--surface);
  border-color:var(--border);
  color:var(--text);
}

:root[data-theme="light"] #drawer{
  background:#fff;
  border-color:var(--border);
  color:var(--text);
}

:root[data-theme="light"] .search,
:root[data-theme="light"] .sc .tile,
:root[data-theme="light"] .pvb input,
:root[data-theme="light"] .pvb textarea,
:root[data-theme="light"] .gb input,
:root[data-theme="light"] .gb textarea,
:root[data-theme="light"] .dcard input{
  background:#f2f2f5;
  color:var(--text);
  border-color:var(--border);
}

:root[data-theme="light"] input,
:root[data-theme="light"] textarea{
  color:var(--text);
}

:root[data-theme="light"] input::placeholder,
:root[data-theme="light"] textarea::placeholder{
  color:#686872;
}

:root[data-theme="light"] .btn{
  background:#e9e9ed;
  color:#1c1c1e;
  border:1px solid var(--border);
}

:root[data-theme="light"] .btn.pri{
  background:#1c1c1e;
  color:#fff;
  border-color:#1c1c1e;
}

:root[data-theme="light"] .btn.dan{
  background:#fde8e8;
  color:#b4232b;
  border-color:#f5caca;
}

:root[data-theme="light"] .btn.ghost{
  background:transparent;
  color:var(--text);
  border-color:var(--border);
}

:root[data-theme="light"] .ib{
  color:#2e2e35;
}

:root[data-theme="light"] .ib:active,
:root[data-theme="light"] .act button:active,
:root[data-theme="light"] .newc:active,
:root[data-theme="light"] .ci:active{
  background:#e5e5e9;
}

:root[data-theme="light"] .ci.sel,
:root[data-theme="light"] .pi.sel,
:root[data-theme="light"] .pi:active{
  background:#e9e9ed;
}

:root[data-theme="light"] .newc,
:root[data-theme="light"] .ci,
:root[data-theme="light"] .pi{
  color:var(--text);
}

:root[data-theme="light"] .gl,
:root[data-theme="light"] .noc,
:root[data-theme="light"] .hint,
:root[data-theme="light"] #setBody h3,
:root[data-theme="light"] .pvb label,
:root[data-theme="light"] .gb label,
:root[data-theme="light"] .pg{
  color:var(--muted);
}

:root[data-theme="light"] .ul{
  color:#44444c;
}

:root[data-theme="light"] .ul em{
  color:var(--text);
}

:root[data-theme="light"] .bar{
  background:#dedee3;
}

:root[data-theme="light"] .bar i{
  background:#555;
}

:root[data-theme="light"] .code{
  background:#f0f0f2;
  border-color:var(--border);
  color:#222;
}

:root[data-theme="light"] .code .ch{
  background:#e5e5e9;
  color:var(--muted);
}

:root[data-theme="light"] .code pre code,
:root[data-theme="light"] .m.a .b code{
  color:#222;
}

:root[data-theme="light"] .m.a .b code{
  background:#e9e9ed;
}

:root[data-theme="light"] .m.a .b a{
  color:#1769c2;
}

:root[data-theme="light"] .err{
  background:#fff0f0;
  border-color:#f0caca;
  color:#b4232b;
}

:root[data-theme="light"] .err button{
  background:#f8dede;
  color:#9f2028;
}

:root[data-theme="light"] .dot{
  background:#aaa;
}

:root[data-theme="light"] .av{
  background:#e5e5e9;
  color:#333;
}

:root[data-theme="light"] #dlg{
  background:rgba(0,0,0,.35);
}

:root[data-theme="light"] .dcard p{
  color:#44444c;
}

:root[data-theme="light"] #toast{
  background:#1c1c1e;
  color:#fff;
}

:root[data-theme="light"] .empty{
  color:var(--muted);
}
/* Светлая тема: контраст индикаторов */
:root[data-theme="light"] .dot.on{
  background:#16a34a;
}

:root[data-theme="light"] .dot:not(.on){
  background:#b8b8c0;
}

/* Полоска токенов */
:root[data-theme="light"] .bar{
  height:8px;
  background:#c5c5ce;
  border-radius:10px;
}

:root[data-theme="light"] .bar i{
  background:#2563eb;
  border-radius:10px;
}

:root[data-theme="light"] .bar i.low{
  background:#dc2626;
}
/* Выделение текста сообщений на iPhone */
.m .b,
.m .b * {
  -webkit-user-select: text !important;
  user-select: text !important;
  -webkit-touch-callout: default;
}
.tbl-wrap{
  width:100%;
  overflow-x:auto;
  margin:12px 0;
  border:1px solid var(--border);
  border-radius:12px;
}

.md-table{
  width:100%;
  border-collapse:collapse;
  font-size:14px;
  line-height:1.45;
}

.md-table th,
.md-table td{
  padding:10px;
  border-bottom:1px solid var(--border);
  border-right:1px solid var(--border);
  text-align:left;
  vertical-align:top;
}

.md-table th{
  background:var(--card);
  font-weight:600;
}

.md-table tr:last-child td{
  border-bottom:0;
}

.md-table th:last-child,
.md-table td:last-child{
  border-right:0;
}

/* Вложения: превью в поле ввода (пусто — не занимает места) */
.atts{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none}
.atts::-webkit-scrollbar{display:none}
.atts:empty{display:none}
.att{position:relative;flex:none;height:64px;border-radius:14px;background:var(--card);border:1px solid var(--border);overflow:hidden}
.att img{display:block;width:64px;height:64px;object-fit:cover}
.att.pdf{display:flex;align-items:center;gap:8px;padding:0 30px 0 12px;max-width:190px;font-size:13px}
.att.pdf span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.att .x{position:absolute;top:4px;right:4px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,.65);color:#fff;display:grid;place-items:center}
/* Вложения в сообщении пользователя */
.uatts{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px;margin:0 0 6px;max-width:100%;white-space:normal}
.uimg{display:block;width:120px;height:120px;object-fit:cover;border-radius:12px}
.ufile{display:flex;align-items:center;gap:8px;max-width:100%;padding:4px 2px;font-size:14px;white-space:nowrap}
.ufile span{min-width:0;overflow:hidden;text-overflow:ellipsis}

[hidden]{display:none!important}

/* Переключатель темы: солнце — тумблер — луна */
.tsw{margin-left:auto;display:flex;align-items:center;gap:8px;padding-right:4px}
.tsw .ico{display:grid;place-items:center;width:24px;height:24px;color:var(--muted);opacity:.4;transition:opacity .2s,color .2s;cursor:pointer}
.tsw .sw{position:relative;flex:none;width:44px;height:26px;border-radius:13px;background:var(--card);border:1px solid var(--border);transition:background .2s}
.tsw .sw i{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--text);transition:transform .22s cubic-bezier(.2,.8,.2,1)}
:root:not([data-theme="light"]) .tsw .sw i{transform:translateX(18px)}
:root:not([data-theme="light"]) .tsw .moon{opacity:1;color:#a5b4fc}
:root[data-theme="light"] .tsw .sun{opacity:1;color:#f59e0b}

/* Список моделей с галочками */
.mh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:16px 0 6px;color:#9a9a9a;font-size:13px}
.mh b{font-weight:600;color:var(--text)}
.mcnt{flex:none}
.mtools{display:flex;gap:8px;margin:0 0 8px}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.mlist{max-height:300px;overflow-y:auto;border:1px solid #363636;border-radius:12px;background:#181818;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.mrow{display:flex;align-items:center;gap:10px;padding:9px 6px 9px 10px;cursor:pointer;border-bottom:1px solid #2a2a2a;-webkit-user-select:none;user-select:none}
.mrow:last-child{border-bottom:0}
.mrow:active{background:rgba(127,127,127,.12)}
.mrow .cb{flex:none;width:20px;height:20px;border-radius:6px;border:1.5px solid #666;display:grid;place-items:center;color:transparent}
.mrow.on .cb{background:#fff;border-color:#fff;color:#121212}
.mrow .mt{flex:1;min-width:0;font-size:14px;line-height:1.3;word-break:break-all}
.mrow .mx{flex:none;width:30px;height:30px;display:grid;place-items:center;color:var(--muted);border-radius:8px}
.mempty{padding:12px 2px;color:var(--muted);font-size:14px;line-height:1.45}
:root[data-theme="light"] .mlist{background:#f2f2f5;border-color:var(--border)}
:root[data-theme="light"] .mrow{border-color:var(--border)}
:root[data-theme="light"] .mrow .cb{border-color:#a0a0a8}
:root[data-theme="light"] .mrow.on .cb{background:#1c1c1e;border-color:#1c1c1e;color:#fff}
:root[data-theme="light"] .mh{color:var(--muted)}

/* Сообщения пользователя: меню по долгому нажатию, без выделения текста */
.m.u .uwrap,.m.u .uwrap *{-webkit-user-select:none!important;user-select:none!important;-webkit-touch-callout:none!important}
.uimg{cursor:zoom-in;-webkit-user-drag:none}

/* Полноэкранный просмотр фото */
#viewer{position:absolute;inset:0;z-index:80;background:#000;touch-action:none;opacity:0;pointer-events:none;transition:opacity .2s}
#viewer.on{opacity:1;pointer-events:auto}
#vstage{position:absolute;inset:0;display:grid;place-items:center;overflow:hidden;touch-action:none}
#vimg{display:block;max-width:100%;max-height:100%;transform-origin:center;will-change:transform;-webkit-user-select:none;user-select:none;-webkit-user-drag:none;-webkit-touch-callout:none;touch-action:none;transition:opacity .15s}
.vtop{position:absolute;top:0;left:0;right:0;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:max(10px,env(safe-area-inset-top)) 12px 12px;color:#fff;pointer-events:none;background:linear-gradient(rgba(0,0,0,.55),transparent)}
.vtop span{font-size:15px;font-weight:500;padding-left:8px}
#viewer .ib{color:#fff;background:rgba(255,255,255,.16)}
#viewer.on .ib{pointer-events:auto}
#viewer .ib:active{background:rgba(255,255,255,.28)}
.vnav{position:absolute;top:50%;z-index:2;margin-top:-20px}
#vPrev{left:10px}#vNext{right:10px}

/* Таблицы: растягиваются вправо за экран, прокручиваются, слова не рвутся по буквам */
.tbl-wrap{-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.md-table{width:max-content;min-width:100%}
.md-table th,.md-table td{min-width:110px;max-width:340px;word-break:normal;overflow-wrap:normal;hyphens:none}
.ul.sub{color:#8a8a8a}
#msgs{overflow-anchor:none}

:root[data-theme="light"] .ul.sub{color:#575761}
:root[data-theme="light"] .m.a .b{color:var(--text)}
:root[data-theme="light"] .m.u .b{background:#e8e8ee;border:1px solid #d3d3dc}
:root[data-theme="light"] .composer{background:#f4f4f7;border-color:#c0c0ca}
:root[data-theme="light"] #drawer{background:#fafafc}
:root[data-theme="light"] .pcard,:root[data-theme="light"] .dcard{background:#fff;box-shadow:0 12px 40px rgba(0,0,0,.18)}
:root[data-theme="light"] .sc{background:#f4f4f7;border-color:#c9c9d2}

/* Размер текста ответа */

.code pre code{font-size:13px}

/* Окно API ключа: ключ + лимит в одну строку */
.kl{display:flex;gap:10px}
.kl .kf{flex:1;min-width:0}
.kl .lf{flex:none;width:calc(10ch + 26px)}
.inw{position:relative}
.pvb .inw input{padding-right:44px}
.eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:36px;height:36px;display:grid;place-items:center;color:var(--muted);border-radius:10px}

/* Одно окно моделей */
.mbox{margin-top:14px;border:1px solid #363636;border-radius:14px;padding:10px;background:#181818}
.mtop{display:flex;gap:8px;align-items:center}
.mtop .btn{flex:none;display:flex;align-items:center;gap:6px;height:40px;padding:0 12px;white-space:nowrap}
.mtop .btn.plus{width:40px;padding:0;justify-content:center}
.mtop input{flex:1;min-width:0;height:40px;padding:0 10px!important;font-size:15px!important}
.mfilter{display:flex;align-items:center;justify-content:center;gap:8px;margin:10px 0 4px;color:var(--muted)}
.pvb .mfilter input{width:auto;max-width:70%;background:transparent!important;border:0!important;padding:6px 0!important;border-radius:0;color:var(--muted);font-size:15px;text-align:left}
.mbox .mlist{border:0;background:none;border-radius:0;max-height:280px;margin-top:4px}
.mbox .mempty{text-align:center;padding:14px 4px 6px}
:root[data-theme="light"] .mbox{background:#f2f2f5;border-color:var(--border)}
:root[data-theme="light"] .pvb .mfilter input{color:var(--text)}

.btns.one{flex-wrap:nowrap}
.btns.one .btn{flex:1;white-space:nowrap;text-align:center}

/* ---- Оформление ответа в стиле ChatGPT ---- */
:root{--line:rgba(255,255,255,.15)}
:root[data-theme="light"]{--line:rgba(0,0,0,.13)}
.m.a{font-size:17px;line-height:1.4}
.m.a .b p{margin:0 0 .9em}
.m.a .b h1,.m.a .b h2,.m.a .b h3,.m.a .b h4{font-size:19px;font-weight:700;line-height:1.3;margin:1.5em 0 .6em}
.m.a .b ul,.m.a .b ol{margin:0 0 .9em;padding-left:24px}
.m.a .b li{margin:.3em 0}
.m.a .b li::marker{color:var(--muted)}

/* Таблицы: без рамки и фона, жирная шапка, только тонкие линии между строками */
.m.a .b .tbl-wrap{border:0;border-radius:0;margin:1.1em 0 1.3em;background:none}
.m.a .b .md-table{border-collapse:collapse;font-size:16px;line-height:1.3;background:none;width:100%;min-width:0}
.m.a .b .md-table th,.m.a .b .md-table td{min-width:125px}
.m.a .b .md-table th,.m.a .b .md-table td{background:none;border:0;border-bottom:1px solid var(--line);padding:10px 20px 10px 0;text-align:left;vertical-align:top}
.m.a .b .md-table th{font-weight:700;padding-top:4px}
.m.a .b .md-table th:last-child,.m.a .b .md-table td:last-child{padding-right:2px}
.m.a .b .md-table tr:last-child td{border-bottom:0}
.m.a .b .md-table td b,.m.a .b .md-table td strong{font-weight:700}

/* ---- Панель управления (админ) ---- */
#upd{position:absolute;inset:0;background:var(--bg);z-index:35;transform:translateX(102%);transition:transform .28s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
#upd.open{transform:none}
#updBody{flex:1;overflow-y:auto;padding:4px 16px max(30px,env(safe-area-inset-bottom));overscroll-behavior:contain}
#updBody h3{margin:22px 0 10px;font-size:13px;color:#8a8a8a;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
:root[data-theme="light"] #updBody h3{color:var(--muted)}
#updBody .atts{padding-top:10px}
#updBody .atts:empty{display:none}
.att.up{opacity:.45}
.att.up::after{content:"";position:absolute;left:50%;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:spin .8s linear infinite}
.att.er{border-color:var(--danger)}
@keyframes spin{to{transform:rotate(360deg)}}
.tgp{background:#0e1621;border-radius:18px;padding:14px}
.tgb{background:#182533;color:#fff;border-radius:16px 16px 16px 4px;max-width:100%;overflow:hidden;font-size:15px;line-height:1.4}
.tgm{display:grid;gap:2px;grid-template-columns:1fr 1fr}
.tgm img,.tgm video{width:100%;height:150px;object-fit:cover;display:block}
.tgm.n1{grid-template-columns:1fr}
.tgm.n1 img,.tgm.n1 video{height:auto;max-height:300px}
.tgm.n3>:first-child{grid-column:1/-1}
.tgt{padding:8px 12px 2px;white-space:pre-wrap;word-break:break-word}
.tgt a{color:#6ab3f3}
.tgt code{background:rgba(255,255,255,.12);padding:1px 5px;border-radius:5px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.9em}
.tgs{text-align:right;font-size:11px;opacity:.6;padding:2px 10px 6px}
:root[data-theme="light"] .tgp{background:#dbe7ef}
:root[data-theme="light"] .tgb{background:#fff;color:#0d0d10}
:root[data-theme="light"] .tgt a{color:#1769c2}
:root[data-theme="light"] .tgt code{background:#eef0f3}
.uc .btns{margin-top:10px}
.attach-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:52px;margin:12px 0 4px;border:1.5px dashed var(--border);border-radius:14px;color:var(--muted);font-size:15px;font-weight:500;transition:background .15s,color .15s,border-color .15s}
.attach-btn small{font-size:12px;opacity:.7;font-weight:400}
.attach-btn:active{background:rgba(127,127,127,.12);color:var(--text);border-color:var(--muted)}
/* ---- Страница ручной настройки API ---- */
#manual{position:absolute;inset:0;background:var(--bg);z-index:32;transform:translateX(102%);transition:transform .28s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
#manual.open{transform:none}
#manBody{flex:1;overflow-y:auto;padding:4px 16px max(30px,env(safe-area-inset-bottom));overscroll-behavior:contain}
.manbtn{display:flex;align-items:center;gap:10px;width:100%;padding:14px;border-radius:16px;background:var(--card2);border:1px solid #303030;font-size:16px;font-weight:500;text-align:left}
.manbtn .chev{margin-left:auto;color:var(--muted)}
:root[data-theme="light"] .manbtn{border-color:var(--border)}
/* ---- Окно «Подключение API» и мини-инструкция ---- */
.dcard.cn{width:min(100%,380px);max-height:100%;overflow-y:auto;padding:22px 20px 20px;border-radius:26px}
.cn-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.cn-h h4{margin:0;font-size:19px;font-weight:700;white-space:nowrap}
.cn-st{flex:none;padding:4px 10px;border-radius:999px;font-size:12.5px;white-space:nowrap;font-weight:600;background:rgba(255,107,107,.16);color:#ff8a8a}
.cn-ic{width:64px;height:64px;margin:22px auto 14px;border-radius:50%;display:grid;place-items:center;background:rgba(127,127,127,.16);color:var(--muted)}
.cn-t{text-align:center;font-size:18px;font-weight:700;margin-bottom:8px}
.dcard.cn p.cn-p{text-align:center;color:var(--muted);margin:0 0 18px}
.cn-b{display:block;width:100%;height:50px;border-radius:999px;font-size:16px}
.cn-l{display:block;width:100%;padding:14px 0 6px;text-align:center;color:var(--muted);font-size:15px;font-weight:500}
.cn-l:active{opacity:.6}
.cn-f{margin-top:12px;padding-top:12px;border-top:1px solid var(--border);text-align:center;color:var(--muted);font-size:13px;opacity:.85}
.cn-prov{display:flex;align-items:center;gap:8px;margin:12px 0;font-size:16px;font-weight:700;white-space:nowrap}
.cn-logo{flex:none;width:34px;height:34px;border-radius:50%;border:1px solid var(--border);display:grid;place-items:center;font-size:12px;font-weight:800;letter-spacing:-.02em;background:rgba(127,127,127,.1)}
.cn-chip{padding:3px 8px;border-radius:999px;font-size:11.5px;font-weight:600;background:rgba(74,222,128,.15);color:#4ade80}
.cn-sep{height:1px;background:var(--border);margin:16px 0}
.cn-steps{margin:10px 0 12px;padding-left:22px;font-size:15.5px;line-height:1.5}
.cn-steps li{margin:6px 0;padding-left:4px}
.cn-note{color:var(--muted);font-size:13px;line-height:1.45;margin:0 0 14px}
:root[data-theme="light"] .cn-st{background:#fbe0e0;color:#b42318}
:root[data-theme="light"] .cn-chip{background:#dff3e4;color:#1f7a3a}
.gb select{width:100%;background:#181818;border:1px solid #363636;border-radius:12px;padding:11px 12px;font-size:16px;color:var(--text)}
:root[data-theme="light"] .gb select{background:#f2f2f5;border-color:var(--border)}
.qcode{font-size:22px;font-weight:700;letter-spacing:.06em;text-align:center;margin:12px 0 6px}
.cn-code{margin-top:4px}
.cn-code input{margin-bottom:10px}
#dlg{transition:padding-bottom .18s ease-out}
.gb .mfilter input{width:auto;max-width:70%;background:transparent!important;border:0!important;padding:6px 0!important;border-radius:0;color:var(--muted);font-size:15px;text-align:left}
:root[data-theme="light"] .gb .mfilter input{color:var(--text)}
</style>

/* ---------- markdown ---------- */
function inline(s){
  return s.replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>')
    .replace(/(^|[^*\w])\*([^*\n]+)\*/g,'$1<i>$2</i>')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
}

function md(src){
  const blocks=[];
  src=src.replace(/```([\w+#.-]*)[ \t]*\n?([\s\S]*?)(```|$)/g,(m,l,c)=>{
    blocks.push({l:l,c:c.replace(/\n$/,'')});
    return '\n\u0000'+(blocks.length-1)+'\u0000\n';
  });

  const out=[];
  let list='';
  const close=()=>{
    if(list){out.push('</'+list+'>');list=''}
  };

  const lines=esc(src).split('\n');

  const cells=line=>line.trim()
    .replace(/^\|/,'')
    .replace(/\|$/,'')
    .split('|')
    .map(x=>x.trim());

  for(let i=0;i<lines.length;i++){
    const line=lines[i];
    let m;

    const isTable=line.includes('|') &&
      i+1<lines.length &&
      /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/.test(lines[i+1]);

    if(isTable){
      close();
      const head=cells(line);
      i+=2;
      const rows=[];

      while(i<lines.length && lines[i].includes('|') && lines[i].trim()){
        rows.push(cells(lines[i]));
        i++;
      }
      i--;

      let html='<div class="tbl-wrap"><table class="md-table"><thead><tr>';
      head.forEach(c=>html+='<th>'+inline(c)+'</th>');
      html+='</tr></thead><tbody>';

      rows.forEach(row=>{
        html+='<tr>';
        head.forEach((_,j)=>html+='<td>'+inline(row[j]||'')+'</td>');
        html+='</tr>';
      });

      html+='</tbody></table></div>';
      out.push(html);
    }
    else if((m=line.match(/^\u0000(\d+)\u0000$/))){
      close();
      const b=blocks[+m[1]];
      out.push('<div class="code"><div class="ch"><span>'+esc(b.l||'код')+'</span><button data-copy>Копировать</button></div><pre><code>'+esc(b.c)+'</code></pre></div>');
    }
    else if((m=line.match(/^(#{1,4})\s+(.*)/))){
      close();out.push('<h3>'+inline(m[2])+'</h3>');
    }
    else if((m=line.match(/^\s*[-*•]\s+(.*)/))){
      if(list!=='ul'){close();out.push('<ul>');list='ul'}
      out.push('<li>'+inline(m[1])+'</li>');
    }
    else if((m=line.match(/^\s*\d+[.)]\s+(.*)/))){
      if(list!=='ol'){close();out.push('<ol>');list='ol'}
      out.push('<li>'+inline(m[1])+'</li>');
    }
    else if(!line.trim()){
      close();
    }
    else{
      close();out.push('<p>'+inline(line)+'</p>');
    }
  }

  close();
  return out.join('');
}

/* ---------- печать ответа и жизненный цикл генерации ----------
   busy остаётся true, пока ответ не получен И не допечатан на экране —
   всё это время кнопка работает как «Стоп», а нажатие полностью прекращает и запрос, и печать. */
let G=null;   // текущая генерация

function paint(){
  const g=G;
  if(!g||g.painting)return;
  g.painting=true;

  function step(){
    if(G!==g){g.painting=false;return}
    const m=g.msg;
    const i=g.chat.messages.indexOf(m);
    const n=(cur===g.chat&&i>=0)?box.querySelector('.m.a[data-i="'+i+'"] .b'):null;

    if(n){
      const next=m.content.indexOf(' ',g.idx);
      g.idx=next===-1?m.content.length:next+1;

      n.innerHTML=m.content
        ?md(m.content.slice(0,g.idx))
        :'<span class="dots"><i></i><i></i><i></i></span>';

      if(m.content){
        const walker=document.createTreeWalker(n,NodeFilter.SHOW_TEXT);
        const nodes=[];
        while(walker.nextNode())nodes.push(walker.currentNode);

        let count=0;
        nodes.forEach(node=>{
          const parts=node.textContent.match(/\s+|\S+/g)||[];
          const frag=document.createDocumentFragment();

          parts.forEach(part=>{
            if(/^\s+$/.test(part)){
              frag.appendChild(document.createTextNode(part));
            }else{
              const span=document.createElement('span');
              span.textContent=part;
              if(count>=g.words)span.className='word-in';
              count++;
              frag.appendChild(span);
            }
          });

          node.parentNode.replaceChild(frag,node);
        });

        g.words=count;
      }
    }else{
      g.idx=m.content.length;   // чат не на экране — печатать нечего
    }

    if(g.idx<m.content.length){
      setTimeout(()=>requestAnimationFrame(step),30);
    }else{
      g.painting=false;
      if(g.streamDone)finishGen(g);
    }
  }

  requestAnimationFrame(step);
}

/* Завершает генерацию (один раз): учёт токенов, сохранение, кнопки под ответом */
function finishGen(g){
  if(g.done)return;
  g.done=true;
  const chat=g.chat,msg=g.msg;

  if(!g.got){g.uIn=est(g.hist);g.uOut=Math.ceil(msg.content.length/3.5)}
  if(g.uIn||g.uOut)addUsage(g.pid,g.model,g.uIn,g.uOut);

  let removed=false;
  if(!msg.content){
    const k=chat.messages.indexOf(msg);
    if(k>=0){chat.messages.splice(k,1);removed=true}
  }

  if(G===g){G=null;busy=false;abortC=null}
  chat.updated=Date.now();save();

  if(cur!==chat)return;
  renderTop();
  updateComposer();
  box.querySelector('.send-space')?.remove();
  if(removed)renderMsgs();

  const last=box.querySelector('.m.a[data-i="'+(chat.messages.length-1)+'"]');
  if(last&&!last.querySelector('.act')){
    last.insertAdjacentHTML('beforeend',
      '<div class="act"><button data-act="copy" aria-label="Копировать">'+ic('copy',18)+'</button><button data-act="regen" aria-label="Повторить">'+ic('refresh',18)+'</button></div>');
  }
  if(errMsg&&!box.querySelector('.err')){
    box.insertAdjacentHTML('beforeend',
      '<div class="err">'+esc(errMsg)+'<button data-act="retry">Повторить</button></div>');
  }
}

/* Остановка в любой момент: и пока идёт запрос, и пока ответ ещё печатается */
function stopGen(){
  const g=G;
  if(!g)return;
  g.stopped=true;
  try{g.abort.abort()}catch(e){}
  // оставляем ровно то, что пользователь уже увидел на экране
  if(g.idx<g.msg.content.length)g.msg.content=g.msg.content.slice(0,g.idx);
  finishGen(g);
  hap();
}

function positionContextMenu(anchor){
  const d=$('#dlg');
  const card=d.querySelector('.dcard');
  if(!card||!anchor)return;

  d.classList.add('context');

  const r=anchor.getBoundingClientRect();
  const root=$('#app').getBoundingClientRect();

  const w=card.offsetWidth;
  const h=card.offsetHeight;

  let x=r.right-w;
  let y=r.bottom+8;

  x=Math.max(12,Math.min(x,window.innerWidth-w-12));

  if(y+h>window.innerHeight-12){
    y=r.top-h-8;
  }

  y=Math.max(12,y);

  card.style.left=(x-root.left)+'px';
  card.style.top=(y-root.top)+'px';
}

function openUserMessageMenu(index,anchor){
  const m=cur.messages[index];
  if(!m||m.role!=='user')return;

  const canRetry=!busy;
  const d=$('#dlg');

  d.innerHTML=
    '<div class="dcard" style="padding:10px">'+
      (m.content?'<button class="pi" data-user-action="copy">'+
        ic('copy',18)+
        '<span style="flex:1;margin-left:10px">Копировать</span>'+
      '</button>':'')+
      (canRetry?
        '<button class="pi" data-user-action="retry">'+
          ic('refresh',18)+
          '<span style="flex:1;margin-left:10px">Повторить отправку</span>'+
        '</button>':'')+
    '</div>';

  d.classList.add('on');
  positionContextMenu(anchor);

  const close=()=>{
    d.classList.remove('on');
    d.innerHTML='';
    popLayer(close);
    d.classList.remove('context');
  };

  pushLayer(close);

  d.onclick=e=>{
    if(e.target===d){
      close();
      return;
    }

    const b=e.target.closest('[data-user-action]');
    if(!b)return;

    const action=b.dataset.userAction;

    }
  };
}

let lp=null,lpFired=0,lpTouch=false;
const lpCancel=()=>{if(lp){clearTimeout(lp.t);lp=null}};

  const t=e.touches[0];

/* ---------- вложения: фото и PDF (текстовые файлы — как раньше, в поле ввода) ---------- */
const ATT_MAX=5,ATT_SIZE=8*1024*1024;
const IMG_TYPES=['image/jpeg','image/png','image/webp','image/gif'];
const isImg=t=>IMG_TYPES.indexOf(t)>=0;
const isPdf=t=>t==='application/pdf';
const pending=[];            // вложения, ещё не отправленные: {id,name,type,size,blob}
const memFiles=new Map();    // запасное хранилище, если IndexedDB недоступна
const urlCache=new Map();    // id -> object URL для превью
let dbP=null;
function idb(){
  if(dbP)return dbP;
  dbP=new Promise((res,rej)=>{
    try{
      const r=indexedDB.open('tgai.files',1);
      r.onupgradeneeded=()=>r.result.createObjectStore('files',{keyPath:'id'});
      r.onsuccess=()=>res(r.result);
      r.onerror=()=>rej(r.error);
    }catch(e){rej(e)}
  });
  return dbP;
}
async function fileSave(id,blob){
  try{
    const db=await idb();
    await new Promise((res,rej)=>{const t=db.transaction('files','readwrite');t.objectStore('files').put({id:id,blob:blob});t.oncomplete=res;t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)});
  }catch(e){memFiles.set(id,blob)}
}
async function fileGet(id){
  if(memFiles.has(id))return memFiles.get(id);
  try{
    const db=await idb();
    return await new Promise((res,rej)=>{const q=db.transaction('files').objectStore('files').get(id);q.onsuccess=()=>res(q.result&&q.result.blob||null);q.onerror=()=>rej(q.error)});
  }catch(e){return null}
}
async function fileDel(ids){
  ids=(ids||[]).filter(Boolean);if(!ids.length)return;
  ids.forEach(id=>{memFiles.delete(id);const u=urlCache.get(id);if(u){try{URL.revokeObjectURL(u)}catch(e){}urlCache.delete(id)}});
  try{
    const db=await idb();
    await new Promise(res=>{const t=db.transaction('files','readwrite');const st=t.objectStore('files');ids.forEach(id=>st.delete(id));t.oncomplete=res;t.onerror=res;t.onabort=res});
  }catch(e){}
}
async function gcFiles(){   // удаляет файлы, не привязанные ни к одному сообщению (например, не отправленные)
  try{
    const used=new Set();
    S.chats.forEach(c=>c.messages.forEach(m=>(m.attachments||[]).forEach(a=>used.add(a.id))));
    const db=await idb();
    const keys=await new Promise((res,rej)=>{const q=db.transaction('files').objectStore('files').getAllKeys();q.onsuccess=()=>res(q.result||[]);q.onerror=()=>rej(q.error)});
    await fileDel(keys.filter(k=>!used.has(k)));
  }catch(e){}
}
const chatFileIds=c=>{const r=[];c.messages.forEach(m=>(m.attachments||[]).forEach(a=>r.push(a.id)));return r};
function getUrl(id,blob){let u=urlCache.get(id);if(!u){u=URL.createObjectURL(blob);urlCache.set(id,u)}return u}
function mimeOf(f){
  const t=(f.type||'').toLowerCase();if(t)return t;
  const m=/\.([a-z0-9]+)$/i.exec(f.name||'');const e=m?m[1].toLowerCase():'';
  return {jpg:'image/jpeg',jpeg:'image/jpeg',png:'image/png',webp:'image/webp',gif:'image/gif',pdf:'application/pdf'}[e]||'';
}
function loadImg(blob){
  return new Promise((res,rej)=>{
    const u=URL.createObjectURL(blob),i=new Image();
    i.onload=()=>{URL.revokeObjectURL(u);res(i)};
    i.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('img'))};
    i.src=u;
  });
}
async function prepImage(f){   // большие фото уменьшаем, чтобы уложиться в лимиты API (напр. 5 МБ у Anthropic)
  if(f.type==='image/gif')return f;
  try{
    const img=await loadImg(f),w=img.naturalWidth,h=img.naturalHeight,mx=Math.max(w,h);
    if(f.size<=3*1024*1024&&mx<=2560)return f;
    const k=Math.min(1,2048/mx),cv=document.createElement('canvas');
    cv.width=Math.max(1,Math.round(w*k));cv.height=Math.max(1,Math.round(h*k));
    const cx=cv.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,cv.width,cv.height);cx.drawImage(img,0,0,cv.width,cv.height);
    const b=await new Promise(r=>cv.toBlob(r,'image/jpeg',.88));
    return b&&b.size<f.size?b:f;
  }catch(e){return f}
}
function addTextFile(f){
  if(f.size>200*1024){toast('Файл больше 200 КБ');return}
  const r=new FileReader();
  r.onload=()=>{inp.value+=(inp.value?'\n\n':'')+'Файл «'+f.name+'»:\n```\n'+String(r.result)+'\n```\n';autosize();updateComposer();inp.focus()};
  r.onerror=()=>toast('Не удалось прочитать файл');
  r.readAsText(f);
}
async function addFiles(list){
  for(const f of list){
    const t=mimeOf(f);
    if(isPdf(t)||/^image\//.test(t)){
      if(!isPdf(t)&&!isImg(t)){toast('Формат «'+(f.name||t)+'» не поддерживается. Нужны JPEG, PNG, WebP или GIF');continue}
      if(pending.length>=ATT_MAX){toast('Не больше '+ATT_MAX+' файлов за раз');break}
      if(f.size>ATT_SIZE){toast('«'+(f.name||'Файл')+'» больше 8 МБ');continue}
      let blob=f;
      if(isImg(t))blob=await prepImage(f.type?f:new Blob([f],{type:t}));
      if(pending.length>=ATT_MAX){toast('Не больше '+ATT_MAX+' файлов за раз');break}
      const a={id:uid(),name:f.name||(isPdf(t)?'document.pdf':'image'),type:isPdf(t)?'application/pdf':(blob.type||t),size:blob.size,blob:blob};
      pending.push(a);
      fileSave(a.id,blob);
      renderAtts();
    }else addTextFile(f);
  }
}

function send(){

function est(hist){let n=sysPrompt().length;hist.forEach(m=>n+=m.content.length);return Math.ceil(n/3.5)}
function b64(blob){
  return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]||'');r.onerror=()=>rej(r.error);r.readAsDataURL(blob)});
}
/* Превращает историю в нейтральный вид {role,text,files:[{type,data}]}; сообщения без вложений не меняются */
async function wireHist(hist,kind,limitMb){
  let total=0;const out=[];
  for(let i=0;i<hist.length;i++){
    const m=hist[i],atts=m.attachments||[];
    if(m.role!=='user'||!atts.length){out.push({role:m.role,text:m.content,files:[]});continue}
    const files=[];let note='';
    for(const a of atts){
      const b=await fileGet(a.id);
      if(!b){note+='\n[Вложение «'+a.name+'» недоступно]';continue}
      const d=await b64(b);total+=d.length;files.push({type:a.type,data:d,name:a.name});
    }
    out.push({role:'user',text:(m.content+note).trim(),files:files});
  }
  if(limitMb&&total>limitMb*1024*1024)throw new Error('Слишком большой общий размер вложений в этом чате (лимит API около '+limitMb+' МБ). Начните новый чат или удалите часть файлов.');
  return out;
}
function addUsage(pid,model,i,o){
  const c=S.providers[pid];c.used.in+=i;c.used.out+=o;
  const b=c.by[model]||(c.by[model]={in:0,out:0});b.in+=i;b.out+=o;save();
}
async function apiErr(res){
  let m=res.status+' '+res.statusText;
  try{const j=await res.json();const e=j.error||j;m=res.status+': '+(e.message||(typeof e==='string'?e:JSON.stringify(e)))}catch(e){}
  return new Error(m);
}
async function sse(res,onData){
  const r=res.body.getReader(),d=new TextDecoder();let buf='';
  for(;;){
    const x=await r.read();if(x.done)break;
    buf+=d.decode(x.value,{stream:true});
    let i;
    while((i=buf.search(/\r?\n\r?\n/))>=0){
      const ev=buf.slice(0,i);buf=buf.slice(i).replace(/^\r?\n\r?\n/,'');
      const lines=ev.split(/\r?\n/);
      for(const l of lines){
        if(l.indexOf('data:')!==0)continue;
        const v=l.slice(5).trim();if(!v||v==='[DONE]')continue;
        let j;try{j=JSON.parse(v)}catch(e){continue}
        onData(j);
      }
    }
  }
}
async function generate(){
  if(busy)return;
  const chat=cur;
  while(chat.messages.length&&chat.messages[chat.messages.length-1].role==='assistant')chat.messages.pop();
  if(!chat.messages.length)return;
  const pm=splitM(chat.model),pid=pm[0],model=pm[1];
  if(!pid||!isAvail(pid)){if(avail().length){toast('Выберите модель');openPicker()}else openConn();return}
  const p=provOf(pid),c=S.providers[pid],mg=pid==='managed';
  const hist=chat.messages.filter(m=>m.content||(m.attachments&&m.attachments.length)).map(m=>({role:m.role,content:m.content||'',attachments:m.attachments}));
  const msg={role:'assistant',content:'',model:chat.model};
  chat.messages.push(msg);
  const abort=new AbortController();
  const g={chat:chat,msg:msg,abort:abort,pid:pid,model:model,hist:hist,idx:0,words:0,
    got:false,uIn:0,uOut:0,streamDone:false,done:false,stopped:false,painting:false};
  G=g;busy=true;abortC=abort;errMsg='';stick=true;anchored=true;renderAll();anchorSoon();
  const signal=abort.signal;
  const base=mg?'':(c.base||p.base).replace(/\/+$/,'');
  let uIn=0,uOut=0,got=false;
  const push=d=>{if(g.stopped)return;msg.content+=d;paint()};
  try{
    await Promise.race([configP,new Promise(r=>setTimeout(r,1500))]);
    if(signal.aborted)return;
    if(p.type==='oai'){
      const raw=await wireHist(hist,'oai',0);
      if(signal.aborted)return;
      const mkMsgs=textOnly=>raw.map(m=>m.files.length
        ?(textOnly
          ?{role:m.role,content:((m.text||'')+'\n[К сообщению было приложено изображение или файл, но эта модель принимает только текст]').trim()}
          :{role:m.role,content:(m.text?[{type:'text',text:m.text}]:[]).concat(m.files.map(f=>isPdf(f.type)
            ?{type:'file',file:{filename:f.name||'document.pdf',file_data:'data:application/pdf;base64,'+f.data}}
            :{type:'image_url',image_url:{url:'data:'+f.type+';base64,'+f.data}}))})
        :{role:m.role,content:m.text});
      const send=textOnly=>{
        const body={model:model,messages:(sysPrompt()?[{role:'system',content:sysPrompt()}]:[]).concat(mkMsgs(textOnly)),stream:true};
        if(p.usage)body.stream_options={include_usage:true};
        if(mg)return managedFetch('chat',model,JSON.stringify(body),signal);
        return fetch(base+'/chat/completions',{method:'POST',signal:signal,
          headers:Object.assign({'Content-Type':'application/json'},c.key?{Authorization:'Bearer '+c.key}:{}),body:JSON.stringify(body)});
      };
      let res=await send(false);
      if(!res.ok){
        const er=await apiErr(res);
        // текстовые модели отвечают 400 «content must be a string» на сообщения с картинками — повторяем без вложений
        if(res.status===400&&/must be a string|expected.*string/i.test(er.message)&&raw.some(m=>m.files.length)){
          toast('Модель не поддерживает изображения — отправлен только текст');
          res=await send(true);
          if(!res.ok)throw await apiErr(res);
        }else throw er;
      }
      await sse(res,j=>{
        const ch=j.choices&&j.choices[0];const t=ch&&ch.delta&&ch.delta.content;if(t)push(t);
        if(j.usage&&j.usage.prompt_tokens!=null){uIn=j.usage.prompt_tokens;uOut=j.usage.completion_tokens||0;got=true}
      });
    }else if(p.type==='anthropic'){
      const wh=(await wireHist(hist,'anthropic',30)).map(m=>m.files.length
        ?{role:m.role,content:m.files.map(f=>isPdf(f.type)
            ?{type:'document',source:{type:'base64',media_type:'application/pdf',data:f.data}}
            :{type:'image',source:{type:'base64',media_type:f.type,data:f.data}}).concat(m.text?[{type:'text',text:m.text}]:[])}
        :{role:m.role,content:m.text});
      if(signal.aborted)return;
      const body={model:model,max_tokens:Math.max(256,+S.maxTokens||4096),messages:wh,stream:true};
      if(sysPrompt())body.system=sysPrompt();
      const res=mg?await managedFetch('chat',model,JSON.stringify(body),signal):await fetch(base+'/v1/messages',{method:'POST',signal:signal,
        headers:{'Content-Type':'application/json','x-api-key':c.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify(body)});
      if(!res.ok)throw await apiErr(res);
      await sse(res,j=>{
        if(j.type==='content_block_delta'&&j.delta&&j.delta.text)push(j.delta.text);
        else if(j.type==='message_start'&&j.message&&j.message.usage){uIn=(j.message.usage.input_tokens||0)+(j.message.usage.cache_read_input_tokens||0);got=true}
        else if(j.type==='message_delta'&&j.usage){uOut=j.usage.output_tokens||uOut;got=true}
        else if(j.type==='error')throw new Error((j.error&&j.error.message)||'Ошибка API');
      });
    }else{
      const wh=await wireHist(hist,'gemini',19);
      if(signal.aborted)return;
      const body={contents:wh.map(m=>({role:m.role==='assistant'?'model':'user',
          parts:m.files.map(f=>({inline_data:{mime_type:f.type,data:f.data}})).concat(m.files.length&&!m.text?[]:[{text:m.text}])})),
        generationConfig:{maxOutputTokens:Math.max(256,+S.maxTokens||4096)}};
      if(sysPrompt())body.systemInstruction={parts:[{text:sysPrompt()}]};
      const res=mg?await managedFetch('chat',model,JSON.stringify(body),signal):await fetch(base+'/models/'+encodeURIComponent(model)+':streamGenerateContent?alt=sse&key='+encodeURIComponent(c.key),
        {method:'POST',signal:signal,headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
      if(!res.ok)throw await apiErr(res);
      await sse(res,j=>{
        const parts=j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts;
        if(parts)parts.forEach(x=>{if(x.text&&!x.thought)push(x.text)});
        if(j.usageMetadata){uIn=j.usageMetadata.promptTokenCount||uIn;uOut=(j.usageMetadata.candidatesTokenCount||0)+(j.usageMetadata.thoughtsTokenCount||0);got=true}
      });
    }
  }catch(e){
    if(g.stopped||(e&&e.name==='AbortError')){/* остановлено пользователем */}
    else if(e instanceof TypeError)errMsg='Не удалось связаться с API: сеть, CORS или блокировка. Проверьте интернет и Base URL (можно указать свой прокси) в настройках.'+(chat.messages.some(m=>m.attachments&&m.attachments.length)?' Есть вложения: если без них запрос проходит, дело в размере запроса.':'')+' ['+(e.message||'TypeError')+']';
    else errMsg=String(e&&e.message||e);
  }finally{
    g.uIn=uIn;g.uOut=uOut;g.got=got;
    g.streamDone=true;
    if(!g.done){
      save();
      // запрос закончился; если ответ ещё печатается — завершим, когда допечатается (кнопка «Стоп» всё это время активна)
      if(g.idx>=msg.content.length)finishGen(g);
      else paint();
    }
  }
}

/* ---------- полноэкранный просмотр фото ---------- */
const V={el:$('#viewer'),st:$('#vstage'),img:$('#vimg'),ids:[],i:0,s:1,x:0,y:0,open:false};
const vclamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function vApply(anim){
  V.img.style.transition=(anim?'transform .22s cubic-bezier(.2,.8,.2,1),':'')+'opacity .15s';
  V.img.style.transform='translate('+V.x+'px,'+V.y+'px) scale('+V.s+')';
}
function vBounds(){
  const w=V.img.offsetWidth*V.s,h=V.img.offsetHeight*V.s;
  const mx=Math.max(0,(w-V.st.clientWidth)/2),my=Math.max(0,(h-V.st.clientHeight)/2);
  V.x=vclamp(V.x,-mx,mx);V.y=vclamp(V.y,-my,my);
}
async function vShow(i){
  V.i=i;V.s=1;V.x=0;V.y=0;vApply(false);
  V.el.style.background='';
  $('#vcount').textContent=V.ids.length>1?(i+1)+' / '+V.ids.length:'';
  $('#vPrev').hidden=$('#vNext').hidden=V.ids.length<2;
  V.img.style.opacity='0';
  const id=V.ids[i];let u=urlCache.get(id);
  if(!u){const b=await fileGet(id);if(b)u=getUrl(id,b)}
  if(!V.open||V.i!==i)return;
  if(!u){toast('Не удалось открыть фото');closeViewer();return}
  V.img.onload=()=>{V.img.style.opacity='1'};
  V.img.src=u;
  if(V.img.complete)V.img.style.opacity='1';
}
function openViewer(ids,i){
  if(V.open)return;
  V.ids=ids;V.open=true;V.el.classList.add('on');pushLayer(closeViewer);vShow(i);
}
function closeViewer(){
  if(!V.open)return;
  V.open=false;V.el.classList.remove('on');popLayer(closeViewer);
  vp.clear();vg=null;
  setTimeout(()=>{if(!V.open)V.img.removeAttribute('src')},230);
}
const vp=new Map();let vg=null,vTap={t:0,x:0,y:0};
const vcen=()=>{
  const a=Array.from(vp.values());
  return {n:a.length,x:a.reduce((t,p)=>t+p.x,0)/a.length,y:a.reduce((t,p)=>t+p.y,0)/a.length,
    d:a.length>1?Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y):0};
};
function vStart(){const c=vcen();vg={n:c.n,cx:c.x,cy:c.y,d:c.d,s:V.s,x:V.x,y:V.y,t:Date.now(),moved:false}}
V.st.addEventListener('pointerdown',e=>{
  try{V.st.setPointerCapture(e.pointerId)}catch(_){}
  vp.set(e.pointerId,{x:e.clientX,y:e.clientY});vStart();
});
V.st.addEventListener('pointermove',e=>{
  if(!vp.has(e.pointerId)||!vg)return;
  vp.set(e.pointerId,{x:e.clientX,y:e.clientY});
  const c=vcen();
  if(c.n>=2&&vg.n>=2&&vg.d>0){            // щипок: масштаб + сдвиг
    V.s=vclamp(vg.s*c.d/vg.d,1,6);V.x=vg.x+(c.x-vg.cx);V.y=vg.y+(c.y-vg.cy);vg.moved=true;
  }else if(c.n===1&&vg.n===1){            // один палец
    const dx=c.x-vg.cx,dy=c.y-vg.cy;
    if(Math.abs(dx)+Math.abs(dy)>8)vg.moved=true;
    if(!vg.moved)return;
    V.x=vg.x+dx;V.y=vg.y+dy;
    if(V.s<=1.01)V.el.style.background='rgba(0,0,0,'+(1-Math.min(.6,Math.abs(V.y)/500))+')';
  }else return;
  vApply(false);
});
function vEnd(e){
  if(!vp.has(e.pointerId))return;
  vp.delete(e.pointerId);
  if(vp.size>0){vStart();return}
  const g=vg;vg=null;if(!g)return;
  if(V.s<=1.02){
    const dx=V.x,dy=V.y;
    if(g.moved&&g.n===1){
      if(Math.abs(dy)>110&&Math.abs(dy)>Math.abs(dx)){closeViewer();return}              // свайп вниз/вверх — закрыть
      if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)&&V.ids.length>1){                   // свайп вбок — соседнее фото
        const n=V.i+(dx<0?1:-1);
        if(n>=0&&n<V.ids.length){vShow(n);return}
      }
    }
    V.s=1;V.x=0;V.y=0;V.el.style.background='';vApply(true);
  }else{vBounds();vApply(true)}
  if(!g.moved&&e.type==='pointerup'&&Date.now()-g.t<350){
    const now=Date.now(),r=V.img.getBoundingClientRect();
    const onImg=e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom;
    if(now-vTap.t<320&&Math.hypot(e.clientX-vTap.x,e.clientY-vTap.y)<30){              // двойной тап — зум
      vTap.t=0;
      if(V.s>1.05){V.s=1;V.x=0;V.y=0}
      else{
        const rc=V.st.getBoundingClientRect(),k=2.5;
        V.s=k;V.x=-(k-1)*(e.clientX-(rc.left+rc.width/2));V.y=-(k-1)*(e.clientY-(rc.top+rc.height/2));vBounds();
      }
      vApply(true);return;
    }
    vTap={t:now,x:e.clientX,y:e.clientY};
    if(!onImg&&V.s<=1.02)closeViewer();                                                   // тап по тёмному фону — закрыть
  }
}
V.st.addEventListener('pointerup',vEnd);
V.st.addEventListener('pointercancel',vEnd);
V.st.addEventListener('wheel',e=>{
  e.preventDefault();
  V.s=vclamp(V.s*(e.deltaY<0?1.15:1/1.15),1,6);
  if(V.s<=1.01){V.s=1;V.x=0;V.y=0}
  vBounds();vApply(false);
},{passive:false});

});

async function fetchBal(pid,silent){
  const p=PROV[pid],c=S.providers[pid];if(!c.key||!p.balance)return;
  const base=(c.base||p.base).replace(/\/+$/,''),H={Authorization:'Bearer '+c.key};
  try{
    let text='';
    if(p.balance==='deepseek'){
      const r=await fetch(base+'/user/balance',{headers:H});const j=await r.json();
      if(!r.ok)throw new Error((j.error&&j.error.message)||r.status);
      text=(j.balance_infos||[]).map(b=>b.total_balance+' '+b.currency).join(' · ')||'—';
    }else{
      let r=await fetch(base+'/credits',{headers:H});
      if(r.ok){const d=(await r.json()).data;text='$'+(d.total_credits-d.total_usage).toFixed(2)}
      else{r=await fetch(base+'/key',{headers:H});const j=await r.json();if(!r.ok)throw new Error((j.error&&j.error.message)||r.status);
        const d=j.data;text=d.limit_remaining!=null?'$'+Number(d.limit_remaining).toFixed(2):'потрачено $'+Number(d.usage).toFixed(2)}
    }
    c.bal={text:text,t:Date.now()};save();
  }catch(e){
    delete c.bal;
    if(!silent)toast('Баланс '+p.name+': '+(e instanceof TypeError?'нет связи с сервисом':e.message));
  }
  renderUsage();
}
async function loadModels(pid){
  const p=provOf(pid),c=S.providers[pid],mg=pid==='managed';
  if(!isAvail(pid)){toast('Сначала укажите '+(p.custom?'Base URL':'API ключ'));return}
  const base=mg?'':(c.base||p.base).replace(/\/+$/,'');
  try{
    let list=[];
    if(mg){
      const r=await managedFetch('models');
      if(!r.ok)throw await apiErr(r);const j=await r.json();
      list=p.type==='gemini'
        ?(j.models||[]).filter(m=>(m.supportedGenerationMethods||[]).indexOf('generateContent')>=0).map(m=>m.name.replace(/^models\//,''))
        :(j.data||[]).map(m=>m.id);
    }else if(p.type==='oai'){
      const r=await fetch(base+'/models',{headers:c.key?{Authorization:'Bearer '+c.key}:{}});
      if(!r.ok)throw await apiErr(r);const j=await r.json();list=(j.data||[]).map(m=>m.id);
    }else if(p.type==='anthropic'){
      const r=await fetch(base+'/v1/models?limit=100',{headers:{'x-api-key':c.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'}});
      if(!r.ok)throw await apiErr(r);const j=await r.json();list=(j.data||[]).map(m=>m.id);
    }else{
      const r=await fetch(base+'/models?pageSize=200&key='+encodeURIComponent(c.key));
      if(!r.ok)throw await apiErr(r);const j=await r.json();
      list=(j.models||[]).filter(m=>(m.supportedGenerationMethods||[]).indexOf('generateContent')>=0).map(m=>m.name.replace(/^models\//,''));
    }
    list=Array.from(new Set(list.filter(Boolean))).sort();
    if(!list.length){toast('Список пуст');return}
    // что было отмечено до загрузки, остаётся отмеченным; остальное пользователь отмечает галочками
    const prev=new Set(getModels(pid));
    const extra=Array.from(prev).filter(m=>list.indexOf(m)<0);
    c.models=list.concat(extra).sort();
    c.enabled=c.models.filter(m=>prev.has(m));
    openProv.add(pid);save();
    toast('Загружено моделей: '+list.length+'. Отметьте нужные галочками');
  }catch(e){toast('Не удалось загрузить: '+(e instanceof TypeError?'нет связи с сервисом':e.message))}
}

/* та же мини-разметка, что и на сервере: **жирный**, *курсив*, `код`, [ссылка](https://…) */
function tgHtml(title,text){
  const codes=[];
  let s=String(text||'').replace(/`([^`\n]+)`/g,(m,c)=>{codes.push(c);return '\u0000'+(codes.length-1)+'\u0000'});
  s=esc(s).replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>')
    .replace(/(^|[^*\w])\*([^*\n]+)\*(?!\*)/g,'$1<i>$2</i>')
    .replace(/\[([^\]\n]+)\]\((https?:\/\/[^)\s]+)\)/g,'<a href="$2">$1</a>');
  s=s.replace(/\u0000(\d+)\u0000/g,(m,i)=>'<code>'+esc(codes[+i])+'</code>');
  return ((title?'<b>'+esc(title)+'</b>\n\n':'')+s).trim();
}
async function upApi(method,path,body){
  if(!tg||!tg.initData)throw new Error('Откройте приложение через Telegram');
  const h={'X-Telegram-Init-Data':tg.initData};
  if(body)h['Content-Type']='application/json';
  let r;
  try{r=await fetch(CLOUD_API+path,{method:method,headers:h,body:body?JSON.stringify(body):undefined})}
  catch(e){throw new Error('Нет связи с сервером')}
  let j={};try{j=await r.json()}catch(e){}
  if(!r.ok){const er=new Error(j.error||('Ошибка '+r.status));er.status=r.status;er.data=j;throw er}
  return j;
}
async function prepTgImage(f){   // Telegram надёжно принимает JPEG/PNG; остальное конвертируем в JPEG
  if(f.type==='image/jpeg'||f.type==='image/png')return prepImage(f);
  const img=await loadImg(f),w=img.naturalWidth,h=img.naturalHeight,k=Math.min(1,2048/Math.max(w,h));
  const cv=document.createElement('canvas');cv.width=Math.max(1,Math.round(w*k));cv.height=Math.max(1,Math.round(h*k));
  const cx=cv.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,cv.width,cv.height);cx.drawImage(img,0,0,cv.width,cv.height);
  const b=await new Promise(r=>cv.toBlob(r,'image/jpeg',.9));
  if(!b)throw new Error('img');
  return b;
}

function upContent(){

  if(UP.media.some(m=>m.state==='up')){toast('Дождитесь загрузки файлов');return null}

  if(!title&&!text&&!UP.media.length){toast('Сообщение пустое');return null}
  return {title:title,text:text,media:UP.media.map(m=>({id:m.fileId,type:m.type}))};

async function upAdd(files){
  for(const f of files){
    if(UP.media.length>=10){toast('Не больше 10 вложений в альбоме');break}
    const isV=/^video\//.test(f.type),isI=/^image\//.test(f.type);
    if(!isV&&!isI){toast('Формат не поддерживается');continue}
    if(isV&&f.type!=='video/mp4'){toast('Для видео нужен формат MP4');continue}
    if(isV&&f.size>45*1024*1024){toast('Видео больше 45 МБ');continue}
    let blob=f;
    if(isI){try{blob=await prepTgImage(f)}catch(e){toast('Не удалось обработать фото');continue}}
    const it={uid:uid(),type:isV?'video':'photo',name:f.name||(isV?'video.mp4':'photo.jpg'),url:URL.createObjectURL(blob),state:'up',fileId:''};
    UP.media.push(it);UP.token=null;upAtts();upPrev();
    (async()=>{
      try{
        const fd=new FormData();fd.append('file',blob,it.name);
        const r=await fetch(CLOUD_API+'/admin/media',{method:'POST',headers:{'X-Telegram-Init-Data':tg.initData},body:fd});
        const j=await r.json().catch(()=>({}));
        if(!r.ok)throw new Error(j.error||('Ошибка '+r.status));
        it.fileId=j.id;it.type=j.type||it.type;it.state='ok';
      }catch(e){it.state='err';toast('Не загрузилось: '+(e.message||'сеть'))}
      upAtts();
    })();
  }
}

async function upRun(id){
  if(UP.running)return;
  UP.running=id;UP.stop=false;upProgress();upHist();
  try{
    for(;;){
      const st=await upApi('POST','/admin/broadcasts/'+id+'/run');
      UP.cur=st;upProgress();
      if(st.status!=='sending'||UP.stop)break;
      if(st.retry_after)await sleepMs(st.retry_after*1000);
      else if(st.busy)await sleepMs(1500);
    }
  }catch(e){toast('Рассылка приостановлена: '+e.message)}
  UP.running=null;UP.stop=false;upProgress();
  await upLoad();
  if(UP.cur&&UP.cur.status==='done'){hap('medium');toast('Рассылка завершена')}
}

async function qLoadModels(){

  if(!base){toast('Сначала укажите Base URL');return}
  if(!key&&!p.custom){toast('Сначала введите API ключ');return}
  try{
    let list=[];
    if(p.type==='oai'){
      const r=await fetch(base+'/models',{headers:key?{Authorization:'Bearer '+key}:{}});
      if(!r.ok)throw await apiErr(r);const j=await r.json();list=(j.data||[]).map(m=>m.id);
    }else if(p.type==='anthropic'){
      const r=await fetch(base+'/v1/models?limit=100',{headers:{'x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'}});
      if(!r.ok)throw await apiErr(r);const j=await r.json();list=(j.data||[]).map(m=>m.id);
    }else{
      const r=await fetch(base+'/models?pageSize=200&key='+encodeURIComponent(key));

      list=(j.models||[]).filter(m=>(m.supportedGenerationMethods||[]).indexOf('generateContent')>=0).map(m=>m.name.replace(/^models\//,''));

  const a=b.dataset.u;
  if(a==='attach')$('#upFile').click();
  else if(a==='test'){b.disabled=true;await upTest();b.disabled=false}
  else if(a==='send'){b.disabled=true;await upSend();b.disabled=false}
  else if(a==='pause'){UP.stop=true;b.disabled=true}
  else if(a==='resume')upRun(b.dataset.id);
  else if(a==='syssave'||a==='sysreset'){
    if(!isAdmin||!tg||!tg.initData)return;
    b.disabled=true;
    try{
      if(a==='syssave'){const t=$('#adminSys').value.trim();await adminRequest('PUT',t);remoteSystem=t;toast('Промпт сохранён для всех')}
      else{await adminRequest('DELETE');remoteSystem=null;$('#adminSys').value='';toast('Промпт очищен')}
    }catch(err){toast('Не удалось сохранить: '+(err instanceof TypeError?'нет связи с сервером':err.message))}
    b.disabled=false;
  }
  else if(a==='qload'){b.disabled=true;const sp=b.querySelector('span');if(sp)sp.textContent='Загрузка…';await qLoadModels();qModelsRender()}
  else if(a==='qmtog'){const m=b.dataset.m;if(QM.on.has(m))QM.on.delete(m);else QM.on.add(m);b.classList.toggle('on',QM.on.has(m));b.setAttribute('aria-checked',String(QM.on.has(m)));hap()}
  else if(a==='qmdel'){const m=b.dataset.m;QM.all=QM.all.filter(x=>x!==m);QM.on.delete(m);const row=b.closest('.mrow');if(row)row.remove()}
  else if(a==='qmadd')qModelAdd();
  else if(a==='qgen'){b.disabled=true;try{await qGen()}catch(err){toast(err.message)}b.disabled=false}
  else if(a==='qcopy'){copyText(b.dataset.t)}
  else if(a==='qdel'){
    const ok=await dialog({title:'Удалить запись?',text:'Код '+b.dataset.id+' пропадёт из списка. Подключение у тех, кто его уже активировал, тоже отключится.',ok:'Удалить',danger:true});
    if(!ok)return;
    try{await upApi('DELETE','/admin/setup-codes/'+b.dataset.id+'?purge=1');qLoad()}catch(err){toast(err.message)}
  }
  else if(a==='qrev'){try{await upApi('DELETE','/admin/setup-codes/'+b.dataset.id);qLoad()}catch(err){toast(err.message)}}
  else if(a==='cancel'){
    const ok=await dialog({title:'Отменить рассылку?',text:'Недоставленные сообщения отправлены не будут.',ok:'Отменить рассылку',danger:true});
    if(!ok)return;
    try{await upApi('POST','/admin/broadcasts/'+b.dataset.id+'/cancel');if(UP.cur&&UP.cur.id===b.dataset.id)UP.cur=null;upProgress();await upLoad()}
    catch(err){toast(err.message)}
  }
});

/* ---------- быстрая настройка по коду или ссылке ---------- */
/* сервер возвращает только имя, лимит и модели: ключ и адрес остаются на сервере в скрытом системном слоте */
function applySetup(d){
  if(!PROV[d.provider]||PROV[d.provider].hidden)throw new Error('Неизвестный провайдер');
  const c=S.providers.managed;
  c.key='';c.base='';c.name='';
  c.used={in:0,out:0};c.by={};delete c.bal;
  c.meta=null;setManagedMeta(d);
  const first=getModels('managed')[0];
  if(first){cur.model='managed|'+first;S.lastModel=cur.model}
  save();renderTop();
}
/* Возвращает false, если пользователь отказался от перезаписи (код при этом не списывается) */
async function redeemCode(raw){
  const m=String(raw||'').match(/startapp=([\w-]+)/i);
  const code=(m?m[1]:String(raw||'')).trim();
  const info=await cloudJson('POST','/setup/check',{code:code});
  if(info.existing){
    const ok=await dialog({title:'Перезаписать подключение?',text:'Системное подключение уже настроено. Оно будет заменено данными из нового кода, счётчик токенов обнулится.',ok:'Перезаписать'});
    if(!ok)return false;
  }
  const d=await cloudJson('POST','/setup/redeem',{code:code});
  applySetup(d);
  if(!getModels('managed').length){
    await loadModels('managed');
    const c=S.providers.managed,list=allModels('managed').slice(0,20);
    if(list.length){c.enabled=list;cur.model='managed|'+list[0];S.lastModel=cur.model;save();renderTop()}
  }
  return true;
}

/* ---------- init ---------- */
try{
  if(tg){
    tg.ready();tg.expand();
    applyTheme();
    try{tg.disableVerticalSwipes&&tg.disableVerticalSwipes()}catch(e){}
    tg.onEvent&&tg.onEvent('viewportChanged',fit);
  }
}catch(e){}
fit();
window.addEventListener('resize',fit);
if(window.visualViewport)window.visualViewport.addEventListener('resize',fit);
inp.addEventListener('focus',()=>{setTimeout(fit,60);setTimeout(fit,320)});
/* окна поверх чата поднимаются вместе с клавиатурой (одно обновление за кадр, без лишних записей) */
let kbRaf=0,kbLast='';
function kbFix(){
  if(kbRaf)return;
  kbRaf=requestAnimationFrame(()=>{
    kbRaf=0;
    const d=$('#dlg');
    if(!d.classList.contains('on')||d.classList.contains('context')){if(d.style.paddingBottom)d.style.paddingBottom='';kbLast='';return}
    const v=window.visualViewport,appH=$('#app').getBoundingClientRect().height;
    const vh=v?v.height:appH,kb=Math.max(0,Math.round(appH-vh-(v?v.offsetTop:0)));
    const pad=(24+kb)+'px',mh=Math.max(200,Math.round(Math.min(appH,vh)-48))+'px';
    const card=d.querySelector('.dcard');
    if(kbLast===pad+'|'+mh&&card&&card.style.maxHeight===mh)return;
    kbLast=pad+'|'+mh;
    d.style.paddingBottom=pad;
    if(card)card.style.maxHeight=mh;
    requestAnimationFrame(kbScroll);
  });
}
function kbScroll(){
  const d=$('#dlg'),a=document.activeElement,card=d.querySelector('.dcard');
  if(!d.classList.contains('on')||!card||!a||!card.contains(a)||!/^(INPUT|TEXTAREA)$/.test(a.tagName))return;
  if(card.classList.contains('cn')){card.scrollTop=card.scrollHeight;return}   // окно подключения: до самого низа, к кнопке «Применить код»
  const r=a.getBoundingClientRect(),c=card.getBoundingClientRect();
  if(r.bottom>c.bottom-8)card.scrollTop+=r.bottom-c.bottom+16;
  else if(r.top<c.top+8)card.scrollTop-=c.top-r.top+16;
}
$('#dlg').addEventListener('focusin',()=>{kbFix();setTimeout(kbFix,250);setTimeout(()=>{kbFix();kbScroll()},420);setTimeout(kbScroll,750)});
$('#dlg').addEventListener('focusout',()=>{setTimeout(kbFix,120);setTimeout(kbFix,420)});
if(window.visualViewport)window.visualViewport.addEventListener('resize',kbFix);
try{tg&&tg.onEvent&&tg.onEvent('viewportChanged',kbFix)}catch(e){}
(async()=>{
  let failed=0;
  try{failed=await loadCloudKeys()||0}catch(e){failed=1}
  newChat();
  if(failed)return;   // не удалось связаться с облаком — не считаем пользователя новым
  const sp=tg&&tg.initDataUnsafe&&tg.initDataUnsafe.start_param;
  if(sp){
    try{
      if(!hasSetup()){await redeemCode(sp);toast('Настройка применена')}
      else if(await redeemCode(sp))toast('Настройка обновлена');
    }catch(e){if(!hasSetup())toast(e.message)}
  }
  if(!hasSetup())openConn();
})();
gcFiles();
})();
