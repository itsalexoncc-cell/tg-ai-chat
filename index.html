  const chat=cur;
  let n=chat.messages.length;while(n&&chat.messages[n-1].role==='assistant')n--;
  if(!n)return;
  const pm=splitM(chat.model),pid=pm[0],model=pm[1];
  if(!pid||!isAvail(pid)){await needModel();return}
  if(!opts.checked&&!opts.noMedia&&!opts.force){
    const chk=await mediaCheck(pid,model,chat.messages[n-1].attachments||[]);
    if(chk==='stop'||busy||cur!==chat)return;
    Object.assign(opts,chk);
  }
  while(chat.messages.length&&chat.messages[chat.messages.length-1].role==='assistant')chat.messages.pop();
  const p=provOf(pid),c=S.providers[pid],mg=pid==='managed',caps=capsFor(pid,model);
  const hist=chat.messages.filter(m=>m.content||(m.attachments&&m.attachments.length)).map(m=>({role:m.role,content:m.content||'',attachments:m.attachments}));
  const msg={role:'assistant',content:'',model:chat.model};
  chat.messages.push(msg);
  const abort=new AbortController();
  const ws=opts.noWeb?null:webSpec(pid,model);
  const cooled=!!(ws&&ws.tier==='auto'&&isWebFreeOff(pid,model));
  const wm=ws?(ws.tier==='auto'?(cooled?null:ws.mode):(paidWeb?ws.mode:null)):null;
  const g={chat:chat,msg:msg,abort:abort,pid:pid,model:model,hist:hist,idx:0,words:0,wordT:[],lockedPos:0,lockedWords:0,tail:null,paintT:0,
    status:(wm&&ws&&ws.tier==='paid')?'searching':'',webMode:wm,webTier:wm&&ws?ws.tier:'',opts:opts,kinds:[],saves:[],err:null,
    got:false,uIn:0,uOut:0,streamDone:false,done:false,stopped:false,painting:false};
  G=g;busy=true;abortC=abort;errMsg='';stick=true;anchored=true;renderAll();anchorSoon();
  const signal=abort.signal;
  const base=mg?'':(c.base||p.base).replace(/\/+$/,'');
  let uIn=0,uOut=0,got=false,completed=false,filtered=false;
  const push=d=>{if(g.stopped)return;msg.content+=d;paint()};
  try{
    await Promise.race([configP,new Promise(r=>setTimeout(r,1500))]);
    if(signal.aborted)return;
    // что из вложений отправлять: старые фото/PDF не отправляем, если модель их не читает
    const skip=(a,isLast)=>{
      const k=kindOf(a);if(k==='text')return false;
      if(opts.noMedia)return true;
      if(opts.noOld&&!isLast)return true;
      return !isLast&&(k==='image'?caps.img===false:caps.pdf===false);
    };
    const W=await wireHist(hist,{limitMb:p.type==='anthropic'?28:p.type==='gemini'?18:24,skip:skip});
    if(signal.aborted)return;
    W.forEach(m=>m.files.forEach(f=>{if(g.kinds.indexOf(f.kind)<0)g.kinds.push(f.kind)}));
    const lost=W.info.missing.filter(x=>x.last);
    if(lost.length){
      const a=await notice({icon:'file',title:'Файл больше недоступен',
        text:'«'+lost.map(x=>x.name).join('», «')+'» больше не хранится на этом устройстве (память приложения была очищена). Модель его не увидит.',
        tips:['Можно отправить сообщение без этого файла или приложить файл заново.'],
        actions:[{id:'go',label:'Отправить без файла',kind:'pri'},{id:'cancel',label:'Отмена',kind:'ghost'}],dismiss:'cancel'});
      if(a!=='go'){g.cancelled=true;return}
    }
    if(W.info.dropped.length)toast('Старые вложения не переданы модели: не хватило места в запросе');
    if(signal.aborted)return;

    const runProvider=async activeWm=>{
      const think=thinkFilter(push,()=>setGenStatus(g,'thinking'));
      if(p.type==='oai'&&activeWm==='oai-responses'&&!mg){
        const input=W.map(m=>({role:m.role,content:m.role==='assistant'
          ?[{type:'output_text',text:m.text}]
          :(m.text?[{type:'input_text',text:m.text}]:[]).concat(m.files.map(f=>f.kind==='pdf'
              ?{type:'input_file',filename:f.name||'document.pdf',file_data:'data:application/pdf;base64,'+f.data}
              :{type:'input_image',image_url:'data:'+f.type+';base64,'+f.data}))}));
        const body={model:model,input:input,tools:[{type:'web_search'}],stream:true};
        if(sysPrompt())body.instructions=sysPrompt();
        const res=await fetch(base+'/responses',{method:'POST',signal:signal,
          headers:Object.assign({'Content-Type':'application/json'},c.key?{Authorization:'Bearer '+c.key}:{}),body:JSON.stringify(body)});
        if(!res.ok)throw await apiErr(res);
        await sse(res,j=>{
          if(j.type==='response.web_search_call.in_progress'||j.type==='response.web_search_call.searching')setGenStatus(g,'searching');
          else if(j.type==='response.reasoning_summary_text.delta')setGenStatus(g,'thinking');
          else if(j.type==='response.output_text.delta'&&j.delta)think.feed(j.delta);
          else if(j.type==='response.output_text.annotation.added'&&j.annotation&&j.annotation.type==='url_citation')addSource(g,j.annotation.url,j.annotation.title);
          else if(j.type==='response.completed'&&j.response){
            const u=j.response.usage;
            if(u){uIn=u.input_tokens||0;uOut=u.output_tokens||0;got=true}
            (j.response.output||[]).forEach(o=>{
              (o.content||[]).forEach(ct=>{(ct.annotations||[]).forEach(a=>{if(a&&a.type==='url_citation')addSource(g,a.url,a.title)})});
            });
          }else if(j.type==='response.failed'||j.type==='error'){
            const er=new Error((j.error&&j.error.message)||(j.response&&j.response.error&&j.response.error.message)||'Ошибка API');
            er.raw=er.message;throw er;
          }
        });
      }else if(p.type==='oai'){
        const msgs=W.map(m=>m.files.length
          ?{role:m.role,content:(m.text?[{type:'text',text:m.text}]:[]).concat(m.files.map(f=>f.kind==='pdf'
              ?{type:'file',file:{filename:f.name||'document.pdf',file_data:'data:application/pdf;base64,'+f.data}}
              :{type:'image_url',image_url:{url:'data:'+f.type+';base64,'+f.data}}))}
          :{role:m.role,content:m.text});
        const body={model:model,messages:(sysPrompt()?[{role:'system',content:sysPrompt()}]:[]).concat(msgs),stream:true};
        if(p.usage)body.stream_options={include_usage:true};
        if(p.id==='openrouter'&&/image/i.test(model))body.modalities=['image','text'];   // модели, которые умеют рисовать
        if(activeWm==='openrouter')body.plugins=[{id:'web'}];
        else if(activeWm==='oai-search')body.web_search_options={};
        else if(activeWm==='xai')body.search_parameters={mode:'on'};
        const res=mg?await managedFetch('chat',model,JSON.stringify(body),signal)
          :await fetch(base+'/chat/completions',{method:'POST',signal:signal,
            headers:Object.assign({'Content-Type':'application/json'},c.key?{Authorization:'Bearer '+c.key}:{}),body:JSON.stringify(body)});
        if(!res.ok)throw await apiErr(res);
        const onChunk=j=>{
          if(j&&j.error){const er=new Error(pickMsg(j.error)||'Ошибка API');er.raw=er.message;er.status=+(j.error.code||j.error.status)||0;throw er}
          if(Array.isArray(j.citations))j.citations.forEach(ct=>{
            if(typeof ct==='string')addSource(g,ct,'');
            else if(ct&&ct.url)addSource(g,ct.url,ct.title);
          });
          const ch=j.choices&&j.choices[0];
          if(ch){
            const dl=ch.delta||ch.message||{};
            if(dl.reasoning_content||dl.reasoning)setGenStatus(g,'thinking');
            const t=Array.isArray(dl.content)?dl.content.map(x=>(x&&(!x.type||x.type==='text'||x.type==='output_text')&&x.text)||'').join(''):(typeof dl.content==='string'?dl.content:'');
            if(t)think.feed(t);
            (dl.annotations||(ch.message&&ch.message.annotations)||[]).forEach(a=>{
              const uc=a&&(a.url_citation||a);
              if(uc&&uc.url)addSource(g,uc.url,uc.title);
            });
            (dl.images||[]).forEach(im=>{
              const u=im&&((im.image_url&&im.image_url.url)||im.url),mm=/^data:([^;,]+);base64,(.+)$/.exec(u||'');
              if(mm)addOutFile(g,mm[1],mm[2]);
            });
            if(ch.finish_reason==='content_filter')filtered=true;
          }
          if(j.usage&&j.usage.prompt_tokens!=null){uIn=j.usage.prompt_tokens;uOut=j.usage.completion_tokens||0;got=true}
        };
        if(/application\/json/i.test(res.headers.get('content-type')||''))onChunk(await res.json());   // сервис ответил без потока
        else await sse(res,onChunk);
      }else if(p.type==='anthropic'){
        const wh=W.map(m=>m.files.length
          ?{role:m.role,content:m.files.map(f=>f.kind==='pdf'
              ?{type:'document',source:{type:'base64',media_type:'application/pdf',data:f.data}}
              :{type:'image',source:{type:'base64',media_type:f.type,data:f.data}}).concat(m.text?[{type:'text',text:m.text}]:[])}
          :{role:m.role,content:m.text});
        const body={model:model,max_tokens:Math.max(256,+S.maxTokens||4096),messages:wh,stream:true};
        if(sysPrompt())body.system=sysPrompt();
        if(activeWm==='anthropic')body.tools=[{type:'web_search_20250305',name:'web_search',max_uses:5}];
        const res=mg?await managedFetch('chat',model,JSON.stringify(body),signal):await fetch(base+'/v1/messages',{method:'POST',signal:signal,
          headers:{'Content-Type':'application/json','x-api-key':c.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify(body)});
        if(!res.ok)throw await apiErr(res);
        await sse(res,j=>{
          if(j.type==='content_block_start'&&j.content_block){
            const cb=j.content_block;
            if(cb.type==='server_tool_use'&&cb.name==='web_search')setGenStatus(g,'searching');
            else if(cb.type==='thinking')setGenStatus(g,'thinking');
            else if(cb.type==='web_search_tool_result'&&Array.isArray(cb.content)){
              cb.content.forEach(x=>{if(x&&x.url)addSource(g,x.url,x.title)});
            }
          }else if(j.type==='content_block_delta'&&j.delta){
            if(j.delta.type==='thinking_delta')setGenStatus(g,'thinking');
            else if(j.delta.type==='citations_delta'&&j.delta.citation&&j.delta.citation.url)addSource(g,j.delta.citation.url,j.delta.citation.title);
            else if(j.delta.text&&(!j.delta.type||j.delta.type==='text_delta'))think.feed(j.delta.text);
          }else if(j.type==='message_start'&&j.message&&j.message.usage){uIn=(j.message.usage.input_tokens||0)+(j.message.usage.cache_read_input_tokens||0);got=true}
          else if(j.type==='message_delta'&&j.usage){uOut=j.usage.output_tokens||uOut;got=true;if(j.delta&&j.delta.stop_reason==='refusal')filtered=true}
          else if(j.type==='error'){
            const er=new Error((j.error&&j.error.message)||'Ошибка API');er.raw=er.message;
            er.status=(j.error&&j.error.type==='overloaded_error')?529:(j.error&&j.error.type==='rate_limit_error')?429:0;
            throw er;
          }
        });
      }else{
        const body={contents:W.map(m=>({role:m.role==='assistant'?'model':'user',
            parts:m.files.map(f=>({inline_data:{mime_type:f.type,data:f.data}})).concat(m.files.length&&!m.text?[]:[{text:m.text}])})),
          generationConfig:{maxOutputTokens:Math.max(256,+S.maxTokens||4096)}};
        if(/image/i.test(model))body.generationConfig.responseModalities=['TEXT','IMAGE'];   // модели, которые умеют рисовать
        if(activeWm==='gemini')body.tools=[{google_search:{}}];
        if(sysPrompt())body.systemInstruction={parts:[{text:sysPrompt()}]};
        const res=mg?await managedFetch('chat',model,JSON.stringify(body),signal):await fetch(base+'/models/'+encodeURIComponent(model)+':streamGenerateContent?alt=sse&key='+encodeURIComponent(c.key),
          {method:'POST',signal:signal,headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
        if(!res.ok)throw await apiErr(res);
        await sse(res,j=>{
          if(j&&j.error){const er=new Error(pickMsg(j.error)||'Ошибка API');er.raw=er.message;er.status=+(j.error.code||j.error.status)||0;throw er}
          const cand=j.candidates&&j.candidates[0],parts=cand&&cand.content&&cand.content.parts;
          const gm=cand&&cand.groundingMetadata;
          if(gm&&gm.webSearchQueries&&gm.webSearchQueries.length)setGenStatus(g,'searching');
          if(parts)parts.forEach(x=>{
            if(x.thought){setGenStatus(g,'thinking');return}   // «мысли» модели не показываем, но сообщаем, что она думает
            if(x.text)think.feed(x.text);
            const d=x.inlineData||x.inline_data;
            if(d&&d.data)addOutFile(g,d.mimeType||d.mime_type,d.data);
          });
          if(gm&&Array.isArray(gm.groundingChunks)){
            gm.groundingChunks.forEach(ch=>{if(ch&&ch.web&&ch.web.uri)addSource(g,ch.web.uri,ch.web.title)});
          }
          if((j.promptFeedback&&j.promptFeedback.blockReason)||(cand&&/SAFETY|PROHIBITED|BLOCKLIST|SPII/.test(cand.finishReason||'')))filtered=true;
          if(j.usageMetadata){uIn=j.usageMetadata.promptTokenCount||uIn;uOut=(j.usageMetadata.candidatesTokenCount||0)+(j.usageMetadata.thoughtsTokenCount||0);got=true}
        });
      }
      think.end();
    };

    try{
      await runProvider(wm);
    }catch(e){
      /* Если веб-поиск не прошёл (нет квоты/баланса на поиск, ошибка инструмента и т.п.) — сразу отправляем обычный запрос без подтверждения */
      if(!g.stopped&&wm&&wm!=='native'&&!msg.content&&!(msg.files&&msg.files.length)&&canWebFallback(e,g)){
        const prevCtx=genCtx(g),wasPaid=g.webTier==='paid',errKind=classify(e,prevCtx);
        g.webMode=null;g.webTier='';g.status='';
        if(cur===chat){
          const idx=chat.messages.indexOf(msg);
          const nEl=idx>=0?box.querySelector('.m.a[data-i="'+idx+'"] .b'):null;
          if(nEl)nEl.innerHTML=statusHtml(g);
        }
        uIn=0;uOut=0;got=false;filtered=false;
        await runProvider(null);
        /* Обычный запрос прошёл: запоминаем, что именно веб-поиск сейчас не сработал */
        if(errKind==='noweb')capSetWeb(pid,model,false);
        else if(!wasPaid)capSetWeb(pid,model,'free_off');
        if(wasPaid)paidWeb=false;
        if(cur===chat){
          syncWebBtn();
          toast(wasPaid?'Веб-поиск не прошёл — отправлен обычный запрос':'Поиск в сети недоступен — ответ без интернета');
        }
      }else throw e;
    }
    completed=true;
  }catch(e){
    if(g.stopped||(e&&e.name==='AbortError')){/* остановлено пользователем */}
    else g.err=e;
  }finally{
    g.uIn=uIn;g.uOut=uOut;g.got=got;
    if(completed&&!g.err&&!g.stopped&&!msg.content&&!(msg.files&&msg.files.length)){
      const er=new Error('empty');er.kind=filtered?'safety':'empty';g.err=er;   // пустой ответ — тоже ошибка, о которой надо сказать
    }
    if(completed&&!g.err&&g.kinds.length)capSet(pid,model,g.kinds,true);   // модель приняла файлы — запоминаем
    try{await Promise.all(g.saves)}catch(e){}
    g.streamDone=true;
    if(!g.done){
      save();
      // запрос закончился; если ответ ещё печатается — завершим, когда допечатается (кнопка «Стоп» всё это время активна)
      if(g.idx>=msg.content.length)finishGen(g);
      else paint();
    }
  }
}

/* ---------- dialog ---------- */
function dialog(o){
  return new Promise(res=>{
    const d=$('#dlg');
    d.innerHTML='<div class="dcard"><h4>'+esc(o.title||'')+'</h4>'+(o.text?'<p>'+esc(o.text)+'</p>':'')+
      (o.input!=null?'<input id="dIn" value="'+esc(o.input)+'" autocomplete="off">':'')+
      '<div class="drow"><button class="btn" data-r="0">Отмена</button><button class="btn '+(o.danger?'dan':'pri')+'" data-r="1">'+esc(o.ok||'OK')+'</button></div></div>';
    d.classList.add('on');
    const done=v=>{d.classList.remove('on');d.innerHTML='';popLayer(cancel);res(v)};
    const cancel=()=>done(null);
    pushLayer(cancel);
    d.onclick=e=>{
      if(e.target===d)return done(null);
      const b=e.target.closest('[data-r]');if(!b)return;
      if(b.dataset.r==='0')return done(null);
      const i=$('#dIn');done(i?i.value.trim():true);
    };
    const i=$('#dIn');if(i){i.focus();i.select()}
  });
}

/* ---------- полноэкранный просмотр фото ---------- */
const V={el:$('#viewer'),st:$('#vstage'),img:$('#vimg'),ids:[],i:0,s:1,x:0,y:0,open:false};
const vclamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function vApply(anim){
  V.img.style.transition=(anim?'transform .22s cubic-bezier(.2,.8,.2,1),':'')+'opacity .15s';
  V.img.style.transform='translate('+V.x+'px,'+V.y+'px) scale('+V.s+')';
}
function vBounds(){
  const w=V.img.offsetWidth*V.s,h=V.img.offsetHeight*V.s;
  const mx=Math.max(0,(w-V.st.clientWidth)/2),my=Math.max(0,(h-V.st.clientHeight)/2);
  V.x=vclamp(V.x,-mx,mx);V.y=vclamp(V.y,-my,my);
}
async function vShow(i){
  V.i=i;V.s=1;V.x=0;V.y=0;vApply(false);
  V.el.style.background='';
  $('#vcount').textContent=V.ids.length>1?(i+1)+' / '+V.ids.length:'';
  $('#vPrev').hidden=$('#vNext').hidden=V.ids.length<2;
  V.img.style.opacity='0';
  const id=V.ids[i];let u=urlCache.get(id);
  if(!u){const b=await fileGet(id);if(b)u=getUrl(id,b)}
  if(!V.open||V.i!==i)return;
  if(!u){closeViewer();infoBox('Фото недоступно','Это изображение больше не хранится на устройстве. Такое бывает, если память приложения была очищена.');return}
  V.img.onload=()=>{V.img.style.opacity='1'};
  V.img.src=u;
  if(V.img.complete)V.img.style.opacity='1';
}
function openViewer(ids,i){
  if(V.open)return;
  V.ids=ids;V.open=true;V.el.classList.add('on');pushLayer(closeViewer);vShow(i);
}
function closeViewer(){
  if(!V.open)return;
  V.open=false;V.el.classList.remove('on');popLayer(closeViewer);
  vp.clear();vg=null;
  setTimeout(()=>{if(!V.open)V.img.removeAttribute('src')},230);
}
const vp=new Map();let vg=null,vTap={t:0,x:0,y:0};
const vcen=()=>{
  const a=Array.from(vp.values());
  return {n:a.length,x:a.reduce((t,p)=>t+p.x,0)/a.length,y:a.reduce((t,p)=>t+p.y,0)/a.length,
    d:a.length>1?Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y):0};
};
function vStart(){const c=vcen();vg={n:c.n,cx:c.x,cy:c.y,d:c.d,s:V.s,x:V.x,y:V.y,t:Date.now(),moved:false}}
V.st.addEventListener('pointerdown',e=>{
  try{V.st.setPointerCapture(e.pointerId)}catch(_){}
  vp.set(e.pointerId,{x:e.clientX,y:e.clientY});vStart();
});
V.st.addEventListener('pointermove',e=>{
  if(!vp.has(e.pointerId)||!vg)return;
  vp.set(e.pointerId,{x:e.clientX,y:e.clientY});
  const c=vcen();
  if(c.n>=2&&vg.n>=2&&vg.d>0){            // щипок: масштаб + сдвиг
    V.s=vclamp(vg.s*c.d/vg.d,1,6);V.x=vg.x+(c.x-vg.cx);V.y=vg.y+(c.y-vg.cy);vg.moved=true;
  }else if(c.n===1&&vg.n===1){            // один палец
    const dx=c.x-vg.cx,dy=c.y-vg.cy;
    if(Math.abs(dx)+Math.abs(dy)>8)vg.moved=true;
    if(!vg.moved)return;
    V.x=vg.x+dx;V.y=vg.y+dy;
    if(V.s<=1.01)V.el.style.background='rgba(0,0,0,'+(1-Math.min(.6,Math.abs(V.y)/500))+')';
  }else return;
  vApply(false);
});
function vEnd(e){
  if(!vp.has(e.pointerId))return;
  vp.delete(e.pointerId);
  if(vp.size>0){vStart();return}
  const g=vg;vg=null;if(!g)return;
  if(V.s<=1.02){
    const dx=V.x,dy=V.y;
    if(g.moved&&g.n===1){
      if(Math.abs(dy)>110&&Math.abs(dy)>Math.abs(dx)){closeViewer();return}              // свайп вниз/вверх — закрыть
      if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)&&V.ids.length>1){                   // свайп вбок — соседнее фото
        const n=V.i+(dx<0?1:-1);
        if(n>=0&&n<V.ids.length){vShow(n);return}
      }
    }
    V.s=1;V.x=0;V.y=0;V.el.style.background='';vApply(true);
  }else{vBounds();vApply(true)}
  if(!g.moved&&e.type==='pointerup'&&Date.now()-g.t<350){
    const now=Date.now(),r=V.img.getBoundingClientRect();
    const onImg=e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom;
    if(now-vTap.t<320&&Math.hypot(e.clientX-vTap.x,e.clientY-vTap.y)<30){              // двойной тап — зум
      vTap.t=0;
      if(V.s>1.05){V.s=1;V.x=0;V.y=0}
      else{
        const rc=V.st.getBoundingClientRect(),k=2.5;
        V.s=k;V.x=-(k-1)*(e.clientX-(rc.left+rc.width/2));V.y=-(k-1)*(e.clientY-(rc.top+rc.height/2));vBounds();
      }
      vApply(true);return;
    }
    vTap={t:now,x:e.clientX,y:e.clientY};
    if(!onImg&&V.s<=1.02)closeViewer();                                                   // тап по тёмному фону — закрыть
  }
}
V.st.addEventListener('pointerup',vEnd);
V.st.addEventListener('pointercancel',vEnd);
V.st.addEventListener('wheel',e=>{
  e.preventDefault();
  V.s=vclamp(V.s*(e.deltaY<0?1.15:1/1.15),1,6);
  if(V.s<=1.01){V.s=1;V.x=0;V.y=0}
  vBounds();vApply(false);
},{passive:false});

$('#vPrev').addEventListener('click',()=>{if(V.i>0)vShow(V.i-1)});

async function fetchBal(pid,silent){
  const p=PROV[pid],c=S.providers[pid];if(!c.key||!p.balance)return;
  const base=(c.base||p.base).replace(/\/+$/,''),H={Authorization:'Bearer '+c.key};
  try{
    let text='';
    if(p.balance==='deepseek'){
      const r=await fetch(base+'/user/balance',{headers:H});
      if(!r.ok)throw await apiErr(r);
      const j=await r.json();
      text=(j.balance_infos||[]).map(b=>b.total_balance+' '+b.currency).join(' · ')||'—';
    }else{
      let r=await fetch(base+'/credits',{headers:H});
      if(r.ok){const d=(await r.json()).data;text='$'+(d.total_credits-d.total_usage).toFixed(2)}
      else{r=await fetch(base+'/key',{headers:H});if(!r.ok)throw await apiErr(r);const j=await r.json();
        const d=j.data;text=d.limit_remaining!=null?'$'+Number(d.limit_remaining).toFixed(2):'потрачено $'+Number(d.usage).toFixed(2)}
    }
    c.bal={text:text,t:Date.now()};save();
  }catch(e){
    delete c.bal;
    if(!silent)showError(e,{where:'models',provider:p.name,title:'Не удалось проверить баланс',noNav:true});
  }
  renderUsage();
}
async function loadModels(pid){
  const p=provOf(pid),c=S.providers[pid],mg=pid==='managed';
  if(!isAvail(pid)){infoBox('Сначала подключите сервис',p.custom?'Укажите адрес сервиса (Base URL), а затем загрузите список моделей.':'Вставьте API-ключ, а затем загрузите список моделей.');return}
  const base=mg?'':(c.base||p.base).replace(/\/+$/,'');
  try{
    let list=[];
    if(mg){
      const r=await managedFetch('models');
      if(!r.ok)throw await apiErr(r);const j=await r.json();
      list=p.type==='gemini'
        ?(j.models||[]).filter(m=>(m.supportedGenerationMethods||[]).indexOf('generateContent')>=0).map(m=>m.name.replace(/^models\//,''))
        :(j.data||[]).map(m=>m.id);
    }else if(p.type==='oai'){
      const r=await fetch(base+'/models',{headers:c.key?{Authorization:'Bearer '+c.key}:{}});
      if(!r.ok)throw await apiErr(r);const j=await r.json();list=(j.data||[]).map(m=>m.id);
    }else if(p.type==='anthropic'){
      const r=await fetch(base+'/v1/models?limit=100',{headers:{'x-api-key':c.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'}});
      if(!r.ok)throw await apiErr(r);const j=await r.json();list=(j.data||[]).map(m=>m.id);
    }else{
      const r=await fetch(base+'/models?pageSize=200&key='+encodeURIComponent(c.key));
      if(!r.ok)throw await apiErr(r);const j=await r.json();
      list=(j.models||[]).filter(m=>(m.supportedGenerationMethods||[]).indexOf('generateContent')>=0).map(m=>m.name.replace(/^models\//,''));
    }
    list=Array.from(new Set(list.filter(Boolean))).sort();
    if(!list.length){infoBox('Список моделей пуст','Сервис не вернул ни одной модели. Проверьте ключ и адрес сервиса или добавьте модель вручную кнопкой «+».');return}
    // что было отмечено до загрузки, остаётся отмеченным; остальное пользователь отмечает галочками
    const prev=new Set(getModels(pid));
    const extra=Array.from(prev).filter(m=>list.indexOf(m)<0);
    c.models=list.concat(extra).sort();
    c.enabled=c.models.filter(m=>prev.has(m));
    clearWebCaps(pid);
    openProv.add(pid);save();
    toast('Загружено моделей: '+list.length+'. Отметьте нужные галочками');
  }catch(e){showError(e,{where:'models',provider:provName(pid),title:'Не удалось загрузить список моделей',noNav:true})}
}

/* та же мини-разметка, что и на сервере: **жирный**, *курсив*, `код`, [ссылка](https://…) */
function tgHtml(title,text){
  const codes=[];
  let s=String(text||'').replace(/`([^`\n]+)`/g,(m,c)=>{codes.push(c);return '\u0000'+(codes.length-1)+'\u0000'});
  s=esc(s).replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>')
    .replace(/(^|[^*\w])\*([^*\n]+)\*(?!\*)/g,'$1<i>$2</i>')
    .replace(/\[([^\]\n]+)\]\((https?:\/\/[^)\s]+)\)/g,'<a href="$2">$1</a>');
  s=s.replace(/\u0000(\d+)\u0000/g,(m,i)=>'<code>'+esc(codes[+i])+'</code>');
  return ((title?'<b>'+esc(title)+'</b>\n\n':'')+s).trim();
}
async function upApi(method,path,body){
  if(!tg||!tg.initData)throw needTg();
  const h={'X-Telegram-Init-Data':tg.initData};
  if(body)h['Content-Type']='application/json';
  const r=await fetch(CLOUD_API+path,{method:method,headers:h,body:body?JSON.stringify(body):undefined});
  let j={};try{j=await r.json()}catch(e){}
  if(!r.ok){const er=cloudErr(r,j);er.data=j;throw er}
  return j;
}
async function prepTgImage(f){   // Telegram надёжно принимает JPEG/PNG; остальное конвертируем в JPEG
  if(f.type==='image/jpeg'||f.type==='image/png'){const r=await prepImageFile(f,f.type);return r.blob}
  const img=await loadImg(f),w=img.naturalWidth,h=img.naturalHeight,k=Math.min(1,2048/Math.max(w,h));
  const cv=document.createElement('canvas');cv.width=Math.max(1,Math.round(w*k));cv.height=Math.max(1,Math.round(h*k));
  const cx=cv.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,cv.width,cv.height);cx.drawImage(img,0,0,cv.width,cv.height);
  const b=await new Promise(r=>cv.toBlob(r,'image/jpeg',.9));
  if(!b)throw new Error('img');
  return b;
}

async function upAdd(files){
  for(const f of files){
    const fn='«'+(f.name||'файл')+'»';
    if(UP.media.length>=10){infoBox('Слишком много вложений','В одном уведомлении может быть не больше 10 фото и видео.');break}
    const isV=/^video\//.test(f.type),isI=/^image\//.test(f.type);
    if(!isV&&!isI){warnBox('Этот формат не подходит',fn+': в уведомление можно добавить фото (JPEG, PNG, WebP, GIF) и видео MP4.');continue}
    if(isV&&f.type!=='video/mp4'){warnBox('Видео нужно в формате MP4',fn+' в другом формате. Сохраните видео как MP4 и добавьте снова.');continue}
    if(isV&&f.size>45*1024*1024){warnBox('Видео слишком большое',fn+' весит '+fmtSize(f.size)+', а можно до 45 МБ.');continue}
    let blob=f;
    if(isI){try{blob=await prepTgImage(f)}catch(e){warnBox('Не удалось открыть фото',fn+' повреждён или имеет неподдерживаемый формат. Попробуйте JPEG или PNG.');continue}}
    const it={uid:uid(),type:isV?'video':'photo',name:f.name||(isV?'video.mp4':'photo.jpg'),url:URL.createObjectURL(blob),state:'up',fileId:''};
    UP.media.push(it);UP.token=null;upAtts();upPrev();
    (async()=>{
      try{
        const fd=new FormData();fd.append('file',blob,it.name);
        const r=await fetch(CLOUD_API+'/admin/media',{method:'POST',headers:{'X-Telegram-Init-Data':tg.initData},body:fd});
        const j=await r.json().catch(()=>({}));
        if(!r.ok)throw cloudErr(r,j);
        it.fileId=j.id;it.type=j.type||it.type;it.state='ok';
      }catch(e){it.state='err';showError(e,{where:'cloud',title:'Файл не загрузился'})}
      upAtts();
    })();
  }
}

async function upSend(){
  const c=upContent();if(!c)return;
  if(UP.running){infoBox('Рассылка уже идёт','Дождитесь её завершения или поставьте на паузу.');return}
  const n=UP.users?UP.users.total-UP.users.blocked:null;
  const ok=await dialog({title:'Разослать всем?',text:'Сообщение получат '+(n!=null?n+' пользователей':'все пользователи')+'. После запуска уже доставленные сообщения вернуть нельзя.',ok:'Разослать',danger:true});
  if(!ok)return;
  if(!UP.token)UP.token=uid();
  try{

    if(!s.duplicate)upReset();
    upProgress();
    const p=$('#uProg');if(p)p.scrollIntoView({behavior:'smooth',block:'center'});
    upRun(s.id);

async function upRun(id){
  if(UP.running)return;
  UP.running=id;UP.stop=false;upProgress();upHist();
  try{
    for(;;){
      const st=await upApi('POST','/admin/broadcasts/'+id+'/run');
      UP.cur=st;upProgress();
      if(st.status!=='sending'||UP.stop)break;
      if(st.retry_after)await sleepMs(st.retry_after*1000);
      else if(st.busy)await sleepMs(1500);
    }
  }catch(e){showError(e,{where:'cloud',title:'Рассылка приостановлена'})}
  UP.running=null;UP.stop=false;upProgress();
  await upLoad();
  if(UP.cur&&UP.cur.status==='done'){hap('medium');toast('Рассылка завершена')}
}

function buildSendUserList(){
  const map=new Map();
  FB.items.forEach(x=>{
    if(x.type!=='code'||!x.user_id)return;
    const id=String(x.user_id);
    if(!map.has(id))map.set(id,{user_id:id,first_name:x.first_name||'',username:x.username||'',req:true,request_id:String(x.id),unread:x.status!=='read'});
  });
  Q_USERS.forEach(u=>{
    if(!u||!u.user_id)return;
    const id=String(u.user_id);
    if(!map.has(id))map.set(id,{user_id:id,first_name:u.first_name||'',username:u.username||'',req:false,request_id:''});
    else{
      const ex=map.get(id);
      if(!ex.first_name&&u.first_name)ex.first_name=u.first_name;
      if(!ex.username&&u.username)ex.username=u.username;
    }
  });
  return Array.from(map.values());
}

async function qLoadModels(){
  const pid=$('#qProv').value,p=PROV[pid],key=$('#qKey').value.trim();
  const base=($('#qBase').value.trim()||p.base).replace(/\/+$/,'');
  if(!base){infoBox('Сначала укажите адрес','Заполните поле Base URL, а затем загрузите список моделей.');return}
  if(!key&&!p.custom){infoBox('Сначала введите ключ','Вставьте API-ключ, а затем загрузите список моделей.');return}
  try{
    let list=[];
    if(p.type==='oai'){
      const r=await fetch(base+'/models',{headers:key?{Authorization:'Bearer '+key}:{}});
      if(!r.ok)throw await apiErr(r);const j=await r.json();list=(j.data||[]).map(m=>m.id);
    }else if(p.type==='anthropic'){
      const r=await fetch(base+'/v1/models?limit=100',{headers:{'x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'}});
      if(!r.ok)throw await apiErr(r);const j=await r.json();list=(j.data||[]).map(m=>m.id);
    }else{
      const r=await fetch(base+'/models?pageSize=200&key='+encodeURIComponent(key));
      if(!r.ok)throw await apiErr(r);const j=await r.json();
      list=(j.models||[]).filter(m=>(m.supportedGenerationMethods||[]).indexOf('generateContent')>=0).map(m=>m.name.replace(/^models\//,''));
    }
    list=Array.from(new Set(list.filter(Boolean))).sort();
    if(!list.length){infoBox('Список моделей пуст','Сервис не вернул ни одной модели. Проверьте ключ и адрес сервиса или добавьте модель вручную кнопкой «+».');return}
    const prev=new Set(QM.on),extra=Array.from(prev).filter(m=>list.indexOf(m)<0);
    QM.all=list.concat(extra).sort();QM.on=prev;
    toast('Загружено моделей: '+list.length+'. Отметьте нужные галочками');
  }catch(e){showError(e,{where:'models',provider:p.name,title:'Не удалось загрузить список моделей',noNav:true})}
}

function fbWho(x){

  const parts=[];

}
function fbDate(ts){
  return ts?new Date(ts).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'}):'';

const DEF_REQ_TEXT='Заявка на получение кода быстрой настройки';
const isCodeDead=(x,now)=>!!(x.revoked||x.uses>=x.max_uses||x.expires_at<now);
const codeStatusLbl=(x,now)=>x.revoked?'отозван':x.uses>=x.max_uses?'использован':x.expires_at<now?'истёк':'активен';
function fbShortDate(ts){
  return ts?new Date(ts).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'';
}
/* Объединяет заявки пользователей и выданные им коды в единые компактные карточки */
function buildUnifiedEntries(reqs,codes,now){
  const list=[],byUid=new Map(),byReq=new Map();
  reqs.forEach(r=>{
    const uid=r.user_id?String(r.user_id):'';
    let e=uid?byUid.get(uid):null;
    if(!e){
      e={user_id:uid,first_name:r.first_name||'',username:r.username||'',reqs:[],codes:[],unread:false,ts:Number(r.created_at)||0};
      list.push(e);
      if(uid)byUid.set(uid,e);
    }
    e.reqs.push(r);
    byReq.set(String(r.id),e);
    if(!e.first_name&&r.first_name)e.first_name=r.first_name;
    if(!e.username&&r.username)e.username=r.username;
    if(r.status!=='read')e.unread=true;
    if((Number(r.created_at)||0)>e.ts)e.ts=Number(r.created_at)||0;
  });
  const matchNote=(note,e)=>{
    const n=String(note||'').trim().toLowerCase();
    if(!n)return false;
    const lbl=userLabel(e).trim().toLowerCase();
    if(lbl&&n===lbl)return true;
    const un=e.username?'@'+String(e.username).replace(/^@/,'').toLowerCase():'';
    if(un&&n.indexOf(un)>=0)return true;
    if(e.user_id&&n.indexOf(String(e.user_id))>=0)return true;
    const fn=(e.first_name||'').trim().toLowerCase();
    if(fn.length>=2&&n===fn)return true;
    return false;
  };
  codes.forEach(c=>{
    const qt=Q_CODE_TARGET[c.code]||null;
    let e=null;
    const rid=c.request_id||(qt&&qt.request_id)||'';
    if(rid&&byReq.has(String(rid)))e=byReq.get(String(rid));
    const tuid=c.target_user_id||(qt&&qt.user_id)||'';
    if(!e&&tuid&&byUid.has(String(tuid)))e=byUid.get(String(tuid));
    if(!e&&c.note)e=list.find(x=>x.reqs.length&&matchNote(c.note,x))||null;
    if(!e&&tuid){
      const ku=Q_USERS.find(u=>String(u.user_id)===String(tuid))||qt||{};
      e={user_id:String(tuid),first_name:ku.first_name||'',username:ku.username||'',reqs:[],codes:[],unread:false,ts:Number(c.created_at)||0};
      list.push(e);
      byUid.set(String(tuid),e);
    }
    if(!e){
      e={user_id:'',first_name:'',username:'',reqs:[],codes:[],unread:false,ts:Number(c.created_at)||0};
      list.push(e);
    }
    e.codes.push(c);
    const cts=Number(c.created_at)||0;
    if(cts>e.ts)e.ts=cts;
  });
  list.forEach(e=>{
    e.codes.sort((a,b)=>{
      const da=isCodeDead(a,now)?1:0,db=isCodeDead(b,now)?1:0;
      if(da!==db)return da-db;
      return (Number(b.created_at)||Number(b.expires_at)||0)-(Number(a.created_at)||Number(a.expires_at)||0);
    });
  });
  const rank=e=>{
    const hasLive=e.codes.some(c=>!isCodeDead(c,now));
    if(e.unread&&!hasLive)return 0;
    if(e.unread&&hasLive)return 1;
    if(hasLive)return 2;
    return 3;
  };
  return list.sort((a,b)=>(rank(a)-rank(b))||(b.ts-a.ts));
}
function fbEntryCard(e,now){
  const primary=e.codes[0]||null;
  const extras=e.codes.slice(1);
  const live=!!(primary&&!isCodeDead(primary,now));
  const hasName=!!((e.first_name||'').trim()||(e.username||'').trim());
  const title=hasName?userLabel(e):((primary&&primary.note)||(e.user_id?'ID '+e.user_id:'Код настройки'));
  const subParts=[];
  if(e.user_id&&title!=='ID '+e.user_id)subParts.push('ID '+e.user_id);
  const dStr=fbShortDate(e.ts||(e.reqs[0]&&e.reqs[0].created_at)||(primary&&primary.created_at));
  if(dStr)subParts.push(dStr);
  const customReq=e.reqs.find(r=>r.text&&r.text.trim()&&r.text.trim()!==DEF_REQ_TEXT);
  let tagCls='muted',tagTxt='Обработана';
  if(e.unread&&!live){tagCls='code';tagTxt='Заявка'}
  else if(live){tagCls='active';tagTxt='Активен'}
  else if(primary){tagCls=primary.revoked?'bug':'muted';tagTxt=codeStatusLbl(primary,now);tagTxt=tagTxt[0].toUpperCase()+tagTxt.slice(1)}
  const reqIds=e.reqs.map(r=>String(r.id)).join(',');
  const codeIds=e.codes.map(c=>c.code).join(',');
  const firstReqId=e.reqs[0]?String(e.reqs[0].id):'';
  const delBtn='<button class="btn dan sm rc-del" data-fba="delentry" data-reqids="'+esc(reqIds)+'" data-codes="'+esc(codeIds)+'" aria-label="Удалить">'+ic('trash',15)+'</button>';
  const hasActs=live||!!e.user_id||e.unread;
  let actsHtml='';
  if(live){
    actsHtml='<div class="rc-acts">'+
      '<button class="btn pri sm" data-u="qsend" data-code="'+esc(primary.code)+'" data-uid="'+esc(e.user_id)+'" data-reqid="'+esc(firstReqId)+'">В бот</button>'+
      '<button class="btn sm" data-u="qcopy" data-t="'+esc(primary.code)+'">Код</button>'+
      '<button class="btn sm" data-u="qcopy" data-t="'+esc(APP_LINK+'?startapp='+primary.code)+'">Ссылка</button>'+
      '<button class="btn dan sm" data-u="qrev" data-id="'+esc(primary.code)+'">Отозвать</button>'+
      delBtn+'</div>';
  }else if(hasActs){
    actsHtml='<div class="rc-acts">'+
      (e.user_id?'<button class="btn pri sm" data-fba="mkcode" data-uid="'+esc(e.user_id)+'" data-fn="'+esc(e.first_name||'')+'" data-un="'+esc(e.username||'')+'" data-reqid="'+esc(firstReqId)+'">'+(primary?'Новый код':'Выдать код')+'</button>':'')+
      (e.unread?'<button class="btn sm" data-fba="readentry" data-reqids="'+esc(reqIds)+'">Прочитано</button>':'')+
      delBtn+'</div>';
  }
  const pCr=primary?Math.max(0,Number(primary.initial_credits)||0):0;
  const codeBar=primary
    ?'<div class="rc-codebar"><b>'+esc(primary.code)+'</b><small>'+esc(primary.provider)+(pCr?' · '+fmt(pCr)+' Cr':'')+' · '+primary.uses+'/'+primary.max_uses+'</small>'+
      (!hasActs?'<button class="btn dan sm rc-tr" data-fba="delentry" data-reqids="'+esc(reqIds)+'" data-codes="'+esc(codeIds)+'" aria-label="Удалить">'+ic('trash',14)+'</button>':'')+'</div>'
    :'';
  const extrasHtml=extras.map(c=>
    '<div class="rc-old"><span><b>'+esc(c.code)+'</b> · '+esc(c.provider)+' · '+codeStatusLbl(c,now)+'</span>'+
    '<button class="rc-ox" data-u="qdel" data-id="'+esc(c.code)+'" aria-label="Удалить код">'+ic('x',13)+'</button></div>'
  ).join('');
  return '<div class="uc fb-card req-card'+(e.unread?' unread':'')+'">'+
    '<div class="rc-top"><div class="rc-who">'+esc(title)+'</div><span class="fb-tag '+tagCls+'">'+(e.unread?'<span class="fb-dot"></span>':'')+esc(tagTxt)+'</span></div>'+
    (subParts.length?'<div class="rc-sub">'+esc(subParts.join(' · '))+'</div>':'')+
    (customReq?'<div class="rc-msg">'+esc(customReq.text.trim())+'</div>':'')+
    codeBar+extrasHtml+actsHtml+'</div>';
}
function fbRender(){
  const tabsEl=$('#fbTabs'),reqPane=$('#fbReqPane'),revPane=$('#fbRevPane');
  const reqList=$('#fbReqList'),revList=$('#fbRevList');
  const reqAllBtn=$('#fbReqReadAll'),revAllBtn=$('#fbRevReadAll');
  const unread=FB.loaded?FB.items.filter(x=>x.status!=='read').length:unreadFeedback;
  if(FB.loaded)unreadFeedback=unread;
  syncFbBadges();
  if(!tabsEl||!reqList||!revList)return;
  const reqs=FB.items.filter(x=>x.type==='code');
  const revs=FB.items.filter(x=>x.type!=='code');
  const reqUnread=reqs.filter(x=>x.status!=='read').length;
  const revUnread=revs.filter(x=>x.status!=='read').length;
  tabsEl.innerHTML=
    '<button class="fb-tab'+(FB.tab==='req'?' on':'')+'" data-fba="tab" data-tab="req"><span>Заявки</span>'+(reqUnread?'<span class="fb-tbadge">'+reqUnread+'</span>':'')+'</button>'+
    '<button class="fb-tab'+(FB.tab==='rev'?' on':'')+'" data-fba="tab" data-tab="rev"><span>Отзывы</span>'+(revUnread?'<span class="fb-tbadge">'+revUnread+'</span>':'')+'</button>';
  if(reqPane)reqPane.hidden=FB.tab!=='req';
  if(revPane)revPane.hidden=FB.tab!=='rev';
  if(reqAllBtn)reqAllBtn.hidden=FB.arch||!reqUnread;
  if(revAllBtn)revAllBtn.hidden=!revUnread;

  // Вкладка «Заявки»: активные заявки и коды отдельно, использованные/неактивные коды — в «Архив»
  const now=Date.now();
  const entries=buildUnifiedEntries(reqs,Q_CODES.items,now);
  const activeEntries=[],archEntries=[];
  entries.forEach(e=>{
    const liveCodes=e.codes.filter(c=>!isCodeDead(c,now));
    const deadCodes=e.codes.filter(c=>isCodeDead(c,now));
    const keepActive=e.unread||liveCodes.length>0||deadCodes.length===0;
    if(keepActive)activeEntries.push(Object.assign({},e,{codes:liveCodes}));
    if(deadCodes.length>0)archEntries.push(Object.assign({},e,{unread:false,reqs:keepActive?[]:e.reqs,codes:deadCodes}));
  });
  const archCnt=archEntries.reduce((s,e)=>s+e.codes.length,0);
  const reqTitle=$('#fbReqTitle'),archBtn=$('#fbArchBtn'),qSec=$('#qSection');
  if(reqTitle)reqTitle.textContent=FB.arch?'Архив кодов':'Заявки и коды';
  if(archBtn){
    archBtn.textContent=FB.arch?'Заявки и коды':(archCnt?'Архив ('+archCnt+')':'Архив');
    archBtn.classList.toggle('on',FB.arch);
  }
  if(qSec)qSec.hidden=FB.arch;

  if((FB.loading||Q_CODES.loading)&&!reqs.length&&!Q_CODES.items.length){
    reqList.innerHTML='<div class="fb-empty">Загрузка заявок и кодов…</div>';
  }else if(FB.arch){
    reqList.innerHTML=archEntries.length?archEntries.map(e=>fbEntryCard(e,now)).join(''):'<div class="fb-empty" style="padding:26px 16px">Использованных кодов в архиве пока нет.</div>';
  }else{
    reqList.innerHTML=activeEntries.length?activeEntries.map(e=>fbEntryCard(e,now)).join(''):'<div class="fb-empty" style="padding:22px 16px">Активных заявок и кодов пока нет.</div>';
  }

  // Вкладка «Отзывы»: единый список без подвкладок, тип (Отзыв / Предложение / Ошибка) указан в каждой карточке
  if(FB.loading&&!revs.length){
    revList.innerHTML='<div class="fb-empty">Загрузка отзывов…</div>';
  }else if(FB.notReady){
    revList.innerHTML='<div class="fb-empty">На сервере ещё не добавлены маршруты отзывов. Обновите Cloudflare Worker, чтобы получать сообщения пользователей.</div>';
  }else if(!revs.length){
    revList.innerHTML='<div class="fb-empty">Отзывов и сообщений об ошибках пока нет.</div>';
  }else{
    revList.innerHTML=revs.map(x=>{
      const isNew=x.status!=='read';
      const t=(x.type==='idea'||x.type==='bug'||x.type==='review')?x.type:'review';
      return '<div class="uc fb-card'+(isNew?' unread':'')+'">'+
        '<div class="uh"><span class="fb-tag '+t+'">'+(isNew?'<span class="fb-dot"></span>':'')+FB_LBL[t]+'</span><span class="fb-date">'+esc(fbDate(x.created_at))+'</span></div>'+
        '<div class="fb-msg">'+esc(x.text||'')+'</div>'+
        '<div class="ul sub">'+esc(fbWho(x))+'</div>'+
        '<div class="btns">'+
          (isNew?'<button class="btn sm" data-fba="read" data-id="'+esc(x.id)+'">Прочитано</button>':'')+
          '<button class="btn sm" data-fba="copy" data-id="'+esc(x.id)+'">Копировать</button>'+
          '<button class="btn dan sm" data-fba="del" data-id="'+esc(x.id)+'" aria-label="Удалить обращение" style="margin-left:auto;padding:0;width:32px;height:32px;display:grid;place-items:center">'+ic('trash',16)+'</button>'+
        '</div></div>';
    }).join('');
  }
}

/* ---------- Кошелёк VEYRA Credits и пополнение (Этапы 4 и 5) ---------- */
const WAL={data:null,loading:false,scrollHist:false,ts:0,inflight:null};
const TX_LBL={
  grant:'Промокод / бонус',
  purchase:'Покупка (Telegram Stars)',
  test_purchase:'Тестовая покупка',
  admin_grant:'Начисление админом',
  admin_debit:'Списание админом',
  spend:'Запрос к ИИ'
};
function txDesc(tx){
  let meta={};try{meta=JSON.parse(tx.meta||'{}')||{}}catch(e){}
  if(tx.type==='spend'){
    const m=meta.model?String(meta.model).split('/').pop():'Модель';
    const io=(meta.in||meta.out)?(' · '+fmt(meta.in||0)+' / '+fmt(meta.out||0)+' ток.'):'';
    return {t:m,s:fbDate(tx.created_at)+io};
  }
  if(tx.type==='purchase'||tx.type==='test_purchase'){
    return {t:TX_LBL[tx.type]+(meta.stars?' ('+meta.stars+' ⭐)':''),s:fbDate(tx.created_at)};
  }
  if(tx.type==='grant'&&meta.code){
    return {t:'Промокод '+meta.code,s:fbDate(tx.created_at)};
  }
  return {t:TX_LBL[tx.type]||tx.type,s:fbDate(tx.created_at)+(meta.reason?' · '+meta.reason:'')};
}

function renderTxList(list){
  if(!list||!list.length)return '<div class="hint" style="text-align:center;padding:18px 8px">Операций пока нет.</div>';
  const rows=[],groups=new Map();
  list.forEach(tx=>{
    if(tx.type==='spend'){
      let meta={};try{meta=JSON.parse(tx.meta||'{}')||{}}catch(e){}
      const fullM=meta.model?String(meta.model):'Модель';
      const shortM=fullM.split('/').pop()||'Модель';
      let g=groups.get(fullM);
      if(!g){
        g={kind:'group',key:fullM,name:shortM,credits:0,inTok:0,outTok:0,count:0,ts:Number(tx.created_at)||0,items:[]};
        groups.set(fullM,g);
        rows.push(g);
      }
      const amt=Math.abs(Number(tx.amount)||0);
      const inT=Number(meta.in)||0,outT=Number(meta.out)||0;
      g.credits+=amt;g.inTok+=inT;g.outTok+=outT;g.count++;
      if((Number(tx.created_at)||0)>g.ts)g.ts=Number(tx.created_at)||0;
      g.items.push({amt:amt,inTok:inT,outTok:outT,bal:tx.balance_after,ts:tx.created_at});
    }else{
      rows.push({kind:'tx',tx:tx,ts:Number(tx.created_at)||0});
    }
  });
  rows.sort((a,b)=>b.ts-a.ts);
  return '<div class="tx-list">'+rows.map(r=>{
    if(r.kind==='group'){
      const totTok=r.inTok+r.outTok;
      const sub=[r.count+' запр.',totTok?(fmt(totTok)+' ток.'):''].filter(Boolean).join(' · ');
      const det=r.items.map(it=>{
        const io=(it.inTok||it.outTok)?(fmt(it.inTok)+' / '+fmt(it.outTok)+' ток.'):'';
        return '<div class="tx-sub"><div class="tx-sl"><span>'+esc(fbDate(it.ts))+'</span>'+(io?'<small>'+esc(io)+'</small>':'')+'</div>'+
          '<div class="tx-sr"><b>−'+fmtCr(it.amt)+'</b><small>ост. '+fmtCr(it.bal)+'</small></div></div>';
      }).join('');
      return '<div class="tx-grp">'+
        '<button class="tx-gh" data-txg aria-expanded="false">'+
          '<div class="tx-l"><b>'+esc(r.name)+'</b><small>'+esc(sub)+'</small></div>'+
          '<div class="tx-r"><b class="neg">−'+fmtCr(r.credits)+'</b><small>всего</small></div>'+
          '<span class="tx-chev">'+ic('chev',16)+'</span>'+
        '</button>'+
        '<div class="tx-gd" hidden>'+det+'</div>'+
      '</div>';
    }
    const tx=r.tx,d=txDesc(tx),amt=Number(tx.amount)||0,pos=amt>=0;
    return '<div class="tx"><div class="tx-l"><b>'+esc(d.t)+'</b><small>'+esc(d.s)+'</small></div>'+
      '<div class="tx-r"><b class="'+(pos?'pos':'neg')+'">'+(pos?'+':'−')+fmtCr(Math.abs(amt))+'</b>'+
      '<small>Остаток: '+fmtCr(tx.balance_after)+'</small></div></div>';
  }).join('')+'</div>';
}

async function loadWallet(silent){
  if(WAL.inflight)return WAL.inflight;
  WAL.loading=true;
  const walOpen=$('#wallet')&&$('#wallet').classList.contains('open');
  const rb=$('#walRefresh');
  if(rb&&!silent)rb.classList.add('spin');
  if(walOpen&&!WAL.data)renderWallet();
  const p=(async()=>{
    try{
      const j=await cloudJson('GET','/credits');
      WAL.data=j;WAL.ts=Date.now();
      S.providers.managed.credits={enabled:j.enabled,balance:j.balance,reserved:j.reserved,available:j.available,total_granted:j.total_granted,total_spent:j.total_spent};
      if(Array.isArray(j.packages))S.walMeta={packages:j.packages,test_mode:!!j.test_mode};
      save();renderUsageSafe();syncDrawerWal();
    }catch(e){
      if(!silent)showError(e,{where:'cloud',title:'Не удалось загрузить кошелёк',noNav:true});
    }finally{
      WAL.loading=false;WAL.inflight=null;
      if(rb)rb.classList.remove('spin');
      if($('#wallet')&&$('#wallet').classList.contains('open'))renderWallet();
    }
  })();
  WAL.inflight=p;
  return p;
}
function openWallet(scrollHist){
  WAL.scrollHist=!!scrollHist;
  if($('#wallet').classList.contains('open')){
    if(!WAL.ts||Date.now()-WAL.ts>15000)loadWallet(true);
    return;
  }
  $('#wallet').classList.add('open');pushLayer(closeWallet);
  renderWallet();
  if(!WAL.data)loadWallet(false);
  else if(Date.now()-WAL.ts>25000)loadWallet(true);
}
function closeWallet(){
  if(!$('#wallet').classList.contains('open'))return;
  $('#wallet').classList.remove('open');popLayer(closeWallet);
}
async function buyPackage(pkgId,btn){
  if(btn)btn.disabled=true;
  try{
    const inv=await cloudJson('POST','/payments/invoice',{package_id:pkgId});
    const pkg=inv.package||{};
    if(inv.mode==='test'){
      const act=await notice({icon:'ok',title:'Тестовая оплата',
        text:'Пакет «'+(pkg.title||'VEYRA Credits')+'»: +'+fmtCr(pkg.credits)+' VEYRA Credits за '+pkg.stars+' ⭐.\n\nРеальные Telegram Stars НЕ спишутся — это полная имитация оплаты и зачисления на баланс.',
        actions:[{id:'pay',label:'Подтвердить тест (+'+fmtCr(pkg.credits)+' Cr)',kind:'pri'},{id:'cancel',label:'Отмена',kind:'ghost'}],dismiss:'cancel'});
      if(act==='pay'){
        const res=await cloudJson('POST','/payments/test-complete',{payment_id:inv.payment_id});
        if(res.credits){S.providers.managed.credits=res.credits;save();renderUsageSafe();syncDrawerWal()}
        hap('medium');toast('Тест пройден: +'+fmtCr(res.added)+' VEYRA Credits');
        await loadWallet(true);
      }
    }else if(inv.mode==='stars'&&inv.invoice_url){
      if(tg&&tg.openInvoice){
        tg.openInvoice(inv.invoice_url,async status=>{
          if(status==='paid'){
            hap('medium');toast('Оплата прошла! Зачисляем кредиты…');
            for(let k=0;k<6;k++){
              await sleepMs(700);
              try{
                const st=await cloudJson('GET','/payments/status?id='+encodeURIComponent(inv.payment_id));
                if(st.status==='paid'){
                  if(st.credits){S.providers.managed.credits=st.credits;save();renderUsageSafe();syncDrawerWal()}
                  await loadWallet(true);
                  toast('Начислено +'+fmtCr(st.added)+' VEYRA Credits!');
                  return;
                }
              }catch(e){}
            }
            await loadWallet(true);
          }else if(status==='failed'){
            warnBox('Оплата не прошла','Telegram не завершил платёж. Попробуйте ещё раз.');
          }
        });
      }else{
        infoBox('Откройте в Telegram','Оплата через Telegram Stars работает только внутри клиента Telegram.');
      }
    }
  }catch(err){
    showError(err,{where:'cloud',title:'Не удалось оформить оплату',noNav:true});
  }
  if(btn)btn.disabled=false;
}

  const p=(async()=>{
    try{
      const j=await upApi('GET','/admin/finance/all?days='+FIN.days+'&pay_days='+FIN.payDays);
      const now=Date.now();
      if(j.stats){FIN.stats=j.stats;FIN.ts.stats=now}
      if(Array.isArray(j.users)){FIN.users=j.users;FIN.ts.users=now}
      if(Array.isArray(j.payments)){FIN.payments=j.payments;FIN.ts.payments=now}
      if(Array.isArray(j.packages)){FIN.packages=j.packages;FIN.ts.packs=now}
      if(j.test_mode!=null)FIN.testMode=!!j.test_mode;
    }catch(e){
      // совместимость со старой версией воркера без /admin/finance/all
      if(e&&e.status===404){
        const now=Date.now();
        await Promise.all([
          upApi('GET','/admin/finance/stats?days='+FIN.days).then(j=>{FIN.stats=j;FIN.testMode=!!j.test_mode;FIN.ts.stats=now}).catch(()=>{}),
          upApi('GET','/admin/finance/users').then(j=>{FIN.users=Array.isArray(j.items)?j.items:[];FIN.ts.users=now}).catch(()=>{}),
          upApi('GET','/admin/finance/payments?days='+FIN.payDays).then(j=>{FIN.payments=Array.isArray(j.items)?j.items:[];FIN.ts.payments=now}).catch(()=>{}),
          upApi('GET','/admin/finance/packages').then(j=>{FIN.packages=Array.isArray(j.packages)?j.packages:[];FIN.ts.packs=now}).catch(()=>{})
        ]);
      }else if(!silent){
        showError(e,{where:'cloud',title:'Не удалось загрузить данные финансов',noNav:true});
      }
    }finally{
      FIN.loading=false;FIN.inflightAll=null;
      if(rb)rb.classList.remove('spin');
      syncFinTestSw();
      if($('#finPage')&&$('#finPage').classList.contains('open'))renderFin();
    }
  })();
  FIN.inflightAll=p;
  return p;
}
async function loadFin(silent,tabOverride){
  const tab=tabOverride||FIN.tab;
  if(FIN.inflight[tab])return FIN.inflight[tab];
  const open=$('#finPage')&&$('#finPage').classList.contains('open');
  const rb=$('#finRefresh');
  const hasData=!!FIN.ts[tab];
  if(rb&&!silent)rb.classList.add('spin');
  FIN.loading=true;
  if(open&&!hasData)renderFin();
  const p=(async()=>{
    try{
      if(tab==='stats'){
        const j=await upApi('GET','/admin/finance/stats?days='+FIN.days);
        FIN.stats=j;FIN.testMode=!!j.test_mode;FIN.ts.stats=Date.now();
      }else if(tab==='users'){
        const j=await upApi('GET','/admin/finance/users');
        FIN.users=Array.isArray(j.items)?j.items:[];FIN.ts.users=Date.now();
      }else if(tab==='payments'){
        const j=await upApi('GET','/admin/finance/payments?days='+FIN.payDays);
        FIN.payments=Array.isArray(j.items)?j.items:[];FIN.testMode=!!j.test_mode;FIN.ts.payments=Date.now();
      }else if(tab==='packs'){
        const j=await upApi('GET','/admin/finance/packages');
        FIN.packages=Array.isArray(j.packages)?j.packages:[];FIN.testMode=!!j.test_mode;FIN.ts.packs=Date.now();
      }
    }catch(e){
      if(!silent)showError(e,{where:'cloud',title:'Не удалось загрузить данные финансов',noNav:true});
    }finally{
      FIN.loading=false;FIN.inflight[tab]=null;
      if(rb)rb.classList.remove('spin');
      syncFinTestSw();
      if($('#finPage')&&$('#finPage').classList.contains('open'))renderFin();
    }
  })();
  FIN.inflight[tab]=p;
  return p;
}

/* сервер возвращает только имя, лимит и модели: ключ и адрес остаются на сервере в скрытом системном слоте */
function applySetup(d){
  if(!PROV[d.provider]||PROV[d.provider].hidden)throw new Error('Неизвестный провайдер');
  const c=S.providers.managed;
  c.key='';c.base='';c.name='';
  c.used={in:0,out:0};c.by={};delete c.bal;
  c.meta=null;setManagedMeta(d);clearWebCaps('managed');
  const first=getModels('managed')[0];
  if(first){cur.model='managed|'+first;S.lastModel=cur.model}
  save();renderTop();
}
/* Возвращает false, если пользователь отказался от перезаписи (код при этом не списывается) */
async function redeemCode(raw){
  const m=String(raw||'').match(/startapp=([\w-]+)/i);
  const code=(m?m[1]:String(raw||'')).trim();
  const info=await cloudJson('POST','/setup/check',{code:code});
  if(info.existing){
    const addTxt=info.initial_credits>0?' На баланс будет дополнительно начислено '+fmtCr(info.initial_credits)+' VEYRA Credits.':'';
    const ok=await dialog({title:'Применить новый промокод?',text:'Системное подключение обновится данными из нового промокода.'+addTxt,ok:'Применить'});
    if(!ok)return false;
  }
  const d=await cloudJson('POST','/setup/redeem',{code:code});
  applySetup(d);
  if(!getModels('managed').length){
    await loadModels('managed');
    const c=S.providers.managed,list=allModels('managed').slice(0,20);
    if(list.length){c.enabled=list;cur.model='managed|'+list[0];S.lastModel=cur.model;save();renderTop()}
  }
  return true;
}

  setTimeout(()=>{
    loadFinAll(true).catch(()=>{});
    if(!FB.loaded)fbLoad(true).catch(()=>{});
    if(!Q_CODES.loaded)qLoad(true).catch(()=>{});
    if(!UP.ts)upLoad(true).catch(()=>{});
  },120);
}
function startBgPreload(){
  bgReady=true;
  if(!tg||!tg.initData)return;
  if(!bgWalStarted&&(!isAdmin||isAvail('managed'))){
    bgWalStarted=true;
    setTimeout(()=>{loadWallet(true).catch(()=>{})},80);
  }
  if(isAdmin)bgPreloadAdmin();
}

/* ---------- init ---------- */
try{
  if(tg){
    tg.ready();tg.expand();
    applyTheme();
    try{tg.disableVerticalSwipes&&tg.disableVerticalSwipes()}catch(e){}
    tg.onEvent&&tg.onEvent('viewportChanged',fit);
  }
}catch(e){}
fit();
window.addEventListener('resize',fit);
if(window.visualViewport)window.visualViewport.addEventListener('resize',fit);
inp.addEventListener('focus',()=>{setTimeout(fit,60);setTimeout(fit,320)});
/* окна поверх чата поднимаются вместе с клавиатурой (одно обновление за кадр, без лишних записей) */
let kbRaf=0,kbLast='';
function kbFix(){
  if(kbRaf)return;
  kbRaf=requestAnimationFrame(()=>{
    kbRaf=0;
    const d=$('#dlg');
    if(!d.classList.contains('on')||d.classList.contains('context')){if(d.style.paddingBottom)d.style.paddingBottom='';kbLast='';return}
    const v=window.visualViewport,appH=$('#app').getBoundingClientRect().height;
    const vh=v?v.height:appH,kb=Math.max(0,Math.round(appH-vh-(v?v.offsetTop:0)));
    const pad=(24+kb)+'px',mh=Math.max(200,Math.round(Math.min(appH,vh)-48))+'px';
    const card=d.querySelector('.dcard');
    if(kbLast===pad+'|'+mh&&card&&card.style.maxHeight===mh)return;
    kbLast=pad+'|'+mh;
    d.style.paddingBottom=pad;
    if(card)card.style.maxHeight=mh;
    requestAnimationFrame(kbScroll);
  });
}
function kbScroll(){
  const d=$('#dlg'),a=document.activeElement,card=d.querySelector('.dcard');
  if(!d.classList.contains('on')||!card||!a||!card.contains(a)||!/^(INPUT|TEXTAREA)$/.test(a.tagName))return;
  if(card.classList.contains('cn')){card.scrollTop=card.scrollHeight;return}   // окно подключения: до самого низа, к кнопке «Применить код»
  const r=a.getBoundingClientRect(),c=card.getBoundingClientRect();
  if(r.bottom>c.bottom-8)card.scrollTop+=r.bottom-c.bottom+16;
  else if(r.top<c.top+8)card.scrollTop-=c.top-r.top+16;
}
$('#dlg').addEventListener('focusin',()=>{kbFix();setTimeout(kbFix,250);setTimeout(()=>{kbFix();kbScroll()},420);setTimeout(kbScroll,750)});
$('#dlg').addEventListener('focusout',()=>{setTimeout(kbFix,120);setTimeout(kbFix,420)});
if(window.visualViewport)window.visualViewport.addEventListener('resize',kbFix);
try{tg&&tg.onEvent&&tg.onEvent('viewportChanged',kbFix)}catch(e){}
(async()=>{
  let failed=0;
  try{
    const res=await Promise.all([loadCloudKeys(),Promise.race([configP,new Promise(r=>setTimeout(r,1500))])]);
    failed=res[0]||0;
  }catch(e){failed=1}
  newChat();
  if(failed){bootHide(true);return}   // не удалось связаться с облаком — не считаем пользователя новым
  const urlSp=(()=>{try{return new URLSearchParams(location.search).get('startapp')||''}catch(e){return ''}})();
  const sp=(tg&&tg.initDataUnsafe&&tg.initDataUnsafe.start_param)||urlSp;
  if(urlSp&&window.history&&history.replaceState){try{const u=new URL(location.href);u.searchParams.delete('startapp');history.replaceState(null,'',u.pathname+u.search+u.hash)}catch(e){}}
  const isAdminJump=sp==='admin_req'||sp==='admin_rev';
  if(isAdminJump){
    if(!isAdmin){try{await Promise.race([configP,new Promise(r=>setTimeout(r,2500))])}catch(e){}}
    if(isAdmin){
      bootHide(true);
      openFbPage(sp==='admin_rev'?'rev':'req');
      startBgPreload();
      return;
    }
  }
  if(sp&&!isAdminJump){
    let applied=false;
    try{
      if(!hasSetup()){
        bootText('Быстрая настройка','Применяем код подключения');
        await redeemCode(sp);
        applied=true;
      }else{
        bootHide(true);
        if(await redeemCode(sp))toast('Настройка обновлена');
      }
    }catch(e){
      bootHide(true);
      if(!hasSetup())showError(e,{where:'cloud',title:'Не удалось применить код настройки',noNav:true});
    }
    if(applied){
      await bootUnlock('Настройка применена',modelsReadyText());
      startBgPreload();
      return;
    }
  }
  if(hasSetup()){
    await bootUnlock('Ключи синхронизированы',modelsReadyText());
    startBgPreload();
  }else{
    bootHide(false);
    openConn();
    startBgPreload();
  }
})();
gcFiles();
})();
</script>
</body>
