<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#121212">
<title>AI Chat</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#121212; --surface:#1a1a1a; --card:#2f2f2f; --card2:#242424; --border:#3a3a3a;
  --text:#f2f2f2; --muted:#9b9b9b; --danger:#ff6b6b; --ok:#4ade80;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);overflow:hidden;
  position:fixed;inset:0;width:100%;
  font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea{font:inherit;color:var(--text);outline:none}
svg{display:block}
#app{position:fixed;left:0;top:0;width:100%;height:var(--h,100dvh);
  display:flex;flex-direction:column;overflow:hidden}

/* header */
#top{display:flex;justify-content:space-between;align-items:center;
  padding:max(12px,env(safe-area-inset-top)) 16px 8px;flex:none}
.circle{width:38px;height:38px;border-radius:50%;border:1px solid var(--border);display:grid;place-items:center;background:transparent}
.pill{height:36px;padding:0 12px 0 16px;border-radius:30px;background:#fff;color:#121212;font-size:15px;font-weight:500;
  display:flex;align-items:center;gap:6px;max-width:62vw}
.pill span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* messages */
#msgs{flex:1;min-height:0;overflow-y:auto;padding:8px 16px 16px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.send-space{
  height:100vh;
  height:100dvh;
  flex:none;
}
.empty{height:100%;display:grid;place-items:center;color:#5d5d5d;font-size:22px;font-weight:500}
.m{margin:16px 0;font-size:17px;line-height:1.5;letter-spacing:.01em}
.m.u{display:flex;justify-content:flex-end}
.m.u .uwrap{display:flex;flex-direction:column;align-items:flex-end;max-width:86%;min-width:0}
.m.u .b{
  background:linear-gradient(155deg,#474a56 0%,#353844 55%,#2b2d38 100%);
  border:0;
  padding:11px 16px;
  border-radius:22px 22px 6px 22px;
  max-width:100%;
  white-space:pre-wrap;
  word-break:break-word;
  box-shadow:0 12px 28px -6px rgba(0,0,0,.72),0 4px 12px -2px rgba(0,0,0,.52),inset 0 1.5px 1px rgba(255,255,255,.18),inset 0 -2px 6px rgba(0,0,0,.28);
}

.ufoot{
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:5px;
  height:20px;
  margin:5px 6px 0 0;
  color:#858585;
  font-size:11px;
}

.umore{
  display:grid;
  place-items:center;
  width:24px;
  height:22px;
  padding:0;
  color:#858585;
  background:transparent;
  border:0;
  border-radius:6px;
}
.m.a .b{word-break:break-word}
.word-in{
  display:inline-block;
  will-change:opacity,transform,filter;
  animation:wordSettle .24s cubic-bezier(.2,.7,.2,1) both;
}
@keyframes wordSettle{
  from{
    opacity:0;
    filter:blur(6px);
    transform:translateY(4px);
  }
  to{
    opacity:1;
    filter:blur(0);
    transform:none;
  }
}
.m.a{
  animation:answerIn .3s ease-out;
  transform-origin:top;
}
@keyframes answerIn{
  from{opacity:0;transform:translateY(8px)}
  to{opacity:1;transform:translateY(0)}
}
.m.a .b>*:first-child{margin-top:0}
.m.a .b p{margin:0 0 1em}
.m.a .b h1,.m.a .b h2,.m.a .b h3,.m.a .b h4{margin:1em 0 .4em;font-size:17px}
.m.a .b ul,.m.a .b ol{margin:0 0 .75em;padding-left:22px}
.m.a .b a{color:#8ab4ff}
.m.a .b code{background:#262626;padding:1px 6px;border-radius:6px;font-size:.9em;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.code{background:#0b0b0b;border:1px solid #2a2a2a;border-radius:14px;margin:.4em 0 .9em;overflow:hidden}
.code .ch{display:flex;justify-content:space-between;align-items:center;padding:6px 12px;background:#1b1b1b;color:var(--muted);font-size:13px}
.code .ch button{color:var(--muted);font-size:13px}
.code pre{margin:0;padding:12px;overflow-x:auto}
.code pre code{background:none;padding:0;font-size:13.5px;line-height:1.5;white-space:pre}
.act{display:flex;gap:4px;margin-top:2px;color:var(--muted)}
.act button{width:34px;height:34px;display:grid;place-items:center;border-radius:10px}
.act button:active{background:#262626}
.dots{display:inline-flex;gap:5px;padding:8px 0}
.dots i{width:8px;height:8px;border-radius:50%;background:#777;animation:bl 1.2s infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes bl{0%,80%,100%{opacity:.25}40%{opacity:1}}
.err{margin:10px 0;padding:12px 14px;border:1px solid #5a2b2b;background:#2a1717;border-radius:14px;color:#ffb4b4;font-size:14px;line-height:1.45}
.err button{display:block;margin-top:8px;color:#fff;background:#4a2323;padding:6px 12px;border-radius:10px;font-size:14px}

/* bottom */
#bottom{flex:none;padding:0 16px max(14px,env(safe-area-inset-bottom))}
.sugg{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 0 12px;padding:0;scrollbar-width:none}
.sugg::-webkit-scrollbar{display:none}
.sugg.hide{display:none}
.sc{flex:none;width:min(68vw,250px);scroll-snap-align:start;display:flex;align-items:center;gap:10px;padding:7px 14px 7px 8px;
  background:var(--card);border:1px solid #3d3d3d;border-radius:30px;text-align:left}
.sc .tile{width:38px;height:38px;border-radius:50%;background:#181818;display:grid;place-items:center;flex:none}
.sc b{display:block;font-size:15px;font-weight:600}
.sc small{display:block;color:var(--muted);font-size:12.5px;margin-top:1px}
.composer{background:var(--surface);border:1px solid #3a3a3a;border-radius:30px;padding:7px 9px}
#inp{display:block;flex:1;min-width:0;width:100%;background:none;border:0;resize:none;font-size:17px;line-height:1.4;min-height:40px;max-height:120px;padding:9px 4px}
#inp::placeholder{color:#a5a5a5}
.crow{display:flex;align-items:center;gap:5px;margin-top:0}
.sp{flex:1}
.ib{width:40px;height:40px;display:grid;place-items:center;border-radius:50%;color:#e6e6e6}
.ib:active{background:#2a2a2a}
.ib.on{color:var(--danger)}
.send{width:46px;height:46px;border-radius:50%;background:#fff;color:#121212;display:grid;place-items:center;margin-left:4px}
#btnMic{
  display:none !important;
}
.send:disabled{
  background:#3a3a3a;
  color:#777;
  opacity:1;
  cursor:default;
}

:root[data-theme="light"] .send:disabled{
  background:#d1d1d6;
  color:#8e8e93;
}

/* drawer */
#scrim{position:absolute;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
#scrim.on{opacity:1;pointer-events:auto}
#drawer{position:absolute;top:0;bottom:0;left:0;width:min(86vw,340px);background:#171717;z-index:21;
  transform:translateX(-102%);transition:transform .28s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;
  padding-top:max(12px,env(safe-area-inset-top));border-right:1px solid #262626}
#drawer.open{transform:none}
.dh{display:flex;gap:8px;padding:0 12px 8px}
.search{flex:1;display:flex;align-items:center;gap:8px;background:#232323;border-radius:14px;padding:0 12px;height:42px;color:var(--muted)}
.search input{flex:1;min-width:0;background:none;border:0;font-size:16px}
.newc{display:flex;align-items:center;gap:12px;margin:4px 12px;padding:10px 12px;border-radius:14px;font-size:16px;font-weight:500;width:calc(100% - 24px)}
.newc:active,.ci:active{background:#232323}
.list{flex:1;overflow-y:auto;padding:4px 12px 12px}
.gl{margin:14px 8px 4px;color:#7d7d7d;font-size:13px;font-weight:600}
.ci{display:flex;align-items:center;border-radius:12px;padding:0 4px 0 12px;min-height:44px;cursor:pointer}
.ci.sel{background:#262626}
.ci .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:16px}
.ci .ib{width:36px;height:36px;color:var(--muted)}
.noc{color:#6d6d6d;text-align:center;padding:30px 10px;font-size:15px}
.prof{display:flex;align-items:center;gap:12px;padding:14px 26px max(20px,calc(env(safe-area-inset-bottom) + 8px));width:100%;text-align:left}
.av{width:36px;height:36px;border-radius:50%;background:#3a3a3a;display:grid;place-items:center;font-weight:600;overflow:hidden;flex:none}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.prof .pn{flex:1;font-weight:500}

/* popover / dialog */
#pop,#dlg{position:absolute;inset:0;z-index:40;display:none}
#pop.on,#dlg.on{display:block}
#dlg{background:rgba(0,0,0,.6);z-index:90}
#dlg.on{display:grid;place-items:center;padding:24px}
.pcard{position:absolute;top:max(60px,calc(env(safe-area-inset-top) + 52px));right:12px;width:min(88vw,330px);max-height:64vh;overflow-y:auto;
  background:#242424;border:1px solid #363636;border-radius:20px;padding:8px;box-shadow:0 12px 40px rgba(0,0,0,.5)}
.pg{padding:10px 12px 4px;color:#8a8a8a;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.pi{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:left;padding:11px 12px;border-radius:12px;font-size:16px;word-break:break-all}
.pi:active{background:#303030}
.pi.sel{background:#2c2c2c}
.pn2{padding:16px 12px;color:var(--muted);font-size:15px;line-height:1.45}
.dcard{width:min(100%,360px);background:#242424;border:1px solid #3a3a3a;border-radius:22px;padding:20px}
.dcard h4{margin:0 0 8px;font-size:18px}
.dcard p{margin:0 0 14px;color:#bdbdbd;font-size:15px;line-height:1.45}
.dcard input{width:100%;background:#181818;border:1px solid #3a3a3a;border-radius:12px;padding:11px 12px;font-size:16px;margin-bottom:14px}
.drow{display:flex;gap:10px;justify-content:flex-end}
.btn{background:#2f2f2f;border-radius:12px;padding:10px 16px;font-size:15px;font-weight:500}
.btn.pri{background:#fff;color:#121212}
.btn.dan{background:#5a2323;color:#ffb4b4}
.btn.ghost{background:none;border:1px solid #3a3a3a}
/* Контекстные меню возле нажатого элемента */
#dlg.context{
  background:transparent;
  display:block;
  padding:0;
}

#dlg.context .dcard{
  position:absolute;
  width:min(260px,calc(100vw - 24px));
  max-width:none;
  padding:10px;
  border-radius:16px;
  box-shadow:0 8px 30px rgba(0,0,0,.4);
  animation:menuIn .14s ease-out;
}

@keyframes menuIn{
  from{opacity:0;transform:scale(.96)}
  to{opacity:1;transform:scale(1)}
}

/* settings */
#settings{position:absolute;inset:0;background:var(--bg);z-index:30;transform:translateX(102%);transition:transform .28s cubic-bezier(.2,.8,.2,1);
  display:flex;flex-direction:column}
#settings.open{transform:none}
.sh{display:flex;align-items:center;gap:8px;padding:max(10px,env(safe-area-inset-top)) 12px 8px}
.sh h2{margin:0;font-size:20px;font-weight:600}
#setBody{flex:1;overflow-y:auto;padding:4px 16px max(30px,env(safe-area-inset-bottom));overscroll-behavior:contain}
#setBody h3{margin:22px 0 10px;font-size:13px;color:#8a8a8a;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.hint{color:#7d7d7d;font-size:13px;line-height:1.45;margin:8px 2px}
.uc{background:var(--card2);border:1px solid #303030;border-radius:16px;padding:12px 14px;margin-bottom:10px}
.uh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.uh b{font-size:16px}
.uh .ib{width:32px;height:32px;color:var(--muted)}
.ul{color:#bdbdbd;font-size:14px;margin-top:4px;line-height:1.5}
.ul em{font-style:normal;color:#fff;font-weight:600}
.bar{height:6px;border-radius:3px;background:#383838;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:#fff;border-radius:3px}
.bar i.low{background:var(--danger)}
.pv{background:var(--card2);border:1px solid #303030;border-radius:16px;margin-bottom:10px;overflow:hidden}
.pvh{display:flex;align-items:center;gap:10px;width:100%;padding:14px;font-size:16px;font-weight:500;text-align:left}
.pvh .chev{margin-left:auto;color:var(--muted);transition:transform .2s}
.pv.open .chev{transform:rotate(180deg)}
.dot{width:9px;height:9px;border-radius:50%;background:#555;flex:none}
.dot.on{background:var(--ok)}
.pvb{padding:0 14px 14px}
.pvb label,.gb label{display:block;margin:12px 0 6px;color:#9a9a9a;font-size:13px}
.pvb input,.pvb textarea,.gb input,.gb textarea{width:100%;background:#181818;border:1px solid #363636;border-radius:12px;padding:11px 12px;font-size:16px;resize:vertical}
.row{display:flex;gap:6px;align-items:center}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.gb{background:var(--card2);border:1px solid #303030;border-radius:16px;padding:4px 14px 14px}

#toast{position:absolute;left:50%;bottom:110px;transform:translateX(-50%) translateY(20px);background:#fff;color:#111;padding:10px 16px;border-radius:14px;
  font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:110;max-width:86vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%)}
/* LIGHT THEME */
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#ffffff;
  --surface:#f4f4f7;
  --card:#ebebf0;
  --card2:#f4f4f7;
  --border:#c9c9d2;
  --text:#0d0d10;
  --muted:#575761;
  --danger:#c62828;
  --ok:#1f8a4c;
}

:root[data-theme="light"] body,
:root[data-theme="light"] #app,
:root[data-theme="light"] #settings{
  background:var(--bg);
  color:var(--text);
}

:root[data-theme="light"] .pill,
:root[data-theme="light"] .send{
  background:#1c1c1e;
  color:#fff;
}

:root[data-theme="light"] .sc,
:root[data-theme="light"] .uc,
:root[data-theme="light"] .pv,
:root[data-theme="light"] .gb{
  background:var(--card);
  border-color:var(--border);
  color:var(--text);
}

:root[data-theme="light"] .composer,
:root[data-theme="light"] .dcard,
:root[data-theme="light"] .pcard{
  background:var(--surface);
  border-color:var(--border);
  color:var(--text);
}

:root[data-theme="light"] #drawer{
  background:#fff;
  border-color:var(--border);
  color:var(--text);
}

:root[data-theme="light"] .search,
:root[data-theme="light"] .sc .tile,
:root[data-theme="light"] .pvb input,
:root[data-theme="light"] .pvb textarea,
:root[data-theme="light"] .gb input,
:root[data-theme="light"] .gb textarea,
:root[data-theme="light"] .dcard input{
  background:#f2f2f5;
  color:var(--text);
  border-color:var(--border);
}

:root[data-theme="light"] input,
:root[data-theme="light"] textarea{
  color:var(--text);
}

:root[data-theme="light"] input::placeholder,
:root[data-theme="light"] textarea::placeholder{
  color:#686872;
}

:root[data-theme="light"] .btn{
  background:#e9e9ed;
  color:#1c1c1e;
  border:1px solid var(--border);
}

:root[data-theme="light"] .btn.pri{
  background:#1c1c1e;
  color:#fff;
  border-color:#1c1c1e;
}

:root[data-theme="light"] .btn.dan{
  background:#fde8e8;
  color:#b4232b;
  border-color:#f5caca;
}

:root[data-theme="light"] .btn.ghost{
  background:transparent;
  color:var(--text);
  border-color:var(--border);
}

:root[data-theme="light"] .ib{
  color:#2e2e35;
}

:root[data-theme="light"] .ib:active,
:root[data-theme="light"] .act button:active,
:root[data-theme="light"] .newc:active,
:root[data-theme="light"] .ci:active{
  background:#e5e5e9;
}

:root[data-theme="light"] .ci.sel,
:root[data-theme="light"] .pi.sel,
:root[data-theme="light"] .pi:active{
  background:#e9e9ed;
}

:root[data-theme="light"] .newc,
:root[data-theme="light"] .ci,
:root[data-theme="light"] .pi{
  color:var(--text);
}

:root[data-theme="light"] .gl,
:root[data-theme="light"] .noc,
:root[data-theme="light"] .hint,
:root[data-theme="light"] #setBody h3,
:root[data-theme="light"] .pvb label,
:root[data-theme="light"] .gb label,
:root[data-theme="light"] .pg{
  color:var(--muted);
}

:root[data-theme="light"] .ul{
  color:#44444c;
}

:root[data-theme="light"] .ul em{
  color:var(--text);
}

:root[data-theme="light"] .bar{
  background:#dedee3;
}

:root[data-theme="light"] .bar i{
  background:#555;
}

:root[data-theme="light"] .code{
  background:#f0f0f2;
  border-color:var(--border);
  color:#222;
}

:root[data-theme="light"] .code .ch{
  background:#e5e5e9;
  color:var(--muted);
}

:root[data-theme="light"] .code pre code,
:root[data-theme="light"] .m.a .b code{
  color:#222;
}

:root[data-theme="light"] .m.a .b code{
  background:#e9e9ed;
}

:root[data-theme="light"] .m.a .b a{
  color:#1769c2;
}

:root[data-theme="light"] .err{
  background:#fff0f0;
  border-color:#f0caca;
  color:#b4232b;
}

:root[data-theme="light"] .err button{
  background:#f8dede;
  color:#9f2028;
}

:root[data-theme="light"] .dot{
  background:#aaa;
}

:root[data-theme="light"] .av{
  background:#e5e5e9;
  color:#333;
}

:root[data-theme="light"] #dlg{
  background:rgba(0,0,0,.35);
}

:root[data-theme="light"] .dcard p{
  color:#44444c;
}

:root[data-theme="light"] #toast{
  background:#1c1c1e;
  color:#fff;
}

:root[data-theme="light"] .empty{
  color:var(--muted);
}
/* Светлая тема: контраст индикаторов */
:root[data-theme="light"] .dot.on{
  background:#16a34a;
}

:root[data-theme="light"] .dot:not(.on){
  background:#b8b8c0;
}

/* Полоска токенов */
:root[data-theme="light"] .bar{
  height:8px;
  background:#c5c5ce;
  border-radius:10px;
}

:root[data-theme="light"] .bar i{
  background:#2563eb;
  border-radius:10px;
}

:root[data-theme="light"] .bar i.low{
  background:#dc2626;
}
/* Выделение текста сообщений на iPhone */
.m .b,
.m .b * {
  -webkit-user-select: text !important;
  user-select: text !important;
  -webkit-touch-callout: default;
}
.tbl-wrap{
  width:100%;
  overflow-x:auto;
  margin:12px 0;
  border:1px solid var(--border);
  border-radius:12px;
}

.md-table{
  width:100%;
  border-collapse:collapse;
  font-size:14px;
  line-height:1.45;
}

.md-table th,
.md-table td{
  padding:10px;
  border-bottom:1px solid var(--border);
  border-right:1px solid var(--border);
  text-align:left;
  vertical-align:top;
}

.md-table th{
  background:var(--card);
  font-weight:600;
}

.md-table tr:last-child td{
  border-bottom:0;
}

.md-table th:last-child,
.md-table td:last-child{
  border-right:0;
}

/* Вложения: превью в поле ввода (пусто — не занимает места) */
.atts{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none}
.atts::-webkit-scrollbar{display:none}
.atts:empty{display:none}
.att{position:relative;flex:none;height:64px;border-radius:14px;background:var(--card);border:1px solid var(--border);overflow:hidden}
.att img{display:block;width:64px;height:64px;object-fit:cover}
.att.pdf{display:flex;align-items:center;gap:8px;padding:0 30px 0 12px;max-width:190px;font-size:13px}
.att.pdf span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.att .x{position:absolute;top:4px;right:4px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,.65);color:#fff;display:grid;place-items:center}
/* Вложения в сообщении пользователя */
.uatts{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px;margin:0 0 6px;max-width:100%;white-space:normal}
.uimg{display:block;width:120px;height:120px;object-fit:cover;border-radius:12px}
.ufile{display:flex;align-items:center;gap:8px;max-width:100%;padding:4px 2px;font-size:14px;white-space:nowrap}
.ufile span{min-width:0;overflow:hidden;text-overflow:ellipsis}

[hidden]{display:none!important}

/* Переключатель темы: солнце — тумблер — луна */
.tsw{margin-left:auto;display:flex;align-items:center;gap:6px}
.tsw .ico{display:grid;place-items:center;width:22px;height:22px;color:var(--muted);opacity:.45;transition:opacity .2s,color .2s;cursor:pointer}
.tsw .sw{position:relative;flex:none;box-sizing:border-box;width:46px;height:26px;padding:3px;border:0;border-radius:999px;display:flex;align-items:center;background:var(--card);transition:background .2s}
.tsw .sw i{position:static;display:block;flex:none;width:20px;height:20px;border-radius:50%;background:var(--text);transform:translateX(0);transition:transform .22s cubic-bezier(.2,.8,.2,1)}
:root:not([data-theme="light"]) .tsw .sw i{transform:translateX(20px)}
:root:not([data-theme="light"]) .tsw .moon{opacity:1;color:#a5b4fc}
:root[data-theme="light"] .tsw .sun{opacity:1;color:#f59e0b}

/* Список моделей с галочками */
.mh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:16px 0 6px;color:#9a9a9a;font-size:13px}
.mh b{font-weight:600;color:var(--text)}
.mcnt{flex:none}
.mtools{display:flex;gap:8px;margin:0 0 8px}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.mlist{max-height:300px;overflow-y:auto;border:1px solid #363636;border-radius:12px;background:#181818;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.mrow{display:flex;align-items:center;gap:10px;padding:9px 6px 9px 10px;cursor:pointer;border-bottom:1px solid #2a2a2a;-webkit-user-select:none;user-select:none}
.mrow:last-child{border-bottom:0}
.mrow:active{background:rgba(127,127,127,.12)}
.mrow .cb{flex:none;width:20px;height:20px;border-radius:6px;border:1.5px solid #666;display:grid;place-items:center;color:transparent}
.mrow.on .cb{background:#fff;border-color:#fff;color:#121212}
.mrow .mt{flex:1;min-width:0;font-size:14px;line-height:1.3;word-break:break-all}
.mrow .mx{flex:none;width:30px;height:30px;display:grid;place-items:center;color:var(--muted);border-radius:8px}
.mempty{padding:12px 2px;color:var(--muted);font-size:14px;line-height:1.45}
:root[data-theme="light"] .mlist{background:#f2f2f5;border-color:var(--border)}
:root[data-theme="light"] .mrow{border-color:var(--border)}
:root[data-theme="light"] .mrow .cb{border-color:#a0a0a8}
:root[data-theme="light"] .mrow.on .cb{background:#1c1c1e;border-color:#1c1c1e;color:#fff}
:root[data-theme="light"] .mh{color:var(--muted)}

/* Сообщения пользователя: меню по долгому нажатию, без выделения текста */
.m.u .uwrap,.m.u .uwrap *{-webkit-user-select:none!important;user-select:none!important;-webkit-touch-callout:none!important}
.uimg{cursor:zoom-in;-webkit-user-drag:none}

/* Полноэкранный просмотр фото */
#viewer{position:absolute;inset:0;z-index:80;background:#000;touch-action:none;opacity:0;pointer-events:none;transition:opacity .2s}
#viewer.on{opacity:1;pointer-events:auto}
#vstage{position:absolute;inset:0;display:grid;place-items:center;overflow:hidden;touch-action:none}
#vimg{display:block;max-width:100%;max-height:100%;transform-origin:center;will-change:transform;-webkit-user-select:none;user-select:none;-webkit-user-drag:none;-webkit-touch-callout:none;touch-action:none;transition:opacity .15s}
.vtop{position:absolute;top:0;left:0;right:0;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:max(10px,env(safe-area-inset-top)) 12px 12px;color:#fff;pointer-events:none;background:linear-gradient(rgba(0,0,0,.55),transparent)}
.vtop span{font-size:15px;font-weight:500;padding-left:8px}
#viewer .ib{color:#fff;background:rgba(255,255,255,.16)}
#viewer.on .ib{pointer-events:auto}
#viewer .ib:active{background:rgba(255,255,255,.28)}
.vnav{position:absolute;top:50%;z-index:2;margin-top:-20px}
#vPrev{left:10px}#vNext{right:10px}

/* Таблицы: растягиваются вправо за экран, прокручиваются, слова не рвутся по буквам */
.tbl-wrap{-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.md-table{width:max-content;min-width:100%}
.md-table th,.md-table td{min-width:110px;max-width:340px;word-break:normal;overflow-wrap:normal;hyphens:none}
.ul.sub{color:#8a8a8a}
#msgs{overflow-anchor:none}

:root[data-theme="light"] .ul.sub{color:#575761}
:root[data-theme="light"] .m.a .b{color:var(--text)}
:root[data-theme="light"] .m.u .b{background:linear-gradient(155deg,#e4e8f2 0%,#d7ddeb 58%,#cbd3e4 100%);border:0;color:var(--text);box-shadow:0 10px 24px -6px rgba(30,41,59,.22),0 3px 10px -2px rgba(30,41,59,.12),inset 0 1.5px 1px rgba(255,255,255,.8),inset 0 -2px 6px rgba(30,41,59,.08)}
:root[data-theme="light"] .composer{background:#f4f4f7;border-color:#c0c0ca}
:root[data-theme="light"] #drawer{background:#fafafc}
:root[data-theme="light"] .pcard,:root[data-theme="light"] .dcard{background:#fff;box-shadow:0 12px 40px rgba(0,0,0,.18)}
:root[data-theme="light"] .sc{background:#f4f4f7;border-color:#c9c9d2}

/* Размер текста ответа */

.code pre code{font-size:13px}

/* Окно API ключа: ключ + лимит в одну строку */
.kl{display:flex;gap:10px}
.kl .kf{flex:1;min-width:0}
.kl .lf{flex:none;width:calc(10ch + 26px)}
.inw{position:relative}
.pvb .inw input{padding-right:44px}
.eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:36px;height:36px;display:grid;place-items:center;color:var(--muted);border-radius:10px}

/* Одно окно моделей */
.mbox{margin-top:14px;border:1px solid #363636;border-radius:14px;padding:10px;background:#181818}
.mtop{display:flex;gap:8px;align-items:center}
.mtop .btn{flex:none;display:flex;align-items:center;gap:6px;height:40px;padding:0 12px;white-space:nowrap}
.mtop .btn.plus{width:40px;padding:0;justify-content:center}
.mtop input{flex:1;min-width:0;height:40px;padding:0 10px!important;font-size:15px!important}
.mfilter{display:flex;align-items:center;justify-content:center;gap:8px;margin:10px 0 4px;color:var(--muted)}
.pvb .mfilter input{width:auto;max-width:70%;background:transparent!important;border:0!important;padding:6px 0!important;border-radius:0;color:var(--muted);font-size:15px;text-align:left}
.mbox .mlist{border:0;background:none;border-radius:0;max-height:280px;margin-top:4px}
.mbox .mempty{text-align:center;padding:14px 4px 6px}
:root[data-theme="light"] .mbox{background:#f2f2f5;border-color:var(--border)}
:root[data-theme="light"] .pvb .mfilter input{color:var(--text)}

.btns.one{flex-wrap:nowrap}
.btns.one .btn{flex:1;white-space:nowrap;text-align:center}

/* ---- Оформление ответа в стиле ChatGPT ---- */
:root{--line:rgba(255,255,255,.15)}
:root[data-theme="light"]{--line:rgba(0,0,0,.13)}
.m.a{font-size:17px;line-height:1.4}
.m.a .b p{margin:0 0 .9em}
.m.a .b h1,.m.a .b h2,.m.a .b h3,.m.a .b h4{font-size:19px;font-weight:700;line-height:1.3;margin:1.5em 0 .6em}
.m.a .b ul,.m.a .b ol{margin:0 0 .9em;padding-left:24px}
.m.a .b li{margin:.3em 0}
.m.a .b li::marker{color:var(--muted)}

/* Таблицы: без рамки и фона, жирная шапка, только тонкие линии между строками */
.m.a .b .tbl-wrap{border:0;border-radius:0;margin:1.1em 0 1.3em;background:none}
.m.a .b .md-table{border-collapse:collapse;font-size:16px;line-height:1.3;background:none;width:100%;min-width:0}
.m.a .b .md-table th,.m.a .b .md-table td{min-width:125px}
.m.a .b .md-table th,.m.a .b .md-table td{background:none;border:0;border-bottom:1px solid var(--line);padding:10px 20px 10px 0;text-align:left;vertical-align:top}
.m.a .b .md-table th{font-weight:700;padding-top:4px}
.m.a .b .md-table th:last-child,.m.a .b .md-table td:last-child{padding-right:2px}
.m.a .b .md-table tr:last-child td{border-bottom:0}
.m.a .b .md-table td b,.m.a .b .md-table td strong{font-weight:700}

/* ---- Панель управления (админ) ---- */
#upd{position:absolute;inset:0;background:var(--bg);z-index:35;transform:translateX(102%);transition:transform .28s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
#upd.open{transform:none}
#updBody{flex:1;overflow-y:auto;padding:4px 16px max(30px,env(safe-area-inset-bottom));overscroll-behavior:contain}
#updBody h3,#fbPageBody h3{margin:22px 0 10px;font-size:13px;color:#8a8a8a;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
:root[data-theme="light"] #updBody h3,:root[data-theme="light"] #fbPageBody h3{color:var(--muted)}
#updBody .atts{padding-top:10px}
#updBody .atts:empty{display:none}
.att.up{opacity:.45}
.att.up::after{content:"";position:absolute;left:50%;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:spin .8s linear infinite}
.att.er{border-color:var(--danger)}
@keyframes spin{to{transform:rotate(360deg)}}
.tgp{background:#0e1621;border-radius:18px;padding:14px}
.tgb{background:#182533;color:#fff;border-radius:16px 16px 16px 4px;max-width:100%;overflow:hidden;font-size:15px;line-height:1.4}
.tgm{display:grid;gap:2px;grid-template-columns:1fr 1fr}
.tgm img,.tgm video{width:100%;height:150px;object-fit:cover;display:block}
.tgm.n1{grid-template-columns:1fr}
.tgm.n1 img,.tgm.n1 video{height:auto;max-height:300px}
.tgm.n3>:first-child{grid-column:1/-1}
.tgt{padding:8px 12px 2px;white-space:pre-wrap;word-break:break-word}
.tgt a{color:#6ab3f3}
.tgt code{background:rgba(255,255,255,.12);padding:1px 5px;border-radius:5px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.9em}
.tgs{text-align:right;font-size:11px;opacity:.6;padding:2px 10px 6px}
:root[data-theme="light"] .tgp{background:#dbe7ef}
:root[data-theme="light"] .tgb{background:#fff;color:#0d0d10}
:root[data-theme="light"] .tgt a{color:#1769c2}
:root[data-theme="light"] .tgt code{background:#eef0f3}
.uc .btns{margin-top:10px}
.attach-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:52px;margin:12px 0 4px;border:1.5px dashed var(--border);border-radius:14px;color:var(--muted);font-size:15px;font-weight:500;transition:background .15s,color .15s,border-color .15s}
.attach-btn small{font-size:12px;opacity:.7;font-weight:400}
.attach-btn:active{background:rgba(127,127,127,.12);color:var(--text);border-color:var(--muted)}
/* ---- Страница ручной настройки API ---- */
#manual{position:absolute;inset:0;background:var(--bg);z-index:32;transform:translateX(102%);transition:transform .28s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
#manual.open{transform:none}
#manBody{flex:1;overflow-y:auto;padding:4px 16px max(30px,env(safe-area-inset-bottom));overscroll-behavior:contain}
.manbtn{display:flex;align-items:center;gap:10px;width:100%;padding:14px;border-radius:16px;background:var(--card2);border:1px solid #303030;font-size:16px;font-weight:500;text-align:left}
.manbtn .chev{margin-left:auto;color:var(--muted)}
.manbtn .mright{margin-left:auto;display:flex;align-items:center;gap:8px}
.manbtn .mright .chev{margin-left:0}
:root[data-theme="light"] .manbtn{border-color:var(--border)}
/* ---- Окно «Подключение API» и мини-инструкция ---- */
.dcard.cn{width:min(100%,380px);max-height:100%;overflow-y:auto;padding:22px 20px 20px;border-radius:26px}
.cn-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.cn-h h4{margin:0;font-size:19px;font-weight:700;white-space:nowrap}
.cn-st{flex:none;padding:4px 10px;border-radius:999px;font-size:12.5px;white-space:nowrap;font-weight:600;background:rgba(255,107,107,.16);color:#ff8a8a}
.cn-ic{width:64px;height:64px;margin:22px auto 14px;border-radius:50%;display:grid;place-items:center;background:rgba(127,127,127,.16);color:var(--muted)}
.cn-t{text-align:center;font-size:18px;font-weight:700;margin-bottom:8px}
.dcard.cn p.cn-p{text-align:center;color:var(--muted);margin:0 0 18px}
.cn-b{display:block;width:100%;height:50px;border-radius:999px;font-size:16px}
.cn-have{position:relative;display:flex;align-items:center;margin-top:14px}
.cn-have .cn-b{padding:0 48px}
.cn-ibtn{position:absolute;right:9px;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-family:Georgia,"Times New Roman",serif;font-style:italic;font-weight:700;font-size:16px;line-height:1;background:rgba(18,18,18,.12);color:#121212;border:1.5px solid rgba(18,18,18,.28);transition:transform .14s ease,background .16s ease}
.cn-ibtn:active{transform:translateY(-50%) scale(.92);background:rgba(18,18,18,.22)}
:root[data-theme="light"] .cn-ibtn{background:rgba(255,255,255,.16);color:#fff;border-color:rgba(255,255,255,.45)}
:root[data-theme="light"] .cn-ibtn:active{background:rgba(255,255,255,.28)}
.cn-promo{text-align:center}
.cn-promo::placeholder{text-align:center}
.cn-l{display:block;width:100%;padding:14px 0 6px;text-align:center;color:var(--muted);font-size:15px;font-weight:500}
.cn-l:active{opacity:.6}
.cn-f{margin-top:12px;padding-top:12px;border-top:1px solid var(--border);text-align:center;color:var(--muted);font-size:13px;opacity:.85}
.cn-prov{display:flex;align-items:center;gap:8px;margin:12px 0;font-size:16px;font-weight:700;white-space:nowrap}
.cn-logo{flex:none;width:34px;height:34px;border-radius:50%;border:1px solid var(--border);display:grid;place-items:center;font-size:12px;font-weight:800;letter-spacing:-.02em;background:rgba(127,127,127,.1)}
.cn-chip{padding:3px 8px;border-radius:999px;font-size:11.5px;font-weight:600;background:rgba(74,222,128,.15);color:#4ade80}
.cn-sep{height:1px;background:var(--border);margin:16px 0}
.cn-steps{margin:10px 0 12px;padding-left:22px;font-size:15.5px;line-height:1.5}
.cn-steps li{margin:6px 0;padding-left:4px}
.cn-note{color:var(--muted);font-size:13px;line-height:1.45;margin:0 0 14px}
:root[data-theme="light"] .cn-st{background:#fbe0e0;color:#b42318}
:root[data-theme="light"] .cn-chip{background:#dff3e4;color:#1f7a3a}
.gb select{width:100%;background:#181818;border:1px solid #363636;border-radius:12px;padding:11px 12px;font-size:16px;color:var(--text)}
:root[data-theme="light"] .gb select{background:#f2f2f5;border-color:var(--border)}
.qcode{font-size:22px;font-weight:700;letter-spacing:.06em;text-align:center;margin:12px 0 6px}
.cn-code{margin-top:4px}
.cn-code input{margin-bottom:10px}
#dlg{transition:padding-bottom .18s ease-out}
.gb .mfilter input{width:auto;max-width:70%;background:transparent!important;border:0!important;padding:6px 0!important;border-radius:0;color:var(--muted);font-size:15px;text-align:left}
:root[data-theme="light"] .gb .mfilter input{color:var(--text)}

/* ---- Окна-уведомления (понятные диалоги вместо системных ошибок) ---- */
#dlg2{position:absolute;inset:0;z-index:100;display:none;background:rgba(0,0,0,.6)}
#dlg2.on{display:grid;place-items:center;padding:20px}
.dcard.nt{width:min(100%,380px);max-height:100%;overflow-y:auto;padding:24px 20px 18px;border-radius:26px;-webkit-overflow-scrolling:touch;animation:ntIn .16s ease-out}
@keyframes ntIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
.nt-ic{width:56px;height:56px;margin:0 auto 14px;border-radius:50%;display:grid;place-items:center;background:rgba(127,127,127,.16);color:var(--muted)}
.nt-ic.error,.nt-ic.warn{background:rgba(255,107,107,.15);color:#ff7a7a}
.nt-ic.info,.nt-ic.file,.nt-ic.img,.nt-ic.bot{background:rgba(96,165,250,.16);color:#7db4ff}
.nt-ic.net,.nt-ic.lock{background:rgba(251,191,36,.16);color:#f5b942}
.nt-ic.ok{background:rgba(74,222,128,.16);color:#4ade80}
.dcard.nt h4{margin:0 0 10px;font-size:19px;line-height:1.3;text-align:center}
.dcard.nt .nt-p{margin:0 0 10px;text-align:center;color:var(--muted);font-size:15px;line-height:1.45;word-break:break-word}
.nt-list,.nt-tips{margin:6px 0 10px;padding-left:20px;font-size:14.5px;line-height:1.45;color:var(--muted)}
.nt-list li,.nt-tips li{margin:5px 0;word-break:break-word}
.nt-tips{padding:10px 12px 10px 30px;border-radius:14px;background:rgba(127,127,127,.12);color:var(--text)}
.nt-det{margin:4px 0 6px;font-size:13px;color:var(--muted)}
.nt-det summary{cursor:pointer;padding:6px 0;text-align:center;list-style:none}
.nt-det summary::-webkit-details-marker{display:none}
.nt-det pre{margin:6px 0 8px;padding:10px;border-radius:12px;background:rgba(127,127,127,.12);white-space:pre-wrap;word-break:break-word;font:12px/1.45 ui-monospace,Menlo,Consolas,monospace;max-height:160px;overflow:auto;user-select:text;-webkit-user-select:text}
.nt-btns{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.nt-btns .btn{width:100%;min-height:48px;border-radius:999px;font-size:16px;text-align:center}
:root[data-theme="light"] #dlg2{background:rgba(0,0,0,.35)}
:root[data-theme="light"] .nt-ic.warn,:root[data-theme="light"] .nt-ic.error{background:#fde8e8;color:#c62828}
:root[data-theme="light"] .nt-ic.info,:root[data-theme="light"] .nt-ic.file,:root[data-theme="light"] .nt-ic.img,:root[data-theme="light"] .nt-ic.bot{background:#e3efff;color:#1769c2}
:root[data-theme="light"] .nt-ic.net,:root[data-theme="light"] .nt-ic.lock{background:#fff1d6;color:#a86a00}
:root[data-theme="light"] .nt-ic.ok{background:#dff3e4;color:#1f7a3a}
:root[data-theme="light"] .nt-tips{background:#f0f0f3}
:root[data-theme="light"] .nt-det pre{background:#f0f0f3}

/* ---- Вложения: файлы и документы ---- */
.att.pdf .an{min-width:0;display:flex;flex-direction:column;gap:1px}
.att.pdf .an small{font-size:11px;opacity:.65}
.att.up img{opacity:.5}
button.ufile{background:rgba(127,127,127,.14);border-radius:12px;padding:8px 12px;color:inherit;text-align:left;cursor:pointer;-webkit-tap-highlight-color:transparent}
button.ufile:active{opacity:.7}
button.ufile small{flex:none;opacity:.6;font-size:12px}
.afiles{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 4px}
.aimg{display:block;max-width:min(100%,360px);max-height:420px;border-radius:14px;cursor:zoom-in;background:rgba(127,127,127,.12)}
.m.a button.ufile{max-width:100%}
.code .ch .chb{display:flex;gap:16px}
.pi.row{justify-content:flex-start;gap:12px;word-break:normal}
.pi.row span{flex:1}
#app.drop::after{content:"Отпустите файлы, чтобы добавить";position:absolute;inset:8px;z-index:95;display:grid;place-items:center;border:2px dashed var(--muted);border-radius:22px;background:rgba(0,0,0,.55);color:#fff;font-size:18px;font-weight:600;pointer-events:none}
.vbtns{display:flex;gap:8px}
.uatts{align-items:flex-start}

/* ---- Отзывы и предложения ---- */
.dcard.fb{width:min(100%,380px);max-height:100%;overflow-y:auto;padding:20px;border-radius:26px;-webkit-overflow-scrolling:touch}
.fb-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.fb-h h4{margin:0;font-size:19px;font-weight:700}
.fb-h .ib{width:34px;height:34px;color:var(--muted)}
.fb-types{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:14px 0 12px}
.fb-type{height:38px;padding:0 8px;border-radius:12px;background:#181818;border:1px solid #363636;font-size:13.5px;font-weight:500;color:var(--muted);transition:background .15s,color .15s,border-color .15s}
.fb-type.on{background:#fff;color:#121212;border-color:#fff}
.fb-ta{width:100%;min-height:116px;max-height:220px;background:#181818;border:1px solid #363636;border-radius:14px;padding:12px;font-size:16px;line-height:1.45;resize:vertical}
.fb-meta{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 2px 14px;font-size:13px;color:var(--muted)}
.fb-anon{display:inline-flex;align-items:center;gap:8px;cursor:pointer;-webkit-user-select:none;user-select:none}
.fb-anon input{width:17px;height:17px;margin:0;accent-color:#fff;cursor:pointer}
.fb-sh{display:flex;align-items:center;gap:8px}
.fb-badge{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--danger);color:#fff;font-size:11.5px;font-weight:700;line-height:1}
.fb-badge.on-pri{background:#ef4444;color:#fff}
#fbPage{position:absolute;inset:0;background:var(--bg);z-index:37;transform:translateX(102%);transition:transform .28s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
#fbPage.open{transform:none}
#fbPageBody{flex:1;overflow-y:auto;padding:4px 16px max(30px,env(safe-area-inset-bottom));overscroll-behavior:contain}
.fb-bar{display:flex;align-items:center;gap:6px;margin:4px 0 12px}
.fb-empty{color:var(--muted);text-align:center;padding:44px 16px;font-size:15px;line-height:1.45}
.fb-filters{display:flex;gap:6px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.fb-filters::-webkit-scrollbar{display:none}
.fb-chip{flex:none;height:32px;padding:0 12px;border-radius:999px;background:var(--card2);border:1px solid #363636;color:var(--muted);font-size:13px;font-weight:500}
.fb-chip.on{background:#fff;color:#121212;border-color:#fff}
.fb-card.unread{border-color:rgba(96,165,250,.5)}
.fb-tag{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600}
.fb-tag.review{background:rgba(74,222,128,.15);color:#4ade80}
.fb-tag.idea{background:rgba(96,165,250,.16);color:#7db4ff}
.fb-tag.bug{background:rgba(255,107,107,.16);color:#ff8a8a}
.fb-tag.code{background:rgba(192,132,252,.18);color:#d8b4fe}
.fb-dot{width:8px;height:8px;border-radius:50%;background:#60a5fa;flex:none}
.fb-date{font-size:12px;color:var(--muted);white-space:nowrap}
.fb-msg{margin:8px 0 6px;font-size:15px;line-height:1.45;white-space:pre-wrap;word-break:break-word;-webkit-user-select:text;user-select:text}
:root[data-theme="light"] .fb-type,
:root[data-theme="light"] .fb-ta{background:#f2f2f5;border-color:var(--border)}
:root[data-theme="light"] .fb-type.on,
:root[data-theme="light"] .fb-chip.on{background:#1c1c1e;color:#fff;border-color:#1c1c1e}
:root[data-theme="light"] .fb-anon input{accent-color:#1c1c1e}
:root[data-theme="light"] .fb-chip{background:var(--card);border-color:var(--border);color:var(--muted)}
:root[data-theme="light"] .fb-card.unread{border-color:rgba(23,105,194,.45)}
:root[data-theme="light"] .fb-tag.review{background:#dff3e4;color:#1f7a3a}
:root[data-theme="light"] .fb-tag.idea{background:#e3efff;color:#1769c2}
:root[data-theme="light"] .fb-tag.bug{background:#fde8e8;color:#c62828}
:root[data-theme="light"] .fb-tag.code{background:#f3e8ff;color:#7e22ce}
:root[data-theme="light"] .fb-dot{background:#2563eb}

/* ---- Экран синхронизации ключей при запуске ---- */
#boot{position:absolute;inset:0;z-index:75;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;opacity:1;transition:opacity .32s ease,transform .32s ease}
#boot.hide{opacity:0;transform:scale(1.03);pointer-events:none}
.bk-stage{position:relative;width:116px;height:116px;display:grid;place-items:center}
.bk-glow{position:absolute;inset:8px;border-radius:50%;background:var(--text);opacity:.04;transition:background .35s ease,opacity .35s ease,transform .45s cubic-bezier(.2,.8,.2,1)}
#boot.ok .bk-glow{background:var(--ok);opacity:.16;transform:scale(1.18)}
.bk-pulse{position:absolute;inset:8px;border-radius:50%;border:2px solid var(--ok);opacity:0;pointer-events:none}
#boot.ok .bk-pulse{animation:bkPulse .65s cubic-bezier(.2,.8,.2,1) forwards}
.bk-svg{position:relative;width:116px;height:116px;color:var(--text);overflow:visible}
.bk-arc,.bk-lock,.bk-shackle,.bk-hole,.bk-key{transform-box:view-box}
.bk-track{stroke:var(--border);opacity:.5;transition:opacity .3s ease}
.bk-arc{stroke:var(--text);stroke-dasharray:74 235;stroke-linecap:round;transform-origin:54px 54px;animation:bkSpin 1.35s linear infinite;transition:stroke .3s ease,stroke-dasharray .4s ease}
#boot.ok .bk-arc{animation:none;stroke:var(--ok);stroke-dasharray:309 0}
#boot.ok .bk-track{opacity:0}
.bk-lock{transform-origin:54px 58px;animation:bkLockNudge 1.8s ease-in-out infinite}
#boot.ok .bk-lock{animation:none}
.bk-shackle{transform-origin:43px 51px;transition:transform .46s cubic-bezier(.22,1.45,.36,1),stroke .3s ease}
#boot.ok .bk-shackle{transform:translateY(-4px) rotate(-26deg);stroke:var(--ok)}
.bk-body{fill:var(--bg);transition:stroke .3s ease}
#boot.ok .bk-body{stroke:var(--ok)}
.bk-hole{transition:opacity .22s ease,transform .22s ease;transform-origin:54px 63px}
#boot.ok .bk-hole{opacity:0;transform:scale(.5)}
.bk-check{stroke:var(--ok);stroke-dasharray:26;stroke-dashoffset:26;opacity:0;transition:stroke-dashoffset .34s cubic-bezier(.2,.8,.2,1) .14s,opacity .15s ease .12s}
#boot.ok .bk-check{stroke-dashoffset:0;opacity:1}
.bk-key{transform-origin:61px 63.5px;animation:bkKeySync 1.8s ease-in-out infinite;transition:opacity .26s ease,transform .32s cubic-bezier(.2,.8,.2,1)}
.bk-key-bow{fill:var(--bg)}
#boot.ok .bk-key{animation:none;transform:translateX(-7px) rotate(-26deg) scale(.86);opacity:0}
.bk-title{margin:20px 0 6px;font-size:18px;font-weight:600;letter-spacing:-.01em;color:var(--text);transition:color .25s ease}
.bk-sub{margin:0;min-height:20px;font-size:14px;line-height:1.4;color:var(--muted)}
.bk-dots{display:inline-flex;gap:4px;margin-left:5px;vertical-align:middle}
.bk-dots i{width:4px;height:4px;border-radius:50%;background:currentColor;opacity:.3;animation:bl 1.2s infinite}
.bk-dots i:nth-child(2){animation-delay:.2s}.bk-dots i:nth-child(3){animation-delay:.4s}
#boot.ok .bk-dots{display:none}
@keyframes bkSpin{to{transform:rotate(360deg)}}
@keyframes bkKeySync{
  0%,100%{transform:translateX(8px) rotate(0deg);opacity:.78}
  28%{transform:translateX(-5px) rotate(0deg);opacity:1}
  46%{transform:translateX(-5px) rotate(-20deg);opacity:1}
  64%{transform:translateX(-5px) rotate(0deg);opacity:1}
}
@keyframes bkLockNudge{
  0%,36%,70%,100%{transform:rotate(0deg)}
  48%{transform:rotate(-3.5deg)}
  58%{transform:rotate(2deg)}
}
@keyframes bkPulse{
  from{opacity:.55;transform:scale(.95)}
  to{opacity:0;transform:scale(1.36)}
}
@media (prefers-reduced-motion:reduce){
  .bk-arc,.bk-key,.bk-lock,#boot.ok .bk-pulse,.gstat-ic{animation:none}
}

/* ---- Веб-поиск, статус ожидания и источники ---- */
.empty-in{display:flex;flex-direction:column;align-items:center;gap:12px;padding:0 16px;text-align:center}
.empty-t{font-size:22px;font-weight:500}
.web-hint{display:inline-flex;align-items:center;justify-content:center;height:32px;padding:0 10px;border-radius:999px;background:var(--surface);border:1px solid var(--border);color:var(--muted);font-size:12.5px;line-height:1.25;font-weight:400;letter-spacing:-.01em;max-width:calc(100vw - 32px);box-shadow:0 2px 10px rgba(0,0,0,.18);transition:background .22s,color .22s,border-color .22s,padding .32s cubic-bezier(.22,1,.36,1),opacity .18s}
.web-hint.open{padding:0 13px}
.web-hint svg{flex:none}
.web-hint:active{opacity:.78}
.web-hint .wh-ic{display:grid;place-items:center;flex:none}
.web-hint .wh-arr{display:grid;place-items:center;flex:none;margin-left:3px;opacity:.7;transition:transform .32s cubic-bezier(.22,1,.36,1),opacity .22s}
.web-hint.open .wh-arr{transform:rotate(180deg);opacity:.55}
.web-hint .wh-txt{display:block;max-width:0;opacity:0;overflow:hidden;white-space:nowrap;margin:0;transition:max-width .36s cubic-bezier(.22,1,.36,1),opacity .24s ease,margin .32s cubic-bezier(.22,1,.36,1)}
.web-hint .wh-txt>span{display:inline-block;max-width:calc(100vw - 96px);overflow:hidden;text-overflow:ellipsis;vertical-align:bottom}
.web-hint.open .wh-txt{max-width:var(--wh-w,280px);opacity:1;margin:0 5px 0 7px}
.web-hint.on{background:rgba(96,165,250,.16);border-color:rgba(96,165,250,.45);color:#7db4ff}
.web-hint.avail{background:rgba(96,165,250,.09);border-color:rgba(96,165,250,.28);color:#8ab8ff}
.web-hint.auto{background:rgba(74,222,128,.12);border-color:rgba(74,222,128,.35);color:#4ade80}
.webbtn{flex:none;height:38px;min-width:38px;padding:0 9px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;gap:6px;color:var(--muted);transition:background .18s,color .18s,padding .18s}
.webbtn .wic{display:grid;place-items:center;flex:none}
.webbtn:active{background:#2a2a2a}
.webbtn .wlbl{display:none;font-size:13.5px;font-weight:600;white-space:nowrap}
.webbtn.on{padding:0 12px;background:rgba(96,165,250,.18);color:#7db4ff}
.webbtn.on .wlbl{display:inline}
.webbtn.dim{opacity:.48}
.gstat{display:inline-flex;align-items:center;gap:8px;padding:6px 0;color:var(--muted);font-size:14.5px;font-weight:500}
.gstat-ic{display:grid;place-items:center;color:#7db4ff;animation:gSpin 2.6s linear infinite}
@keyframes gSpin{to{transform:rotate(360deg)}}
.dots.sm{gap:4px;padding:0}
.dots.sm i{width:5px;height:5px}
.srcs{display:flex;gap:6px;overflow-x:auto;margin:8px 0 4px;padding:2px 0;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.srcs::-webkit-scrollbar{display:none}
.src-chip{flex:none;display:inline-flex;align-items:center;gap:6px;max-width:210px;padding:5px 11px;border-radius:999px;background:var(--card2);border:1px solid var(--border);color:var(--muted);font-size:12.5px;line-height:1.25;text-decoration:none}
.src-chip svg{flex:none;opacity:.8}
.src-chip span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.src-chip:active{opacity:.72}
.pi-meta{display:inline-flex;align-items:center;gap:6px;flex:none;color:var(--muted)}
.pi-web{display:grid;place-items:center;color:var(--muted);opacity:.78}
.pi-web.auto{color:#4ade80;opacity:.95}
.pi-web.paid{color:#7db4ff;opacity:.88}
.pi-web.off{color:var(--muted);opacity:.55}
.nt-ic.web{background:rgba(96,165,250,.16);color:#7db4ff}
:root[data-theme="light"] .web-hint{background:var(--surface);border-color:var(--border);color:var(--muted);box-shadow:0 2px 10px rgba(15,23,42,.06)}
:root[data-theme="light"] .web-hint.on{background:#e3efff;border-color:#b6d3fb;color:#1769c2}
:root[data-theme="light"] .web-hint.avail{background:#edf4ff;border-color:#c6dcfa;color:#1769c2}
:root[data-theme="light"] .web-hint.auto{background:#dff3e4;border-color:#b5e2c2;color:#1f7a3a}
:root[data-theme="light"] .webbtn:active{background:#e5e5e9}
:root[data-theme="light"] .webbtn.on{background:#e3efff;color:#1769c2}
:root[data-theme="light"] .gstat-ic{color:#1769c2}
:root[data-theme="light"] .pi-web.auto{color:#1f7a3a}
:root[data-theme="light"] .pi-web.paid{color:#1769c2}
:root[data-theme="light"] .src-chip{background:var(--surface);border-color:var(--border);color:var(--muted)}
:root[data-theme="light"] .nt-ic.web{background:#e3efff;color:#1769c2}

/* ---- Парящий объёмный дизайн + вдавленные поля поиска и ввода ---- */
:root{
  --flt-bg:linear-gradient(155deg,#2e313c 0%,#23252f 58%,#1c1e26 100%);
  --flt-bg-hi:linear-gradient(155deg,#3b3e4c 0%,#2e313d 58%,#252832 100%);
  --flt-btn:linear-gradient(155deg,#424656 0%,#333644 58%,#292c38 100%);
  --flt-sh:0 12px 28px -8px rgba(0,0,0,.74),0 4px 12px -2px rgba(0,0,0,.5),inset 0 1px 1px rgba(255,255,255,.12),inset 0 -2px 5px rgba(0,0,0,.28);
  --flt-sh-sm:0 7px 18px -4px rgba(0,0,0,.66),0 2px 6px -1px rgba(0,0,0,.44),inset 0 1px 1px rgba(255,255,255,.15),inset 0 -1.5px 4px rgba(0,0,0,.26);
  --flt-sh-lg:0 24px 54px -12px rgba(0,0,0,.84),0 8px 22px -4px rgba(0,0,0,.58),inset 0 1.5px 1px rgba(255,255,255,.13),inset 0 -2px 8px rgba(0,0,0,.32);
  --deb-bg:linear-gradient(160deg,#0b0c10 0%,#13151c 100%);
  --deb-sh:inset 0 3px 9px rgba(0,0,0,.8),inset 0 1px 2px rgba(0,0,0,.56),0 1px 0 rgba(255,255,255,.07);
  --pri-bg:linear-gradient(155deg,#ffffff 0%,#e5e7ef 100%);
  --pri-sh:0 9px 22px -4px rgba(0,0,0,.66),0 3px 8px -1px rgba(0,0,0,.42),inset 0 1.5px 1px rgba(255,255,255,.95),inset 0 -2px 4px rgba(0,0,0,.14);
  --dan-bg:linear-gradient(155deg,#6c2929 0%,#521e1e 100%);
  --dan-sh:0 8px 18px -5px rgba(0,0,0,.65),inset 0 1px 1px rgba(255,180,180,.18),inset 0 -2px 4px rgba(0,0,0,.3);
  --sel-bg:linear-gradient(155deg,#4b4f5e 0%,#383b48 58%,#2d303c 100%);
  --sel-sh:0 8px 20px -5px rgba(0,0,0,.64),inset 0 1.5px 1px rgba(255,255,255,.22),inset 0 -1.5px 4px rgba(0,0,0,.28);
}
:root[data-theme="light"]{
  --flt-bg:linear-gradient(155deg,#eceff8 0%,#e1e6f3 58%,#d5dced 100%);
  --flt-bg-hi:linear-gradient(155deg,#eef1f9 0%,#e2e7f4 58%,#d6deee 100%);
  --flt-btn:linear-gradient(155deg,#f8faff 0%,#edf1fa 58%,#e1e7f4 100%);
  --flt-sh:0 12px 28px -6px rgba(30,41,59,.2),0 4px 12px -2px rgba(30,41,59,.11),inset 0 1.5px 1px rgba(255,255,255,.86),inset 0 -2px 6px rgba(30,41,59,.07);
  --flt-sh-sm:0 7px 18px -4px rgba(30,41,59,.2),0 2px 7px -1px rgba(30,41,59,.11),inset 0 1.5px 1px rgba(255,255,255,.88),inset 0 -1.5px 4px rgba(30,41,59,.07);
  --flt-sh-lg:0 24px 52px -12px rgba(15,23,42,.26),0 8px 22px -4px rgba(15,23,42,.14),inset 0 1.5px 1px rgba(255,255,255,.9),inset 0 -2px 6px rgba(15,23,42,.07);
  --deb-bg:linear-gradient(160deg,#cfd6e6 0%,#dce2f0 62%,#e6ebf5 100%);
  --deb-sh:inset 0 3px 8px rgba(30,41,59,.19),inset 0 1px 3px rgba(30,41,59,.11),0 1px 0 rgba(255,255,255,.88);
  --pri-bg:linear-gradient(155deg,#2e303b 0%,#181920 100%);
  --pri-sh:0 8px 20px -4px rgba(15,23,42,.36),0 2px 8px -1px rgba(15,23,42,.22),inset 0 1px 1px rgba(255,255,255,.22),inset 0 -2px 4px rgba(0,0,0,.3);
  --dan-bg:linear-gradient(155deg,#fee2e2 0%,#f9c9c9 100%);
  --dan-sh:0 6px 16px -4px rgba(180,35,43,.22),inset 0 1px 1px rgba(255,255,255,.85),inset 0 -1.5px 4px rgba(180,35,43,.1);
  --sel-bg:linear-gradient(155deg,#d6dff2 0%,#c7d3ec 58%,#b8c7e6 100%);
  --sel-sh:0 7px 18px -4px rgba(30,41,59,.22),inset 0 1.5px 1px rgba(255,255,255,.8),inset 0 -1.5px 4px rgba(30,41,59,.09);
}

/* Верхняя панель и отступы прокручиваемых страниц (чтобы тени никогда не обрезались) */
#top{padding:max(12px,env(safe-area-inset-top)) 16px 12px}
#msgs{padding:10px 16px 20px}
#setBody,#manBody,#updBody,#fbPageBody{padding:10px 16px max(34px,env(safe-area-inset-bottom))}
.circle{width:40px;height:40px;border:0;background:var(--flt-bg-hi);box-shadow:var(--flt-sh-sm);transition:transform .14s ease,box-shadow .16s ease}
.circle:active{transform:scale(.94)}
.pill{height:40px;padding:0 14px 0 18px;border:0;border-radius:999px;background:var(--pri-bg);box-shadow:var(--pri-sh);transition:transform .14s ease}
.pill:active{transform:scale(.97)}
:root[data-theme="light"] .pill{background:var(--pri-bg);color:#fff}

/* Вдавленные в экран поля поиска и ввода */
.composer{background:var(--deb-bg);border:0;border-radius:32px;padding:7px 9px;box-shadow:var(--deb-sh)}
:root[data-theme="light"] .composer{background:var(--deb-bg);border:0}
.search{flex:1;display:flex;align-items:center;gap:8px;background:var(--deb-bg);border:0;border-radius:999px;padding:0 15px;height:44px;color:var(--muted);box-shadow:var(--deb-sh)}
:root[data-theme="light"] .search{background:var(--deb-bg);border:0}
.pvb input,.pvb textarea,.gb input,.gb textarea,.gb select,.dcard input,.fb-ta{
  background:var(--deb-bg);border:0;box-shadow:var(--deb-sh);padding:12px 16px
}
.pvb input,.gb input,.gb select,.dcard input{border-radius:999px}
.pvb textarea,.gb textarea,.fb-ta{border-radius:24px}
:root[data-theme="light"] .pvb input,
:root[data-theme="light"] .pvb textarea,
:root[data-theme="light"] .gb input,
:root[data-theme="light"] .gb textarea,
:root[data-theme="light"] .gb select,
:root[data-theme="light"] .dcard input,
:root[data-theme="light"] .fb-ta{background:var(--deb-bg);border:0;color:var(--text)}
.mbox{border:0;border-radius:26px;padding:12px;background:var(--deb-bg);box-shadow:var(--deb-sh)}
:root[data-theme="light"] .mbox{background:var(--deb-bg);border:0}
.pvb .mfilter input,.gb .mfilter input{box-shadow:none!important;border-radius:0!important}
.mtop{padding:2px 2px 4px}
.mtop input{padding:0 14px!important}
.pvb .inw input{padding-right:46px}

/* Список моделей в настройках: мягкие парящие скруглённые капсулы вместо квадратных плашек */
.mbox .mlist,:root[data-theme="light"] .mbox .mlist{
  background:transparent;border:0;border-radius:20px;max-height:290px;margin-top:4px;
  padding:6px 4px 12px;display:flex;flex-direction:column;gap:8px
}
.mrow,:root[data-theme="light"] .mrow{
  border:0;border-radius:22px;padding:9px 8px 9px 12px;
  background:var(--flt-btn);box-shadow:var(--flt-sh-sm);
  transition:transform .14s ease,background .16s ease,box-shadow .16s ease
}
.mrow:active,:root[data-theme="light"] .mrow:active{transform:scale(.985);background:var(--flt-btn)}
.mrow.on,:root[data-theme="light"] .mrow.on{background:var(--sel-bg);box-shadow:var(--sel-sh)}
.mrow .cb{border-radius:50%;border-width:1.6px}

/* Кнопка отправки и подсказки над полем ввода (тени не обрезаются ни сверху, ни снизу, ни по бокам) */
.send{background:var(--pri-bg);box-shadow:var(--pri-sh);transition:transform .14s ease,opacity .16s ease}
.send:active:not(:disabled){transform:scale(.93)}
.send:disabled{background:var(--flt-bg-hi);box-shadow:none;opacity:.55}
:root[data-theme="light"] .send{background:var(--pri-bg);color:#fff}
:root[data-theme="light"] .send:disabled{background:#cdd3e2;color:#7e8599;box-shadow:none;opacity:.85}
.sugg{gap:10px;margin:-10px -16px 0;padding:14px 16px 20px;scroll-padding-left:16px}
.sc{border:0;border-radius:999px;background:var(--flt-bg-hi);box-shadow:var(--flt-sh-sm);transition:transform .14s ease}
.sc:active{transform:scale(.97)}
.sc .tile{background:var(--deb-bg);box-shadow:var(--deb-sh)}
:root[data-theme="light"] .sc{background:var(--flt-bg-hi);border:0;box-shadow:var(--flt-sh-sm)}
:root[data-theme="light"] .sc .tile{background:var(--deb-bg)}

/* Полукруглые парящие кнопки по всему интерфейсу */
.btn,.btn.sm,.fb-type,.fb-chip,.err button,.attach-btn,.newc,.ci,.pi{border-radius:999px}
.btn{border:0;padding:10px 18px;background:var(--flt-btn);box-shadow:var(--flt-sh-sm);transition:transform .14s ease,opacity .16s ease}
.btn:active:not(:disabled){transform:scale(.96)}
.btn.sm{padding:8px 14px;border-radius:999px}
.btn.pri{background:var(--pri-bg);color:#121212;box-shadow:var(--pri-sh)}
.btn.dan{background:var(--dan-bg);color:#ffb4b4;box-shadow:var(--dan-sh)}
.btn.ghost{background:var(--flt-btn);border:0;box-shadow:var(--flt-sh-sm)}
:root[data-theme="light"] .btn{background:var(--flt-btn);color:var(--text);border:0;box-shadow:var(--flt-sh-sm)}
:root[data-theme="light"] .btn.pri{background:var(--pri-bg);color:#fff;border:0;box-shadow:var(--pri-sh)}
:root[data-theme="light"] .btn.dan{background:var(--dan-bg);color:#b4232b;border:0;box-shadow:var(--dan-sh)}
:root[data-theme="light"] .btn.ghost{background:var(--flt-btn);color:var(--text);border:0;box-shadow:var(--flt-sh-sm)}
.act button,.umore,.eye,.mrow .mx,.mtop .btn.plus{border-radius:50%}
.mtop .btn{border-radius:999px;padding:0 15px}
.mtop .btn.plus{width:40px;height:40px;padding:0}
.fb-type{border:0;background:var(--flt-btn);box-shadow:var(--flt-sh-sm)}
.fb-type.on,.fb-chip.on{background:var(--pri-bg);color:#121212;border:0;box-shadow:var(--pri-sh)}
.fb-chip{border:0;height:36px;padding:0 15px;background:var(--flt-bg-hi);box-shadow:var(--flt-sh-sm);transition:transform .14s ease}
.fb-chip:active{transform:scale(.96)}
:root[data-theme="light"] .fb-type{background:var(--flt-btn);border:0;color:var(--muted)}
:root[data-theme="light"] .fb-chip{background:var(--flt-bg-hi);border:0;color:var(--muted);box-shadow:var(--flt-sh-sm)}
:root[data-theme="light"] .fb-type.on,:root[data-theme="light"] .fb-chip.on{background:var(--pri-bg);color:#fff;border:0;box-shadow:var(--pri-sh)}
.fb-bar{margin:-6px -16px 2px;padding:0;gap:8px}
.fb-filters{gap:8px;padding:12px 16px 18px}
.fb-bar>.btn{margin-right:16px;margin-bottom:6px}
.attach-btn{border:1.5px dashed rgba(155,155,155,.35);background:var(--deb-bg);box-shadow:var(--deb-sh)}

/* Большие парящие окна, карточки, меню и шторка с увеличенным радиусом закругления */
#drawer{border-right:0;border-radius:0 32px 32px 0;background:var(--flt-bg);box-shadow:var(--flt-sh-lg)}
:root[data-theme="light"] #drawer{background:var(--flt-bg);border:0}
.list{padding:6px 14px 16px}
.pcard{border:0;border-radius:30px;padding:12px 14px;background:var(--flt-bg);box-shadow:var(--flt-sh-lg)}
:root[data-theme="light"] .pcard{background:var(--flt-bg);border:0;box-shadow:var(--flt-sh-lg)}
.dcard,.dcard.cn,.dcard.nt,.dcard.fb{border:0;border-radius:32px;background:var(--flt-bg);box-shadow:var(--flt-sh-lg)}
:root[data-theme="light"] .dcard,:root[data-theme="light"] .dcard.cn,:root[data-theme="light"] .dcard.nt,:root[data-theme="light"] .dcard.fb{background:var(--flt-bg);border:0;box-shadow:var(--flt-sh-lg)}
#dlg.context .dcard{border-radius:26px;padding:10px;box-shadow:var(--flt-sh-lg)}
.uc,.pv,.gb,.manbtn{border:0;border-radius:26px;background:var(--flt-bg);box-shadow:var(--flt-sh)}
.pv{overflow:visible}
.pvh{border-radius:26px}
.pvb{padding:2px 16px 18px}
.uc,.pv{margin-bottom:14px}
.uc{padding:14px 16px}
.gb{padding:8px 16px 18px}
.btns{margin-top:14px}
.manbtn{padding:15px 18px;transition:transform .14s ease}
.manbtn:active{transform:scale(.98)}
:root[data-theme="light"] .uc,
:root[data-theme="light"] .pv,
:root[data-theme="light"] .gb,
:root[data-theme="light"] .manbtn{background:var(--flt-bg);border:0;box-shadow:var(--flt-sh)}

/* Выбор модели: мягкое объёмное выделение без галочки */
.pi{padding:11px 16px;margin:3px 0;transition:background .16s ease,box-shadow .16s ease,transform .14s ease}
.pi:active{transform:scale(.98)}
.pi.sel{background:var(--sel-bg);box-shadow:var(--sel-sh);font-weight:600;color:#fff}
:root[data-theme="light"] .pi.sel{background:var(--sel-bg);box-shadow:var(--sel-sh);color:var(--text)}
.ci{padding:0 6px 0 15px;margin:3px 0;transition:background .16s ease,box-shadow .16s ease}
.ci.sel{background:var(--sel-bg);box-shadow:var(--sel-sh);font-weight:500}
:root[data-theme="light"] .ci.sel{background:var(--sel-bg);box-shadow:var(--sel-sh)}
.newc{padding:11px 16px}

/* Блоки кода, вложения, чипы, переключатель темы, прогресс, уведомления */
.code{border:0;border-radius:24px;box-shadow:var(--flt-sh)}
.code .ch{padding:9px 16px}
.err{border:0;border-radius:24px;box-shadow:var(--flt-sh)}
.atts{padding:8px 8px 14px;margin:-4px -6px -4px}
.att{border:0;border-radius:18px;box-shadow:var(--flt-sh-sm)}
.aimg,.uimg{border-radius:18px;box-shadow:var(--flt-sh-sm)}
button.ufile{border:0;border-radius:999px;padding:9px 15px;background:var(--flt-bg-hi);box-shadow:var(--flt-sh-sm)}
.srcs{margin:2px -16px 0;padding:8px 16px 14px;gap:8px}
.src-chip{border:0;background:var(--flt-bg-hi);box-shadow:var(--flt-sh-sm);padding:6px 13px}
:root[data-theme="light"] .src-chip{background:var(--flt-bg-hi);border:0;box-shadow:var(--flt-sh-sm)}
.web-hint{border:0;background:var(--flt-bg-hi);box-shadow:var(--flt-sh-sm)}
.web-hint.auto{background:linear-gradient(155deg,rgba(74,222,128,.22),rgba(34,197,94,.12));box-shadow:var(--flt-sh-sm)}
.web-hint.on{background:linear-gradient(155deg,rgba(96,165,250,.26),rgba(59,130,246,.14));box-shadow:var(--flt-sh-sm)}
.web-hint.avail{background:linear-gradient(155deg,rgba(96,165,250,.18),rgba(59,130,246,.08));box-shadow:var(--flt-sh-sm)}
:root[data-theme="light"] .web-hint{background:var(--flt-bg-hi);border:0;box-shadow:var(--flt-sh-sm)}
:root[data-theme="light"] .web-hint.auto{background:linear-gradient(155deg,#e2f6e9,#cdecd8);border:0}
:root[data-theme="light"] .web-hint.on{background:linear-gradient(155deg,#e2eeff,#cce1ff);border:0}
:root[data-theme="light"] .web-hint.avail{background:linear-gradient(155deg,#eaf2ff,#d8e7fe);border:0}
.tsw .sw{background:var(--deb-bg);box-shadow:var(--deb-sh)}
.tsw .sw i{box-shadow:0 2px 6px rgba(0,0,0,.35)}
:root[data-theme="light"] .tsw .sw i{background:linear-gradient(155deg,#ffffff 0%,#f0f3fa 100%);box-shadow:0 2px 5px rgba(15,23,42,.28),0 1px 2px rgba(15,23,42,.16)}
.bar{border-radius:999px;box-shadow:inset 0 1px 3px rgba(0,0,0,.35)}
.bar i{border-radius:999px}
.nt-tips,.nt-det pre{border-radius:20px;background:var(--deb-bg);box-shadow:var(--deb-sh)}
:root[data-theme="light"] .nt-tips,:root[data-theme="light"] .nt-det pre{background:var(--deb-bg)}
.tgp{border-radius:24px;box-shadow:var(--deb-sh)}
.tgb{border-radius:20px 20px 20px 6px;box-shadow:var(--flt-sh-sm)}
#toast{border-radius:999px;padding:10px 18px;box-shadow:var(--flt-sh-lg)}
.hint{font-size:12.5px;line-height:1.4;margin:6px 6px 10px;opacity:.82}
#setBody h3,#updBody h3,#fbPageBody h3{margin:20px 0 8px 6px}

/* Заголовок истории рассылок с кнопкой очистки */
.uh-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:20px 0 8px}
#updBody .uh-row h3,#fbPageBody .uh-row h3{margin:0 0 0 6px}
.uc .uh b{min-width:0;overflow:hidden;text-overflow:ellipsis}

/* Парящие верхние кнопки на страницах Настройки / Ручная настройка API / Панель управления / Обращения */
#settings,#manual,#upd,#fbPage{display:block}
#settings .sh,#manual .sh,#upd .sh,#fbPage .sh{
  position:absolute;top:0;left:0;right:0;z-index:8;
  display:flex;align-items:center;gap:8px;
  padding:max(12px,env(safe-area-inset-top)) 16px 10px;
  pointer-events:none;background:transparent;
}
#settings .sh > *,#manual .sh > *,#upd .sh > *,#fbPage .sh > *{pointer-events:auto}
.sh > .ib{
  flex:none;width:40px;height:40px;border-radius:50%;
  background:rgba(46,49,60,.74);
  box-shadow:var(--flt-sh-sm);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  transition:transform .14s ease,background .16s ease;
}
.sh > .ib:active{transform:scale(.94);background:rgba(58,62,76,.86)}
.ib.spin svg{animation:spin .8s linear infinite}
.sh h2{
  margin:0;display:block;height:40px;line-height:40px;padding:0 16px;
  border-radius:999px;min-width:0;
  font-size:15.5px;font-weight:600;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  background:rgba(46,49,60,.74);
  box-shadow:var(--flt-sh-sm);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
}
.sh .tsw{
  margin-left:auto;flex:none;height:40px;padding:0 10px;
  border-radius:999px;
  background:rgba(46,49,60,.74);
  box-shadow:var(--flt-sh-sm);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
}
.sh .fb-badge{flex:none;box-shadow:var(--flt-sh-sm)}
:root[data-theme="light"] .sh > .ib,
:root[data-theme="light"] .sh h2,
:root[data-theme="light"] .sh .tsw{
  background:rgba(238,242,250,.76);color:var(--text);
}
:root[data-theme="light"] .sh > .ib:active{background:rgba(224,230,244,.9)}
#setBody,#manBody,#updBody,#fbPageBody{
  position:absolute;inset:0;overflow-y:auto;
  padding:calc(max(12px,env(safe-area-inset-top)) + 60px) 16px max(34px,env(safe-area-inset-bottom));
  overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
}
#manBody{padding-top:calc(max(12px,env(safe-area-inset-top)) + 64px)}
#setBody > h3:first-child,#updBody > h3:first-child,#updBody > .uh-row:first-child{margin-top:6px}
/* Скрываем веб-кнопки «Назад» внутри Telegram, чтобы не дублировать нативную кнопку BackButton */
:root.has-tg-back #setBack,
:root.has-tg-back #manBack,
:root.has-tg-back #updBack,
:root.has-tg-back #fbBack{display:none}
/* Заявки на код и отправка кода пользователю в бот */
.qtarget{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 0 4px;padding:10px 12px 10px 14px;border-radius:20px;background:rgba(192,132,252,.14);color:#e9d5ff;font-size:13.5px;line-height:1.35}
.qtarget b{display:block;font-weight:600;color:var(--text)}
.qtarget small{display:block;color:var(--muted);font-size:12px}
.qtarget .ib{flex:none;width:30px;height:30px;color:var(--muted)}
:root[data-theme="light"] .qtarget{background:#f3e8ff;color:#6b21a8}
.qs-code{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:999px;background:var(--deb-bg);box-shadow:var(--deb-sh);font-size:15px;font-weight:700;letter-spacing:.05em;margin:10px 0 12px}
.qs-list{max-height:200px;overflow-y:auto;margin:6px 0 12px;padding:4px 2px 8px;display:flex;flex-direction:column;gap:6px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.qs-u{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;padding:9px 14px;border-radius:20px;text-align:left;background:var(--flt-btn);box-shadow:var(--flt-sh-sm);transition:transform .14s ease,background .16s ease}
.qs-u:active{transform:scale(.98)}
.qs-u.sel{background:var(--sel-bg);box-shadow:var(--sel-sh)}
.qs-u .qu-n{min-width:0;flex:1}
.qs-u .qu-n b{display:block;font-size:14.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qs-u .qu-n small{display:block;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qs-u .qu-tag{flex:none;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600;background:rgba(192,132,252,.18);color:#d8b4fe}
:root[data-theme="light"] .qs-u .qu-tag{background:#f3e8ff;color:#7e22ce}
.qs-empty{padding:10px 4px;text-align:center;color:var(--muted);font-size:13px}
/* Вкладки-облачка на странице «Обращения» и статусы единого списка заявок и кодов */
.fb-tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:2px 0 10px;padding:2px 0 6px}
.fb-tab{display:flex;align-items:center;justify-content:center;gap:7px;height:42px;padding:0 14px;border:0;border-radius:999px;font-size:14.5px;font-weight:600;color:var(--muted);background:var(--flt-bg-hi);box-shadow:var(--flt-sh-sm);transition:transform .14s ease,background .16s ease,color .16s ease,box-shadow .16s ease}
.fb-tab:active{transform:scale(.97)}
.fb-tab.on{background:var(--pri-bg);color:#121212;box-shadow:var(--pri-sh)}
:root[data-theme="light"] .fb-tab.on{color:#fff}
.fb-tbadge{display:inline-flex;align-items:center;justify-content:center;min-width:19px;height:19px;padding:0 5px;border-radius:999px;background:#ef4444;color:#fff;font-size:11px;font-weight:700;line-height:1}
.fb-tag.active{background:rgba(74,222,128,.16);color:#4ade80}
.fb-tag.muted{background:rgba(155,155,155,.16);color:var(--muted)}
:root[data-theme="light"] .fb-tag.active{background:#dff3e4;color:#1f7a3a}
:root[data-theme="light"] .fb-tag.muted{background:#e5e7ef;color:var(--muted)}
.req-card{padding:10px 12px;margin-bottom:9px;border-radius:20px}
.rc-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.rc-who{min-width:0;flex:1;font-size:14.5px;font-weight:600;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rc-sub{font-size:12px;line-height:1.25;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rc-msg{margin-top:5px;font-size:13.5px;line-height:1.35;white-space:pre-wrap;word-break:break-word;opacity:.92;-webkit-user-select:text;user-select:text}
.rc-codebar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:7px;padding:6px 11px;border-radius:14px;background:var(--deb-bg);box-shadow:var(--deb-sh)}
.rc-codebar b{font-size:14px;font-weight:700;letter-spacing:.05em;white-space:nowrap;-webkit-user-select:text;user-select:text}
.rc-codebar small{font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rc-codebar .rc-tr{flex:none;width:28px;height:28px;padding:0;border-radius:50%;display:grid;place-items:center}
.rc-old{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:5px;padding:3px 6px 3px 10px;border-radius:12px;background:rgba(127,127,127,.09);font-size:12px;color:var(--muted)}
.rc-old span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rc-old b{color:var(--text);font-weight:600;letter-spacing:.03em;-webkit-user-select:text;user-select:text}
.rc-old .rc-ox{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.rc-old .rc-ox:active{background:rgba(255,107,107,.2);color:#ff8a8a}
.rc-acts{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:8px}
.rc-acts .btn.sm{height:30px;padding:0 10px;font-size:12.5px;display:inline-flex;align-items:center;justify-content:center;gap:4px}
.rc-acts .rc-del{margin-left:auto;width:30px;height:30px;padding:0;border-radius:50%;display:grid;place-items:center}
.req-card .fb-tag{padding:2px 8px;font-size:11.5px;flex:none}
/* Переключатели уведомлений администратора в Telegram */
.ntf-box{padding:4px 14px!important;margin-top:10px}
.ntf-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 2px}
.ntf-row+.ntf-row{border-top:1px solid var(--line)}
.ntf-lbl{min-width:0;flex:1}
.ntf-lbl b{display:block;font-size:14.5px;font-weight:500;line-height:1.25}
.ntf-lbl small{display:block;font-size:12px;color:var(--muted);line-height:1.3;margin-top:2px}
.ntf-sw{position:relative;flex:none;box-sizing:border-box;width:46px;height:26px;padding:3px;border:0;border-radius:999px;display:flex;align-items:center;background:var(--deb-bg);box-shadow:var(--deb-sh);transition:background .2s}
.ntf-sw i{display:block;flex:none;width:20px;height:20px;border-radius:50%;background:var(--text);box-shadow:0 2px 6px rgba(0,0,0,.35);transform:translateX(0);transition:transform .22s cubic-bezier(.2,.8,.2,1)}
.ntf-sw.on{background:linear-gradient(155deg,#22c55e 0%,#16a34a 100%);box-shadow:inset 0 1px 2px rgba(255,255,255,.25),0 4px 12px -3px rgba(22,163,74,.5)}
.ntf-sw.on i{background:#fff;transform:translateX(20px)}
:root[data-theme="light"] .ntf-sw i{background:linear-gradient(155deg,#ffffff 0%,#f0f3fa 100%);box-shadow:0 2px 5px rgba(15,23,42,.28),0 1px 2px rgba(15,23,42,.16)}
/* ---- Кошелёк пользователя (#wallet) и Финансовая админка (#finPage) ---- */
#wallet,#finPage{position:absolute;inset:0;background:var(--bg);z-index:38;transform:translateX(102%);transition:transform .28s cubic-bezier(.2,.8,.2,1);display:block}
#finPage{z-index:39}
#wallet.open,#finPage.open{transform:none}
#wallet .sh,#finPage .sh{
  position:absolute;top:0;left:0;right:0;z-index:8;
  display:flex;align-items:center;gap:8px;
  padding:max(12px,env(safe-area-inset-top)) 16px 10px;
  pointer-events:none;background:transparent;
}
#wallet .sh > *,#finPage .sh > *{pointer-events:auto}
#walBody,#finBody{
  position:absolute;inset:0;overflow-y:auto;
  padding:calc(max(12px,env(safe-area-inset-top)) + 60px) 16px max(34px,env(safe-area-inset-bottom));
  overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
}
#walBody h3,#finBody h3{margin:20px 0 8px 6px;font-size:13px;color:#8a8a8a;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
:root[data-theme="light"] #walBody h3,:root[data-theme="light"] #finBody h3{color:var(--muted)}
:root.has-tg-back #walBack,:root.has-tg-back #finBack{display:none}
.dr-wal{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 12px 2px;padding:10px 14px;border-radius:20px;background:var(--flt-bg-hi);box-shadow:var(--flt-sh-sm);width:calc(100% - 24px);text-align:left;transition:transform .14s ease}
.dr-wal:active{transform:scale(.98)}
.dr-wal b{display:block;font-size:14.5px;font-weight:600}
.dr-wal small{display:block;font-size:12px;color:var(--muted)}
.dr-wal .dr-topup{flex:none;padding:5px 11px;border-radius:999px;font-size:12px;font-weight:600;background:var(--pri-bg);color:#121212;box-shadow:var(--pri-sh)}
:root[data-theme="light"] .dr-wal .dr-topup{color:#fff}
.wal-hero{padding:18px 18px 16px;text-align:center}
.wal-lbl{font-size:13px;color:var(--muted);font-weight:500}
.wal-num{font-size:32px;font-weight:800;letter-spacing:-.02em;margin:4px 0 2px;line-height:1.15}
.wal-unit{font-size:13px;color:var(--muted);font-weight:600}
.wal-sub{display:flex;justify-content:center;gap:16px;margin-top:10px;font-size:12.5px;color:var(--muted)}
.wal-mode{display:inline-flex;align-items:center;gap:6px;margin-top:10px;padding:4px 12px;border-radius:999px;font-size:12px;font-weight:600;background:rgba(251,191,36,.16);color:#f5b942}
:root[data-theme="light"] .wal-mode{background:#fff1d6;color:#9a5b00}
.pkg-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0 4px}
.pkg{position:relative;display:flex;flex-direction:column;justify-content:space-between;gap:8px;padding:14px 13px;border-radius:24px;background:var(--flt-bg);box-shadow:var(--flt-sh);text-align:left;transition:transform .14s ease}
.pkg:active{transform:scale(.97)}
.pkg.pop{background:var(--sel-bg);box-shadow:var(--sel-sh)}
.pkg-b{display:inline-block;align-self:flex-start;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700;background:rgba(74,222,128,.16);color:#4ade80}
.pkg-b.base{background:rgba(155,155,155,.18);color:var(--muted)}
:root[data-theme="light"] .pkg-b{background:#dff3e4;color:#1f7a3a}
:root[data-theme="light"] .pkg-b.base{background:#e2e5ee;color:#575761}
.pkg-t{font-size:12.5px;color:var(--muted);font-weight:500}
.pkg-cr{font-size:18px;font-weight:800;line-height:1.2}
.pkg-cr small{display:block;font-size:11.5px;font-weight:500;color:var(--muted);margin-top:1px}
.pkg-st{display:inline-flex;align-items:center;justify-content:center;gap:4px;margin-top:2px;height:34px;border-radius:999px;background:var(--pri-bg);color:#121212;font-size:14px;font-weight:700;box-shadow:var(--pri-sh)}
:root[data-theme="light"] .pkg-st{color:#fff}
/* Кнопка «Кошелёк» в Настройках */
.manbtn.wal-btn{position:relative;justify-content:center;padding:15px 44px;margin-bottom:10px}
.manbtn.wal-btn .wal-mid{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:16px;font-weight:600}
.manbtn.wal-btn .wal-ic-o{color:#fb923c;display:grid;place-items:center;flex:none}
.manbtn.wal-btn .wal-ic-g{color:#4ade80;display:grid;place-items:center;flex:none}
.manbtn.wal-btn .chev{position:absolute;right:16px;top:50%;transform:translateY(-50%);margin-left:0}
:root[data-theme="light"] .manbtn.wal-btn .wal-ic-o{color:#ea580c}
:root[data-theme="light"] .manbtn.wal-btn .wal-ic-g{color:#16a34a}

.tx-list{display:flex;flex-direction:column;gap:8px}
.tx{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-radius:20px;background:var(--flt-bg);box-shadow:var(--flt-sh-sm)}
.tx-l{min-width:0;flex:1}
