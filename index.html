<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#121212">
<title>AI Chat</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#121212; --surface:#1a1a1a; --card:#2f2f2f; --card2:#242424; --border:#3a3a3a;
  --text:#f2f2f2; --muted:#9b9b9b; --danger:#ff6b6b; --ok:#4ade80;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);overflow:hidden;
  position:fixed;inset:0;width:100%;
  font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea{font:inherit;color:var(--text);outline:none}
svg{display:block}
#app{position:fixed;left:0;top:0;width:100%;height:var(--h,100dvh);
  display:flex;flex-direction:column;overflow:hidden}

/* header */
#top{display:flex;justify-content:space-between;align-items:center;
  padding:max(12px,env(safe-area-inset-top)) 16px 8px;flex:none}
.circle{width:38px;height:38px;border-radius:50%;border:1px solid var(--border);display:grid;place-items:center;background:transparent}
.pill{height:36px;padding:0 12px 0 16px;border-radius:30px;background:#fff;color:#121212;font-size:15px;font-weight:500;
  display:flex;align-items:center;gap:6px;max-width:62vw}
.pill span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* messages */
#msgs{flex:1;min-height:0;overflow-y:auto;padding:8px 16px 16px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.send-space{
  height:100vh;
  height:100dvh;
  flex:none;
}
.empty{height:100%;display:grid;place-items:center;color:#5d5d5d;font-size:22px;font-weight:500}
.m{margin:16px 0;font-size:17px;line-height:1.5;letter-spacing:.01em}
.m.u{display:flex;justify-content:flex-end}
.m.u .uwrap{display:flex;flex-direction:column;align-items:flex-end;max-width:86%;min-width:0}
.m.u .b{background:var(--card);padding:10px 16px;border-radius:20px 20px 5px 20px;max-width:100%;white-space:pre-wrap;word-break:break-word}

.ufoot{
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:5px;
  height:20px;
  margin:2px 4px 0 0;
  color:#858585;
  font-size:11px;
}

.umore{
  display:grid;
  place-items:center;
  width:24px;
  height:22px;
  padding:0;
  color:#858585;
  background:transparent;
  border:0;
  border-radius:6px;
}
.m.a .b{word-break:break-word}
.word-in{
  display:inline-block;
  animation:wordSettle .24s cubic-bezier(.2,.7,.2,1) both;
}
@keyframes wordSettle{
  from{
    opacity:0;
    filter:blur(6px);
    position:relative;
    top:4px;
  }
  to{
    opacity:1;
    filter:blur(0);
    top:0;
  }
}
.m.a{
  animation:answerIn .3s ease-out;
  transform-origin:top;
}
@keyframes answerIn{
  from{opacity:0;transform:translateY(8px)}
  to{opacity:1;transform:translateY(0)}
}
.m.a .b>*:first-child{margin-top:0}
.m.a .b p{margin:0 0 1em}
.m.a .b h1,.m.a .b h2,.m.a .b h3,.m.a .b h4{margin:1em 0 .4em;font-size:17px}
.m.a .b ul,.m.a .b ol{margin:0 0 .75em;padding-left:22px}
.m.a .b a{color:#8ab4ff}
.m.a .b code{background:#262626;padding:1px 6px;border-radius:6px;font-size:.9em;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.code{background:#0b0b0b;border:1px solid #2a2a2a;border-radius:14px;margin:.4em 0 .9em;overflow:hidden}
.code .ch{display:flex;justify-content:space-between;align-items:center;padding:6px 12px;background:#1b1b1b;color:var(--muted);font-size:13px}
.code .ch button{color:var(--muted);font-size:13px}
.code pre{margin:0;padding:12px;overflow-x:auto}
.code pre code{background:none;padding:0;font-size:13.5px;line-height:1.5;white-space:pre}
.act{display:flex;gap:4px;margin-top:2px;color:var(--muted)}
.act button{width:34px;height:34px;display:grid;place-items:center;border-radius:10px}
.act button:active{background:#262626}
.dots{display:inline-flex;gap:5px;padding:8px 0}
.dots i{width:8px;height:8px;border-radius:50%;background:#777;animation:bl 1.2s infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes bl{0%,80%,100%{opacity:.25}40%{opacity:1}}
.err{margin:10px 0;padding:12px 14px;border:1px solid #5a2b2b;background:#2a1717;border-radius:14px;color:#ffb4b4;font-size:14px;line-height:1.45}
.err button{display:block;margin-top:8px;color:#fff;background:#4a2323;padding:7px 14px;border-radius:10px;font-size:14px}

/* bottom */
#bottom{flex:none;padding:0 16px max(14px,env(safe-area-inset-bottom))}
.sugg{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 0 12px;padding:0;scrollbar-width:none}
.sugg::-webkit-scrollbar{display:none}
.sugg.hide{display:none}
.sc{flex:none;width:min(68vw,250px);scroll-snap-align:start;display:flex;align-items:center;gap:10px;padding:7px 14px 7px 8px;
  background:var(--card);border:1px solid #3d3d3d;border-radius:30px;text-align:left}
.sc .tile{width:38px;height:38px;border-radius:50%;background:#181818;display:grid;place-items:center;flex:none}
.sc b{display:block;font-size:15px;font-weight:600}
.sc small{display:block;color:var(--muted);font-size:12.5px;margin-top:1px}
.composer{background:var(--surface);border:1px solid #3a3a3a;border-radius:30px;padding:7px 9px}
#inp{display:block;flex:1;min-width:0;width:100%;background:none;border:0;resize:none;font-size:17px;line-height:1.4;min-height:40px;max-height:120px;padding:9px 4px}
#inp::placeholder{color:#a5a5a5}
.crow{display:flex;align-items:center;gap:5px;margin-top:0}
.sp{flex:1}
.ib{width:40px;height:40px;display:grid;place-items:center;border-radius:50%;color:#e6e6e6}
.ib:active{background:#2a2a2a}
.ib.on{color:var(--danger)}
.send{width:46px;height:46px;border-radius:50%;background:#fff;color:#121212;display:grid;place-items:center;margin-left:4px}
#btnMic{
  display:none !important;
}
.send:disabled{
  background:#3a3a3a;
  color:#777;
  opacity:1;
  cursor:default;
}

:root[data-theme="light"] .send:disabled{
  background:#d1d1d6;
  color:#8e8e93;
}

/* drawer */
#scrim{position:absolute;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
#scrim.on{opacity:1;pointer-events:auto}
#drawer{position:absolute;top:0;bottom:0;left:0;width:min(86vw,340px);background:#171717;z-index:21;
  transform:translateX(-102%);transition:transform .28s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;
  padding-top:max(12px,env(safe-area-inset-top));border-right:1px solid #262626}
#drawer.open{transform:none}
.dh{display:flex;gap:8px;padding:0 12px 8px}
.search{flex:1;display:flex;align-items:center;gap:8px;background:#232323;border-radius:14px;padding:0 12px;height:42px;color:var(--muted)}
.search input{flex:1;min-width:0;background:none;border:0;font-size:16px}
.newc{display:flex;align-items:center;gap:12px;margin:4px 12px;padding:10px 12px;border-radius:14px;font-size:16px;font-weight:500;width:calc(100% - 24px)}
.newc:active,.ci:active{background:#232323}
.list{flex:1;overflow-y:auto;padding:4px 12px 12px}
.gl{margin:14px 8px 4px;color:#7d7d7d;font-size:13px;font-weight:600}
.ci{display:flex;align-items:center;border-radius:12px;padding:0 4px 0 12px;min-height:44px;cursor:pointer}
.ci.sel{background:#262626}
.ci .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:16px}
.ci .ib{width:36px;height:36px;color:var(--muted)}
.noc{color:#6d6d6d;text-align:center;padding:30px 10px;font-size:15px}
.prof{display:flex;align-items:center;gap:12px;padding:14px 26px max(20px,calc(env(safe-area-inset-bottom) + 8px));width:100%;text-align:left}
.av{width:36px;height:36px;border-radius:50%;background:#3a3a3a;display:grid;place-items:center;font-weight:600;overflow:hidden;flex:none}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.prof .pn{flex:1;font-weight:500}

/* popover / dialog */
#pop,#dlg{position:absolute;inset:0;z-index:40;display:none}
#pop.on,#dlg.on{display:block}
#dlg{background:rgba(0,0,0,.6);z-index:90}
#dlg.on{display:grid;place-items:center;padding:24px}
.pcard{position:absolute;top:max(60px,calc(env(safe-area-inset-top) + 52px));right:12px;width:min(88vw,330px);max-height:64vh;overflow-y:auto;
  background:#242424;border:1px solid #363636;border-radius:20px;padding:8px;box-shadow:0 12px 40px rgba(0,0,0,.5)}
.pg{padding:10px 12px 4px;color:#8a8a8a;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.pi{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:left;padding:11px 12px;border-radius:12px;font-size:16px;word-break:break-all}
.pi:active{background:#303030}
.pi.sel{background:#2c2c2c}
.pn2{padding:16px 12px;color:var(--muted);font-size:15px;line-height:1.45}
.dcard{width:min(100%,360px);background:#242424;border:1px solid #3a3a3a;border-radius:22px;padding:20px}
.dcard h4{margin:0 0 8px;font-size:18px}
.dcard p{margin:0 0 14px;color:#bdbdbd;font-size:15px;line-height:1.45}
.dcard input{width:100%;background:#181818;border:1px solid #3a3a3a;border-radius:12px;padding:11px 12px;font-size:16px;margin-bottom:14px}
.drow{display:flex;gap:10px;justify-content:flex-end}
.btn{background:#2f2f2f;border-radius:12px;padding:10px 16px;font-size:15px;font-weight:500}
.btn.pri{background:#fff;color:#121212}
.btn.dan{background:#5a2323;color:#ffb4b4}
.btn.ghost{background:none;border:1px solid #3a3a3a}
/* Контекстные меню возле нажатого элемента */
#dlg.context{
  background:transparent;
  display:block;
  padding:0;
}

#dlg.context .dcard{
  position:absolute;
  width:min(260px,calc(100vw - 24px));
  max-width:none;
  padding:10px;
  border-radius:16px;
  box-shadow:0 8px 30px rgba(0,0,0,.4);
  animation:menuIn .14s ease-out;
}

@keyframes menuIn{
  from{opacity:0;transform:scale(.96)}
  to{opacity:1;transform:scale(1)}
}

/* settings */
#settings{position:absolute;inset:0;background:var(--bg);z-index:30;transform:translateX(102%);transition:transform .28s cubic-bezier(.2,.8,.2,1);
  display:flex;flex-direction:column}
#settings.open{transform:none}
.sh{display:flex;align-items:center;gap:8px;padding:max(10px,env(safe-area-inset-top)) 12px 8px}
.sh h2{margin:0;font-size:20px;font-weight:600}
#setBody{flex:1;overflow-y:auto;padding:4px 16px max(30px,env(safe-area-inset-bottom));overscroll-behavior:contain}
#setBody h3{margin:22px 0 10px;font-size:13px;color:#8a8a8a;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.hint{color:#7d7d7d;font-size:13px;line-height:1.45;margin:8px 2px}
.uc{background:var(--card2);border:1px solid #303030;border-radius:16px;padding:12px 14px;margin-bottom:10px}
.uh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.uh b{font-size:16px}
.uh .ib{width:32px;height:32px;color:var(--muted)}
.ul{color:#bdbdbd;font-size:14px;margin-top:4px;line-height:1.5}
.ul em{font-style:normal;color:#fff;font-weight:600}
.bar{height:6px;border-radius:3px;background:#383838;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:#fff;border-radius:3px}
.bar i.low{background:var(--danger)}
.pv{background:var(--card2);border:1px solid #303030;border-radius:16px;margin-bottom:10px;overflow:hidden}
.pvh{display:flex;align-items:center;gap:10px;width:100%;padding:14px;font-size:16px;font-weight:500;text-align:left}
.pvh .chev{margin-left:auto;color:var(--muted);transition:transform .2s}
.pv.open .chev{transform:rotate(180deg)}
.dot{width:9px;height:9px;border-radius:50%;background:#555;flex:none}
.dot.on{background:var(--ok)}
.pvb{padding:0 14px 14px}
.pvb label,.gb label{display:block;margin:12px 0 6px;color:#9a9a9a;font-size:13px}
.pvb input,.pvb textarea,.gb input,.gb textarea{width:100%;background:#181818;border:1px solid #363636;border-radius:12px;padding:11px 12px;font-size:16px;resize:vertical}
.row{display:flex;gap:6px;align-items:center}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.gb{background:var(--card2);border:1px solid #303030;border-radius:16px;padding:4px 14px 14px}

#toast{position:absolute;left:50%;bottom:110px;transform:translateX(-50%) translateY(20px);background:#fff;color:#111;padding:10px 16px;border-radius:14px;
  font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:110;max-width:86vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%)}
/* LIGHT THEME */
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#ffffff;
  --surface:#f4f4f7;
  --card:#ebebf0;
  --card2:#f4f4f7;
  --border:#c9c9d2;
  --text:#0d0d10;
  --muted:#575761;
  --danger:#c62828;
  --ok:#1f8a4c;
}

:root[data-theme="light"] body,
:root[data-theme="light"] #app,
:root[data-theme="light"] #settings{
  background:var(--bg);
  color:var(--text);
}

:root[data-theme="light"] .pill,
:root[data-theme="light"] .send{
  background:#1c1c1e;
  color:#fff;
}

:root[data-theme="light"] .m.u .b,
:root[data-theme="light"] .sc,
:root[data-theme="light"] .uc,
:root[data-theme="light"] .pv,
:root[data-theme="light"] .gb{
  background:var(--card);
  border-color:var(--border);
  color:var(--text);
}

:root[data-theme="light"] .composer,
:root[data-theme="light"] .dcard,
:root[data-theme="light"] .pcard{
  background:var(--surface);
  border-color:var(--border);
  color:var(--text);
}

:root[data-theme="light"] #drawer{
  background:#fff;
  border-color:var(--border);
  color:var(--text);
}

:root[data-theme="light"] .search,
:root[data-theme="light"] .sc .tile,
:root[data-theme="light"] .pvb input,
:root[data-theme="light"] .pvb textarea,
:root[data-theme="light"] .gb input,
:root[data-theme="light"] .gb textarea,
:root[data-theme="light"] .dcard input{
  background:#f2f2f5;
  color:var(--text);
  border-color:var(--border);
}

:root[data-theme="light"] input,
:root[data-theme="light"] textarea{
  color:var(--text);
}

:root[data-theme="light"] input::placeholder,
:root[data-theme="light"] textarea::placeholder{
  color:#686872;
}

:root[data-theme="light"] .btn{
  background:#e9e9ed;
  color:#1c1c1e;
  border:1px solid var(--border);
}

:root[data-theme="light"] .btn.pri{
  background:#1c1c1e;
  color:#fff;
  border-color:#1c1c1e;
}

:root[data-theme="light"] .btn.dan{
  background:#fde8e8;
  color:#b4232b;
  border-color:#f5caca;
}

:root[data-theme="light"] .btn.ghost{
  background:transparent;
  color:var(--text);
  border-color:var(--border);
}

:root[data-theme="light"] .ib{
  color:#2e2e35;
}

:root[data-theme="light"] .ib:active,
:root[data-theme="light"] .act button:active,
:root[data-theme="light"] .newc:active,
:root[data-theme="light"] .ci:active{
  background:#e5e5e9;
}

:root[data-theme="light"] .ci.sel,
:root[data-theme="light"] .pi.sel,
:root[data-theme="light"] .pi:active{
  background:#e9e9ed;
}

:root[data-theme="light"] .newc,
:root[data-theme="light"] .ci,
:root[data-theme="light"] .pi{
  color:var(--text);
}

:root[data-theme="light"] .gl,
:root[data-theme="light"] .noc,
:root[data-theme="light"] .hint,
:root[data-theme="light"] #setBody h3,
:root[data-theme="light"] .pvb label,
:root[data-theme="light"] .gb label,
:root[data-theme="light"] .pg{
  color:var(--muted);
}

:root[data-theme="light"] .ul{
  color:#44444c;
}

:root[data-theme="light"] .ul em{
  color:var(--text);
}

:root[data-theme="light"] .bar{
  background:#dedee3;
}

:root[data-theme="light"] .bar i{
  background:#555;
}

:root[data-theme="light"] .code{
  background:#f0f0f2;
  border-color:var(--border);
  color:#222;
}

:root[data-theme="light"] .code .ch{
  background:#e5e5e9;
  color:var(--muted);
}

:root[data-theme="light"] .code pre code,
:root[data-theme="light"] .m.a .b code{
  color:#222;
}

:root[data-theme="light"] .m.a .b code{
  background:#e9e9ed;
}

:root[data-theme="light"] .m.a .b a{
  color:#1769c2;
}

:root[data-theme="light"] .err{
  background:#fff0f0;
  border-color:#f0caca;
  color:#b4232b;
}

:root[data-theme="light"] .err button{
  background:#f8dede;
  color:#9f2028;
}

:root[data-theme="light"] .dot{
  background:#aaa;
}

:root[data-theme="light"] .av{
  background:#e5e5e9;
  color:#333;
}

:root[data-theme="light"] #dlg{
  background:rgba(0,0,0,.35);
}

:root[data-theme="light"] .dcard p{
  color:#44444c;
}

:root[data-theme="light"] #toast{
  background:#1c1c1e;
  color:#fff;
}

:root[data-theme="light"] .empty{
  color:var(--muted);
}
/* Светлая тема: контраст индикаторов */
:root[data-theme="light"] .dot.on{
  background:#16a34a;
}

:root[data-theme="light"] .dot:not(.on){
  background:#b8b8c0;
}

/* Полоска токенов */
:root[data-theme="light"] .bar{
  height:8px;
  background:#c5c5ce;
  border-radius:10px;
}

:root[data-theme="light"] .bar i{
  background:#2563eb;
  border-radius:10px;
}

:root[data-theme="light"] .bar i.low{
  background:#dc2626;
}
/* Выделение текста сообщений на iPhone */
.m .b,
.m .b * {
  -webkit-user-select: text !important;
  user-select: text !important;
  -webkit-touch-callout: default;
}
.tbl-wrap{
  width:100%;
  overflow-x:auto;
  margin:12px 0;
  border:1px solid var(--border);
  border-radius:12px;
}

.md-table{
  width:100%;
  border-collapse:collapse;
  font-size:14px;
  line-height:1.45;
}

.md-table th,
.md-table td{
  padding:10px;
  border-bottom:1px solid var(--border);
  border-right:1px solid var(--border);
  text-align:left;
  vertical-align:top;
}

.md-table th{
  background:var(--card);
  font-weight:600;
}

.md-table tr:last-child td{
  border-bottom:0;
}

.md-table th:last-child,
.md-table td:last-child{
  border-right:0;
}

/* Вложения: превью в поле ввода (пусто — не занимает места) */
.atts{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none}
.atts::-webkit-scrollbar{display:none}
.atts:empty{display:none}
.att{position:relative;flex:none;height:64px;border-radius:14px;background:var(--card);border:1px solid var(--border);overflow:hidden}
.att img{display:block;width:64px;height:64px;object-fit:cover}
.att.pdf{display:flex;align-items:center;gap:8px;padding:0 30px 0 12px;max-width:190px;font-size:13px}
.att.pdf span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.att .x{position:absolute;top:4px;right:4px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,.65);color:#fff;display:grid;place-items:center}
/* Вложения в сообщении пользователя */
.uatts{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px;margin:0 0 6px;max-width:100%;white-space:normal}
.uimg{display:block;width:120px;height:120px;object-fit:cover;border-radius:12px}
.ufile{display:flex;align-items:center;gap:8px;max-width:100%;padding:4px 2px;font-size:14px;white-space:nowrap}
.ufile span{min-width:0;overflow:hidden;text-overflow:ellipsis}

[hidden]{display:none!important}

/* Переключатель темы: солнце — тумблер — луна */
.tsw{margin-left:auto;display:flex;align-items:center;gap:8px;padding-right:4px}
.tsw .ico{display:grid;place-items:center;width:24px;height:24px;color:var(--muted);opacity:.4;transition:opacity .2s,color .2s;cursor:pointer}
.tsw .sw{position:relative;flex:none;width:44px;height:26px;border-radius:13px;background:var(--card);border:1px solid var(--border);transition:background .2s}
.tsw .sw i{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--text);transition:transform .22s cubic-bezier(.2,.8,.2,1)}
:root:not([data-theme="light"]) .tsw .sw i{transform:translateX(18px)}
:root:not([data-theme="light"]) .tsw .moon{opacity:1;color:#a5b4fc}
:root[data-theme="light"] .tsw .sun{opacity:1;color:#f59e0b}

/* Список моделей с галочками */
.mh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:16px 0 6px;color:#9a9a9a;font-size:13px}
.mh b{font-weight:600;color:var(--text)}
.mcnt{flex:none}
.mtools{display:flex;gap:8px;margin:0 0 8px}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.mlist{max-height:300px;overflow-y:auto;border:1px solid #363636;border-radius:12px;background:#181818;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.mrow{display:flex;align-items:center;gap:10px;padding:9px 6px 9px 10px;cursor:pointer;border-bottom:1px solid #2a2a2a;-webkit-user-select:none;user-select:none}
.mrow:last-child{border-bottom:0}
.mrow:active{background:rgba(127,127,127,.12)}
.mrow .cb{flex:none;width:20px;height:20px;border-radius:6px;border:1.5px solid #666;display:grid;place-items:center;color:transparent}
.mrow.on .cb{background:#fff;border-color:#fff;color:#121212}
.mrow .mt{flex:1;min-width:0;font-size:14px;line-height:1.3;word-break:break-all}
.mrow .mx{flex:none;width:30px;height:30px;display:grid;place-items:center;color:var(--muted);border-radius:8px}
.mempty{padding:12px 2px;color:var(--muted);font-size:14px;line-height:1.45}
:root[data-theme="light"] .mlist{background:#f2f2f5;border-color:var(--border)}
:root[data-theme="light"] .mrow{border-color:var(--border)}
:root[data-theme="light"] .mrow .cb{border-color:#a0a0a8}
:root[data-theme="light"] .mrow.on .cb{background:#1c1c1e;border-color:#1c1c1e;color:#fff}
:root[data-theme="light"] .mh{color:var(--muted)}

/* Сообщения пользователя: меню по долгому нажатию, без выделения текста */
.m.u .uwrap,.m.u .uwrap *{-webkit-user-select:none!important;user-select:none!important;-webkit-touch-callout:none!important}
.uimg{cursor:zoom-in;-webkit-user-drag:none}

/* Полноэкранный просмотр фото */
#viewer{position:absolute;inset:0;z-index:80;background:#000;touch-action:none;opacity:0;pointer-events:none;transition:opacity .2s}
#viewer.on{opacity:1;pointer-events:auto}
#vstage{position:absolute;inset:0;display:grid;place-items:center;overflow:hidden;touch-action:none}
#vimg{display:block;max-width:100%;max-height:100%;transform-origin:center;will-change:transform;-webkit-user-select:none;user-select:none;-webkit-user-drag:none;-webkit-touch-callout:none;touch-action:none;transition:opacity .15s}
.vtop{position:absolute;top:0;left:0;right:0;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:max(10px,env(safe-area-inset-top)) 12px 12px;color:#fff;pointer-events:none;background:linear-gradient(rgba(0,0,0,.55),transparent)}
.vtop span{font-size:15px;font-weight:500;padding-left:8px}
#viewer .ib{color:#fff;background:rgba(255,255,255,.16)}
#viewer.on .ib{pointer-events:auto}
#viewer .ib:active{background:rgba(255,255,255,.28)}
.vnav{position:absolute;top:50%;z-index:2;margin-top:-20px}
#vPrev{left:10px}#vNext{right:10px}

/* Таблицы: растягиваются вправо за экран, прокручиваются, слова не рвутся по буквам */
.tbl-wrap{-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.md-table{width:max-content;min-width:100%}
.md-table th,.md-table td{min-width:110px;max-width:340px;word-break:normal;overflow-wrap:normal;hyphens:none}
.ul.sub{color:#8a8a8a}
#msgs{overflow-anchor:none}

:root[data-theme="light"] .ul.sub{color:#575761}
:root[data-theme="light"] .m.a .b{color:var(--text)}
:root[data-theme="light"] .m.u .b{background:#e8e8ee;border:1px solid #d3d3dc}
:root[data-theme="light"] .composer{background:#f4f4f7;border-color:#c0c0ca}
:root[data-theme="light"] #drawer{background:#fafafc}
:root[data-theme="light"] .pcard,:root[data-theme="light"] .dcard{background:#fff;box-shadow:0 12px 40px rgba(0,0,0,.18)}
:root[data-theme="light"] .sc{background:#f4f4f7;border-color:#c9c9d2}

/* Размер текста ответа */

.code pre code{font-size:13px}

/* Окно API ключа: ключ + лимит в одну строку */
.kl{display:flex;gap:10px}
.kl .kf{flex:1;min-width:0}
.kl .lf{flex:none;width:calc(10ch + 26px)}
.inw{position:relative}
.pvb .inw input{padding-right:44px}
.eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:36px;height:36px;display:grid;place-items:center;color:var(--muted);border-radius:10px}

/* Одно окно моделей */
.mbox{margin-top:14px;border:1px solid #363636;border-radius:14px;padding:10px;background:#181818}
.mtop{display:flex;gap:8px;align-items:center}
.mtop .btn{flex:none;display:flex;align-items:center;gap:6px;height:40px;padding:0 12px;white-space:nowrap}
.mtop .btn.plus{width:40px;padding:0;justify-content:center}
.mtop input{flex:1;min-width:0;height:40px;padding:0 10px!important;font-size:15px!important}
.mfilter{display:flex;align-items:center;justify-content:center;gap:8px;margin:10px 0 4px;color:var(--muted)}
.pvb .mfilter input{width:auto;max-width:70%;background:transparent!important;border:0!important;padding:6px 0!important;border-radius:0;color:var(--muted);font-size:15px;text-align:left}
.mbox .mlist{border:0;background:none;border-radius:0;max-height:280px;margin-top:4px}
.mbox .mempty{text-align:center;padding:14px 4px 6px}
:root[data-theme="light"] .mbox{background:#f2f2f5;border-color:var(--border)}
:root[data-theme="light"] .pvb .mfilter input{color:var(--text)}

.btns.one{flex-wrap:nowrap}
.btns.one .btn{flex:1;white-space:nowrap;text-align:center}

/* ---- Оформление ответа в стиле ChatGPT ---- */
:root{--line:rgba(255,255,255,.15)}
:root[data-theme="light"]{--line:rgba(0,0,0,.13)}
.m.a{font-size:17px;line-height:1.4}
.m.a .b p{margin:0 0 .9em}
.m.a .b h1,.m.a .b h2,.m.a .b h3,.m.a .b h4{font-size:19px;font-weight:700;line-height:1.3;margin:1.5em 0 .6em}
.m.a .b ul,.m.a .b ol{margin:0 0 .9em;padding-left:24px}
.m.a .b li{margin:.3em 0}
.m.a .b li::marker{color:var(--muted)}

/* Таблицы: без рамки и фона, жирная шапка, только тонкие линии между строками */
.m.a .b .tbl-wrap{border:0;border-radius:0;margin:1.1em 0 1.3em;background:none}
.m.a .b .md-table{border-collapse:collapse;font-size:16px;line-height:1.3;background:none;width:100%;min-width:0}
.m.a .b .md-table th,.m.a .b .md-table td{min-width:125px}
.m.a .b .md-table th,.m.a .b .md-table td{background:none;border:0;border-bottom:1px solid var(--line);padding:10px 20px 10px 0;text-align:left;vertical-align:top}
.m.a .b .md-table th{font-weight:700;padding-top:4px}
.m.a .b .md-table th:last-child,.m.a .b .md-table td:last-child{padding-right:2px}
.m.a .b .md-table tr:last-child td{border-bottom:0}
.m.a .b .md-table td b,.m.a .b .md-table td strong{font-weight:700}

/* ---- Панель управления (админ) ---- */
#upd{position:absolute;inset:0;background:var(--bg);z-index:35;transform:translateX(102%);transition:transform .28s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
#upd.open{transform:none}
#updBody{flex:1;overflow-y:auto;padding:4px 16px max(30px,env(safe-area-inset-bottom));overscroll-behavior:contain}
#updBody h3{margin:22px 0 10px;font-size:13px;color:#8a8a8a;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
:root[data-theme="light"] #updBody h3{color:var(--muted)}
#updBody .atts{padding-top:10px}
#updBody .atts:empty{display:none}
.att.up{opacity:.45}
.att.up::after{content:"";position:absolute;left:50%;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:spin .8s linear infinite}
.att.er{border-color:var(--danger)}
@keyframes spin{to{transform:rotate(360deg)}}
.tgp{background:#0e1621;border-radius:18px;padding:14px}
.tgb{background:#182533;color:#fff;border-radius:16px 16px 16px 4px;max-width:100%;overflow:hidden;font-size:15px;line-height:1.4}
.tgm{display:grid;gap:2px;grid-template-columns:1fr 1fr}
.tgm img,.tgm video{width:100%;height:150px;object-fit:cover;display:block}
.tgm.n1{grid-template-columns:1fr}
.tgm.n1 img,.tgm.n1 video{height:auto;max-height:300px}
.tgm.n3>:first-child{grid-column:1/-1}
.tgt{padding:8px 12px 2px;white-space:pre-wrap;word-break:break-word}
.tgt a{color:#6ab3f3}
.tgt code{background:rgba(255,255,255,.12);padding:1px 5px;border-radius:5px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.9em}
.tgs{text-align:right;font-size:11px;opacity:.6;padding:2px 10px 6px}
:root[data-theme="light"] .tgp{background:#dbe7ef}
:root[data-theme="light"] .tgb{background:#fff;color:#0d0d10}
:root[data-theme="light"] .tgt a{color:#1769c2}
:root[data-theme="light"] .tgt code{background:#eef0f3}
.uc .btns{margin-top:10px}
.attach-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:52px;margin:12px 0 4px;border:1.5px dashed var(--border);border-radius:14px;color:var(--muted);font-size:15px;font-weight:500;transition:background .15s,color .15s,border-color .15s}
.attach-btn small{font-size:12px;opacity:.7;font-weight:400}
.attach-btn:active{background:rgba(127,127,127,.12);color:var(--text);border-color:var(--muted)}
/* ---- Страница ручной настройки API ---- */
#manual{position:absolute;inset:0;background:var(--bg);z-index:32;transform:translateX(102%);transition:transform .28s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
#manual.open{transform:none}
#manBody{flex:1;overflow-y:auto;padding:4px 16px max(30px,env(safe-area-inset-bottom));overscroll-behavior:contain}
.manbtn{display:flex;align-items:center;gap:10px;width:100%;padding:14px;border-radius:16px;background:var(--card2);border:1px solid #303030;font-size:16px;font-weight:500;text-align:left}
.manbtn .chev{margin-left:auto;color:var(--muted)}
:root[data-theme="light"] .manbtn{border-color:var(--border)}
/* ---- Окно «Подключение API» и мини-инструкция ---- */
.dcard.cn{width:min(100%,380px);max-height:100%;overflow-y:auto;padding:22px 20px 20px;border-radius:26px}
.cn-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.cn-h h4{margin:0;font-size:19px;font-weight:700;white-space:nowrap}
.cn-st{flex:none;padding:4px 10px;border-radius:999px;font-size:12.5px;white-space:nowrap;font-weight:600;background:rgba(255,107,107,.16);color:#ff8a8a}
.cn-ic{width:64px;height:64px;margin:22px auto 14px;border-radius:50%;display:grid;place-items:center;background:rgba(127,127,127,.16);color:var(--muted)}
.cn-t{text-align:center;font-size:18px;font-weight:700;margin-bottom:8px}
.dcard.cn p.cn-p{text-align:center;color:var(--muted);margin:0 0 18px}
.cn-b{display:block;width:100%;height:50px;border-radius:999px;font-size:16px}
.cn-l{display:block;width:100%;padding:14px 0 6px;text-align:center;color:var(--muted);font-size:15px;font-weight:500}
.cn-l:active{opacity:.6}
.cn-f{margin-top:12px;padding-top:12px;border-top:1px solid var(--border);text-align:center;color:var(--muted);font-size:13px;opacity:.85}
.cn-prov{display:flex;align-items:center;gap:8px;margin:12px 0;font-size:16px;font-weight:700;white-space:nowrap}
.cn-logo{flex:none;width:34px;height:34px;border-radius:50%;border:1px solid var(--border);display:grid;place-items:center;font-size:12px;font-weight:800;letter-spacing:-.02em;background:rgba(127,127,127,.1)}
.cn-chip{padding:3px 8px;border-radius:999px;font-size:11.5px;font-weight:600;background:rgba(74,222,128,.15);color:#4ade80}
.cn-sep{height:1px;background:var(--border);margin:16px 0}
.cn-steps{margin:10px 0 12px;padding-left:22px;font-size:15.5px;line-height:1.5}
.cn-steps li{margin:6px 0;padding-left:4px}
.cn-note{color:var(--muted);font-size:13px;line-height:1.45;margin:0 0 14px}
:root[data-theme="light"] .cn-st{background:#fbe0e0;color:#b42318}
:root[data-theme="light"] .cn-chip{background:#dff3e4;color:#1f7a3a}
.gb select{width:100%;background:#181818;border:1px solid #363636;border-radius:12px;padding:11px 12px;font-size:16px;color:var(--text)}
:root[data-theme="light"] .gb select{background:#f2f2f5;border-color:var(--border)}
.qcode{font-size:22px;font-weight:700;letter-spacing:.06em;text-align:center;margin:12px 0 6px}
.cn-code{margin-top:4px}
.cn-code input{margin-bottom:10px}
#dlg{transition:padding-bottom .18s ease-out}
.gb .mfilter input{width:auto;max-width:70%;background:transparent!important;border:0!important;padding:6px 0!important;border-radius:0;color:var(--muted);font-size:15px;text-align:left}
:root[data-theme="light"] .gb .mfilter input{color:var(--text)}

/* ---- Окна-уведомления (понятные диалоги вместо системных ошибок) ---- */
#dlg2{position:absolute;inset:0;z-index:100;display:none;background:rgba(0,0,0,.6)}
#dlg2.on{display:grid;place-items:center;padding:20px}
.dcard.nt{width:min(100%,380px);max-height:100%;overflow-y:auto;padding:24px 20px 18px;border-radius:26px;-webkit-overflow-scrolling:touch;animation:ntIn .16s ease-out}
@keyframes ntIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
.nt-ic{width:56px;height:56px;margin:0 auto 14px;border-radius:50%;display:grid;place-items:center;background:rgba(127,127,127,.16);color:var(--muted)}
.nt-ic.error,.nt-ic.warn{background:rgba(255,107,107,.15);color:#ff7a7a}
.nt-ic.info,.nt-ic.file,.nt-ic.img,.nt-ic.bot{background:rgba(96,165,250,.16);color:#7db4ff}
.nt-ic.net,.nt-ic.lock{background:rgba(251,191,36,.16);color:#f5b942}
.nt-ic.ok{background:rgba(74,222,128,.16);color:#4ade80}
.dcard.nt h4{margin:0 0 10px;font-size:19px;line-height:1.3;text-align:center}
.dcard.nt .nt-p{margin:0 0 10px;text-align:center;color:var(--muted);font-size:15px;line-height:1.45;word-break:break-word}
.nt-list,.nt-tips{margin:6px 0 10px;padding-left:20px;font-size:14.5px;line-height:1.45;color:var(--muted)}
.nt-list li,.nt-tips li{margin:5px 0;word-break:break-word}
.nt-tips{padding:10px 12px 10px 30px;border-radius:14px;background:rgba(127,127,127,.12);color:var(--text)}
.nt-det{margin:4px 0 6px;font-size:13px;color:var(--muted)}
.nt-det summary{cursor:pointer;padding:6px 0;text-align:center;list-style:none}
.nt-det summary::-webkit-details-marker{display:none}
.nt-det pre{margin:6px 0 8px;padding:10px;border-radius:12px;background:rgba(127,127,127,.12);white-space:pre-wrap;word-break:break-word;font:12px/1.45 ui-monospace,Menlo,Consolas,monospace;max-height:160px;overflow:auto;user-select:text;-webkit-user-select:text}
.nt-btns{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.nt-btns .btn{width:100%;min-height:48px;border-radius:999px;font-size:16px;text-align:center}
:root[data-theme="light"] #dlg2{background:rgba(0,0,0,.35)}
:root[data-theme="light"] .nt-ic.warn,:root[data-theme="light"] .nt-ic.error{background:#fde8e8;color:#c62828}
:root[data-theme="light"] .nt-ic.info,:root[data-theme="light"] .nt-ic.file,:root[data-theme="light"] .nt-ic.img,:root[data-theme="light"] .nt-ic.bot{background:#e3efff;color:#1769c2}
:root[data-theme="light"] .nt-ic.net,:root[data-theme="light"] .nt-ic.lock{background:#fff1d6;color:#a86a00}
:root[data-theme="light"] .nt-ic.ok{background:#dff3e4;color:#1f7a3a}
:root[data-theme="light"] .nt-tips{background:#f0f0f3}
:root[data-theme="light"] .nt-det pre{background:#f0f0f3}

/* ---- Ошибка в чате ---- */
.err{display:block}
.err .err-t{font-weight:600;font-size:15px}
.err .err-h{margin-top:4px;opacity:.9}
.err .err-b{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.err .err-b button{display:inline-block;margin:0}

/* ---- Вложения: файлы и документы ---- */
.att.pdf .an{min-width:0;display:flex;flex-direction:column;gap:1px}
.att.pdf .an small{font-size:11px;opacity:.65}
.att.up img{opacity:.5}
button.ufile{background:rgba(127,127,127,.14);border-radius:12px;padding:8px 12px;color:inherit;text-align:left;cursor:pointer;-webkit-tap-highlight-color:transparent}
button.ufile:active{opacity:.7}
button.ufile small{flex:none;opacity:.6;font-size:12px}
.afiles{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 4px}
.aimg{display:block;max-width:min(100%,360px);max-height:420px;border-radius:14px;cursor:zoom-in;background:rgba(127,127,127,.12)}
.m.a button.ufile{max-width:100%}
.code .ch .chb{display:flex;gap:16px}
.pi.row{justify-content:flex-start;gap:12px;word-break:normal}
.pi.row span{flex:1}
#app.drop::after{content:"Отпустите файлы, чтобы добавить";position:absolute;inset:8px;z-index:95;display:grid;place-items:center;border:2px dashed var(--muted);border-radius:22px;background:rgba(0,0,0,.55);color:#fff;font-size:18px;font-weight:600;pointer-events:none}
.vbtns{display:flex;gap:8px}
.uatts{align-items:flex-start}
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <button class="circle" id="btnMenu" aria-label="Чаты"></button>
    <button class="pill" id="btnModel"><span id="modelName">Модель</span><i id="pchev"></i></button>
  </header>

  <main id="msgs"></main>

  <div id="bottom">
    <div id="sugg" class="sugg"></div>
    <div class="composer">
      <div class="atts" id="atts"></div>
      <div class="crow">
        <button class="ib" id="btnAttach" aria-label="Прикрепить файл"></button>
        <button class="ib" id="btnMic" aria-label="Диктовка" hidden></button>
        <textarea id="inp" rows="1" placeholder="Спроси что угодно…" enterkeyhint="enter"></textarea>
        <button class="send" id="btnSend" aria-label="Отправить"></button>
      </div>
    </div>
  </div>

  <div id="scrim"></div>
  <aside id="drawer">
    <div class="dh">
      <label class="search"><span id="sIc"></span><input id="q" placeholder="Поиск чатов" autocomplete="off"></label>
      <button class="ib" id="btnNew2" aria-label="Новый чат"></button>
    </div>
    <button class="newc" id="btnNew"></button>
    <div class="list" id="chatList"></div>
    <button class="prof" id="btnSettings"><div class="av" id="av">A</div><div class="pn" id="pname">Гость</div><span id="gIc"></span></button>
  </aside>

  <section id="settings">
    <div class="sh"><button class="ib" id="setBack" aria-label="Назад"></button><h2>Настройки</h2><div class="tsw" id="themeSw"><span class="ico sun" id="icSun" aria-label="Светлая тема"></span><button class="sw" id="themeToggle" role="switch" aria-checked="true" aria-label="Тёмная тема"><i></i></button><span class="ico moon" id="icMoon" aria-label="Тёмная тема"></span></div></div>
    <div id="setBody"></div>

async function cloudKeyRequest(method,provider,key){

  }
  const res=await fetch(CLOUD_API+'/keys'+query,options);
  let data={};try{data=await res.json()}catch(e){}

}

function setManagedMeta(d){
  const c=S.providers.managed,prev=c.meta;
  c.meta={provider:d.provider,name:d.name||'',limit:d.limit||0};
  if(!prev||prev.provider!==d.provider||(d.models&&d.models.length&&JSON.stringify(d.models)!==JSON.stringify(c.models))){
    delete c.models;delete c.enabled;
    if(d.models&&d.models.length){c.models=d.models.slice();c.enabled=d.models.slice()}
  }
  c.limit=d.limit>0?d.limit:0;
}

async function cloudJson(method,path,body){

  if(body!==undefined)h['Content-Type']='application/json';
  const res=await fetch(CLOUD_API+path,{method:method,headers:h,body:body!==undefined?JSON.stringify(body):undefined});
  let j={};try{j=await res.json()}catch(e){}
  if(!res.ok)throw cloudErr(res,j);
  return j;
}

async function loadCloudKeys(){
  if(!tg||!tg.initData){showError(needTg(),{where:'cloud'});return 1}
  let migrated=0,loaded=0,failed=0;
  await Promise.all(VISIBLE.map(async p=>{
    const c=S.providers[p.id];
    try{
      if(c.key){await cloudKeyRequest('PUT',p.id,c.key);migrated++}
      else{const data=await cloudKeyRequest('GET',p.id);if(data.key){c.key=data.key;loaded++}}
    }catch(e){failed++}
  }));
  try{await syncManaged()}catch(e){failed++}
  save();
  if(failed)syncFailedNotice();
  else if(migrated||loaded)toast('Ключи синхронизированы с облаком');
  return failed;
}

/* ---------- диалоги-уведомления (вместо исчезающих тостов и сырых ошибок) ----------
   notice({icon,title,text,list,tips,details,actions:[{id,label,kind}],dismiss}) → Promise<id | dismiss>
   Окна показываются по очереди, поверх любых других окон; закрываются кнопкой, тапом по фону или кнопкой «назад» Telegram. */
const NT_ICON={error:'warn',warn:'warn',info:'info',ok:'okc',net:'net',lock:'lock',img:'img',file:'file',bot:'send'};
let ntQ=Promise.resolve();
function notice(o){
  const p=ntQ.then(()=>ntShow(o));
  ntQ=p.then(()=>{},()=>{});
  return p;
}
function ntShow(o){
  return new Promise(res=>{
    const d=$('#dlg2');
    const acts=(o.actions&&o.actions.length)?o.actions:[{id:'ok',label:'Понятно',kind:'pri'}];
    const para=(o.text?String(o.text).split(/\n{2,}/):[]).map(t=>'<p class="nt-p">'+esc(t)+'</p>').join('');
    const ico=o.icon||'info';
    d.innerHTML='<div class="dcard nt" role="alertdialog" aria-modal="true">'+
      '<div class="nt-ic '+esc(ico)+'">'+ic(NT_ICON[ico]||'info',30)+'</div>'+
      '<h4>'+esc(o.title||'')+'</h4>'+para+
      (o.list&&o.list.length?'<ul class="nt-list">'+o.list.map(t=>'<li>'+esc(t)+'</li>').join('')+'</ul>':'')+
      (o.tips&&o.tips.filter(Boolean).length?'<ul class="nt-tips">'+o.tips.filter(Boolean).map(t=>'<li>'+esc(t)+'</li>').join('')+'</ul>':'')+
      (o.details?'<details class="nt-det"><summary>Технические подробности</summary><pre>'+esc(o.details)+'</pre><button class="btn sm" data-nt="__copy">Скопировать</button></details>':'')+
      '<div class="nt-btns">'+acts.map(a=>'<button class="btn '+esc(a.kind||'')+'" data-nt="'+esc(a.id)+'">'+esc(a.label)+'</button>').join('')+'</div></div>';
    d.classList.add('on');
    try{document.activeElement&&document.activeElement.blur&&document.activeElement.blur()}catch(e){}
    const done=v=>{d.classList.remove('on');d.innerHTML='';d.onclick=null;popLayer(cancel);res(v)};
    const cancel=()=>done(o.dismiss!==undefined?o.dismiss:null);
    pushLayer(cancel);
    d.onclick=e=>{
      if(e.target===d){cancel();return}
      const b=e.target.closest('[data-nt]');if(!b)return;
      if(b.dataset.nt==='__copy'){copyText(o.details||'');return}
      done(b.dataset.nt);
    };
  });
}

/* ---------- разбор ответа с ошибкой от провайдера ---------- */
/* Достаёт читаемый текст из разных форматов ошибок (OpenAI, Anthropic, Gemini, Mistral, OpenRouter и др.) */
function pickMsg(j){
  if(j==null)return '';
  if(typeof j==='string')return j;
  if(Array.isArray(j))return j.map(pickMsg).filter(Boolean).join('; ');
  if(typeof j!=='object')return String(j);
  const e=j.error!==undefined?j.error:j;
  if(typeof e==='string')return e;
  if(e&&typeof e==='object'){
    const m=e.message!==undefined?e.message:(e.detail!==undefined?e.detail:(e.msg!==undefined?e.msg:''));
    let t=typeof m==='string'?m:pickMsg(m);
    if(t&&e.metadata&&e.metadata.raw)t+=' ('+pickMsg(e.metadata.raw)+')';
    if(t)return t;
    try{return JSON.stringify(e).slice(0,300)}catch(_){return ''}
  }
  return '';
}
async function apiErr(res){
  let raw='',body=null;
  try{raw=await res.text();try{body=JSON.parse(raw)}catch(e){}}catch(e){}
  const msg=body?pickMsg(body):String(raw||'').replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim().slice(0,300);
  const er=new Error((res.status||'')+(msg?': '+msg:''));
  er.status=res.status;er.raw=msg||res.statusText||'';er.api=true;
  if(body&&typeof body.code==='string'&&APP_CODES.indexOf(body.code)>=0){er.cloud=true;er.code=body.code}   // ответил наш сервер, а не провайдер ИИ
  return er;
}
const APP_CODES=['session','forbidden','no_managed','upstream','bot_blocked','too_large','bad_request','server'];
const needTg=()=>{const er=new Error('need telegram');er.cloud=true;er.code='need_telegram';return er};
/* Ошибка собственного сервера (Worker) */
function cloudErr(res,j){
  const er=new Error((j&&j.error)||('Ошибка '+res.status));
  er.status=res.status;er.code=j&&j.code;er.cloud=true;er.raw=(j&&j.error)||'';
  return er;
}

function classify(e,ctx){
  ctx=ctx||{};
  if(e&&e.kind)return e.kind;
  if(e&&e.name==='AbortError')return 'abort';
  const st=(e&&e.status)||0;
  if(e instanceof TypeError||(e&&e.net))return 'network';
  const s=String((e&&(e.raw||e.message))||'').toLowerCase();
  if(e&&e.cloud){
    if(e.code==='bot_blocked')return 'botblock';
    if(e.code==='need_telegram')return 'needtg';
    if(e.code==='no_managed')return 'nomanaged';
    if(e.code==='upstream')return 'server';
    if(st===401)return 'session';
    if(st===403)return 'forbidden';
    if(st===413)return 'toolarge';
    if(st===429)return 'rate';
    if(st>=500)return 'cloudserver';
    return 'msg';
  }
  const files=!!(ctx.kinds&&ctx.kinds.length);
  if(/unsupported_country|country, region, or territory|not available in your (country|region)|location is not supported|user location is not supported/.test(s))return 'region';
  if(st===402||/insufficient[_ ]quota|exceeded your current quota|billing|insufficient (credit|balance|funds)|credit balance|payment required|out of credits|no credits/.test(s))return 'quota';
  if(st===401||/invalid[_ ]api[_ ]key|incorrect api key|api key not valid|invalid x-api-key|unauthorized|authentication (failed|error)/.test(s))return 'auth';
  if(st===429||/rate[_ ]?limit|too many requests/.test(s))return 'rate';
  if(/too many (images|files|attachments|documents)|maximum (number )?of (images|files)|at most \d+ (images|files)|up to \d+ images|limit of \d+ images|max(imum)? \d+ images/.test(s))return 'toomany';
  if(/context[_ ](length|window)|maximum context|too many tokens|token limit|prompt is too long|input is too long|reduce the length|input token count|tokens? (exceed|limit)|exceeds the.*tokens/.test(s))return 'context';
  if(st===413||/request[_ ]entity too large|payload too large|request too large|body.*too large|image.*(exceeds|larger than|too big|too large)|(exceeds|larger than).*(\d+ ?mb|size limit)|image size|more than \d+ pages|page limit|content[_ ]length/.test(s))return 'toolarge';
  if(files&&(st===400||st===404||st===415||st===422||st===500)&&/image|vision|multimodal|multi-modal|modalit|pdf|document|file|attachment|content|must be a string|valid string|expected a string|invalid type|unknown variant|does not support|not support|unsupported|cannot (read|process)|image_url|mime|base64/.test(s))return 'nofiles';
  if(st===403)return 'auth';
  if(st===404||/model.*(not found|does not exist|not available|decommissioned|deprecated|no longer)|unknown model|invalid model|no such model|is not a valid model/.test(s))return 'model';
  if(/safety|content[_ ]policy|content_filter|moderation|prohibited|refus/.test(s))return 'safety';
  if(st===408||st===504||/timeout|timed out/.test(s))return 'timeout';
  if(st>=500||/overloaded|temporarily unavailable|service unavailable|internal server error|bad gateway/.test(s))return 'server';
  if(st===400||st===422)return 'badreq';
  return 'unknown';
}

/* ctx: {where:'chat'|'cloud'|'file'|..., title, provider, model, kinds:['image','pdf'], managed} */
function errInfo(e,ctx){
  ctx=ctx||{};
  const kind=classify(e,ctx),C=copyFor(kind,ctx,e);
  let title=C.title;
  if(ctx.title&&GENERIC_KINDS.indexOf(kind)>=0)title=ctx.title;
  const lines=[];
  if(e&&e.status)lines.push('Код ответа: '+e.status);
  if(e&&e.code)lines.push('Код ошибки: '+e.code);
  if(ctx.provider)lines.push('Сервис: '+ctx.provider);
  if(ctx.model)lines.push('Модель: '+ctx.model);
  if(ctx.kinds&&ctx.kinds.length)lines.push('Вложения: '+ctx.kinds.join(', '));
  const raw=String((e&&(e.raw||e.message))||'').slice(0,600);
  if(raw)lines.push('Ответ сервера: '+raw);
  lines.push('Тип: '+kind+' · '+new Date().toLocaleString('ru-RU'));
  const chat=ctx.where==='chat';
  let acts=(C.acts||['ok']).filter(Boolean).filter(id=>chat||(id==='retry'?!!ctx.retry:CHAT_ONLY.indexOf(id)<0));
  if(ctx.noNav)acts=acts.filter(id=>id!=='model'&&id!=='settings'&&id!=='newchat');
  if(!chat)acts=acts.map(id=>id==='close'?'ok':id);
  if(ctx.retry&&!chat&&kind!=='needtg'&&kind!=='toolarge'&&acts.indexOf('retry')<0)acts.unshift('retry');   // «Повторить» вне чата (например, при сохранении файла)
  if(ctx.retry&&!chat)acts=acts.map(id=>id==='ok'?'close':id);
  acts=acts.filter((id,i)=>acts.indexOf(id)===i);
  if(!acts.length)acts=['ok'];
  return {kind:kind,title:title,short:title,
    dialog:{icon:C.icon||'error',title:title,text:C.text,tips:C.tips,details:lines.join('\n'),
      actions:acts.map(id=>ACT[id]),dismiss:'close'}};
}
/* Показывает окно ошибки; «Выбрать модель», «Настройки», «Новый чат» выполняются сразу, остальное возвращается вызывающему коду */
async function showError(e,ctx){
  if(e&&e.name==='AbortError')return null;
  const info=errInfo(e,ctx);
  const act=await notice(info.dialog);
  if(act==='model')openPicker();
  else if(act==='settings')openSettings();
  else if(act==='newchat')startNew();
  return act;
}

/* ---------- что умеет модель: фото и PDF ----------
   Значения: true — умеет, false — не умеет, null — неизвестно (пробуем и смотрим на ответ).
   Сначала смотрим на то, что приложение выяснило само (S.caps), затем на название модели. */
const NOVIS_RE=/(gpt-3\.5|gpt-4(-0\d{3}|-32k|-base)?$|o1-mini|o1-preview|text-davinci|babbage|embedding|whisper|tts|dall-e|moderation|claude-(2|instant)|deepseek-(chat|reasoner|coder|v[23]|r1)|mixtral|codestral|llama-?3(\.[013])?-(?!.*vision)|llama3-|llama-2|gemma-?[12]\b|grok-3|grok-code)/i;
const VIS_RE=/(gpt-4o|gpt-4\.1|gpt-4\.5|gpt-5|gpt-4-turbo|gpt-4-vision|chatgpt-4o|(^|[\/:-])o1($|[^-])|(^|[\/:-])o3|(^|[\/:-])o4|claude|gemini|pixtral|llava|vision|[-_]vl([-_\d.]|$)|qwen.*vl|internvl|minicpm-v|llama-?4|llama-3\.2-(11|90)b|grok-(4|2-vision|vision)|mistral-(medium|small)|mistral-large-(2512|3)|molmo|nova-(lite|pro|premier)|glm-4\.?\dv|kimi-vl|phi-4-multimodal)/i;
function guessCaps(p,model){
  const id=String(model||'').toLowerCase(),real=p&&p.id,t=p&&p.type;
  let img=null,pdf=null;
  if(t==='anthropic'){img=/claude-(2|instant)/.test(id)?false:true;pdf=img}
  else if(t==='gemini'){img=/gemma-?[12]\b|embedding|aqa/.test(id)?false:true;pdf=img}
  else{
    if(NOVIS_RE.test(id))img=false;else if(VIS_RE.test(id))img=true;
    if(real==='deepseek'){img=false}
    if(real==='openai')pdf=img===true?true:(img===false?false:null);
    else if(real==='openrouter')pdf=true;           // OpenRouter сам извлекает текст из PDF для любой модели
    else if(real==='groq'||real==='xai'||real==='mistral'||real==='deepseek')pdf=false;
    else pdf=img===false?false:null;
  }
  return {img:img,pdf:pdf};
}
const capKey=(pid,model)=>pid+'|'+model;
function capsFor(pid,model){
  const L=(S.caps&&S.caps[capKey(pid,model)])||{},g=guessCaps(provOf(pid),model);
  return {img:L.img!=null?L.img:g.img,pdf:L.pdf!=null?L.pdf:g.pdf};
}
function capSet(pid,model,kinds,val){
  if(!S.caps)S.caps={};
  const k=capKey(pid,model),c=S.caps[k]||(S.caps[k]={});
  kinds.forEach(x=>{if(x==='image')c.img=val;else if(x==='pdf')c.pdf=val});
  save();
}
/* Окно «модель не умеет читать это»: возвращает 'model' | 'text' | 'force' | null */
function unsupportedDialog(kinds,pid,model){
  const img=kinds.indexOf('image')>=0,pdf=kinds.indexOf('pdf')>=0;
  const what=img&&pdf?'фото и PDF':pdf?'PDF-документы':'фото';
  return notice({icon:'img',
    title:img&&pdf?'Модель, скорее всего, не примет фото и PDF':pdf?'Модель, скорее всего, не читает PDF':'Модель, скорее всего, не видит фото',
    text:'«'+model+'» ('+provName(pid)+') похоже, работает только с текстом и не сможет прочитать ваши '+what+'. Что сделать?',
    actions:[{id:'model',label:'Выбрать другую модель',kind:'pri'},{id:'text',label:'Отправить без '+(img&&pdf?'файлов':pdf?'PDF':'фото')},{id:'force',label:'Всё равно отправить',kind:'ghost'}],

/* Проверка перед отправкой: что приложено → поддерживает ли модель. Возвращает 'stop' или параметры отправки */
async function mediaCheck(pid,model,atts){
  const caps=capsFor(pid,model);
  const kinds=[];(atts||[]).forEach(a=>{const k=kindOf(a);if(k!=='text'&&kinds.indexOf(k)<0)kinds.push(k)});
  const bad=kinds.filter(k=>k==='image'?caps.img===false:caps.pdf===false);
  if(!bad.length)return {};
  const act=await unsupportedDialog(bad,pid,model);
  if(act==='model'){openPicker();return 'stop'}
  if(act==='text')return {noMedia:true};
  if(act==='force')return {force:true};
  return 'stop';
}

/* ---------- markdown ---------- */
function inline(s){
  return s.replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>')
    .replace(/(^|[^*\w])\*([^*\n]+)\*/g,'$1<i>$2</i>')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
}

function md(src){
  const blocks=[];
  src=src.replace(/```([\w+#.-]*)[ \t]*\n?([\s\S]*?)(```|$)/g,(m,l,c)=>{
    blocks.push({l:l,c:c.replace(/\n$/,'')});
    return '\n\u0000'+(blocks.length-1)+'\u0000\n';
  });

  const out=[];
  let list='';
  const close=()=>{
    if(list){out.push('</'+list+'>');list=''}
  };

  const lines=esc(src).split('\n');

  const cells=line=>line.trim()
    .replace(/^\|/,'')
    .replace(/\|$/,'')
    .split('|')
    .map(x=>x.trim());

  for(let i=0;i<lines.length;i++){
    const line=lines[i];
    let m;

    const isTable=line.includes('|') &&
      i+1<lines.length &&
      /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/.test(lines[i+1]);

    if(isTable){
      close();
      const head=cells(line);
      i+=2;
      const rows=[];

      while(i<lines.length && lines[i].includes('|') && lines[i].trim()){
        rows.push(cells(lines[i]));
        i++;
      }
      i--;

      let html='<div class="tbl-wrap"><table class="md-table"><thead><tr>';
      head.forEach(c=>html+='<th>'+inline(c)+'</th>');
      html+='</tr></thead><tbody>';

      rows.forEach(row=>{
        html+='<tr>';
        head.forEach((_,j)=>html+='<td>'+inline(row[j]||'')+'</td>');
        html+='</tr>';
      });

      html+='</tbody></table></div>';
      out.push(html);
    }
    else if((m=line.match(/^\u0000(\d+)\u0000$/))){
      close();
      const b=blocks[+m[1]];
      out.push('<div class="code"><div class="ch"><span>'+esc(b.l||'код')+'</span><span class="chb"><button data-dlcode data-lang="'+esc(b.l||'')+'">Скачать</button><button data-copy>Копировать</button></span></div><pre><code>'+esc(b.c)+'</code></pre></div>');
    }
    else if((m=line.match(/^(#{1,4})\s+(.*)/))){
      close();out.push('<h3>'+inline(m[2])+'</h3>');
    }
    else if((m=line.match(/^\s*[-*•]\s+(.*)/))){
      if(list!=='ul'){close();out.push('<ul>');list='ul'}
      out.push('<li>'+inline(m[1])+'</li>');
    }
    else if((m=line.match(/^\s*\d+[.)]\s+(.*)/))){
      if(list!=='ol'){close();out.push('<ol>');list='ol'}
      out.push('<li>'+inline(m[1])+'</li>');
    }
    else if(!line.trim()){
      close();
    }
    else{
      close();out.push('<p>'+inline(line)+'</p>');
    }
  }

  close();
  return out.join('');
}

/* Пока идёт ответ, отправленное сообщение закреплено у верхнего края. Закрепление держится, пока пользователь сам не прокрутил чат,
   и переустанавливается при любом изменении размеров (закрылась клавиатура, изменилась высота поля ввода и т.п.) */

/* любая «чужая» прокрутка во время ответа (инерция, браузерный scroll anchoring, клавиатура) возвращается на место */

},{passive:true});

/* ---------- печать ответа и жизненный цикл генерации ----------
   busy остаётся true, пока ответ не получен И не допечатан на экране —
   всё это время кнопка работает как «Стоп», а нажатие полностью прекращает и запрос, и печать. */
let G=null;   // текущая генерация

function paint(){
  const g=G;
  if(!g||g.painting)return;
  g.painting=true;

  function step(){
    if(G!==g){g.painting=false;return}
    const m=g.msg;
    const i=g.chat.messages.indexOf(m);
    const n=(cur===g.chat&&i>=0)?box.querySelector('.m.a[data-i="'+i+'"] .b'):null;

    if(n){
      const next=m.content.indexOf(' ',g.idx);
      g.idx=next===-1?m.content.length:next+1;

      n.innerHTML=m.content
        ?md(m.content.slice(0,g.idx))
        :'<span class="dots"><i></i><i></i><i></i></span>';

      if(m.content){
        const walker=document.createTreeWalker(n,NodeFilter.SHOW_TEXT);
        const nodes=[];
        while(walker.nextNode())nodes.push(walker.currentNode);

        let count=0;
        nodes.forEach(node=>{
          const parts=node.textContent.match(/\s+|\S+/g)||[];
          const frag=document.createDocumentFragment();

          parts.forEach(part=>{
            if(/^\s+$/.test(part)){
              frag.appendChild(document.createTextNode(part));
            }else{
              const span=document.createElement('span');
              span.textContent=part;
              if(count>=g.words)span.className='word-in';
              count++;
              frag.appendChild(span);
            }
          });

          node.parentNode.replaceChild(frag,node);
        });

        g.words=count;
      }
    }else{
      g.idx=m.content.length;   // чат не на экране — печатать нечего
    }

    if(g.idx<m.content.length){
      setTimeout(()=>requestAnimationFrame(step),30);
    }else{
      g.painting=false;
      if(g.streamDone)finishGen(g);
    }
  }

  requestAnimationFrame(step);
}

/* Завершает генерацию (один раз): учёт токенов, сохранение, кнопки под ответом, окно с ошибкой */
function finishGen(g){
  if(g.done)return;
  g.done=true;
  const chat=g.chat,msg=g.msg,hasFiles=!!(msg.files&&msg.files.length);

  if(!g.got){g.uIn=est(g.hist);g.uOut=Math.ceil(msg.content.length/3.5)}
  if((g.uIn||g.uOut)&&!(g.err&&!g.got&&!msg.content&&!hasFiles))addUsage(g.pid,g.model,g.uIn,g.uOut);   // запрос, который не дошёл, токены не тратит

  let removed=false;
  if(!msg.content&&!hasFiles){
    const k=chat.messages.indexOf(msg);
    if(k>=0){chat.messages.splice(k,1);removed=true}
  }
  const failed=!!(g.err&&!g.stopped);
  if(failed){
    const info=errInfo(g.err,genCtx(g));
    errMsg=info.short;errData={hint:info.dialog.text};lastErrG=g;
  }

  if(G===g){G=null;busy=false;abortC=null}
  chat.updated=Date.now();save();

  if(cur!==chat)return;
  renderTop();
  updateComposer();
  box.querySelector('.send-space')?.remove();
  if(removed||hasFiles)renderMsgs();
  else{
    const last=box.querySelector('.m.a[data-i="'+(chat.messages.length-1)+'"]');
    if(last&&!last.querySelector('.act'))last.insertAdjacentHTML('beforeend',actHtml(msg,true));
    if(errMsg&&!box.querySelector('.err'))box.insertAdjacentHTML('beforeend',errHtml());
  }
  if(failed)showGenError(g);
}

/* Остановка в любой момент: и пока идёт запрос, и пока ответ ещё печатается */
function stopGen(){
  const g=G;
  if(!g)return;
  g.stopped=true;
  try{g.abort.abort()}catch(e){}
  // оставляем ровно то, что пользователь уже увидел на экране
  if(g.idx<g.msg.content.length)g.msg.content=g.msg.content.slice(0,g.idx);
  finishGen(g);
  hap();
}

function positionContextMenu(anchor){
  const d=$('#dlg');
  const card=d.querySelector('.dcard');
  if(!card||!anchor)return;

  d.classList.add('context');

  const r=anchor.getBoundingClientRect();
  const root=$('#app').getBoundingClientRect();

  const w=card.offsetWidth;
  const h=card.offsetHeight;

  let x=r.right-w;
  let y=r.bottom+8;

  x=Math.max(12,Math.min(x,window.innerWidth-w-12));

  if(y+h>window.innerHeight-12){
    y=r.top-h-8;
  }

  y=Math.max(12,y);

  card.style.left=(x-root.left)+'px';
  card.style.top=(y-root.top)+'px';
}

  const m=cur.messages[index];

  const canRetry=!busy;

  d.innerHTML=
    '<div class="dcard" style="padding:10px">'+

        '</button>':'')+

  d.classList.add('on');
  positionContextMenu(anchor);

  const close=()=>{
    d.classList.remove('on');

async function prepImageFile(f,mime){

  const needs=!direct||(gif?f.size>LIM.gif:(f.size>LIM.imgKeep||mx>LIM.imgDim));
  if(!needs){if(im.close)im.close();return {kind:'image',type:mime,blob:f.type===mime?f:new Blob([f],{type:mime}),size:f.size,w:w,h:h}}

  try{
    for(let i=0;i<3;i++){
      const cv=document.createElement('canvas');
      cv.width=Math.max(1,Math.round(w*k));cv.height=Math.max(1,Math.round(h*k));
      const cx=cv.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,cv.width,cv.height);cx.drawImage(im,0,0,cv.width,cv.height);
      out=await new Promise(r=>cv.toBlob(r,'image/jpeg',q));
      cv.width=cv.height=0;
      if(!out)throw new Error('toBlob');
      if(out.size<=LIM.imgOut)break;

function looksBinary(u){
  const n=Math.min(u.length,8192);let ctl=0;
  for(let i=0;i<n;i++){const b=u[i];if(b===0)return true;if(b<9||(b>13&&b<32&&b!==27))ctl++}
  return n>0&&ctl/n>0.1;

  try{return new TextDecoder('windows-1251').decode(u)}catch(e){}   // старые русские .txt и .csv

}
async function prepText(f){
  const head=new Uint8Array(await readBuf(f.slice(0,8192)));

  if(!txt.trim())throw new Rej('empty');
  const blob=new Blob([txt],{type:'text/plain;charset=utf-8'});
  return {kind:'text',type:'text/plain',blob:blob,size:blob.size};
}

async function inflateRaw(u8){
  const ds=new DecompressionStream('deflate-raw'),w=ds.writable.getWriter();
  w.write(u8);w.close();

async function unzip(buf,want){

  const td=new TextDecoder();

    const method=dv.getUint16(p+10,true),csize=dv.getUint32(p+20,true),usize=dv.getUint32(p+24,true);
    const nl=dv.getUint16(p+28,true),xl=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),lho=dv.getUint32(p+42,true);
    const name=td.decode(u8.subarray(p+46,p+46+nl));

    if(usize>40*MB)throw new Error('zip bomb');

const XENT={amp:'&',lt:'<',gt:'>',quot:'"',apos:"'"};
const xmlDec=s=>s.replace(/&(#x[0-9a-f]+|#\d+|amp|lt|gt|quot|apos);/gi,(m,g)=>{
  if(g[0]==='#'){const c=g[1]==='x'||g[1]==='X'?parseInt(g.slice(2),16):parseInt(g.slice(1),10);try{return String.fromCodePoint(c)}catch(e){return ''}}

function docxText(files){
  const xml=new TextDecoder().decode(files.get('word/document.xml')||new Uint8Array());

  const re=/<\/w:p>|<w:tab\/>|<w:br[^>]*\/>|<\/w:tc>|<\/w:tr>|<w:t(?:\s[^>]*)?>([^<]*)<\/w:t>/g;let m;

}
function pptxText(files){
  const td=new TextDecoder(),names=Array.from(files.keys()).sort((a,b)=>parseInt(a.replace(/\D+/g,''))-parseInt(b.replace(/\D+/g,'')));
  return names.map((n,i)=>{
    let t='';const re=/<\/a:p>|<a:t(?:\s[^>]*)?>([^<]*)<\/a:t>/g;let m;const xml=td.decode(files.get(n));
    while((m=re.exec(xml)))t+=m[1]!==undefined?xmlDec(m[1]):'\n';

function xlsxText(files){
  const td=new TextDecoder(),get=n=>files.has(n)?td.decode(files.get(n)):'';
  const ss=[];
  for(const m of get('xl/sharedStrings.xml').matchAll(/<si\b[^>]*>([\s\S]*?)<\/si>/g))
    ss.push(xmlDec(Array.from(m[1].matchAll(/<t(?:\s[^>]*)?>([^<]*)<\/t>/g),x=>x[1]).join('')));
  const rel={};
  for(const m of get('xl/_rels/workbook.xml.rels').matchAll(/<Relationship\b[^>]*>/g)){
    const id=/\bId="([^"]+)"/.exec(m[0]),tg=/\bTarget="([^"]+)"/.exec(m[0]);

  }

  for(const m of get('xl/workbook.xml').matchAll(/<sheet\b[^>]*>/g)){
    const n=/\bname="([^"]*)"/.exec(m[0]),r=/\br:id="([^"]+)"/.exec(m[0]);
    let path=r&&rel[r[1]]?rel[r[1]].replace(/^\//,''):'';
    if(path&&path.indexOf('xl/')!==0)path='xl/'+path;

  }
  if(!sheets.length)Array.from(files.keys()).filter(n=>/^xl\/worksheets\//.test(n)).sort().forEach((n,i)=>sheets.push({name:'Лист '+(i+1),path:n}));

  return sheets.map(sh=>{
    const xml=get(sh.path);if(!xml)return '';
    const lines=[];
    for(const rm of xml.matchAll(/<row\b[^>]*>([\s\S]*?)<\/row>/g)){
      const row=[];
      for(const cm of rm[1].matchAll(/<c\b([^>]*?)(?:\/>|>([\s\S]*?)<\/c>)/g)){
        const at=cm[1],inner=cm[2]||'',ref=/\br="([A-Z]+)\d+"/.exec(at),t=/\bt="(\w+)"/.exec(at),v=/<v>([\s\S]*?)<\/v>/.exec(inner);

        else if(t&&t[1]==='b')val=v&&v[1]==='1'?'TRUE':'FALSE';
        else if(v)val=xmlDec(v[1]);

      if(line.trim())lines.push(line);
    }
    return lines.length?'## Лист «'+sh.name+'»\n'+lines.join('\n'):'';

}
async function prepOffice(f,e){
  if(f.size>LIM.doc)throw new Rej('size',{size:f.size,max:LIM.doc});
  if(typeof DecompressionStream==='undefined')throw new Rej('nodecomp');

  try{
    const want=e==='docx'?n=>n==='word/document.xml'
      :e==='xlsx'?n=>/^xl\/(sharedStrings\.xml|workbook\.xml|_rels\/workbook\.xml\.rels|worksheets\/[^/]+\.xml)$/.test(n)

/* ----- общий разбор файла ----- */
async function prepareFile(f){
  const name=f.name||'',e=fext(name),t=(f.type||'').toLowerCase();
  if(!f.size)throw new Rej('empty');
  if((/^image\//.test(t)&&t!=='image/svg+xml')||(IMG_MIME[e]&&(!t||t==='application/octet-stream'))){
    if(f.size>LIM.img)throw new Rej('size',{size:f.size,max:LIM.img});
    return prepImageFile(f,(t==='image/jpg'?'image/jpeg':t)||IMG_MIME[e]);
  }
  if(t==='application/pdf'||e==='pdf'){
    if(f.size>LIM.pdf)throw new Rej('size',{size:f.size,max:LIM.pdf});
    const head=new Uint8Array(await readBuf(f.slice(0,1024)));
    if(!String.fromCharCode.apply(null,head).includes('%PDF-'))throw new Rej('badpdf');
    return {kind:'pdf',type:'application/pdf',blob:f.type==='application/pdf'?f:new Blob([f],{type:'application/pdf'}),size:f.size};
  }
  if(OFFICE_EXT.has(e))return prepOffice(f,e);
  if(LEGACY_EXT.has(e))throw new Rej('legacy',{ext:e});
  if(/^(audio|video)\//.test(t)||AV_EXT.has(e))throw new Rej('media');
  if(ARCH_EXT.has(e)||/zip|rar|7z|tar|gzip/.test(t))throw new Rej('archive');
  return prepText(f);
}

const REJ_TITLE={empty:'Файл пустой',size:'Файл слишком большой',count:'Слишком много файлов',total:'Слишком большой общий размер',legacy:'Этот формат не поддерживается',media:'Аудио и видео не поддерживаются',archive:'Архивы не поддерживаются',type:'Этот файл не поддерживается',badpdf:'Не удалось открыть PDF',decode:'Не удалось открыть фото',office:'Не удалось открыть документ',officeEmpty:'В документе нет текста',nodecomp:'Документ не открывается на этом устройстве',read:'Не удалось прочитать файл'};
function rejText(r){
  const n='«'+(r.name||'файл')+'»';
  switch(r.why){
    case 'empty':return n+' пустой или ещё не скачан на устройство. Если файл лежит в облаке (Google Диск, iCloud), сначала скачайте его на телефон.';
    case 'size':return n+' слишком большой: '+fmtSize(r.size)+', а можно до '+fmtSize(r.max)+'.';

    case 'total':return n+' не добавлен: фото и PDF в одном сообщении вместе могут весить не больше '+fmtSize(LIM.total)+'.';
    case 'legacy':return n+' — старый формат (.'+r.ext+'), его нельзя прочитать. Сохраните файл как .docx, .xlsx, .pptx или PDF.';
    case 'media':return n+' — аудио и видео пока нельзя отправить модели.';
    case 'archive':return n+' — архив. Распакуйте его и приложите нужные файлы по отдельности.';
    case 'type':return n+' — неизвестный или двоичный формат, прочитать его нельзя.';

    case 'decode':return n+' не удалось открыть: файл повреждён или формат'+(r.ext?' .'+r.ext:'')+' не поддерживается. Попробуйте JPEG или PNG.';
    case 'office':return n+' не удалось прочитать: файл повреждён или защищён паролем.';
    case 'officeEmpty':return n+': текст в документе не найден (возможно, там только картинки). Сохраните его как PDF и приложите PDF.';
    case 'nodecomp':return n+': это устройство не умеет распаковывать документы. Сохраните как PDF или вставьте текст в сообщение.';
    default:return n+' не удалось прочитать. Если файл лежит в облаке, скачайте его на устройство и попробуйте снова.';
  }
}

async function addFiles(list){
  const rej=[],warn=[];
  for(const f of Array.from(list)){
    const nm=f.name||'файл';
    if(pending.length>=LIM.files){rej.push({name:nm,why:'count'});continue}
    const slot={id:uid(),name:nm,state:'up',kind:'file',type:'',size:f.size||0};
    pending.push(slot);renderAtts();
    try{
      const r=await prepareFile(f);
      if(pending.indexOf(slot)<0)continue;                      // пользователь убрал файл, пока он обрабатывался
      if(r.kind!=='text'){
        const used=pending.reduce((s,a)=>s+(a!==slot&&a.state==='ok'&&a.kind!=='text'?a.size:0),0);
        if(used+r.size>LIM.total)throw new Rej('total');
      }
      Object.assign(slot,{kind:r.kind,type:r.type,blob:r.blob,size:r.size,w:r.w,h:r.h,from:r.from,state:'ok'});
      if(r.warn)warn.push({name:nm,msg:r.warn});
      await fileSave(slot.id,r.blob);
    }catch(e){
      const i=pending.indexOf(slot);if(i>=0)pending.splice(i,1);
      rej.push({name:nm,why:(e&&e.why)||'read',size:e&&e.size,max:e&&e.max,ext:e&&e.ext});
      if(!(e&&e.why))console.warn('attach failed',e);
    }
    renderAtts();
  }
  if(rej.length||warn.length)await attachProblems(rej,warn);
}

   1) системное меню «Поделиться / Сохранить в Файлы», если оно есть;
   2) отправка файла ботом в личный чат (универсально, работает во всех клиентах Telegram);

async function sendFileToBot(blob,name){

async function deliverFile(blob,name,mode){

    }catch(e){if(e&&e.name==='AbortError')return 'cancel'}

  pending.splice(0);renderAtts();

  if(atts.length)um.attachments=atts;
  cur.messages.push(um);
  if(cur.messages.length===1)cur.title=(text||atts[0].name).replace(/\s+/g,' ').slice(0,42);

function b64(blob){
  return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]||'');r.onerror=()=>rej(r.error);r.readAsDataURL(blob)});

/* Превращает историю в нейтральный вид {role,text,files:[{type,kind,data,name}]}.
   Текстовые файлы вставляются в текст сообщения; фото и PDF — как вложения. Если запрос получается слишком тяжёлым,
   вложения убираются из самых старых сообщений (последнее сообщение не трогаем). */
async function wireHist(hist,o){
  o=o||{};
  const limit=(o.limitMb||24)*MB;
  let lastU=-1;for(let i=hist.length-1;i>=0;i--)if(hist[i].role==='user'){lastU=i;break}
  const out=[],missing=[],dropped=[];
  for(let i=0;i<hist.length;i++){
    const m=hist[i],atts=m.attachments||[];
    if(m.role!=='user'||!atts.length){out.push({role:m.role,text:m.content,files:[]});continue}
    let text=m.content||'';const files=[],notes=[];
    for(const a of atts){
      const k=kindOf(a),b=await fileGet(a.id);
      if(!b){missing.push({name:a.name,last:i===lastU});notes.push('[Файл «'+a.name+'» недоступен]');continue}
      if(k==='text'){text+='\n\n<attached_file name="'+String(a.name).replace(/"/g,"'")+'">\n'+await blobText(b)+'\n</attached_file>';continue}
      if(o.skip&&o.skip(a,i===lastU)){notes.push('[К сообщению '+(k==='pdf'?'прикладывался PDF-документ':'прикладывалось изображение')+' «'+a.name+'», но модель не может его просмотреть]');continue}
      files.push({type:a.type,kind:k,data:await b64(b),name:a.name});
    }
    out.push({role:'user',text:(text+(notes.length?'\n'+notes.join('\n'):'')).trim(),files:files,last:i===lastU});
  }
  const size=()=>out.reduce((s,m)=>s+m.files.reduce((t,f)=>t+f.data.length,0),0);
  let total=size();
  for(let i=0;i<out.length&&total>limit;i++){
    const m=out[i];if(!m.files.length||m.last)continue;
    m.text=(m.text+'\n'+m.files.map(f=>'[Вложение «'+f.name+'» не передано повторно: слишком большой диалог]').join('\n')).trim();
    m.files.forEach(f=>dropped.push(f.name));m.files=[];total=size();
  }
  if(total>limit){const er=new Error('too large');er.kind='toolarge';er.raw='Вложения занимают '+fmtSize(total)+', лимит запроса около '+fmtSize(limit);throw er}
  out.info={missing:missing,dropped:dropped};
  return out;
}
function addUsage(pid,model,i,o){

async function sse(res,onData){
  const r=res.body.getReader(),d=new TextDecoder();let buf='';
  for(;;){
    const x=await r.read();if(x.done)break;
    buf+=d.decode(x.value,{stream:true});
    let i;
    while((i=buf.search(/\r?\n\r?\n/))>=0){
      const ev=buf.slice(0,i);buf=buf.slice(i).replace(/^\r?\n\r?\n/,'');
      const lines=ev.split(/\r?\n/);
      for(const l of lines){
        if(l.indexOf('data:')!==0)continue;
        const v=l.slice(5).trim();if(!v||v==='[DONE]')continue;
        let j;try{j=JSON.parse(v)}catch(e){continue}
        onData(j);
      }
    }
  }
}

  if(busy)return;
  const chat=cur;
  let n=chat.messages.length;while(n&&chat.messages[n-1].role==='assistant')n--;
  if(!n)return;
  const pm=splitM(chat.model),pid=pm[0],model=pm[1];
  if(!pid||!isAvail(pid)){await needModel();return}
  if(!opts.checked&&!opts.noMedia&&!opts.force){
    const chk=await mediaCheck(pid,model,chat.messages[n-1].attachments||[]);
    if(chk==='stop'||busy||cur!==chat)return;
    Object.assign(opts,chk);
  }
  while(chat.messages.length&&chat.messages[chat.messages.length-1].role==='assistant')chat.messages.pop();
  const p=provOf(pid),c=S.providers[pid],mg=pid==='managed',caps=capsFor(pid,model);
  const hist=chat.messages.filter(m=>m.content||(m.attachments&&m.attachments.length)).map(m=>({role:m.role,content:m.content||'',attachments:m.attachments}));
  const msg={role:'assistant',content:'',model:chat.model};
  chat.messages.push(msg);
  const abort=new AbortController();
  const g={chat:chat,msg:msg,abort:abort,pid:pid,model:model,hist:hist,idx:0,words:0,opts:opts,kinds:[],saves:[],err:null,
    got:false,uIn:0,uOut:0,streamDone:false,done:false,stopped:false,painting:false};
  G=g;busy=true;abortC=abort;errMsg='';errData=null;stick=true;anchored=true;renderAll();anchorSoon();
  const signal=abort.signal;
  const base=mg?'':(c.base||p.base).replace(/\/+$/,'');
  let uIn=0,uOut=0,got=false,completed=false,filtered=false;
  const push=d=>{if(g.stopped)return;msg.content+=d;paint()};
  try{
    await Promise.race([configP,new Promise(r=>setTimeout(r,1500))]);
    if(signal.aborted)return;
    // что из вложений отправлять: старые фото/PDF не отправляем, если модель их не читает
    const skip=(a,isLast)=>{
      const k=kindOf(a);if(k==='text')return false;
      if(opts.noMedia)return true;
      if(opts.noOld&&!isLast)return true;
      return !isLast&&(k==='image'?caps.img===false:caps.pdf===false);
    };
    const W=await wireHist(hist,{limitMb:p.type==='anthropic'?28:p.type==='gemini'?18:24,skip:skip});
    if(signal.aborted)return;
    W.forEach(m=>m.files.forEach(f=>{if(g.kinds.indexOf(f.kind)<0)g.kinds.push(f.kind)}));
    const lost=W.info.missing.filter(x=>x.last);
    if(lost.length){
      const a=await notice({icon:'file',title:'Файл больше недоступен',
        text:'«'+lost.map(x=>x.name).join('», «')+'» больше не хранится на этом устройстве (память приложения была очищена). Модель его не увидит.',
        tips:['Можно отправить сообщение без этого файла или приложить файл заново.'],
        actions:[{id:'go',label:'Отправить без файла',kind:'pri'},{id:'cancel',label:'Отмена',kind:'ghost'}],dismiss:'cancel'});
      if(a!=='go'){g.cancelled=true;return}
    }
    if(W.info.dropped.length)toast('Старые вложения не переданы модели: не хватило места в запросе');
    if(signal.aborted)return;

    if(p.type==='oai'){
      const msgs=W.map(m=>m.files.length
        ?{role:m.role,content:(m.text?[{type:'text',text:m.text}]:[]).concat(m.files.map(f=>f.kind==='pdf'
            ?{type:'file',file:{filename:f.name||'document.pdf',file_data:'data:application/pdf;base64,'+f.data}}
            :{type:'image_url',image_url:{url:'data:'+f.type+';base64,'+f.data}}))}
        :{role:m.role,content:m.text});
      const body={model:model,messages:(sysPrompt()?[{role:'system',content:sysPrompt()}]:[]).concat(msgs),stream:true};
      if(p.usage)body.stream_options={include_usage:true};
      if(p.id==='openrouter'&&/image/i.test(model))body.modalities=['image','text'];   // модели, которые умеют рисовать
      const res=mg?await managedFetch('chat',model,JSON.stringify(body),signal)
        :await fetch(base+'/chat/completions',{method:'POST',signal:signal,
          headers:Object.assign({'Content-Type':'application/json'},c.key?{Authorization:'Bearer '+c.key}:{}),body:JSON.stringify(body)});
      if(!res.ok)throw await apiErr(res);
      const onChunk=j=>{
        const ch=j.choices&&j.choices[0];
        if(ch){
          const dl=ch.delta||ch.message||{};
          const t=Array.isArray(dl.content)?dl.content.map(x=>(x&&x.text)||'').join(''):(typeof dl.content==='string'?dl.content:'');
          if(t)push(t);
          (dl.images||[]).forEach(im=>{
            const u=im&&((im.image_url&&im.image_url.url)||im.url),mm=/^data:([^;,]+);base64,(.+)$/.exec(u||'');
            if(mm)addOutFile(g,mm[1],mm[2]);
          });
          if(ch.finish_reason==='content_filter')filtered=true;
        }
        if(j.usage&&j.usage.prompt_tokens!=null){uIn=j.usage.prompt_tokens;uOut=j.usage.completion_tokens||0;got=true}
      };
      if(/application\/json/i.test(res.headers.get('content-type')||''))onChunk(await res.json());   // сервис ответил без потока
      else await sse(res,onChunk);
    }else if(p.type==='anthropic'){
      const wh=W.map(m=>m.files.length
        ?{role:m.role,content:m.files.map(f=>f.kind==='pdf'
            ?{type:'document',source:{type:'base64',media_type:'application/pdf',data:f.data}}
            :{type:'image',source:{type:'base64',media_type:f.type,data:f.data}}).concat(m.text?[{type:'text',text:m.text}]:[])}
        :{role:m.role,content:m.text});
      const body={model:model,max_tokens:Math.max(256,+S.maxTokens||4096),messages:wh,stream:true};
      if(sysPrompt())body.system=sysPrompt();
      const res=mg?await managedFetch('chat',model,JSON.stringify(body),signal):await fetch(base+'/v1/messages',{method:'POST',signal:signal,
        headers:{'Content-Type':'application/json','x-api-key':c.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify(body)});
      if(!res.ok)throw await apiErr(res);
      await sse(res,j=>{
        if(j.type==='content_block_delta'&&j.delta&&j.delta.text)push(j.delta.text);
        else if(j.type==='message_start'&&j.message&&j.message.usage){uIn=(j.message.usage.input_tokens||0)+(j.message.usage.cache_read_input_tokens||0);got=true}
        else if(j.type==='message_delta'&&j.usage){uOut=j.usage.output_tokens||uOut;got=true;if(j.delta&&j.delta.stop_reason==='refusal')filtered=true}
        else if(j.type==='error'){
          const er=new Error((j.error&&j.error.message)||'Ошибка API');er.raw=er.message;
          er.status=(j.error&&j.error.type==='overloaded_error')?529:(j.error&&j.error.type==='rate_limit_error')?429:0;
          throw er;
        }
      });
    }else{
      const body={contents:W.map(m=>({role:m.role==='assistant'?'model':'user',
          parts:m.files.map(f=>({inline_data:{mime_type:f.type,data:f.data}})).concat(m.files.length&&!m.text?[]:[{text:m.text}])})),
        generationConfig:{maxOutputTokens:Math.max(256,+S.maxTokens||4096)}};
      if(/image/i.test(model))body.generationConfig.responseModalities=['TEXT','IMAGE'];   // модели, которые умеют рисовать
      if(sysPrompt())body.systemInstruction={parts:[{text:sysPrompt()}]};
      const res=mg?await managedFetch('chat',model,JSON.stringify(body),signal):await fetch(base+'/models/'+encodeURIComponent(model)+':streamGenerateContent?alt=sse&key='+encodeURIComponent(c.key),
        {method:'POST',signal:signal,headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
      if(!res.ok)throw await apiErr(res);
      await sse(res,j=>{
        const cand=j.candidates&&j.candidates[0],parts=cand&&cand.content&&cand.content.parts;
        if(parts)parts.forEach(x=>{
          if(x.text&&!x.thought)push(x.text);
          const d=x.inlineData||x.inline_data;
          if(d&&d.data)addOutFile(g,d.mimeType||d.mime_type,d.data);
        });
        if((j.promptFeedback&&j.promptFeedback.blockReason)||(cand&&/SAFETY|PROHIBITED|BLOCKLIST|SPII/.test(cand.finishReason||'')))filtered=true;
        if(j.usageMetadata){uIn=j.usageMetadata.promptTokenCount||uIn;uOut=(j.usageMetadata.candidatesTokenCount||0)+(j.usageMetadata.thoughtsTokenCount||0);got=true}
      });
    }
    completed=true;
  }catch(e){
    if(g.stopped||(e&&e.name==='AbortError')){/* остановлено пользователем */}
    else g.err=e;
  }finally{
    g.uIn=uIn;g.uOut=uOut;g.got=got;
    if(completed&&!g.err&&!g.stopped&&!msg.content&&!(msg.files&&msg.files.length)){
      const er=new Error('empty');er.kind=filtered?'safety':'empty';g.err=er;   // пустой ответ — тоже ошибка, о которой надо сказать
    }
    if(completed&&!g.err&&g.kinds.length)capSet(pid,model,g.kinds,true);   // модель приняла файлы — запоминаем
    try{await Promise.all(g.saves)}catch(e){}
    g.streamDone=true;
    if(!g.done){
      save();
      // запрос закончился; если ответ ещё печатается — завершим, когда допечатается (кнопка «Стоп» всё это время активна)
      if(g.idx>=msg.content.length)finishGen(g);
      else paint();
    }
  }
}

let sx=0,sy=0,st=0;

  const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;
