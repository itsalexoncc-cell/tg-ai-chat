.tx-r{flex:none;text-align:right}
.tx-r b{display:block;font-size:14.5px;font-weight:700}
.tx-r b.pos{color:var(--ok)}
.tx-r b.neg{color:var(--text);opacity:.88}
.tx-r small{display:block;font-size:11.5px;color:var(--muted);margin-top:2px}
.tx-grp{border-radius:20px;background:var(--flt-bg);box-shadow:var(--flt-sh-sm);overflow:hidden}
.tx-gh{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;padding:10px 12px 10px 14px;text-align:left}
.tx-gh:active{background:rgba(127,127,127,.08)}
.tx-chev{flex:none;color:var(--muted);display:grid;place-items:center;transition:transform .2s ease}
.tx-grp.open .tx-chev{transform:rotate(180deg)}
.tx-gd{border-top:1px solid var(--line);padding:6px 14px 10px;display:flex;flex-direction:column;gap:6px}
.tx-sub{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12.5px;padding:3px 0}
.tx-sub+.tx-sub{border-top:1px dashed var(--line);padding-top:6px}
.tx-sl{min-width:0;flex:1;color:var(--muted)}
.tx-sl span{display:block;color:var(--text);font-size:12.5px}
.tx-sl small{display:block;font-size:11.5px;color:var(--muted)}
.tx-sr{flex:none;text-align:right}
.tx-sr b{display:block;font-size:13px;font-weight:600}
.tx-sr small{display:block;font-size:11px;color:var(--muted)}
/* Финансовая админка */
.fsw .ico{font-size:15px;line-height:1;opacity:.42;filter:grayscale(.4);transition:opacity .2s,filter .2s,transform .2s}
.fsw:not(.live) .ftest{opacity:1;filter:none;transform:scale(1.08)}
.fsw.live .flive{opacity:1;filter:none;transform:scale(1.08)}
.fsw .sw i,:root:not([data-theme="light"]) .fsw .sw i{transform:translateX(0)}
.fsw.live .sw i,:root:not([data-theme="light"]) .fsw.live .sw i{transform:translateX(20px)}
.fin-tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:2px 0 8px;padding:4px 0 10px}
.fin-tab{height:38px;padding:0 6px;border:0;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted);background:var(--flt-bg-hi);box-shadow:var(--flt-sh-sm);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:transform .14s ease,background .16s ease,color .16s ease}
.fin-tab:active{transform:scale(.96)}
.fin-tab.on{background:var(--pri-bg);color:#121212;box-shadow:var(--pri-sh)}
:root[data-theme="light"] .fin-tab.on{color:#fff}
.fin-bar1{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 12px;padding:2px 0 6px}
.fin-actbtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;padding:0 16px;border:0;border-radius:999px;font-size:13.5px;font-weight:600;color:var(--text);background:var(--flt-bg-hi);box-shadow:var(--flt-sh-sm);white-space:nowrap;transition:transform .14s ease,background .16s ease}
.fin-actbtn:active{transform:scale(.97)}
/* Крупные чистые блоки Сводки */
.fin-card{padding:16px 18px 18px;margin-bottom:14px;border-radius:26px;background:var(--flt-bg);box-shadow:var(--flt-sh)}
.fin-ch{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.fin-ch h4{margin:0;font-size:14.5px;font-weight:600;color:var(--muted);letter-spacing:.01em}
.fin-hero{margin:2px 0 12px}
.fin-big{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.fin-big.pos{color:var(--ok)}
.fin-big.neg{color:var(--danger)}
.fin-big-sub{font-size:13px;color:var(--muted);margin-top:4px;line-height:1.35}
.fin-warn{margin-top:10px;padding:8px 12px;border-radius:14px;background:rgba(255,107,107,.14);color:#ff8a8a;font-size:12.5px;line-height:1.35}
:root[data-theme="light"] .fin-warn{background:#fde8e8;color:#b4232b}
.fin-inrow{display:flex;gap:8px;align-items:center;margin:8px 0 12px}
.fin-inrow input{flex:1;min-width:0;height:44px;border-radius:999px;background:var(--deb-bg);border:0;box-shadow:var(--deb-sh);padding:0 16px;font-size:15.5px}
.fin-inrow .btn{flex:none;height:44px;padding:0 18px}
.fin-split{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.fin-stat{padding:10px 12px;border-radius:18px;background:var(--deb-bg);box-shadow:var(--deb-sh)}
.fin-stat small{display:block;font-size:11.5px;color:var(--muted)}
.fin-stat b{display:block;font-size:16.5px;font-weight:700;margin-top:3px;line-height:1.2}
.fin-stat span{display:block;font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.3}
.fin-ledger{margin-top:12px;padding-top:6px;border-top:1px solid var(--line)}
.fin-row{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:8px 0;font-size:14px}
.fin-row+.fin-row{border-top:1px dashed var(--line)}
.fin-row-l{color:var(--muted);min-width:0}
.fin-row-l small{display:block;font-size:11.5px;opacity:.8;margin-top:1px}
.fin-row-r{font-weight:600;text-align:right;white-space:nowrap}
.fin-row-r.pos{color:var(--ok)}
.fin-row-r.neg{color:var(--danger)}
.fin-margin{display:inline-flex;align-items:center;margin-left:8px;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:700;vertical-align:middle;background:rgba(74,222,128,.16);color:#4ade80}
.fin-margin.neg{background:rgba(255,107,107,.16);color:#ff8a8a}
:root[data-theme="light"] .fin-margin{background:#dff3e4;color:#1f7a3a}
:root[data-theme="light"] .fin-margin.neg{background:#fde8e8;color:#b4232b}
.pay-tag{display:inline-flex;align-items:center;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700}
.pay-tag.real{background:rgba(74,222,128,.16);color:#4ade80}
.pay-tag.test{background:rgba(251,191,36,.16);color:#f5b942}
:root[data-theme="light"] .pay-tag.real{background:#dff3e4;color:#1f7a3a}
:root[data-theme="light"] .pay-tag.test{background:#fff1d6;color:#9a5b00}
.fin-u{padding:11px 13px;border-radius:22px;background:var(--flt-bg);box-shadow:var(--flt-sh-sm);margin-bottom:9px}
.fin-u-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.fin-u-who{min-width:0;flex:1}
.fin-u-who b{display:block;font-size:14.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fin-u-who small{display:block;font-size:12px;color:var(--muted);margin-top:1px}
.fin-u-bal{flex:none;text-align:right;font-size:14.5px;font-weight:700}
.fin-u-bal small{display:block;font-size:11px;font-weight:500;color:var(--muted)}
.fin-chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
.fin-grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
/* Архив кодов (серая кликабельная надпись справа от «Заявки и коды») */
.fb-arch-link{font-size:13px;font-weight:600;color:var(--muted);padding:4px 6px;border-radius:10px;white-space:nowrap;transition:opacity .15s,color .15s}
.fb-arch-link:active{opacity:.55}
.fb-arch-link.on{color:var(--text)}
/* Компактные карточки пакетов по 2 в ряд + превью кошелька пользователя */
.pk-adm-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:4px 0 12px}
.pk-adm{display:flex;flex-direction:column;justify-content:space-between;gap:8px;padding:12px;border-radius:22px;background:var(--flt-bg);box-shadow:var(--flt-sh-sm);min-width:0}
.pk-adm-top{min-width:0}
.pk-adm-t{font-size:13px;font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pk-adm-cr{font-size:16px;font-weight:800;line-height:1.2;margin-top:2px}
.pk-adm-sub{font-size:11.5px;color:var(--muted);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pk-adm-acts{display:flex;align-items:center;gap:6px}
.pk-adm-acts .btn.sm{height:30px;padding:0 10px;font-size:12.5px}
.pk-adm-acts .pk-ed{flex:1;text-align:center}
.pk-adm-acts .pk-dl{flex:none;width:30px;height:30px;padding:0;border-radius:50%;display:grid;place-items:center}
.wal-prev{margin-top:6px;padding:12px;border-radius:28px;background:var(--deb-bg);box-shadow:var(--deb-sh)}
.wal-prev .wal-hero{margin-bottom:10px;padding:14px 14px 12px}
.wal-prev .wal-num{font-size:26px}
.wal-prev .wp-h{margin:10px 4px 6px;font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.wal-prev .pkg-grid{margin:4px 0 0;pointer-events:none}
</style>

function parseRgba(str){
  const m=String(str||'').match(/rgba?\(\s*([\d.]+)\s*,\s*([\d.]+)\s*,\s*([\d.]+)(?:\s*[,/]\s*([\d.]+))?\s*\)/);
  return m?[+m[1],+m[2],+m[3],m[4]!=null?+m[4]:1]:null;
}
function syncTgChrome(){
  const baseHex=currentTheme==='light'?'#ffffff':'#121212';
  let rgb=currentTheme==='light'?[255,255,255]:[18,18,18];
  const layers=['#scrim.on','#dlg.on:not(.context)','#dlg2.on','#viewer.on'];
  for(let i=0;i<layers.length;i++){
    const el=$(layers[i]);
    if(!el)continue;
    const ov=parseRgba(getComputedStyle(el).backgroundColor);
    if(ov&&ov[3]>0.01){
      const a=ov[3];
      rgb=[
        Math.max(0,Math.min(255,Math.round(ov[0]*a+rgb[0]*(1-a)))),
        Math.max(0,Math.min(255,Math.round(ov[1]*a+rgb[1]*(1-a)))),
        Math.max(0,Math.min(255,Math.round(ov[2]*a+rgb[2]*(1-a))))
      ];
    }
  }
  const hex='#'+rgb.map(v=>v.toString(16).padStart(2,'0')).join('');
  const meta=document.querySelector('meta[name="theme-color"]');
  if(meta)meta.setAttribute('content',hex);
  try{
    if(tg){
      if(tg.setHeaderColor)tg.setHeaderColor(hex);
      if(tg.setBackgroundColor)tg.setBackgroundColor(baseHex);
      if(tg.setBottomBarColor)tg.setBottomBarColor(hex);
    }
  }catch(e){}
}

async function loadCloudKeys(){
  if(!tg||!tg.initData){bootHide(true);showError(needTg(),{where:'cloud'});return 1}
  let migrated=0,loaded=0,failed=0;
  const toMig=VISIBLE.filter(p=>S.providers[p.id].key);
  const keysTask=(async()=>{
    try{
      if(toMig.length){
        await Promise.all(toMig.map(async p=>{
          await cloudKeyRequest('PUT',p.id,S.providers[p.id].key);migrated++;
        }));
      }
      const data=await cloudJson('GET','/keys?all=1');
      if(data&&data.keys&&typeof data.keys==='object'){
        VISIBLE.forEach(p=>{
          const k=data.keys[p.id];
          if(k&&!S.providers[p.id].key){S.providers[p.id].key=k;loaded++}
        });
        return;
      }
      throw new Error('fallback');
    }catch(err){
      // совместимость со старой версией воркера без ?all=1
      if(err&&err.status===401){failed++;return}
      await Promise.all(VISIBLE.map(async p=>{
        const c=S.providers[p.id];
        if(c.key)return;
        try{const data=await cloudKeyRequest('GET',p.id);if(data.key){c.key=data.key;loaded++}}
        catch(e){failed++}
      }));
    }
  })();
  await Promise.all([keysTask,syncManaged().catch(()=>{failed++})]);
  save();
  if(failed){bootHide(true);syncFailedNotice()}
  else if((migrated||loaded)&&!bootVisible())toast('Ключи синхронизированы с облаком');
  return failed;
}

/* ---------- разбор ответа с ошибкой от провайдера ---------- */
/* Достаёт читаемый текст из разных форматов ошибок (OpenAI, Anthropic, Gemini, Mistral, OpenRouter и др.) */
function pickMsg(j){
  if(j==null)return '';
  if(typeof j==='string')return j;
  if(Array.isArray(j))return j.map(pickMsg).filter(Boolean).join('; ');
  if(typeof j!=='object')return String(j);
  const e=j.error!==undefined?j.error:j;
  if(typeof e==='string')return e;
  if(e&&typeof e==='object'){
    const m=e.message!==undefined?e.message:(e.detail!==undefined?e.detail:(e.msg!==undefined?e.msg:''));
    let t=typeof m==='string'?m:pickMsg(m);
    if(t&&e.metadata&&e.metadata.raw)t+=' ('+pickMsg(e.metadata.raw)+')';
    if(t)return t;
    try{return JSON.stringify(e).slice(0,300)}catch(_){return ''}
  }
  return '';
}
async function apiErr(res){
  let raw='',body=null;
  try{raw=await res.text();try{body=JSON.parse(raw)}catch(e){}}catch(e){}
  const msg=body?pickMsg(body):String(raw||'').replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim().slice(0,300);
  const er=new Error((res.status||'')+(msg?': '+msg:''));
  er.status=res.status;er.raw=msg||res.statusText||'';er.api=true;
  if(body&&typeof body.code==='string'&&APP_CODES.indexOf(body.code)>=0){er.cloud=true;er.code=body.code}   // ответил наш сервер, а не провайдер ИИ
  return er;
}
const APP_CODES=['session','forbidden','no_managed','no_credits','upstream','bot_blocked','too_large','bad_request','server'];
const needTg=()=>{const er=new Error('need telegram');er.cloud=true;er.code='need_telegram';return er};
/* Ошибка собственного сервера (Worker) */
function cloudErr(res,j){
  const er=new Error((j&&j.error)||('Ошибка '+res.status));
  er.status=res.status;er.code=j&&j.code;er.cloud=true;er.raw=(j&&j.error)||'';
  return er;
}

function classify(e,ctx){
  ctx=ctx||{};
  if(e&&e.kind)return e.kind;
  if(e&&e.name==='AbortError')return 'abort';
  const st=(e&&e.status)||0;
  if(e instanceof TypeError||(e&&e.net))return 'network';
  const s=String((e&&(e.raw||e.message))||'').toLowerCase();
  if(e&&e.cloud){
    if(e.code==='bot_blocked')return 'botblock';
    if(e.code==='need_telegram')return 'needtg';
    if(e.code==='no_managed')return 'nomanaged';
    if(e.code==='no_credits')return 'nocredits';
    if(e.code==='upstream')return 'server';
    if(st===401)return 'session';
    if(st===403)return 'forbidden';
    if(st===413)return 'toolarge';
    if(st===429)return 'rate';
    if(st>=500)return 'cloudserver';
    return 'msg';
  }
  const files=!!(ctx.kinds&&ctx.kinds.length);
  if(/unsupported_country|country, region, or territory|not available in your (country|region)|location is not supported|user location is not supported/.test(s))return 'region';
  if(st===402||/insufficient[_ ]quota|exceeded your current quota|billing|insufficient (credit|balance|funds)|credit balance|payment required|out of credits|no credits/.test(s))return 'quota';
  if(st===401||/invalid[_ ]api[_ ]key|incorrect api key|api key not valid|invalid x-api-key|unauthorized|authentication (failed|error)/.test(s))return 'auth';
  if(st===429||/rate[_ ]?limit|too many requests/.test(s))return 'rate';
  if(/too many (images|files|attachments|documents)|maximum (number )?of (images|files)|at most \d+ (images|files)|up to \d+ images|limit of \d+ images|max(imum)? \d+ images/.test(s))return 'toomany';
  if(/context[_ ](length|window)|maximum context|too many tokens|token limit|prompt is too long|input is too long|reduce the length|input token count|tokens? (exceed|limit)|exceeds the.*tokens/.test(s))return 'context';
  if(st===413||/request[_ ]entity too large|payload too large|request too large|body.*too large|image.*(exceeds|larger than|too big|too large)|(exceeds|larger than).*(\d+ ?mb|size limit)|image size|more than \d+ pages|page limit|content[_ ]length/.test(s))return 'toolarge';
  if(ctx.web&&(st===400||st===404||st===410||st===422)&&/web[_ ]?search|google[_ ]?search|search_parameters|web_search_options|plugins|grounding|tool|online|unknown field|extra_forbidden|unrecognized|not support|unsupported/.test(s))return 'noweb';
  if(files&&(st===400||st===404||st===415||st===422||st===500)&&/image|vision|multimodal|multi-modal|modalit|pdf|document|file|attachment|content|must be a string|valid string|expected a string|invalid type|unknown variant|does not support|not support|unsupported|cannot (read|process)|image_url|mime|base64/.test(s))return 'nofiles';
  if(st===403)return 'auth';
  if(st===404||/model.*(not found|does not exist|not available|decommissioned|deprecated|no longer)|unknown model|invalid model|no such model|is not a valid model/.test(s))return 'model';
  if(/safety|content[_ ]policy|content_filter|moderation|prohibited|refus/.test(s))return 'safety';
  if(st===408||st===504||/timeout|timed out/.test(s))return 'timeout';
  if(st>=500||/overloaded|temporarily unavailable|service unavailable|internal server error|bad gateway/.test(s))return 'server';
  if(st===400||st===422)return 'badreq';
  return 'unknown';
}

/* ctx: {where:'chat'|'cloud'|'file'|..., title, provider, model, kinds:['image','pdf'], managed} */
function errInfo(e,ctx){
  ctx=ctx||{};
  const kind=classify(e,ctx),C=copyFor(kind,ctx,e);
  let title=C.title;
  if(ctx.title&&GENERIC_KINDS.indexOf(kind)>=0)title=ctx.title;
  const lines=[];
  if(e&&e.status)lines.push('Код ответа: '+e.status);
  if(e&&e.code)lines.push('Код ошибки: '+e.code);
  if(ctx.provider)lines.push('Сервис: '+ctx.provider);
  if(ctx.model)lines.push('Модель: '+ctx.model);
  if(ctx.kinds&&ctx.kinds.length)lines.push('Вложения: '+ctx.kinds.join(', '));
  const raw=String((e&&(e.raw||e.message))||'').slice(0,600);
  if(raw)lines.push('Ответ сервера: '+raw);
  lines.push('Тип: '+kind+' · '+new Date().toLocaleString('ru-RU'));
  const chat=ctx.where==='chat';
  let acts=(C.acts||['ok']).filter(Boolean).filter(id=>chat||(id==='retry'?!!ctx.retry:CHAT_ONLY.indexOf(id)<0));
  if(ctx.noNav)acts=acts.filter(id=>id!=='model'&&id!=='settings'&&id!=='newchat');
  if(!chat)acts=acts.map(id=>id==='close'?'ok':id);
  if(ctx.retry&&!chat&&kind!=='needtg'&&kind!=='toolarge'&&acts.indexOf('retry')<0)acts.unshift('retry');   // «Повторить» вне чата (например, при сохранении файла)
  if(ctx.retry&&!chat)acts=acts.map(id=>id==='ok'?'close':id);
  acts=acts.filter((id,i)=>acts.indexOf(id)===i);
  if(!acts.length)acts=['ok'];
  return {kind:kind,title:title,short:title,
    dialog:{icon:C.icon||'error',title:title,text:C.text,tips:C.tips,details:lines.join('\n'),
      actions:acts.map(id=>ACT[id]),dismiss:'close'}};
}
/* Показывает окно ошибки; «Выбрать модель», «Настройки», «Новый чат» выполняются сразу, остальное возвращается вызывающему коду */
async function showError(e,ctx){
  if(e&&e.name==='AbortError')return null;
  const info=errInfo(e,ctx);
  const act=await notice(info.dialog);
  if(act==='topup')openWallet();
  else if(act==='model')openPicker();
  else if(act==='settings')openSettings();

/* ---------- что умеет модель: фото и PDF ----------
   Значения: true — умеет, false — не умеет, null — неизвестно (пробуем и смотрим на ответ).
   Сначала смотрим на то, что приложение выяснило само (S.caps), затем на название модели. */
const NOVIS_RE=/(gpt-3\.5|gpt-4(-0\d{3}|-32k|-base)?$|o1-mini|o1-preview|text-davinci|babbage|embedding|whisper|tts|dall-e|moderation|claude-(2|instant)|deepseek-(chat|reasoner|coder|v[23]|r1)|mixtral|codestral|llama-?3(\.[013])?-(?!.*vision)|llama3-|llama-2|gemma-?[12]\b|grok-3|grok-code)/i;
const VIS_RE=/(gpt-4o|gpt-4\.1|gpt-4\.5|gpt-5|gpt-4-turbo|gpt-4-vision|chatgpt-4o|(^|[\/:-])o1($|[^-])|(^|[\/:-])o3|(^|[\/:-])o4|claude|gemini|pixtral|llava|vision|[-_]vl([-_\d.]|$)|qwen.*vl|internvl|minicpm-v|llama-?4|llama-3\.2-(11|90)b|grok-(4|2-vision|vision)|mistral-(medium|small)|mistral-large-(2512|3)|molmo|nova-(lite|pro|premier)|glm-4\.?\dv|kimi-vl|phi-4-multimodal)/i;
function guessCaps(p,model){
  const id=String(model||'').toLowerCase(),real=p&&p.id,t=p&&p.type;
  let img=null,pdf=null;
  if(t==='anthropic'){img=/claude-(2|instant)/.test(id)?false:true;pdf=img}
  else if(t==='gemini'){img=/gemma-?[12]\b|embedding|aqa/.test(id)?false:true;pdf=img}
  else{
    if(NOVIS_RE.test(id))img=false;else if(VIS_RE.test(id))img=true;
    if(real==='deepseek'){img=false}
    if(real==='openai')pdf=img===true?true:(img===false?false:null);
    else if(real==='openrouter')pdf=true;           // OpenRouter сам извлекает текст из PDF для любой модели
    else if(real==='groq'||real==='xai'||real==='mistral'||real==='deepseek')pdf=false;
    else pdf=img===false?false:null;
  }
  return {img:img,pdf:pdf};
}
const capKey=(pid,model)=>pid+'|'+model;
function capsFor(pid,model){
  const L=(S.caps&&S.caps[capKey(pid,model)])||{},g=guessCaps(provOf(pid),model);
  return {img:L.img!=null?L.img:g.img,pdf:L.pdf!=null?L.pdf:g.pdf};
}
function capSet(pid,model,kinds,val){
  if(!S.caps)S.caps={};
  const k=capKey(pid,model),c=S.caps[k]||(S.caps[k]={});
  kinds.forEach(x=>{if(x==='image')c.img=val;else if(x==='pdf')c.pdf=val});
  save();
}
/* Окно «модель не умеет читать это»: возвращает 'model' | 'text' | 'force' | null */
function unsupportedDialog(kinds,pid,model){
  const img=kinds.indexOf('image')>=0,pdf=kinds.indexOf('pdf')>=0;
  const what=img&&pdf?'фото и PDF':pdf?'PDF-документы':'фото';
  return notice({icon:'img',
    title:img&&pdf?'Модель, скорее всего, не примет фото и PDF':pdf?'Модель, скорее всего, не читает PDF':'Модель, скорее всего, не видит фото',
    text:'«'+model+'» ('+provName(pid)+') похоже, работает только с текстом и не сможет прочитать ваши '+what+'. Что сделать?',
    actions:[{id:'model',label:'Выбрать другую модель',kind:'pri'},{id:'text',label:'Отправить без '+(img&&pdf?'файлов':pdf?'PDF':'фото')},{id:'force',label:'Всё равно отправить',kind:'ghost'}],
    dismiss:null});
}
/* Проверка перед отправкой: что приложено → поддерживает ли модель. Возвращает 'stop' или параметры отправки */
async function mediaCheck(pid,model,atts){
  const caps=capsFor(pid,model);
  const kinds=[];(atts||[]).forEach(a=>{const k=kindOf(a);if(k!=='text'&&kinds.indexOf(k)<0)kinds.push(k)});
  const bad=kinds.filter(k=>k==='image'?caps.img===false:caps.pdf===false);
  if(!bad.length)return {};
  const act=await unsupportedDialog(bad,pid,model);
  if(act==='model'){openPicker();return 'stop'}
  if(act==='text')return {noMedia:true};
  if(act==='force')return {force:true};
  return 'stop';
}

/* ---------- веб-поиск в интернете ----------
   tier:'auto' — API с бесплатным тарифом и умным встроенным поиском (Gemini, Groq Compound): работает универсально и автоматически, без переключателя.
   tier:'paid' — платные API / платный плагин поиска (OpenRouter, OpenAI, Claude, Grok): отдельный переключатель (по умолчанию выключен) с предупреждением.
   null        — модели без выхода в интернет: чистые запросы без лишних параметров. */
let paidWeb=false;
const isWebFreeOff=(pid,model)=>{
  const L=S.caps&&S.caps[capKey(pid,model)];
  return !!(L&&L.web==='free_off');
};
function clearWebCaps(pid){
  const pref=pid+'|';
  if(S.caps){
    let ch=false;
    Object.keys(S.caps).forEach(k=>{
      if(k.indexOf(pref)===0&&S.caps[k]&&S.caps[k].web!=null){
        delete S.caps[k].web;ch=true;
      }
    });
    if(ch)save();
  }
  syncWebBtn();
}
function webSpec(pid,model){
  if(!pid||!model)return null;
  const L=S.caps&&S.caps[capKey(pid,model)];
  if(L&&L.web===false)return null;
  const p=provOf(pid),c=S.providers[pid]||{},mg=pid==='managed',id=String(model).toLowerCase(),base=String(c.base||'').toLowerCase();
  if(p.type==='gemini'){
    if(/gemma|embedding|aqa|imagen|image|tts|audio|veo|learnlm|gemini-1\./i.test(id))return null;
    return {mode:'gemini',tier:'auto'};
  }
  if(p.id==='groq'&&/compound/i.test(id))return {mode:'native',tier:'auto'};
  if(p.id==='openrouter'||/openrouter\.ai/.test(base)){
    if(/embedding|moderation/i.test(id))return null;
    if(/:online$/i.test(id)||/^perplexity\/sonar/i.test(id))return {mode:'native',tier:'auto'};
    return {mode:'openrouter',tier:'paid'};
  }
  if(/perplexity\.ai/.test(base)||/(^|\/)sonar/i.test(id))return {mode:'native',tier:'auto'};
  if(p.type==='anthropic'){
    if(/claude-(2|instant)/i.test(id))return null;
    return {mode:'anthropic',tier:'paid'};
  }
  if(p.id==='xai'){
    if(/image/i.test(id))return null;
    return {mode:'xai',tier:'paid'};
  }
  if(p.id==='openai'){
    if(/search/i.test(id))return {mode:'oai-search',tier:'paid'};
    if(!mg&&(!base||/api\.openai\.com/.test(base))&&!/^(dall-e|whisper|tts|text-embedding|moderation|gpt-image)/i.test(id))return {mode:'oai-responses',tier:'paid'};
    return null;
  }
  return null;
}
const curWebSpec=()=>{const pm=cur&&cur.model?splitM(cur.model):['',''];return webSpec(pm[0],pm[1])};
function capSetWeb(pid,model,val){
  if(!S.caps)S.caps={};
  const k=capKey(pid,model),c=S.caps[k]||(S.caps[k]={});
  c.web=val;save();
}
function findWebModel(tierOnly){
  const a=avail();
  const score=m=>{
    const pm=splitM(m),ws=webSpec(pm[0],pm[1]);
    if(!ws||(tierOnly&&ws.tier!==tierOnly))return 0;
    if(ws.tier==='auto'){
      if(isWebFreeOff(pm[0],pm[1]))return 0;
      return ws.mode==='gemini'?10:9;
    }
    return ws.mode==='openrouter'?4:ws.mode==='oai-responses'||ws.mode==='oai-search'?3:ws.mode==='anthropic'?2:1;
  };
  return a.filter(m=>score(m)>0).sort((x,y)=>score(y)-score(x))[0]||'';
}

    collapseWebHint(btn);

function syncWebBtn(){
  const b=$('#btnWeb');if(!b)return;
  const ws=curWebSpec();
  const isAuto=!!(ws&&ws.tier==='auto');
  const isPaid=!!(ws&&ws.tier==='paid');

  b.hidden=isAuto;   // для автопоиска кнопка не нужна — всё работает универсально
  b.classList.toggle('on',isPaid&&paidWeb);

  if(wic)wic.innerHTML=ic(ws?'lang':'langoff',20);
  b.setAttribute('aria-pressed',String(isPaid&&paidWeb));
  b.title=isPaid?(paidWeb?'Веб-поиск включён':'Включить веб-поиск (может быть платным)'):'Эта модель без доступа в интернет';
  const el=$('#inp');
  if(el)el.placeholder=(isPaid&&paidWeb)?'Спроси — найду в интернете…':'Спроси что угодно…';
  clearTimeout(webHintT);webHintT=0;
  const mh=$('#msgs'),h=mh&&mh.querySelector('.web-hint');
  if(h)h.outerHTML=emptyWebHintHtml();

async function confirmPaidWeb(pid,ws){
  const autoAlt=findWebModel('auto');
  const isOR=ws.mode==='openrouter';
  const actions=[{id:'on',label:'Включить поиск',kind:'pri'}];
  if(autoAlt)actions.push({id:'auto',label:'Перейти на '+modelLabel(autoAlt)+' (автопоиск)'});
  actions.push({id:'close',label:'Отмена',kind:'ghost'});
  const act=await notice({icon:'web',title:'Веб-поиск может быть платным',
    text:isOR
      ?'В OpenRouter поиск в интернете оплачивается отдельно с баланса аккаунта — даже если выбрана бесплатная модель.'
      :'В сервисе «'+provName(pid)+'» обращение к интернету тарифицируется отдельно сверх обычных токенов.',
    tips:['Включайте поиск только когда нужны свежие новости, курсы или цены.',
      autoAlt?'У вас уже подключена модель с бесплатным автопоиском — можно переключиться на неё кнопкой ниже.':'В Google Gemini поиск в интернете встроен и работает автоматически (есть бесплатный тариф).'],
    actions:actions,dismiss:'close'});
  if(act==='on'){
    paidWeb=true;syncWebBtn();hap();toast('Веб-поиск включён');return true;
  }
  if(act==='auto'&&autoAlt){
    cur.model=autoAlt;S.lastModel=autoAlt;save();paidWeb=false;renderTop();hap('medium');
    toast('Выбрана '+modelLabel(autoAlt)+' · автопоиск в сети');return true;
  }
  return false;
}
async function toggleWeb(forceOn){
  if(!cur||!cur.model||!avail().includes(cur.model)){await needModel();return false}
  const pm=splitM(cur.model),pid=pm[0],model=pm[1],ws=webSpec(pid,model);
  if(ws&&ws.tier==='auto'){
    if(isWebFreeOff(pid,model)){
      if(!forceOn)await infoBox('В бесплатной версии поиск недоступен','У «'+model+'» веб-поиск сейчас не работает, поэтому ответы идут в обычном режиме. Чтобы проверить поиск снова, загрузите список моделей заново в настройках.');
      return false;
    }
    if(!forceOn)await infoBox('Поиск работает автоматически','«'+model+'» сама обращается в интернет, когда вы спрашиваете про свежие новости, цены или события. Если поиск не пройдёт, запрос автоматически отправится как обычный.');
    return true;
  }
  if(ws&&ws.tier==='paid'){
    if(paidWeb&&!forceOn){
      paidWeb=false;syncWebBtn();hap();toast('Веб-поиск выключен');return false;
    }
    if(paidWeb)return true;
    return await confirmPaidWeb(pid,ws);
  }
  const autoAlt=findWebModel('auto'),paidAlt=!autoAlt?findWebModel('paid'):'';
  const alt=autoAlt||paidAlt;
  if(alt){
    const ap=splitM(alt);
    const act=await notice({icon:'web',title:'Эта модель работает без интернета',
      text:autoAlt
        ?'«'+model+'» ('+provName(pid)+') не умеет искать в сети. Переключиться на «'+ap[1]+'» — там веб-поиск работает автоматически?'
        :'«'+model+'» ('+provName(pid)+') не умеет искать в сети. Переключиться на «'+ap[1]+'» ('+provName(ap[0])+')? Обратите внимание: веб-поиск там может быть платным.',
      actions:[{id:'sw',label:autoAlt?'Переключить на '+modelLabel(alt):'Переключить и включить поиск',kind:'pri'},{id:'pick',label:'Выбрать другую модель'},{id:'close',label:'Отмена',kind:'ghost'}],dismiss:'close'});
    if(act==='sw'){
      cur.model=alt;S.lastModel=alt;save();
      paidWeb=!autoAlt;
      renderTop();hap('medium');
      toast(autoAlt?'Автопоиск в сети · '+modelLabel(alt):'Веб-поиск включён · '+modelLabel(alt));
      return true;
    }
    if(act==='pick')openPicker();
    return false;
  }
  const act=await notice({icon:'web',title:'У этой модели нет доступа в интернет',
    text:'«'+model+'» ('+provName(pid)+') отвечает только по своим знаниям и не видит свежих новостей, курсов и цен.',
    tips:['Для бесплатного автоматического поиска подключите Google Gemini (или Groq Compound).','Также веб-поиск по переключателю доступен в OpenRouter, Claude, OpenAI и Grok (может быть платным).'],
    actions:[{id:'set',label:'Открыть настройки',kind:'pri'},{id:'close',label:'Понятно',kind:'ghost'}],dismiss:'close'});
  if(act==='set')openSettings();
  return false;
}
function addSource(g,url,title){
  if(!url||typeof url!=='string'||!/^https?:\/\//i.test(url))return;
  const list=g.msg.sources||(g.msg.sources=[]);
  if(list.length>=8||list.some(x=>x.url===url))return;
  let lbl=String(title||'').trim();
  if(!lbl){try{lbl=new URL(url).hostname.replace(/^www\./,'')}catch(e){lbl=url}}
  if(lbl.length>30)lbl=lbl.slice(0,29)+'…';
  list.push({url:url,title:lbl});
}

/* ---------- markdown ---------- */
function inline(s){
  return s.replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>')
    .replace(/(^|[^*\w])\*([^*\n]+)\*/g,'$1<i>$2</i>')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
}

function md(src){
  const blocks=[];
  src=src.replace(/```([\w+#.-]*)[ \t]*\n?([\s\S]*?)(```|$)/g,(m,l,c)=>{
    blocks.push({l:l,c:c.replace(/\n$/,'')});
    return '\n\u0000'+(blocks.length-1)+'\u0000\n';
  });

  const out=[];
  let list='';
  const close=()=>{
    if(list){out.push('</'+list+'>');list=''}
  };

  const lines=esc(src).split('\n');

  const cells=line=>line.trim()
    .replace(/^\|/,'')
    .replace(/\|$/,'')
    .split('|')
    .map(x=>x.trim());

  for(let i=0;i<lines.length;i++){
    const line=lines[i];
    let m;

    const isTable=line.includes('|') &&
      i+1<lines.length &&
      /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/.test(lines[i+1]);

    if(isTable){
      close();
      const head=cells(line);
      i+=2;
      const rows=[];

      while(i<lines.length && lines[i].includes('|') && lines[i].trim()){
        rows.push(cells(lines[i]));
        i++;
      }
      i--;

      let html='<div class="tbl-wrap"><table class="md-table"><thead><tr>';
      head.forEach(c=>html+='<th>'+inline(c)+'</th>');
      html+='</tr></thead><tbody>';

      rows.forEach(row=>{
        html+='<tr>';
        head.forEach((_,j)=>html+='<td>'+inline(row[j]||'')+'</td>');
        html+='</tr>';
      });

      html+='</tbody></table></div>';
      out.push(html);
    }
    else if((m=line.match(/^\u0000(\d+)\u0000$/))){
      close();
      const b=blocks[+m[1]];
      out.push('<div class="code"><div class="ch"><span>'+esc(b.l||'код')+'</span><span class="chb"><button data-dlcode data-lang="'+esc(b.l||'')+'">Скачать</button><button data-copy>Копировать</button></span></div><pre><code>'+esc(b.c)+'</code></pre></div>');
    }
    else if((m=line.match(/^(#{1,4})\s+(.*)/))){
      close();out.push('<h3>'+inline(m[2])+'</h3>');
    }
    else if((m=line.match(/^\s*[-*•]\s+(.*)/))){
      if(list!=='ul'){close();out.push('<ul>');list='ul'}
      out.push('<li>'+inline(m[1])+'</li>');
    }
    else if((m=line.match(/^\s*\d+[.)]\s+(.*)/))){
      if(list!=='ol'){close();out.push('<ol>');list='ol'}
      out.push('<li>'+inline(m[1])+'</li>');
    }
    else if(!line.trim()){
      close();
    }
    else{
      close();out.push('<p>'+inline(line)+'</p>');
    }
  }

  close();
  return out.join('');
}

/* ---------- печать ответа и жизненный цикл генерации ----------
   busy остаётся true, пока ответ не получен И не допечатан на экране —
   всё это время кнопка работает как «Стоп», а нажатие полностью прекращает и запрос, и печать. */
let G=null;   // текущая генерация

function statusHtml(g){
  if(g&&g.status==='searching')return '<div class="gstat"><span class="gstat-ic">'+ic('lang',16)+'</span><span>Ищу в интернете</span><span class="dots sm"><i></i><i></i><i></i></span></div>';

  return '<span class="dots"><i></i><i></i><i></i></span>';
}
function setGenStatus(g,st){

  const n=i>=0?box.querySelector('.m.a[data-i="'+i+'"] .b'):null;

/* Находит границу завершённых блоков Markdown (пустая строка вне блока кода ```), чтобы не перерисовывать весь текст заново */
function safeSplitPos(s){
  let inCode=false,pos=0,lastSafe=0;
  const lines=s.split('\n');
  for(let i=0;i<lines.length-1;i++){
    const line=lines[i];
    const fences=line.match(/```/g);
    if(fences&&fences.length%2)inCode=!inCode;
    pos+=line.length+1;
    if(!inCode&&!line.trim()&&i>0)lastSafe=pos;
  }
  return lastSafe;
}
/* Оборачивает в .word-in только новые и ещё не завершившие анимацию слова (age < 260 мс), оставляя остальной текст лёгким */
function animWords(root,startIdx,g,now){
  const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
  const nodes=[];
  while(walker.nextNode()){
    const nd=walker.currentNode;
    if(nd.parentElement&&nd.parentElement.closest('.ch'))continue;
    nodes.push(nd);
  }
  let count=startIdx;
  const dur=260;
  for(let j=0;j<nodes.length;j++){
    const node=nodes[j],parts=node.textContent.match(/\s+|\S+/g);
    if(!parts)continue;
    let wordNum=0;
    for(let k=0;k<parts.length;k++)if(!/^\s+$/.test(parts[k]))wordNum++;
    let needWrap=false;
    for(let k=0;k<wordNum;k++){
      const t=g.wordT[count+k];
      if(t===undefined||now-t<dur){needWrap=true;break}
    }
    if(!needWrap){count+=wordNum;continue}
    const frag=document.createDocumentFragment();
    let plain='';
    const flush=()=>{if(plain){frag.appendChild(document.createTextNode(plain));plain=''}};
    for(let k=0;k<parts.length;k++){
      const part=parts[k];
      if(/^\s+$/.test(part)){plain+=part;continue}
      let t=g.wordT[count];
      if(t===undefined){t=now;g.wordT[count]=t}
      const age=now-t;
      if(age<dur){
        flush();
        const span=document.createElement('span');
        span.className='word-in';
        if(age>8)span.style.animationDelay='-'+Math.round(age)+'ms';
        span.textContent=part;
        frag.appendChild(span);
      }else{
        plain+=part;
      }
      count++;
    }
    flush();
    node.parentNode.replaceChild(frag,node);
  }
  return count;
}
function paint(){
  const g=G;
  if(!g||g.painting)return;
  g.painting=true;

  function step(){
    if(G!==g){g.painting=false;return}
    const m=g.msg;
    const i=g.chat.messages.indexOf(m);
    const n=(cur===g.chat&&i>=0)?box.querySelector('.m.a[data-i="'+i+'"] .b'):null;

    if(n){
      let p=g.idx,len=m.content.length;
      while(p<len&&/\s/.test(m.content[p]))p++;
      while(p<len&&!/\s/.test(m.content[p]))p++;
      while(p<len&&/\s/.test(m.content[p]))p++;
      g.idx=p;

      if(!m.content){
        n.innerHTML=statusHtml(g);
      }else{
        const now=(window.performance&&performance.now)?performance.now():Date.now();
        const slice=m.content.slice(0,g.idx);
        if(!g.tail||g.tail.parentNode!==n){
          n.innerHTML='';
          g.tail=document.createElement('div');
          n.appendChild(g.tail);
          g.lockedPos=0;g.lockedWords=0;
        }
        const safe=safeSplitPos(slice);
        if(safe>g.lockedPos){
          const tmp=document.createElement('div');
          tmp.innerHTML=md(slice.slice(g.lockedPos,safe));
          g.lockedWords=animWords(tmp,g.lockedWords,g,now);
          const frag=document.createDocumentFragment();
          while(tmp.firstChild)frag.appendChild(tmp.firstChild);
          n.insertBefore(frag,g.tail);
          g.lockedPos=safe;
        }
        const tailText=slice.slice(g.lockedPos);
        g.tail.innerHTML=tailText?md(tailText):'';
        g.words=tailText?animWords(g.tail,g.lockedWords,g,now):g.lockedWords;
      }
    }else{
      g.idx=m.content.length;   // чат не на экране — печатать нечего
    }

    if(g.idx<m.content.length){
      g.paintT=setTimeout(()=>requestAnimationFrame(step),30);
    }else{
      g.painting=false;
      if(g.streamDone)finishGen(g);
    }
  }

  requestAnimationFrame(step);
}

/* Завершает генерацию (один раз): учёт токенов, сохранение, кнопки под ответом, окно с ошибкой */
function finishGen(g){
  if(g.done)return;
  g.done=true;
  const chat=g.chat,msg=g.msg,hasFiles=!!(msg.files&&msg.files.length);

  if(!g.got){g.uIn=est(g.hist);g.uOut=Math.ceil(msg.content.length/3.5)}
  if((g.uIn||g.uOut)&&!(g.err&&!g.got&&!msg.content&&!hasFiles))addUsage(g.pid,g.model,g.uIn,g.uOut);   // запрос, который не дошёл, токены не тратит

  let removed=false;
  if(!msg.content&&!hasFiles){
    const k=chat.messages.indexOf(msg);
    if(k>=0){chat.messages.splice(k,1);removed=true}
  }
  const failed=!!(g.err&&!g.stopped);

  if(G===g){G=null;busy=false;abortC=null}
  chat.updated=Date.now();save();
  if(g.pid==='managed'){WAL.ts=0;FIN.ts.stats=0;FIN.ts.users=0;setTimeout(()=>{loadWallet(true).catch(()=>{})},450)}

  if(cur!==chat)return;
  renderTop();
  updateComposer();
  box.querySelector('.send-space')?.remove();
  if(removed||hasFiles)renderMsgs();
  else{
    const last=box.querySelector('.m.a[data-i="'+(chat.messages.length-1)+'"]');
    if(last&&!last.querySelector('.act'))last.insertAdjacentHTML('beforeend',sourcesHtml(msg)+actHtml(msg,true));
  }
  if(failed)showGenError(g);
}

/* Остановка в любой момент: и пока идёт запрос, и пока ответ ещё печатается */
function stopGen(){
  const g=G;
  if(!g)return;
  g.stopped=true;
  clearTimeout(g.paintT);
  try{g.abort.abort()}catch(e){}
  // оставляем ровно то, что пользователь уже увидел на экране
  if(g.idx<g.msg.content.length)g.msg.content=g.msg.content.slice(0,g.idx);
  finishGen(g);
  hap();
}

function positionContextMenu(anchor){
  const d=$('#dlg');
  const card=d.querySelector('.dcard');
  if(!card||!anchor)return;

  d.classList.add('context');

  const r=anchor.getBoundingClientRect();
  const root=$('#app').getBoundingClientRect();

  const w=card.offsetWidth;
  const h=card.offsetHeight;

  let x=r.right-w;
  let y=r.bottom+8;

  x=Math.max(12,Math.min(x,window.innerWidth-w-12));

  if(y+h>window.innerHeight-12){
    y=r.top-h-8;
  }

  y=Math.max(12,y);

  card.style.left=(x-root.left)+'px';
  card.style.top=(y-root.top)+'px';
}

function openUserMessageMenu(index,anchor){
  const m=cur.messages[index];
  if(!m||m.role!=='user')return;

  const canRetry=!busy;
  const d=$('#dlg');

  d.innerHTML=
    '<div class="dcard" style="padding:10px">'+
      (m.content?'<button class="pi" data-user-action="copy">'+
        ic('copy',18)+
        '<span style="flex:1;margin-left:10px">Копировать</span>'+
      '</button>':'')+
      (canRetry?
        '<button class="pi" data-user-action="retry">'+
          ic('refresh',18)+
          '<span style="flex:1;margin-left:10px">Повторить отправку</span>'+
        '</button>':'')+
    '</div>';

  d.classList.add('on');
  positionContextMenu(anchor);

  const close=()=>{
    d.classList.remove('on');
    d.innerHTML='';
    popLayer(close);
    d.classList.remove('context');
  };

  pushLayer(close);

  d.onclick=e=>{
    if(e.target===d){
      close();
      return;
    }

    const b=e.target.closest('[data-user-action]');
    if(!b)return;

    const action=b.dataset.userAction;
    close();

    if(action==='copy'){
      copyText(m.content);
      hap();
    }

    if(action==='retry'){
      retryUserMessage(index);
    }
  };
}
/* Долгое нажатие на сообщение пользователя открывает меню; обычный тап по фото открывает его на весь экран */
let lp=null,lpFired=0,lpTouch=false;
const lpCancel=()=>{if(lp){clearTimeout(lp.t);lp=null}};
function lpOpen(b){
  const row=b.closest('.m.u');if(!row)return;
  lpFired=Date.now();
  hap('medium');
  openUserMessageMenu(+row.dataset.i,b);
}
box.addEventListener('touchstart',e=>{
  lpCancel();
  const b=e.target.closest('.m.u .uwrap');
  if(!b||e.touches.length!==1||e.target.closest('[data-user-menu]'))return;
  const t=e.touches[0];
  lp={x:t.clientX,y:t.clientY,t:setTimeout(()=>{lp=null;lpTouch=true;lpOpen(b)},450)};
},{passive:true});
box.addEventListener('touchmove',e=>{
  if(!lp)return;
  const t=e.touches[0];
  if(Math.abs(t.clientX-lp.x)>10||Math.abs(t.clientY-lp.y)>10)lpCancel();
},{passive:true});
const lpEnd=e=>{
  lpCancel();
  if(lpTouch){            // палец отпущен после долгого нажатия — гасим «хвостовой» клик
    lpTouch=false;lpFired=Date.now();
    if(e.cancelable)e.preventDefault();
  }
};
box.addEventListener('touchend',lpEnd,{passive:false});
box.addEventListener('touchcancel',lpEnd);
box.addEventListener('scroll',lpCancel,{passive:true});
box.addEventListener('contextmenu',e=>{   // ПК / Android: правая кнопка или системное долгое нажатие
  const b=e.target.closest('.m.u .uwrap');if(!b)return;
  e.preventDefault();
  if(Date.now()-lpFired<900||$('#dlg').classList.contains('on'))return;
  lpOpen(b);
});

box.addEventListener('click',e=>{
  if(Date.now()-lpFired<700)return;

  const selection=window.getSelection();

  // Не реагируем, если пользователь выделяет текст
  if(selection&&!selection.isCollapsed&&selection.toString().trim()){
    return;
  }

  const wh=e.target.closest('[data-toggle-web]');
  if(wh){handleWebHintClick(wh);return}

  const cp=e.target.closest('[data-copy]');
  if(cp){
    const pre=cp.closest('.code').querySelector('pre');
    copyText(pre.textContent);
    hap();
    return;
  }

  const dc=e.target.closest('[data-dlcode]');
  if(dc){
    const pre=dc.closest('.code').querySelector('pre');
    saveFlow(new Blob([pre.textContent],{type:'text/plain;charset=utf-8'}),codeFileName(dc.dataset.lang),dc);
    hap();
    return;
  }

  const fb=e.target.closest('[data-file]');
  if(fb){openFileSheet(fb.dataset.file,fb);return}

  const im=e.target.closest('img[data-att]');
  if(im){
    const row=im.closest('.m');
    const imgs=Array.prototype.slice.call(row.querySelectorAll('img[data-att]'));
    openViewer(imgs.map(x=>x.dataset.att),Math.max(0,imgs.indexOf(im)));
    return;
  }

  const more=e.target.closest('[data-user-menu]');
  if(more){
    openUserMessageMenu(+more.closest('.m.u').dataset.i,more);
    return;
  }

  if(e.target.closest('.m.u'))return;   // обычный тап по сообщению ничего не делает

  const b=e.target.closest('[data-act]');
  if(!b)return;

  const a=b.dataset.act;

  if(a==='copy'){
    const i=+b.closest('.m').dataset.i;
    copyText(cur.messages[i].content);
  }
  else if(a==='dl'){
    answerDownload(+b.closest('.m').dataset.i,b);
  }
  else if(a==='regen'||a==='retry'){
    generate();
  }
});

/* ---------- вложения: фото, PDF, текстовые файлы и документы Office ----------
   Всё, что можно прочитать как текст (код, txt, csv, docx, xlsx, pptx), уходит модели обычным текстом — это работает с любой моделью.
   Фото и PDF уходят как вложения и требуют поддержки модели. */
const LIM={
  files:5,                 // файлов в одном сообщении
  img:30*MB,               // исходное фото (дальше всё равно сжимается)
  imgKeep:1.5*MB,          // фото меньше этого размера и разрешения не пересжимаем
  imgDim:2048,             // длинная сторона после сжатия
  imgOut:3*MB,             // целевой размер сжатого фото
  gif:2*MB,                // GIF больше этого превращаем в обычную картинку
  pdf:12*MB,
  doc:15*MB,               // исходный docx / xlsx / pptx
  text:300*KB,             // текст одного файла (≈ 100 страниц)
  total:12*MB,             // фото + PDF в одном сообщении (после сжатия)
  botSend:25*MB            // файл, отправляемый через бота
};
const IMG_MIME={jpg:'image/jpeg',jpeg:'image/jpeg',jpe:'image/jpeg',jfif:'image/jpeg',png:'image/png',webp:'image/webp',gif:'image/gif',heic:'image/heic',heif:'image/heif',bmp:'image/bmp',avif:'image/avif',tif:'image/tiff',tiff:'image/tiff'};

const ARCH_EXT=new Set(['zip','rar','7z','tar','gz','tgz','bz2','xz','apk','exe','dmg','iso','msi','jar']);
const fext=n=>{const m=/\.([a-z0-9]+)$/i.exec(n||'');return m?m[1].toLowerCase():''};

/* вид вложения: image | pdf | text (у старых сообщений поля kind нет — определяем по типу) */
function kindOf(a){

}

let dbP=null;
function idb(){
  if(dbP)return dbP;
  dbP=new Promise((res,rej)=>{
    try{
      const r=indexedDB.open('tgai.files',1);
      r.onupgradeneeded=()=>r.result.createObjectStore('files',{keyPath:'id'});
      r.onsuccess=()=>res(r.result);
      r.onerror=()=>rej(r.error);
      r.onblocked=()=>rej(new Error('blocked'));
    }catch(e){rej(e)}
  });
  return dbP;
}
const readBuf=b=>b.arrayBuffer?b.arrayBuffer():new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsArrayBuffer(b)});
const blobText=async b=>b.text?b.text():new TextDecoder().decode(await readBuf(b));
/* В IndexedDB кладём ArrayBuffer, а не Blob: на iOS Blob в IndexedDB бывает нечитаемым после перезапуска */
async function fileSave(id,blob){
  memFiles.set(id,blob);
  try{
    const buf=await readBuf(blob),db=await idb();
    await new Promise((res,rej)=>{const t=db.transaction('files','readwrite');t.objectStore('files').put({id:id,buf:buf,type:blob.type||''});t.oncomplete=res;t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error||new Error('abort'))});
    memFiles.delete(id);
    return true;
  }catch(e){return false}   // файл остаётся в памяти на время сессии
}
async function fileGet(id){
  if(memFiles.has(id))return memFiles.get(id);
  try{
    const db=await idb();
    const r=await new Promise((res,rej)=>{const q=db.transaction('files').objectStore('files').get(id);q.onsuccess=()=>res(q.result||null);q.onerror=()=>rej(q.error)});
    if(!r)return null;
    if(r.buf)return new Blob([r.buf],{type:r.type||''});
    return r.blob||null;   // записи старого формата
  }catch(e){return null}
}
async function fileDel(ids){
  ids=(ids||[]).filter(Boolean);if(!ids.length)return;
  ids.forEach(id=>{memFiles.delete(id);const u=urlCache.get(id);if(u){try{URL.revokeObjectURL(u)}catch(e){}urlCache.delete(id)}});
  try{
    const db=await idb();
    await new Promise(res=>{const t=db.transaction('files','readwrite');const st=t.objectStore('files');ids.forEach(id=>st.delete(id));t.oncomplete=res;t.onerror=res;t.onabort=res});
  }catch(e){}
}
const msgFileIds=m=>[].concat((m.attachments||[]).map(a=>a.id),(m.files||[]).map(a=>a.id));
async function gcFiles(){   // удаляет файлы, не привязанные ни к одному сообщению (например, не отправленные)
  try{
    const used=new Set();
    S.chats.forEach(c=>c.messages.forEach(m=>msgFileIds(m).forEach(id=>used.add(id))));

    await fileDel(keys.filter(k=>!used.has(k)));

}

/* ----- фото ----- */
function loadImg(blob){
  return new Promise((res,rej)=>{
    const u=URL.createObjectURL(blob),i=new Image();
    i.onload=()=>{URL.revokeObjectURL(u);res(i)};
    i.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('img'))};
    i.src=u;
  });
}
async function decodeImg(blob){
  if(window.createImageBitmap){try{return await createImageBitmap(blob)}catch(e){}}
  return loadImg(blob);
}
async function prepImageFile(f,mime){
  const e=fext(f.name);
  let im;
  try{im=await decodeImg(f.type===mime?f:new Blob([f],{type:mime}))}catch(err){throw new Rej('decode',{ext:e})}
  const w=im.naturalWidth||im.width,h=im.naturalHeight||im.height,mx=Math.max(w,h);
  if(!w||!h){if(im.close)im.close();throw new Rej('decode',{ext:e})}
  const direct=DIRECT_IMG.indexOf(mime)>=0,gif=mime==='image/gif';
  const needs=!direct||(gif?f.size>LIM.gif:(f.size>LIM.imgKeep||mx>LIM.imgDim));
  if(!needs){if(im.close)im.close();return {kind:'image',type:mime,blob:f.type===mime?f:new Blob([f],{type:mime}),size:f.size,w:w,h:h}}
  // сжимаем: длинная сторона до imgDim, JPEG; если вышло тяжело — ещё раз поменьше
  let k=Math.min(1,LIM.imgDim/mx),q=.86,out=null;
  try{
    for(let i=0;i<3;i++){
      const cv=document.createElement('canvas');
      cv.width=Math.max(1,Math.round(w*k));cv.height=Math.max(1,Math.round(h*k));
      const cx=cv.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,cv.width,cv.height);cx.drawImage(im,0,0,cv.width,cv.height);
      out=await new Promise(r=>cv.toBlob(r,'image/jpeg',q));
      cv.width=cv.height=0;
      if(!out)throw new Error('toBlob');
      if(out.size<=LIM.imgOut)break;
      k*=.75;q-=.08;
    }
  }catch(err){if(im.close)im.close();throw new Rej('decode',{ext:e})}
  if(im.close)im.close();
  if(direct&&!gif&&mx<=LIM.imgDim&&out.size>=f.size)return {kind:'image',type:mime,blob:f.type===mime?f:new Blob([f],{type:mime}),size:f.size,w:w,h:h};
  return {kind:'image',type:'image/jpeg',blob:out,size:out.size,w:Math.round(w*k),h:Math.round(h*k)};
}

/* ----- текст ----- */
function looksBinary(u){
  const n=Math.min(u.length,8192);let ctl=0;
  for(let i=0;i<n;i++){const b=u[i];if(b===0)return true;if(b<9||(b>13&&b<32&&b!==27))ctl++}
  return n>0&&ctl/n>0.1;
}
const bomOf=u=>(u[0]===0xFF&&u[1]===0xFE)?'utf-16le':(u[0]===0xFE&&u[1]===0xFF)?'utf-16be':'';
function decodeText(buf){
  const u=new Uint8Array(buf),bom=bomOf(u);
  if(bom)return new TextDecoder(bom).decode(u);
  try{return new TextDecoder('utf-8',{fatal:true}).decode(u)}catch(e){}
  try{return new TextDecoder('windows-1251').decode(u)}catch(e){}   // старые русские .txt и .csv
  return new TextDecoder('utf-8').decode(u);
}
async function prepText(f){
  const head=new Uint8Array(await readBuf(f.slice(0,8192)));
  if(!bomOf(head)&&looksBinary(head))throw new Rej('type');
  if(f.size>LIM.text)throw new Rej('size',{size:f.size,max:LIM.text});
  const txt=decodeText(await readBuf(f));
  if(!txt.trim())throw new Rej('empty');
  const blob=new Blob([txt],{type:'text/plain;charset=utf-8'});
  return {kind:'text',type:'text/plain',blob:blob,size:blob.size};
}

/* ----- документы Office: достаём текст прямо в браузере (docx, xlsx, pptx — это zip с XML) ----- */
async function inflateRaw(u8){
  const ds=new DecompressionStream('deflate-raw'),w=ds.writable.getWriter();
  w.write(u8);w.close();
  return new Uint8Array(await new Response(ds.readable).arrayBuffer());
}
async function unzip(buf,want){
  const u8=new Uint8Array(buf),dv=new DataView(buf),out=new Map();
  let e=u8.length-22;const min=Math.max(0,u8.length-65557);
  for(;e>=min;e--)if(dv.getUint32(e,true)===0x06054b50)break;
  if(e<min)throw new Error('zip');
  const cnt=dv.getUint16(e+10,true);let p=dv.getUint32(e+16,true);
  const td=new TextDecoder();
  for(let i=0;i<cnt;i++){
    if(dv.getUint32(p,true)!==0x02014b50)throw new Error('zip');
    const method=dv.getUint16(p+10,true),csize=dv.getUint32(p+20,true),usize=dv.getUint32(p+24,true);
    const nl=dv.getUint16(p+28,true),xl=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),lho=dv.getUint32(p+42,true);
    const name=td.decode(u8.subarray(p+46,p+46+nl));
    p+=46+nl+xl+cl;
    if(!want(name))continue;
    if(usize>40*MB)throw new Error('zip bomb');
    const start=lho+30+dv.getUint16(lho+26,true)+dv.getUint16(lho+28,true),data=u8.subarray(start,start+csize);
    out.set(name,method===0?data:await inflateRaw(data));
  }
  return out;
}
const XENT={amp:'&',lt:'<',gt:'>',quot:'"',apos:"'"};
const xmlDec=s=>s.replace(/&(#x[0-9a-f]+|#\d+|amp|lt|gt|quot|apos);/gi,(m,g)=>{
  if(g[0]==='#'){const c=g[1]==='x'||g[1]==='X'?parseInt(g.slice(2),16):parseInt(g.slice(1),10);try{return String.fromCodePoint(c)}catch(e){return ''}}
  return XENT[g.toLowerCase()]||m;
});
function docxText(files){
  const xml=new TextDecoder().decode(files.get('word/document.xml')||new Uint8Array());
  let out='';
  const re=/<\/w:p>|<w:tab\/>|<w:br[^>]*\/>|<\/w:tc>|<\/w:tr>|<w:t(?:\s[^>]*)?>([^<]*)<\/w:t>/g;let m;
  while((m=re.exec(xml))){
    const s=m[0];
    if(m[1]!==undefined)out+=xmlDec(m[1]);
    else if(s==='</w:p>'||s==='</w:tr>'||s.indexOf('<w:br')===0)out+='\n';
    else out+='\t';
  }
  return out.replace(/\n{3,}/g,'\n\n');
}
function pptxText(files){
  const td=new TextDecoder(),names=Array.from(files.keys()).sort((a,b)=>parseInt(a.replace(/\D+/g,''))-parseInt(b.replace(/\D+/g,'')));
  return names.map((n,i)=>{
    let t='';const re=/<\/a:p>|<a:t(?:\s[^>]*)?>([^<]*)<\/a:t>/g;let m;const xml=td.decode(files.get(n));
    while((m=re.exec(xml)))t+=m[1]!==undefined?xmlDec(m[1]):'\n';
    return '--- Слайд '+(i+1)+' ---\n'+t.replace(/\n{2,}/g,'\n').trim();
  }).join('\n\n');
}
function xlsxText(files){
  const td=new TextDecoder(),get=n=>files.has(n)?td.decode(files.get(n)):'';
  const ss=[];
  for(const m of get('xl/sharedStrings.xml').matchAll(/<si\b[^>]*>([\s\S]*?)<\/si>/g))
    ss.push(xmlDec(Array.from(m[1].matchAll(/<t(?:\s[^>]*)?>([^<]*)<\/t>/g),x=>x[1]).join('')));
  const rel={};
  for(const m of get('xl/_rels/workbook.xml.rels').matchAll(/<Relationship\b[^>]*>/g)){
    const id=/\bId="([^"]+)"/.exec(m[0]),tg=/\bTarget="([^"]+)"/.exec(m[0]);
    if(id&&tg)rel[id[1]]=tg[1];
  }
  const sheets=[];
  for(const m of get('xl/workbook.xml').matchAll(/<sheet\b[^>]*>/g)){
    const n=/\bname="([^"]*)"/.exec(m[0]),r=/\br:id="([^"]+)"/.exec(m[0]);
    let path=r&&rel[r[1]]?rel[r[1]].replace(/^\//,''):'';
    if(path&&path.indexOf('xl/')!==0)path='xl/'+path;
    if(n)sheets.push({name:xmlDec(n[1]),path:path});
  }
  if(!sheets.length)Array.from(files.keys()).filter(n=>/^xl\/worksheets\//.test(n)).sort().forEach((n,i)=>sheets.push({name:'Лист '+(i+1),path:n}));
  const col=s=>{let n=0;for(const ch of s)n=n*26+ch.charCodeAt(0)-64;return n-1};
  return sheets.map(sh=>{
    const xml=get(sh.path);if(!xml)return '';
    const lines=[];
    for(const rm of xml.matchAll(/<row\b[^>]*>([\s\S]*?)<\/row>/g)){
      const row=[];
      for(const cm of rm[1].matchAll(/<c\b([^>]*?)(?:\/>|>([\s\S]*?)<\/c>)/g)){
        const at=cm[1],inner=cm[2]||'',ref=/\br="([A-Z]+)\d+"/.exec(at),t=/\bt="(\w+)"/.exec(at),v=/<v>([\s\S]*?)<\/v>/.exec(inner);
        let val='';
        if(t&&t[1]==='s'&&v)val=ss[+v[1]]||'';
        else if(t&&t[1]==='inlineStr')val=xmlDec(Array.from(inner.matchAll(/<t[^>]*>([^<]*)<\/t>/g),x=>x[1]).join(''));
        else if(t&&t[1]==='b')val=v&&v[1]==='1'?'TRUE':'FALSE';
        else if(v)val=xmlDec(v[1]);
        const c=ref?col(ref[1]):row.length;
        if(c<300)row[c]=val;
      }
      const line=Array.from(row,x=>x==null?'':x).join('\t').replace(/\t+$/,'');
      if(line.trim())lines.push(line);
    }
    return lines.length?'## Лист «'+sh.name+'»\n'+lines.join('\n'):'';
  }).filter(Boolean).join('\n\n');
}
async function prepOffice(f,e){
  if(f.size>LIM.doc)throw new Rej('size',{size:f.size,max:LIM.doc});
  if(typeof DecompressionStream==='undefined')throw new Rej('nodecomp');
  let txt;
  try{
    const want=e==='docx'?n=>n==='word/document.xml'
      :e==='xlsx'?n=>/^xl\/(sharedStrings\.xml|workbook\.xml|_rels\/workbook\.xml\.rels|worksheets\/[^/]+\.xml)$/.test(n)
      :n=>/^ppt\/slides\/slide\d+\.xml$/.test(n);
    const files=await unzip(await readBuf(f),want);
    txt=e==='docx'?docxText(files):e==='xlsx'?xlsxText(files):pptxText(files);
  }catch(err){throw new Rej('office')}
  txt=txt.replace(/[ \t]+\n/g,'\n').trim();
  if(!txt)throw new Rej('officeEmpty');
  let warn='';
  if(txt.length>LIM.text){txt=txt.slice(0,LIM.text)+'\n\n[…текст обрезан: документ слишком большой]';warn='Документ очень большой: модель получит только его начало (около '+fmtSize(LIM.text)+' текста).'}
  const blob=new Blob([txt],{type:'text/plain;charset=utf-8'});
  return {kind:'text',type:'text/plain',blob:blob,size:blob.size,from:e,warn:warn};
}

/* ----- общий разбор файла ----- */
async function prepareFile(f){
  const name=f.name||'',e=fext(name),t=(f.type||'').toLowerCase();
  if(!f.size)throw new Rej('empty');
  if((/^image\//.test(t)&&t!=='image/svg+xml')||(IMG_MIME[e]&&(!t||t==='application/octet-stream'))){
    if(f.size>LIM.img)throw new Rej('size',{size:f.size,max:LIM.img});
    return prepImageFile(f,(t==='image/jpg'?'image/jpeg':t)||IMG_MIME[e]);
  }
  if(t==='application/pdf'||e==='pdf'){
    if(f.size>LIM.pdf)throw new Rej('size',{size:f.size,max:LIM.pdf});
    const head=new Uint8Array(await readBuf(f.slice(0,1024)));
    if(!String.fromCharCode.apply(null,head).includes('%PDF-'))throw new Rej('badpdf');
    return {kind:'pdf',type:'application/pdf',blob:f.type==='application/pdf'?f:new Blob([f],{type:'application/pdf'}),size:f.size};
  }
  if(OFFICE_EXT.has(e))return prepOffice(f,e);
  if(LEGACY_EXT.has(e))throw new Rej('legacy',{ext:e});
  if(/^(audio|video)\//.test(t)||AV_EXT.has(e))throw new Rej('media');
  if(ARCH_EXT.has(e)||/zip|rar|7z|tar|gzip/.test(t))throw new Rej('archive');
  return prepText(f);
}

const REJ_TITLE={empty:'Файл пустой',size:'Файл слишком большой',count:'Слишком много файлов',total:'Слишком большой общий размер',legacy:'Этот формат не поддерживается',media:'Аудио и видео не поддерживаются',archive:'Архивы не поддерживаются',type:'Этот файл не поддерживается',badpdf:'Не удалось открыть PDF',decode:'Не удалось открыть фото',office:'Не удалось открыть документ',officeEmpty:'В документе нет текста',nodecomp:'Документ не открывается на этом устройстве',read:'Не удалось прочитать файл'};
function rejText(r){
  const n='«'+(r.name||'файл')+'»';
  switch(r.why){
    case 'empty':return n+' пустой или ещё не скачан на устройство. Если файл лежит в облаке (Google Диск, iCloud), сначала скачайте его на телефон.';
    case 'size':return n+' слишком большой: '+fmtSize(r.size)+', а можно до '+fmtSize(r.max)+'.';
    case 'count':return n+' не добавлен: к одному сообщению можно приложить не больше '+LIM.files+' файлов.';
    case 'total':return n+' не добавлен: фото и PDF в одном сообщении вместе могут весить не больше '+fmtSize(LIM.total)+'.';
    case 'legacy':return n+' — старый формат (.'+r.ext+'), его нельзя прочитать. Сохраните файл как .docx, .xlsx, .pptx или PDF.';
    case 'media':return n+' — аудио и видео пока нельзя отправить модели.';
    case 'archive':return n+' — архив. Распакуйте его и приложите нужные файлы по отдельности.';
    case 'type':return n+' — неизвестный или двоичный формат, прочитать его нельзя.';
    case 'badpdf':return n+' повреждён или это не PDF-документ.';
    case 'decode':return n+' не удалось открыть: файл повреждён или формат'+(r.ext?' .'+r.ext:'')+' не поддерживается. Попробуйте JPEG или PNG.';
    case 'office':return n+' не удалось прочитать: файл повреждён или защищён паролем.';
    case 'officeEmpty':return n+': текст в документе не найден (возможно, там только картинки). Сохраните его как PDF и приложите PDF.';
    case 'nodecomp':return n+': это устройство не умеет распаковывать документы. Сохраните как PDF или вставьте текст в сообщение.';
    default:return n+' не удалось прочитать. Если файл лежит в облаке, скачайте его на устройство и попробуйте снова.';
  }
}
async function attachProblems(rej,warn){
  if(rej.length){
    const one=rej.length===1;
    const unsupported=rej.some(r=>['type','media','archive','legacy'].indexOf(r.why)>=0);
    await notice({icon:'file',
      title:one?(REJ_TITLE[rej[0].why]||'Не удалось добавить файл'):'Не все файлы удалось добавить',
      text:one?rejText(rej[0]):'Эти файлы не добавлены:',
      list:one?null:rej.map(rejText),
      tips:[unsupported?'Подходят: фото (JPEG, PNG, WebP, GIF), PDF, документы Word, Excel и PowerPoint (.docx, .xlsx, .pptx), а также текстовые файлы и код.':null,
        rej.some(r=>r.why==='size'||r.why==='total')?'Сожмите файл или разделите его на части.':null,
        rej.some(r=>r.why==='count')?'Отправьте остальные файлы следующим сообщением.':null],
      actions:[{id:'ok',label:'Понятно',kind:'pri'}]});
  }
  for(const w of warn)await infoBox('Файл добавлен с оговоркой','«'+w.name+'»: '+w.msg);
}
async function addFiles(list){
  const rej=[],warn=[];
  for(const f of Array.from(list)){
    const nm=f.name||'файл';
    if(pending.length>=LIM.files){rej.push({name:nm,why:'count'});continue}
    const slot={id:uid(),name:nm,state:'up',kind:'file',type:'',size:f.size||0};
    pending.push(slot);renderAtts();
    try{
      const r=await prepareFile(f);
      if(pending.indexOf(slot)<0)continue;                      // пользователь убрал файл, пока он обрабатывался
      if(r.kind!=='text'){
        const used=pending.reduce((s,a)=>s+(a!==slot&&a.state==='ok'&&a.kind!=='text'?a.size:0),0);
        if(used+r.size>LIM.total)throw new Rej('total');
      }
      Object.assign(slot,{kind:r.kind,type:r.type,blob:r.blob,size:r.size,w:r.w,h:r.h,from:r.from,state:'ok'});
      if(r.warn)warn.push({name:nm,msg:r.warn});
      await fileSave(slot.id,r.blob);
    }catch(e){
      const i=pending.indexOf(slot);if(i>=0)pending.splice(i,1);
      rej.push({name:nm,why:(e&&e.why)||'read',size:e&&e.size,max:e&&e.max,ext:e&&e.ext});
      if(!(e&&e.why))console.warn('attach failed',e);
    }
    renderAtts();
  }
  if(rej.length||warn.length)await attachProblems(rej,warn);
}
function renderAtts(){
  $('#atts').innerHTML=pending.map(a=>{
    const thumb=a.kind==='image'&&a.blob;
    return '<div class="att'+(thumb?'':' pdf')+(a.state==='up'?' up':'')+'">'+
      (thumb?'<img alt="" src="'+getUrl(a.id,a.blob)+'">'
        :ic('file',22)+'<div class="an"><span>'+esc(a.name)+'</span><small>'+(a.state==='up'?'Обработка…':fmtSize(a.size))+'</small></div>')+
      '<button class="x" data-rm="'+esc(a.id)+'" aria-label="Убрать файл">'+ic('x',12)+'</button></div>';
  }).join('');
  updateComposer();
}
$('#atts').addEventListener('click',e=>{
  const b=e.target.closest('[data-rm]');if(!b)return;
  const i=pending.findIndex(a=>a.id===b.dataset.rm);if(i<0)return;

/* Превращает историю в нейтральный вид {role,text,files:[{type,kind,data,name}]}.
   Текстовые файлы вставляются в текст сообщения; фото и PDF — как вложения. Если запрос получается слишком тяжёлым,
   вложения убираются из самых старых сообщений (последнее сообщение не трогаем). */
async function wireHist(hist,o){
  o=o||{};
  const limit=(o.limitMb||24)*MB;
  let lastU=-1;for(let i=hist.length-1;i>=0;i--)if(hist[i].role==='user'){lastU=i;break}
  const out=[],missing=[],dropped=[];
  for(let i=0;i<hist.length;i++){
    const m=hist[i],atts=m.attachments||[];
    if(m.role!=='user'||!atts.length){out.push({role:m.role,text:m.content,files:[]});continue}
    let text=m.content||'';const files=[],notes=[];
    for(const a of atts){
      const k=kindOf(a),b=await fileGet(a.id);
      if(!b){missing.push({name:a.name,last:i===lastU});notes.push('[Файл «'+a.name+'» недоступен]');continue}
      if(k==='text'){text+='\n\n<attached_file name="'+String(a.name).replace(/"/g,"'")+'">\n'+await blobText(b)+'\n</attached_file>';continue}
      if(o.skip&&o.skip(a,i===lastU)){notes.push('[К сообщению '+(k==='pdf'?'прикладывался PDF-документ':'прикладывалось изображение')+' «'+a.name+'», но модель не может его просмотреть]');continue}
      files.push({type:a.type,kind:k,data:await b64(b),name:a.name});
    }
    out.push({role:'user',text:(text+(notes.length?'\n'+notes.join('\n'):'')).trim(),files:files,last:i===lastU});
  }
  const size=()=>out.reduce((s,m)=>s+m.files.reduce((t,f)=>t+f.data.length,0),0);
  let total=size();
  for(let i=0;i<out.length&&total>limit;i++){
    const m=out[i];if(!m.files.length||m.last)continue;
    m.text=(m.text+'\n'+m.files.map(f=>'[Вложение «'+f.name+'» не передано повторно: слишком большой диалог]').join('\n')).trim();
    m.files.forEach(f=>dropped.push(f.name));m.files=[];total=size();
  }
  if(total>limit){const er=new Error('too large');er.kind='toolarge';er.raw='Вложения занимают '+fmtSize(total)+', лимит запроса около '+fmtSize(limit);throw er}
  out.info={missing:missing,dropped:dropped};
  return out;
}

async function sse(res,onData){
  const r=res.body.getReader(),d=new TextDecoder();let buf='';
  for(;;){
    const x=await r.read();if(x.done)break;
    buf+=d.decode(x.value,{stream:true});
    let i;
    while((i=buf.search(/\r?\n\r?\n/))>=0){
      const ev=buf.slice(0,i);buf=buf.slice(i).replace(/^\r?\n\r?\n/,'');
      const lines=ev.split(/\r?\n/);
      for(const l of lines){
        if(l.indexOf('data:')!==0)continue;
        const v=l.slice(5).trim();if(!v||v==='[DONE]')continue;
        let j;try{j=JSON.parse(v)}catch(e){continue}
        onData(j);
      }
    }
  }
}
/* Скрывает «размышления» моделей, которые некоторые сервисы присылают прямо в тексте ответа:
   <think>…</think>, <thinking>, <thought>, <reasoning>. Блок распознаётся только в самом начале ответа,
   чтобы не прятать обычный текст, где такие теги просто упоминаются. */
function thinkFilter(out,onThink){
  const OPENS=['<think>','<thinking>','<thought>','<reasoning>'];
  let buf='',inside='',shown=false;
  const emit=s=>{
    if(!shown){s=s.replace(/^\s+/,'');if(!s)return;shown=true}
    out(s);
  };
  return {
    feed(t){
      buf+=t;
      for(;;){
        if(inside){
          const m=new RegExp('</'+inside+'>','i').exec(buf);
          if(!m){buf=buf.slice(Math.max(0,buf.length-inside.length-2));return}   // блок ещё не закончился
          buf=buf.slice(m.index+m[0].length);inside='';continue;
        }
        if(!shown){
          const s=buf.replace(/^\s+/,''),m=/^<(think|thinking|thought|reasoning)>/i.exec(s);
          if(m){buf=s.slice(m[0].length);inside=m[1].toLowerCase();if(onThink)onThink();continue}
          if(!s||OPENS.some(o=>o.length>s.length&&o.indexOf(s.toLowerCase())===0)){buf=s;return}   // может оказаться началом тега — ждём
        }
        emit(buf);buf='';return;
      }
    },
    end(){if(!inside&&buf)emit(buf);buf=''}
  };
}
const genCtx=g=>({where:'chat',provider:provName(g.pid),model:g.model,kinds:g.kinds,web:!!g.webMode,webTier:g.webTier||'',managed:g.pid==='managed'});

  if(!e||e.name==='AbortError'||e.cloud)return false;

  if(st===401||st===413)return false;
  const k=classify(e,genCtx(g));

  if(k==='network'&&g.webMode!=='oai-responses')return false;

}
